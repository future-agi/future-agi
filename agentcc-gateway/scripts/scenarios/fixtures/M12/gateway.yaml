# Gateway config template for 68_m12_legacy_sessions.sh: one static YAML MCP
# server, "primary", on the mock scn_mcp_up started as "primary", and two keys
# of one org, so a session opened with one is refused to the other.
#
# scn_mcp_gateway_template (lib_mcp.sh) renders @@MCP_PRIMARY_URL@@ and adds
# the fixed test state key under `mcp:`; scn_up renders base.yaml's
# placeholders and appends `redis:` (the scenario requires SCN_REDIS), so
# mcp.session_store resolves to redis. Every key and token below is a fake
# value for the local mocks.
server:
  port: 18910 # replaced by AGENTCC_PORT
  host: "127.0.0.1"
admin:
  token: "@@ADMIN_TOKEN@@"
auth:
  enabled: true
  keys:
    - name: "acme-app"
      key: "scn-test-key-acme"
      owner: "acme"
      key_type: "byok"
      metadata:
        org_id: "org-acme"
    - name: "acme-other-app"
      key: "scn-test-key-acme-other"
      owner: "acme"
      key_type: "byok"
      metadata:
        org_id: "org-acme"
providers:
  operator-openai:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-operator-upstream"
    api_format: "openai"
    auto_discover: false
    models: ["gpt-4o"]
logging:
  level: "debug"
mcp:
  enabled: true
  # The YAML servers serve the keys' org, org-acme (mcp.static.org_id): the
  # legacy view serves them only to that org's principals and to a principal
  # with no org (M10 IR-11, at the W3b merge).
  static:
    org_id: "org-acme"
  servers:
    primary:
      url: "@@MCP_PRIMARY_URL@@/mcp" # used exactly (M13): the mock's path
      transport: "http"
      auth:
        type: "bearer"
        token: "scn-test-mcp-upstream-token"
