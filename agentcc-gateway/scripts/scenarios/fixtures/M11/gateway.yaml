# Gateway config template for 67_m11_protocol_2026.sh: one static YAML MCP
# server, "main", on the mock scn_mcp_up started as "main", with the 2026
# protocol keys set to non-default values so the scenario proves they reach
# the MCP server (wiring_mcp_protocol.go): a 1 MiB body cap and one allowed
# browser origin.
#
# scn_mcp_gateway_template (lib_mcp.sh) renders @@MCP_<NAME>_URL@@ and adds
# the fixed test state key under `mcp:`; scn_up then renders base.yaml's
# placeholders (see config/base.yaml) and appends `redis:`. Every key and
# token below is a fake value for the local mocks.
server:
  port: 18910 # replaced by AGENTCC_PORT
  host: "127.0.0.1"
admin:
  token: "@@ADMIN_TOKEN@@"
auth:
  enabled: true
  keys:
    - name: "acme-app"
      key: "scn-test-key-acme"
      owner: "acme"
      key_type: "byok"
      metadata:
        org_id: "org-acme"
providers:
  operator-openai:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-operator-upstream"
    api_format: "openai"
    auto_discover: false
    models: ["gpt-4o"]
logging:
  level: "info"
mcp:
  enabled: true
  # The YAML servers serve the keys' org, org-acme (mcp.static.org_id): the
  # legacy view serves them only to that org's principals and to a principal
  # with no org.
  static:
    org_id: "org-acme"
  max_body_bytes: 1048576
  allowed_origins: ["https://app.example"]
  servers:
    main:
      url: "@@MCP_MAIN_URL@@/mcp" # used exactly: the mock's path
      transport: "http"
