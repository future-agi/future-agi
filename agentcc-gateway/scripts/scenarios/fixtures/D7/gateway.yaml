# D7 scenario gateway config (scripts/scenarios/34_d7_content_mode.sh), rendered
# by scn_up like config/base.yaml (same placeholders; scn_up appends redis:).
# It is base.yaml with request bodies captured (include_bodies), so the
# request log can show what each content mode keeps and drops, and with one
# warn-action keyword guardrail.
#
# Every key and token below is a fake value for the local mock upstream.
server:
  port: 18910 # replaced by AGENTCC_PORT
  host: "127.0.0.1"
admin:
  token: "@@ADMIN_TOKEN@@"
auth:
  enabled: true
  # Org keys are person-owned (733): under a control plane config.yaml holds
  # only deployment identities (key_type internal, no org_id, no user_id).
  # scn_up registers acme-app (SCN_KEY of org-acme, user SCN_USER) with the
  # mock's control plane, which lists it on the key sync (lib.sh, Org keys).
providers:
  # FutureAGI-credentialed and managed: opted-in orgs may use it, billed.
  openrouter:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-managed-upstream"
    api_format: "openai"
    type: "openrouter"
    managed: true
    auto_discover: false
  # FutureAGI-credentialed but not managed: customer keys may never reach it.
  operator-openai:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-operator-upstream"
    api_format: "openai"
    auto_discover: false
    models: ["gpt-4o"]
managed:
  markup_percent: 5
  require_credits: true
  catalog_refresh: 1m
routing:
  provider_lock:
    enabled: true
cost_tracking:
  enabled: true
logging:
  level: "info"
  request_logging:
    enabled: true
    # Capture bodies and headers; the content mode decides what the log keeps.
    include_bodies: true
# A warn-action guardrail that quotes the matched word from the prompt in its
# message, which reaches the log as metadata.guardrail_warnings (check 5).
guardrails:
  enabled: true
  rules:
    - name: "keyword-blocklist"
      stage: "pre"
      mode: "sync"
      action: "warn"
      threshold: 0.5
      config:
        words: ["d7flaggedword"]
# The mock stands in for Django: request logs reach its /__logs.
# Its control plane lists the person-owned keys scn_up registers and does
# not answer the org sync, so configs pushed with scn_org_config stay; the
# gateway syncs keys on startup (scn_up waits for the first list).
control_plane:
  url: "@@MOCK_URL@@"
  admin_token: "@@ADMIN_TOKEN@@"
  sync_on_startup: true
  sync_interval: 60s
