# Server-tools scenario gateway config (scripts/scenarios/04_server_tools.sh). The
# scenario first replaces @@ANTHROPIC_URL@@ with its Anthropic stand-in's URL
# (fixtures/server-tools/anthropic_standin.py), then scn_up renders it like
# config/base.yaml (same placeholders; scn_up appends redis:). It is
# base.yaml with two operator providers serving the same Claude model:
#  - anthropic: Anthropic's own API (the stand-in), a direct source with no
#    key of its own; the org brings its key (BYOK), and the gateway never
#    calls an org's own base_url on loopback;
#  - bedrock: Amazon Bedrock, which runs no Anthropic server tool. Its base
#    URL is the stand-in too, so a call that reached it would be recorded.
#
# Every key and token below is a fake value for the local stand-ins.
server:
  port: 18910 # replaced by AGENTCC_PORT
  host: "127.0.0.1"
admin:
  token: "@@ADMIN_TOKEN@@"
auth:
  enabled: true
  keys:
    - name: "acme-app"
      key: "scn-test-key-acme"
      owner: "acme"
      key_type: "byok"
      metadata:
        org_id: "org-acme"
providers:
  # FutureAGI-credentialed and managed: opted-in orgs may use it, billed.
  openrouter:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-managed-upstream"
    api_format: "openai"
    type: "openrouter"
    managed: true
    auto_discover: false
  anthropic:
    base_url: "@@ANTHROPIC_URL@@"
    api_format: "anthropic"
    auto_discover: false
    models: ["claude-sonnet-4-5-20250929"]
  bedrock:
    base_url: "@@ANTHROPIC_URL@@"
    api_format: "bedrock"
    aws_region: "us-east-1"
    aws_access_key_id: "scn-test-aws-access-key"
    aws_secret_access_key: "scn-test-aws-secret-key"
    auto_discover: false
    models: ["anthropic.claude-sonnet-4-5-20250929-v1:0"]
managed:
  markup_percent: 5
  require_credits: true
  catalog_refresh: 1m
cost_tracking:
  enabled: true
logging:
  level: "info"
  request_logging:
    enabled: true
# The mock stands in for Django: request logs reach its /__logs. No org or
# key sync runs (sync_on_startup false, no interval).
control_plane:
  url: "@@MOCK_URL@@"
  admin_token: "@@ADMIN_TOKEN@@"
  sync_on_startup: false
  sync_interval: 0s
