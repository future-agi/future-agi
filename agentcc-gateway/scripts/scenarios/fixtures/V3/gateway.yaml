# V3 scenario gateway config (scripts/scenarios/05_v3_shell_hygiene.sh). The
# scenario first replaces @@OCR_URL@@ with its OCR stand-in's URL
# (fixtures/V3/ocr_standin.py), then scn_up renders it like config/base.yaml
# (same placeholders; scn_up appends redis:). It is base.yaml with request
# bodies captured (include_bodies), so the request log shows what an OCR
# payload keeps, and with an operator "mistral" provider at the stand-in: the
# org brings its own key for it (BYOK), and the gateway never calls an org's
# own base_url on loopback.
#
# Every key and token below is a fake value for the local mock upstream.
server:
  port: 18910 # replaced by AGENTCC_PORT
  host: "127.0.0.1"
admin:
  token: "@@ADMIN_TOKEN@@"
auth:
  enabled: true
  # Org keys are person-owned (733): under a control plane config.yaml holds
  # only deployment identities (key_type internal, no org_id, no user_id).
  # scn_up registers acme-app (SCN_KEY of org-acme, user SCN_USER) with the
  # mock's control plane, which lists it on the key sync (lib.sh, Org keys).
providers:
  # FutureAGI-credentialed and managed: opted-in orgs may use it, billed.
  openrouter:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-managed-upstream"
    api_format: "openai"
    type: "openrouter"
    managed: true
    auto_discover: false
  # The Mistral OCR upstream (the stand-in). It carries no key: the org's
  # BYOK key is the only credential that reaches it.
  mistral:
    base_url: "@@OCR_URL@@"
    api_format: "openai"
    auto_discover: false
    models: ["mistral-ocr-4-0"]
managed:
  markup_percent: 5
  require_credits: true
  catalog_refresh: 1m
cost_tracking:
  enabled: true
logging:
  level: "info"
  request_logging:
    enabled: true
    # Capture bodies; the OCR payload itself decides what it keeps.
    include_bodies: true
# The mock stands in for Django: request logs reach its /__logs.
# Its control plane lists the person-owned keys scn_up registers and does
# not answer the org sync, so configs pushed with scn_org_config stay; the
# gateway syncs keys on startup (scn_up waits for the first list).
control_plane:
  url: "@@MOCK_URL@@"
  admin_token: "@@ADMIN_TOKEN@@"
  sync_on_startup: true
  sync_interval: 60s
