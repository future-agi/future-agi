# V2 scenario gateway config (scripts/scenarios/04_v2_server_tools.sh). The
# scenario first replaces @@ANTHROPIC_URL@@ with its Anthropic stand-in's URL
# (fixtures/V2/anthropic_standin.py), then scn_up renders it like
# config/base.yaml (same placeholders; scn_up appends redis:). It is
# base.yaml with two operator providers serving the same Claude model:
#  - anthropic: Anthropic's own API (the stand-in), a direct source with no
#    key of its own; the org brings its key (BYOK), and the gateway never
#    calls an org's own base_url on loopback;
#  - bedrock: Amazon Bedrock, which runs no Anthropic server tool. Its base
#    URL is the stand-in too, so a call that reached it would be recorded.
#
# Every key and token below is a fake value for the local stand-ins.
server:
  port: 18910 # replaced by AGENTCC_PORT
  host: "127.0.0.1"
admin:
  token: "@@ADMIN_TOKEN@@"
auth:
  enabled: true
  # Org keys are person-owned (733): under a control plane config.yaml holds
  # only deployment identities (key_type internal, no org_id, no user_id).
  # scn_up registers acme-app (SCN_KEY of org-acme, user SCN_USER) with the
  # mock's control plane, which lists it on the key sync (lib.sh, Org keys).
providers:
  # FutureAGI-credentialed and managed: opted-in orgs may use it, billed.
  openrouter:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-managed-upstream"
    api_format: "openai"
    type: "openrouter"
    managed: true
    auto_discover: false
  anthropic:
    base_url: "@@ANTHROPIC_URL@@"
    api_format: "anthropic"
    auto_discover: false
    models: ["claude-sonnet-4-5-20250929"]
  bedrock:
    base_url: "@@ANTHROPIC_URL@@"
    api_format: "bedrock"
    aws_region: "us-east-1"
    aws_access_key_id: "scn-test-aws-access-key"
    aws_secret_access_key: "scn-test-aws-secret-key"
    auto_discover: false
    models: ["anthropic.claude-sonnet-4-5-20250929-v1:0"]
managed:
  markup_percent: 5
  require_credits: true
  catalog_refresh: 1m
cost_tracking:
  enabled: true
logging:
  level: "info"
  request_logging:
    enabled: true
# The mock stands in for Django: request logs reach its /__logs.
# Its control plane lists the person-owned keys scn_up registers and does
# not answer the org sync, so configs pushed with scn_org_config stay; the
# gateway syncs keys on startup (scn_up waits for the first list).
control_plane:
  url: "@@MOCK_URL@@"
  admin_token: "@@ADMIN_TOKEN@@"
  sync_on_startup: true
  sync_interval: 60s
