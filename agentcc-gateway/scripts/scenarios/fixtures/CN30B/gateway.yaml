# 98b_cn_per_user_oauth.sh's gateway config. The script fills in the @@CN30B_*@@
# values first; lib_mcp.sh's scn_mcp_gateway_template then adds the test state
# key under mcp:, and lib.sh's scn_up fills base.yaml's placeholders (the
# gateway's own URL among them) and appends redis:. The control plane is
# Django's dev server: the gateway syncs keys and org configs from it every
# 2 s, fetches each person's own account token from its internal token
# endpoint (mcp.django) with a secret of its own, and takes the verification
# keys of Django's authorization server for MCP sign-in (mcp.oauth). Each
# org's per-person OAuth server is its own agentcc-mcpmock in OAuth mode,
# listed for egress by its loopback port. Every key, token and secret is a
# fake value made for the run.
server:
  port: 18911 # replaced by AGENTCC_PORT
  host: "127.0.0.1"
admin:
  token: "@@ADMIN_TOKEN@@"
auth:
  enabled: true
providers:
  operator-openai:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-operator-upstream"
    api_format: "openai"
    auto_discover: false
    models: ["gpt-4o"]
logging:
  level: "info"
  request_logging:
    enabled: true
control_plane:
  url: "@@CN30B_DJANGO_URL@@"
  admin_token: "@@ADMIN_TOKEN@@"
  webhook_secret: "@@CN30B_WEBHOOK_SECRET@@"
  sync_on_startup: true
  sync_interval: 2s
mcp:
  enabled: true
  public_url: "@@GATEWAY_URL@@"
  static:
    org_id: "org-cn30b-static"
  oauth:
    enabled: true
    issuer: "@@CN30B_DJANGO_URL@@/agentcc/mcp-oauth"
  django:
    base_url: "@@CN30B_DJANGO_URL@@"
    internal_token_secret: "@@CN30B_DJANGO_SECRET@@"
  egress:
    private_allow:
      - "127.0.0.1:@@CN30B_CRMA_PORT@@"
      - "127.0.0.1:@@CN30B_CRMB_PORT@@"
