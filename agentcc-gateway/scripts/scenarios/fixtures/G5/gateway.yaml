# G5 scenario gateway config (scripts/scenarios/18_g5_breaker.sh), rendered by
# scn_up like config/base.yaml (same placeholders; scn_up appends redis:).
#
# Circuits per model: the managed OpenRouter provider and a backup both serve
# mock/fail-500 (the mock fails it with 500) and mock/ok-1. Only an internal
# key fails over across config.yaml providers, so the script sends with
# scn-test-key-g5-internal. Cost-optimized ranks the unpriced mock models by
# priority, so openrouter is always tried first. The global breaker opens a
# circuit after 5 failures.
# Every key and token below is a fake value for the local mock upstream.
server:
  port: 18910 # replaced by AGENTCC_PORT
  host: "127.0.0.1"
admin:
  token: "@@ADMIN_TOKEN@@"
auth:
  enabled: true
  # Org keys are person-owned (733): under a control plane config.yaml holds
  # only deployment identities (key_type internal, no org_id, no user_id).
  # scn_up registers acme-app (SCN_KEY of org-acme, user SCN_USER) with the
  # mock's control plane, which lists it on the key sync (lib.sh, Org keys).
  keys:
    - name: "g5-internal"
      key: "scn-test-key-g5-internal"
      owner: "acme"
      key_type: "internal"
providers:
  # FutureAGI-credentialed and managed.
  openrouter:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-managed-upstream"
    api_format: "openai"
    type: "openrouter"
    managed: true
    auto_discover: false
  backup:
    base_url: "@@MOCK_URL@@"
    api_key: "scn-test-g5-backup-upstream"
    api_format: "openai"
    auto_discover: false
    models: ["mock/fail-500", "mock/ok-1"]
managed:
  markup_percent: 5
  require_credits: true
  catalog_refresh: 1m
routing:
  default_strategy: "cost-optimized"
  targets:
    "mock/fail-500":
      - provider: "openrouter"
        priority: 0
      - provider: "backup"
        priority: 1
    "mock/ok-1":
      - provider: "openrouter"
        priority: 0
      - provider: "backup"
        priority: 1
  failover:
    enabled: true
    max_attempts: 2
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    cooldown: 5m
cost_tracking:
  enabled: true
logging:
  level: "info"
  request_logging:
    enabled: true
# The mock stands in for Django: request logs reach its /__logs.
# Its control plane lists the person-owned keys scn_up registers and does
# not answer the org sync, so configs pushed with scn_org_config stay; the
# gateway syncs keys on startup (scn_up waits for the first list).
control_plane:
  url: "@@MOCK_URL@@"
  admin_token: "@@ADMIN_TOKEN@@"
  sync_on_startup: true
  sync_interval: 60s
