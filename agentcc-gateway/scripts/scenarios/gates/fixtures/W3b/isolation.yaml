# W3b_isolation_live.sh's gateway config (integrator-owned). The script fills
# in the mock ports; lib_mcp.sh's scn_mcp_gateway_template adds the fixed test
# state key under `mcp:`; lib.sh's scn_up fills base.yaml's placeholders and
# appends `redis:`. Orgs A and B (Django orgs) push their own server named
# github; the one operator YAML server ("ops") serves only mcp.static.org_id,
# which neither is. The log webhook (control_plane.url) is the mock, whose
# /__logs keeps the batches. Every key and token is a fake value for the mocks.
server:
  port: 18910 # replaced by AGENTCC_PORT
  host: "127.0.0.1"
admin:
  token: "@@ADMIN_TOKEN@@"
auth:
  enabled: true
  # Org keys are person-owned (733): under a control plane config.yaml holds
  # only deployment identities (key_type internal, no org_id, no user_id).
  # scn_up registers acme-app (SCN_KEY of org-acme, user SCN_USER) with the
  # mock's control plane, which lists it on the key sync (lib.sh, Org keys).
providers:
  operator-openai:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-operator-upstream"
    api_format: "openai"
    auto_discover: false
    models: ["gpt-4o"]
logging:
  level: "info"
  request_logging:
    enabled: true
# The mock stands in for Django. Its control plane lists the person-owned
# keys scn_up registers and does not answer the org sync, so configs pushed
# with scn_org_config stay; the gateway syncs keys on startup (scn_up waits
# for the first list).
control_plane:
  url: "@@MOCK_URL@@"
  admin_token: "@@ADMIN_TOKEN@@"
  sync_on_startup: true
  sync_interval: 60s
mcp:
  enabled: true
  static:
    org_id: "org-w3b-static"
  egress:
    # The mocks, by their loopback ports, for the upstream client through the egress guard.
    private_allow:
      - "127.0.0.1:@@W3B_A_PORT@@"
      - "127.0.0.1:@@W3B_B_PORT@@"
      - "127.0.0.1:@@W3B_OPS_PORT@@"
  servers:
    ops:
      url: "@@MCP_OPS_URL@@/mcp"
      transport: "http"
