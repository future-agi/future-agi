# CW2_ee_provisioning_live.sh's gateway config (integrator-owned). scn_mcp_gateway_template adds the
# test state key under mcp:; scn_up fills base.yaml's placeholders and appends
# redis:. Every key and token is a fake value for the mocks.
server:
  port: 18910 # replaced by AGENTCC_PORT
  host: "127.0.0.1"
admin:
  token: "@@ADMIN_TOKEN@@"
auth:
  enabled: true
  # Org keys are person-owned (733): under a control plane config.yaml holds
  # only deployment identities (key_type internal, no org_id, no user_id).
  # scn_up registers acme-app (SCN_KEY of org-acme, user SCN_USER) with the
  # mock's control plane, which lists it on the key sync (lib.sh, Org keys).
providers:
  operator-openai:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-operator-upstream"
    api_format: "openai"
    auto_discover: false
    models: ["gpt-4o"]
logging:
  level: "info"
  request_logging:
    enabled: true
# The mock stands in for Django. Its control plane lists the person-owned
# keys scn_up registers and does not answer the org sync, so configs pushed
# with scn_org_config stay; the gateway syncs keys on startup (scn_up waits
# for the first list).
control_plane:
  url: "@@MOCK_URL@@"
  admin_token: "@@ADMIN_TOKEN@@"
  sync_on_startup: true
  sync_interval: 60s
mcp:
  enabled: true
  static:
    org_id: "org-cw2-live-static"
  egress:
    private_allow:
      - "127.0.0.1:@@CN22_A_PORT@@"
