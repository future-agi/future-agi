# Gateway config of the catalog-priced gate checks (gates/*.sh), rendered
# by scn_up like config/base.yaml (same placeholders; scn_up appends redis:).
# The mock serves gates/fixtures/catalog-priced/mock: the common catalog plus models that
# no model database prices (gatevendor/*), so only the managed catalog can.
# Every key and token below is a fake value for the local mock upstream.
server:
  port: 18910 # replaced by AGENTCC_PORT
  host: "127.0.0.1"
admin:
  token: "@@ADMIN_TOKEN@@"
auth:
  enabled: true
  keys:
    - name: "acme-app"
      key: "scn-test-key-acme"
      owner: "acme"
      key_type: "byok"
      metadata:
        org_id: "org-acme"
    # Internal keys select through the gateway router and may use config.yaml
    # providers; their requests are not in the request log.
    - name: "gate-internal"
      key: "scn-test-key-gate-internal"
      owner: "acme"
      key_type: "internal"
providers:
  # FutureAGI-credentialed and managed: opted-in orgs may use it, billed.
  openrouter:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-managed-upstream"
    api_format: "openai"
    type: "openrouter"
    managed: true
    auto_discover: false
  # FutureAGI-credentialed, not managed, not OpenRouter.
  operator-openai:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-operator-upstream"
    api_format: "openai"
    auto_discover: false
    models: ["gpt-4o"]
  # Anthropic's Messages API on the mock (/v1/messages); an org reaches it
  # with its own key through an org provider entry of the same id.
  anthropic-direct:
    base_url: "@@MOCK_URL@@"
    api_key: "scn-test-operator-anthropic"
    api_format: "anthropic"
    auto_discover: false
    models: ["claude-sonnet-4-5"]
managed:
  markup_percent: 5
  require_credits: true
  catalog_refresh: 1m
routing:
  # Cost-optimized, failover off: the global router picks one target. The
  # three targets of gate/cheapest serve catalog-only models whose priority
  # order is the reverse of their price order.
  default_strategy: "cost-optimized"
  targets:
    "gate/cheapest":
      - provider: "openrouter"
        model_override: "gatevendor/tier-high"
        priority: 0
      - provider: "openrouter"
        model_override: "gatevendor/tier-mid"
        priority: 1
      - provider: "openrouter"
        model_override: "gatevendor/tier-low"
        priority: 2
cost_tracking:
  enabled: true
logging:
  level: "info"
  request_logging:
    enabled: true
control_plane:
  url: "@@MOCK_URL@@"
  admin_token: "@@ADMIN_TOKEN@@"
  sync_on_startup: false
  sync_interval: 0s
