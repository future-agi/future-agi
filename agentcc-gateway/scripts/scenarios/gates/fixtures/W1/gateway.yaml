# Gateway config for the gate checks gates/W1_*.sh, rendered
# by scn_up like config/base.yaml (same placeholders; scn_up appends redis:).
# The mock serves gates/fixtures/W1/mock: the common catalog plus models that
# no model database prices (w1vendor/*), so only the managed catalog can.
# Every key and token below is a fake value for the local mock upstream.
server:
  port: 18910 # replaced by AGENTCC_PORT
  host: "127.0.0.1"
admin:
  token: "@@ADMIN_TOKEN@@"
auth:
  enabled: true
  # Org keys are person-owned (733): under a control plane config.yaml holds
  # only deployment identities (key_type internal, no org_id, no user_id).
  # scn_up registers acme-app (SCN_KEY of org-acme, user SCN_USER) with the
  # mock's control plane, which lists it on the key sync (lib.sh, Org keys).
  keys:
    # Internal keys select through the gateway router and may use config.yaml
    # providers; their requests are not in the request log.
    - name: "w1-internal"
      key: "scn-test-key-w1-internal"
      owner: "acme"
      key_type: "internal"
providers:
  # FutureAGI-credentialed and managed: opted-in orgs may use it, billed.
  openrouter:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-managed-upstream"
    api_format: "openai"
    type: "openrouter"
    managed: true
    auto_discover: false
  # FutureAGI-credentialed, not managed, not OpenRouter.
  operator-openai:
    base_url: "@@MOCK_URL@@/api"
    api_key: "scn-test-operator-upstream"
    api_format: "openai"
    auto_discover: false
    models: ["gpt-4o"]
  # Anthropic's Messages API on the mock (/v1/messages); an org reaches it
  # with its own key through an org provider entry of the same id.
  anthropic-direct:
    base_url: "@@MOCK_URL@@"
    api_key: "scn-test-operator-anthropic"
    api_format: "anthropic"
    auto_discover: false
    models: ["claude-sonnet-4-5"]
managed:
  markup_percent: 5
  require_credits: true
  catalog_refresh: 1m
routing:
  # Cost-optimized, failover off: the global router picks one target. The
  # three targets of w1/cheapest serve catalog-only models whose priority
  # order is the reverse of their price order.
  default_strategy: "cost-optimized"
  targets:
    "w1/cheapest":
      - provider: "openrouter"
        model_override: "w1vendor/tier-high"
        priority: 0
      - provider: "openrouter"
        model_override: "w1vendor/tier-mid"
        priority: 1
      - provider: "openrouter"
        model_override: "w1vendor/tier-low"
        priority: 2
cost_tracking:
  enabled: true
logging:
  level: "info"
  request_logging:
    enabled: true
# The mock stands in for Django. Its control plane lists the person-owned
# keys scn_up registers and does not answer the org sync, so configs pushed
# with scn_org_config stay; the gateway syncs keys on startup (scn_up waits
# for the first list).
control_plane:
  url: "@@MOCK_URL@@"
  admin_token: "@@ADMIN_TOKEN@@"
  sync_on_startup: true
  sync_interval: 60s
