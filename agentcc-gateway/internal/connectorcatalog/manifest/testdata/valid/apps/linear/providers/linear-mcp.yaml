# Fixture for the manifest validator tests, not catalog data. Facts are
# illustrative; the catalog itself lives in agentcc-gateway/catalog/connectors.
schema: "connector-manifest/v1#provider"
app: linear
id: linear-mcp
version: 1.0.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: ga, source: https://linear.app/docs/mcp }
transport:
  kind: http
  url: https://mcp.linear.app/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent, user]
auth:
  kind: oauth2
  oauth2:
    authorizeUrl: https://linear.app/oauth/authorize
    tokenUrl: https://api.linear.app/oauth/token
    scopes: [read, write]
    pkce: true
    tokenBody: form
    clientAuth: body
    refresh: { supported: true, rotates: false }
    registration: [preregistered, dcr]
  verify: { tool: list_issues }
tools:
  source: upstream_mcp
  defaultPosture: ask
  snapshot:
    count: 2
    toolsHash: sha256:c55690cf679360ccc1893b5648dc0e23b41defa99ceb1271cd1098af4881d055
    era: 2025-06-18
    takenAt: 2026-10-19
  items:
    - name: list_issues
      title: List issues
      description: "List issues in the user's workspace, filtered by team, assignee or state."
      annotations:
        readOnlyHint: true
        destructiveHint: false
        idempotentHint: true
        openWorldHint: true
      posture: auto
      scopes: [read]
    - name: create_issue
      title: Create issue
      description: "Create an issue in a team, with a title and an optional description."
      annotations:
        readOnlyHint: false
        destructiveHint: false
        idempotentHint: false
        openWorldHint: true
      posture: ask
      scopes: [write]
rateLimits:
  - scope: user
    requests: 1500
    per: 1h
    source: https://linear.app/developers/rate-limiting
pricing: { model: free }
upstream:
  registry: { name: app.linear/linear, version: 1.0.0, namespace: domain }
quality:
  tier: listed
  review: { by: connectors-maintainer, at: 2026-10-19 }
  owner: connectors
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://linear.app/docs/mcp
    fetchedAt: 2026-10-19
  - fact: auth.oauth2.authorizeUrl
    url: https://linear.app/developers/oauth-2-0-authentication
    fetchedAt: 2026-10-19
  - fact: auth.oauth2.tokenUrl
    url: https://linear.app/developers/oauth-2-0-authentication
    fetchedAt: 2026-10-19
  - fact: auth.oauth2.scopes
    url: https://linear.app/developers/oauth-2-0-authentication
    fetchedAt: 2026-10-19
x-gateway: { timeoutMs: 30000 }
