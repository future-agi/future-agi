schema: "connector-manifest/v1#provider"
app: github
id: local
version: 1.0.0
kind: vendor_local
publisher: vendor
vendorStatus: { label: ga, source: https://github.com/github/github-mcp-server }
transport:
  kind: stdio
  command: docker
  args:
    - run
    - "-i"
    - "--rm"
    - "-e"
    - GITHUB_PERSONAL_ACCESS_TOKEN
    - ghcr.io/github/github-mcp-server
