# Retell's hosted MCP server accepts a Retell API key as a bearer.
# Its generic invoke tool can reach mutating endpoints; keep per-call approval.
schema: "connector-manifest/v1#provider"
app: retell-ai
id: api-key
version: 1.1.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.retellai.com
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: Retell API key
      help: "Generate a Retell API key with only the needed permissions. The invoke_api_endpoint tool can call every endpoint the key permits, including delete and publish; approve each call individually. Supply the key without the Bearer prefix."
      helpUrl: https://docs.retellai.com/accounts/manage-api-keys
tools: { source: upstream_mcp, defaultPosture: ask }
pricing:
  model: vendor_metered
  source: https://www.retellai.com/pricing
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://docs.retellai.com/get-started/mcp-server
    fetchedAt: 2026-11-09
  - fact: transport.variant
    url: https://docs.retellai.com/get-started/mcp-server
    fetchedAt: 2026-11-09
  - fact: auth.kind
    url: https://docs.retellai.com/get-started/mcp-server
    fetchedAt: 2026-11-09
  - fact: auth.credentialParts
    url: https://docs.retellai.com/get-started/mcp-server
    fetchedAt: 2026-11-09
