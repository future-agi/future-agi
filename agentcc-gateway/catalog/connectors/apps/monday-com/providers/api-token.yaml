# monday.com's hosted Platform MCP server with a personal API token as the
# bearer, the path monday.com documents for clients that do not run its
# MCP OAuth flow. A personal token mirrors its owner's monday.com
# permissions, so this is one shared (agent-mode) connection an org admin
# adds for the team's own use.
schema: "connector-manifest/v1#provider"
app: monday-com
id: api-token
version: 1.0.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.monday.com/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: Personal API token
      help: "A monday.com personal API token (profile picture > Developers > My access tokens). Calls act with that person's monday.com permissions."
      helpUrl: https://developer.monday.com/api-reference/docs/mcp-api-token
tools: { source: upstream_mcp, defaultPosture: ask }
pricing: { model: vendor_plan }
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://developer.monday.com/api-reference/docs/integrate-with-monday-mcp
    fetchedAt: 2026-10-21
  - fact: transport.variant
    url: https://developer.monday.com/api-reference/docs/integrate-with-monday-mcp
    fetchedAt: 2026-10-21
  - fact: auth.kind
    url: https://developer.monday.com/api-reference/docs/mcp-api-token
    fetchedAt: 2026-10-21
  - fact: auth.credentialParts
    url: https://developer.monday.com/api-reference/docs/mcp-api-token
    fetchedAt: 2026-10-21
x-omega: { oss: exclude }
