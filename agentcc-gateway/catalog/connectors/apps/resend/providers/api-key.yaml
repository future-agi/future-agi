# Resend documents API-key bearer authentication for headless clients of its
# hosted MCP server; interactive OAuth is a separate connection option.
schema: "connector-manifest/v1#provider"
app: resend
id: api-key
version: 1.1.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.resend.com/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: API key
      help: "Create a key on Resend's API Keys page. Sending-access keys can send email; full-access keys can manage other resources. Choose only the permissions your agent needs."
      helpUrl: https://resend.com/docs/mcp-server
tools: { source: upstream_mcp, defaultPosture: ask }
pricing:
  model: vendor_metered
  source: https://resend.com/pricing
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://resend.com/docs/mcp-server
    fetchedAt: 2026-11-09
  - fact: transport.variant
    url: https://resend.com/docs/mcp-server
    fetchedAt: 2026-11-09
  - fact: auth.kind
    url: https://resend.com/docs/mcp-server
    fetchedAt: 2026-11-09
  - fact: auth.credentialParts
    url: https://resend.com/docs/mcp-server
    fetchedAt: 2026-11-09
