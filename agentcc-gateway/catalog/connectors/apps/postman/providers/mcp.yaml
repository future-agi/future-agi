  - fact: auth.oauth2.registration
    url: https://learning.postman.com/docs/reference/postman-api/postman-mcp-server/postman-mcp-remote-server
    fetchedAt: 2026-11-11
  - fact: auth.oauth2.registration
    url: https://mcp.postman.com/.well-known/oauth-authorization-server
    fetchedAt: 2026-11-11
x-omega: { ee: exclude }
