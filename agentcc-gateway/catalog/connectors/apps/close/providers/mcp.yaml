    fetchedAt: 2026-10-20
x-omega:
  publicClient:
    supported: false
    evidence:
      - url: https://developer.close.com/integrations/create-an-oauth-app
        fetchedAt: 2026-10-22
        sha256: 07e5f9fb8fa38b6d293d9785e220bee8c0e256c04311b4f9af3edabfb73ceeaa
        quote: "Click Create, then copy your Client ID and Client Secret — you’ll need these to implement the OAuth 2.0 flow."
      - url: https://developer.close.com/integrations/create-an-oauth-app
        fetchedAt: 2026-10-22
        sha256: 07e5f9fb8fa38b6d293d9785e220bee8c0e256c04311b4f9af3edabfb73ceeaa
        quote: "Must use TLS/SSL — plain http:// URLs are not accepted."
    notes: "Close's authorization server also lists none for token auth, which serves dynamically registered clients; an OAuth app a person creates gets a client secret and an https-only redirect, and omega mcp login redirects to http on loopback."
