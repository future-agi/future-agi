# HashiCorp's hosted Terraform MCP server accepts an HCP Terraform API token as a bearer.
schema: "connector-manifest/v1#provider"
app: hcp-terraform
id: api-key
version: 1.1.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.terraform.io/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: HCP Terraform API token
      help: "Create an HCP Terraform user or team API token. Only US HCP Terraform organizations are supported, not Terraform Enterprise or HCP Europe. The hosted server is beta; HashiCorp discourages production use. Supply the token without the Bearer prefix."
      helpUrl: https://developer.hashicorp.com/terraform/mcp-server/deploy/remote-mcp
tools: { source: upstream_mcp, defaultPosture: ask }
pricing:
  model: vendor_plan
  source: https://developer.hashicorp.com/terraform/mcp-server/deploy/remote-mcp
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://developer.hashicorp.com/terraform/mcp-server/deploy/remote-mcp
    fetchedAt: 2026-11-09
  - fact: transport.variant
    url: https://developer.hashicorp.com/terraform/mcp-server/deploy
    fetchedAt: 2026-11-09
  - fact: auth.kind
    url: https://developer.hashicorp.com/terraform/mcp-server/deploy/remote-mcp
    fetchedAt: 2026-11-09
  - fact: auth.credentialParts
    url: https://developer.hashicorp.com/terraform/mcp-server/deploy/remote-mcp
    fetchedAt: 2026-11-09
