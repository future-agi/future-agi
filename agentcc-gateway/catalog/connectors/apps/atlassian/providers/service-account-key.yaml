# The Atlassian Rovo MCP Server with a service account API key as the
# bearer: an organization admin creates the service account and must enable
# API token authentication for Rovo MCP. (A personal API token is sent as
# HTTP Basic email:token, which the gateway cannot compose yet, so it is not
# offered here.)
schema: "connector-manifest/v1#provider"
app: atlassian
id: service-account-key
version: 1.0.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.atlassian.com/v2/mcp?tools=all
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: Service account API key
      help: "An API key of an Atlassian service account. Your organization admin must enable API token authentication for Rovo MCP."
      helpUrl: https://developer.atlassian.com/cloud/rovo-mcp/guides/configuring-authentication-via-api-token/
tools: { source: upstream_mcp, defaultPosture: ask }
pricing: { model: vendor_plan }
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://developer.atlassian.com/cloud/rovo-mcp/guides/configuring-authentication-via-api-token/
    fetchedAt: 2026-10-20
  - fact: transport.url
    url: https://developer.atlassian.com/cloud/rovo-mcp/guides/supported-tools/
    fetchedAt: 2026-10-20
  - fact: auth.kind
    url: https://developer.atlassian.com/cloud/rovo-mcp/guides/authentication-and-authorization/
    fetchedAt: 2026-10-20
  - fact: auth.credentialParts
    url: https://developer.atlassian.com/cloud/rovo-mcp/guides/configuring-authentication-via-api-token/
    fetchedAt: 2026-10-20
x-omega: { oss: exclude }
