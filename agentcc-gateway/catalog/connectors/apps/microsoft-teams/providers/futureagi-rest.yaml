# FutureAGI's own Teams connector: the agentcc-connectors runtime serves
# these tools over MCP and calls Microsoft Graph v1.0 with each user's
# Microsoft token. The tools are generated from Microsoft Graph's OpenAPI
# description, pinned by sha256 at a commit of microsoftgraph/msgraph-metadata,
# and the curated overlay beside this file (providers/futureagi-rest/tools.yaml).
#
# Sign-in is Microsoft Entra's v2 authorization code flow with PKCE, for work
# or school accounts only (Teams has no personal-account API). {tenant} is
# "organizations" for a multitenant client (FutureAGI's own, or an org's), or
# the tenant id of an org's own single-tenant client; it sits in the path, so
# the token host is fixed. The client is the microsoft group's, shared with
# Outlook: the organization's own Entra client, else FutureAGI's platform
# client.
#
# ChannelMessage.Read.All requires a tenant admin's consent, so a person
# connects Teams only after an admin of their tenant has consented for the
# client (or the tenant lets them request it). The other scopes are
# user-consentable; for a multitenant client, users of another tenant can
# consent only when its publisher is verified (review below).
#
# Refresh tokens are replaced on every use, so the vault stores the new one
# each time. Entra publishes no token revocation endpoint: disconnecting
# deletes the stored tokens, and the user or a tenant admin removes the
# client's consent in Microsoft's portals.
#
# Not emitted to Omega: EE would take this provider for a Teams app before
# the runtime is deployed; OSS receives no rest provider.
#
# Its cassette under fixtures/ is synthetic (no Microsoft test tenant yet),
# so it is marked unverified, and the provider stays at tier listed.
schema: "connector-manifest/v1#provider"
app: microsoft-teams
id: futureagi-rest
version: 1.0.0
kind: rest
publisher: futureagi
vendorStatus:
  label: ga
  source: https://learn.microsoft.com/en-us/graph/api/overview?view=graph-rest-1.0
transport:
  kind: http
  url: "https://{connectorsHost}/microsoft-teams/mcp"
  variant: streamable
hosted: true
trusted: false
accountModes: [agent, user]
auth:
  kind: oauth2
  oauth2:
    authorizeUrl: "https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize"
    tokenUrl: "https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token"
    scopes:
      - offline_access
      - Team.ReadBasic.All
      - Channel.ReadBasic.All
      - ChannelMessage.Read.All
      - ChannelMessage.Send
      - Chat.ReadBasic
      - Chat.Read
      - ChatMessage.Send
    pkce: true
    tokenBody: form
    clientAuth: body
    urlVariables:
      tenant:
        description: "Entra tenant: organizations for a multitenant client, or the tenant id of a single-tenant client."
        pattern: "^(organizations|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$"
        default: organizations
        scope: org
    refresh: { supported: true, rotates: true }
    registration: [preregistered]
    clientGroup: microsoft
    review:
      program: microsoft_publisher_verification
      leadTime: P1W
      source: https://learn.microsoft.com/en-us/partner-center/enroll/understand-the-verification-process
  verify: { tool: list_joined_teams }
tools:
  source: operations
  defaultPosture: ask
  generated: tools.generated.json
retry: { "on": [429, 503], honorRetryAfter: true }
pricing: { model: vendor_plan }
upstream:
  spec:
    url: https://raw.githubusercontent.com/microsoftgraph/msgraph-metadata/8c562525694550601a232cb54014e48c6c7f6da0/openapi/v1.0/openapi.yaml
    format: openapi-3
    sha256: 533f6d86985584327109ba2c52c0e51454ce1ba2153c11f4d841e898b88c5b1b
    licence: MIT (microsoftgraph/msgraph-metadata)
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: auth.oauth2.authorizeUrl
    url: https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow
    fetchedAt: 2026-10-21
  - fact: auth.oauth2.tokenUrl
    url: https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow
    fetchedAt: 2026-10-21
  - fact: auth.oauth2.scopes
    url: https://learn.microsoft.com/en-us/graph/permissions-reference
    fetchedAt: 2026-10-21
  - fact: auth.oauth2.scopes
    url: https://learn.microsoft.com/en-us/entra/identity-platform/scopes-oidc
    fetchedAt: 2026-10-21
  - fact: auth.oauth2.pkce
    url: https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow
    fetchedAt: 2026-10-21
  - fact: auth.oauth2.clientAuth
    url: https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow
    fetchedAt: 2026-10-21
  - fact: auth.oauth2.urlVariables.tenant
    url: https://learn.microsoft.com/en-us/entra/identity-platform/v2-protocols
    fetchedAt: 2026-10-21
  - fact: auth.oauth2.urlVariables.tenant
