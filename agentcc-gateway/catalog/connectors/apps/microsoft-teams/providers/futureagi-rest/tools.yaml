# The curated overlay for FutureAGI's Teams connector over Microsoft Graph
# v1.0. Graph's OpenAPI description lists no scopes per operation, so each tool
# cites the Learn page whose permissions table names its least privileged
# delegated scope (scopeSource). ChannelMessage.Read.All, which the three
# channel-reading tools need, requires a tenant admin's consent. Several
# operations accept fewer OData query parameters than the description lists;
# the inputs follow each Learn page instead. The description's operation
# summaries are not used.
schema: connector-gen/rest-overlay/v1
spec: fixtures/spec/graph-v1.0-openapi.yaml.gz
tools:
  - name: list_joined_teams
    title: List my teams
    description: List the teams the signed-in user is a member of, with their ids, names and descriptions.
    operation: { operationId: me.ListJoinedTeams }
    params:
      exclude:
        [$top, $skip, $count, $expand, $search, $filter, $orderby, $select]
    annotations: { openWorldHint: false }
    posture: auto
    scopes: [Team.ReadBasic.All]
    scopeSource: https://learn.microsoft.com/en-us/graph/api/user-list-joinedteams?view=graph-rest-1.0
    response:
      maxBytes: 50000

  - name: list_channels
    title: List a team's channels
    description: >-
      List the channels of a team, by its id from list_joined_teams, with each channel's id, name and
      membership type. filter takes OData, for example membershipType eq 'standard'.
    operation: { operationId: teams.ListChannels }
    params:
      exclude: [$top, $skip, $count, $expand, $search, $orderby]
      rename: { $filter: filter, $select: select }
      describe:
        team-id: "The team's id, from list_joined_teams."
    annotations: { openWorldHint: false }
    posture: auto
    scopes: [Channel.ReadBasic.All]
    scopeSource: https://learn.microsoft.com/en-us/graph/api/channel-list?view=graph-rest-1.0
    response:
      maxBytes: 50000

  - name: list_channel_messages
    title: Read a channel's messages
    description: >-
      Read the top-level messages of a channel, newest first, by team id and channel id. top is 1-50 (default
      20); expand=replies includes each message's replies. Each message's id is the chatMessage-id that
      list_replies and reply_to_channel_message take; @odata.nextLink holds the next page.
    operation: { operationId: teams.channels.ListMessages }
    params:
      exclude: [$skip, $count, $search, $filter, $orderby, $select]
      rename: { $top: top, $expand: expand }
      describe:
        team-id: "The team's id, from list_joined_teams."
        channel-id: "The channel's id, from list_channels."
    annotations: { openWorldHint: false }
    posture: auto
    scopes: [ChannelMessage.Read.All]
    scopeSource: https://learn.microsoft.com/en-us/graph/api/channel-list-messages?view=graph-rest-1.0
    response:
      maxBytes: 50000

  - name: list_replies
    title: Read a thread's replies
    description: >-
      Read the replies to one channel message, by team id, channel id and the message's id. top is 1-50.
    operation: { operationId: teams.channels.messages.ListReplies }
    params:
      exclude: [$skip, $count, $search, $filter, $orderby, $select, $expand]
      rename: { $top: top }
      describe:
        team-id: "The team's id."
        channel-id: "The channel's id."
        chatMessage-id: "The id of the top-level message, from list_channel_messages."
    annotations: { openWorldHint: false }
    posture: auto
    scopes: [ChannelMessage.Read.All]
    scopeSource: https://learn.microsoft.com/en-us/graph/api/chatmessage-list-replies?view=graph-rest-1.0
    response:
      maxBytes: 50000

  - name: get_channel_message
    title: Read one channel message
    description: >-
      Read one channel message, by team id, channel id and the message's id, with its sender, body and
      reactions.
    operation: { operationId: teams.channels.GetMessages }
    params:
      exclude: [$select, $expand]
      describe:
        team-id: "The team's id."
        channel-id: "The channel's id."
        chatMessage-id: "The message's id."
    annotations: { openWorldHint: false }
    posture: auto
    scopes: [ChannelMessage.Read.All]
    scopeSource: https://learn.microsoft.com/en-us/graph/api/chatmessage-get?view=graph-rest-1.0
    response:
      fields:
        [
          id,
          replyToId,
          createdDateTime,
          from,
          subject,
          body,
          importance,
          webUrl,
          reactions,
          mentions,
        ]
      maxBytes: 50000

  - name: post_channel_message
    title: Post to a channel
    description: >-
      Post a new message to a channel, by team id and channel id. The input body is the message, for example
      {"body": {"contentType": "text", "content": "Release 2.4 is out"}, "subject": "Release"}; subject is an
      optional headline.
    operation: { operationId: teams.channels.CreateMessages }
    params:
      describe:
        team-id: "The team's id."
        channel-id: "The channel's id."
    body:
      fields: [body, subject, importance]
      required: [body]
      description: The message to post.
    annotations:
      { destructiveHint: false, idempotentHint: false, openWorldHint: true }
    posture: ask
    scopes: [ChannelMessage.Send]
    scopeSource: https://learn.microsoft.com/en-us/graph/api/channel-post-messages?view=graph-rest-1.0
    response:
      fields: [id, webUrl, createdDateTime]

  - name: reply_to_channel_message
    title: Reply in a channel thread
    description: >-
      Reply to a channel message, by team id, channel id and the message's id. The input body is the reply, for
      example {"body": {"contentType": "text", "content": "On it."}}.
    operation: { operationId: teams.channels.messages.CreateReplies }
    params:
      describe:
        team-id: "The team's id."
        channel-id: "The channel's id."
        chatMessage-id: "The id of the top-level message to reply to."
    body:
      fields: [body]
      required: [body]
      description: The reply.
    annotations:
      { destructiveHint: false, idempotentHint: false, openWorldHint: true }
    posture: ask
    scopes: [ChannelMessage.Send]
    scopeSource: https://learn.microsoft.com/en-us/graph/api/channel-post-messagereply?view=graph-rest-1.0
    response:
      fields: [id, replyToId, webUrl, createdDateTime]

  - name: list_chats
    title: List my chats
    description: >-
      List the user's one-on-one, group and meeting chats, with their ids and topics. filter takes OData, for
      example chatType eq 'oneOnOne'; expand=members or expand=lastMessagePreview adds them; top is 1-50;
      @odata.nextLink holds the next page.
    operation: { operationId: chats.chat.ListChat }
    params:
      exclude: [$skip, $count, $search, $orderby, $select]
      rename: { $top: top, $filter: filter, $expand: expand }
    annotations: { openWorldHint: false }
    posture: auto
    scopes: [Chat.ReadBasic]
    scopeSource: https://learn.microsoft.com/en-us/graph/api/chat-list?view=graph-rest-1.0
    response:
      maxBytes: 50000

  - name: list_chat_messages
    title: Read a chat's messages
    description: >-
      Read the messages of one chat, newest first, by its id from list_chats. top is 1-50; orderby takes
      lastModifiedDateTime desc or createdDateTime desc; filter takes a date range, for example
      lastModifiedDateTime gt 2026-10-20T00:00:00Z.
    operation: { operationId: chats.ListMessages }
    params:
      exclude: [$skip, $count, $search, $select, $expand]
      rename: { $top: top, $filter: filter, $orderby: orderby }
      describe:
        chat-id: "The chat's id, from list_chats."
    annotations: { openWorldHint: false }
    posture: auto
    scopes: [Chat.Read]
    scopeSource: https://learn.microsoft.com/en-us/graph/api/chat-list-messages?view=graph-rest-1.0
    response:
      maxBytes: 50000

  - name: list_chat_members
    title: List a chat's members
    description: List the members of one chat, by its id from list_chats, with their names, user ids and roles.
    operation: { operationId: chats.ListMembers }
    params:
      exclude:
        [$top, $skip, $count, $search, $filter, $orderby, $select, $expand]
      describe:
        chat-id: "The chat's id, from list_chats."
    annotations: { openWorldHint: false }
    posture: auto
    scopes: [Chat.ReadBasic]
    scopeSource: https://learn.microsoft.com/en-us/graph/api/conversationmember-list?view=graph-rest-1.0
    response:
      maxBytes: 25000

  - name: send_chat_message
    title: Send a chat message
    description: >-
      Send a message in a chat, by its id. The input body is the message, for example {"body": {"contentType":
      "text", "content": "Can we move to 3pm?"}}.
    operation: { operationId: chats.CreateMessages }
    params:
      describe:
        chat-id: "The chat's id, from list_chats."
    body:
      fields: [body]
      required: [body]
      description: The message to send.
    annotations:
      { destructiveHint: false, idempotentHint: false, openWorldHint: true }
    posture: ask
    scopes: [ChatMessage.Send]
    scopeSource: https://learn.microsoft.com/en-us/graph/api/chat-post-messages?view=graph-rest-1.0
    response:
      fields: [id, chatId, webUrl, createdDateTime]
