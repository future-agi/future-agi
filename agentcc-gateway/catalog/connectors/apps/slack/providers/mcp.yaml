# Slack's MCP server takes user tokens, from the user-token authorize and
# token endpoints (not the bot-token oauth.v2.access, which EE's built-in app
# still uses). Slack has no dynamic client registration, and only apps
# listed in the Slack Marketplace, or a workspace's own internal app, may use
# MCP: until a FutureAGI app is listed, each workspace connects its own
# internal app. The scopes are the user scopes EE's built-in app requests,
# each one a scope Slack's MCP page names for a tool.
schema: "connector-manifest/v1#provider"
app: slack
id: mcp
version: 1.0.1
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.slack.com/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent, user]
auth:
  kind: oauth2
  oauth2:
    authorizeUrl: https://slack.com/oauth/v2_user/authorize
    tokenUrl: https://slack.com/api/oauth.v2.user.access
    scopes:
      [
        "search:read.public",
        "channels:history",
        "channels:read",
        "chat:write",
        "users:read",
      ]
    pkce: true
    tokenBody: form
    clientAuth: body
    refresh: { supported: true, rotates: true }
    registration: [preregistered]
    review:
      program: slack_marketplace_review
      leadTime: P12W
      source: https://docs.slack.dev/slack-marketplace/slack-marketplace-review-guide/
  clientApproval:
    required: true
    program: "Slack Marketplace listing; a workspace's own internal app needs none"
    url: https://docs.slack.dev/slack-marketplace/slack-marketplace-review-guide/
    source: https://docs.slack.dev/ai/slack-mcp-server/
tools: { source: upstream_mcp, defaultPosture: ask }
pricing: { model: vendor_plan }
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://docs.slack.dev/ai/slack-mcp-server/
    fetchedAt: 2026-10-20
  - fact: transport.variant
    url: https://docs.slack.dev/ai/slack-mcp-server/
    fetchedAt: 2026-10-20
  - fact: auth.kind
    url: https://docs.slack.dev/ai/slack-mcp-server/
    fetchedAt: 2026-10-20
  - fact: auth.oauth2.authorizeUrl
    url: https://docs.slack.dev/ai/slack-mcp-server/
    fetchedAt: 2026-10-20
  - fact: auth.oauth2.authorizeUrl
    url: https://mcp.slack.com/.well-known/oauth-authorization-server
    fetchedAt: 2026-10-20
  - fact: auth.oauth2.tokenUrl
    url: https://docs.slack.dev/ai/slack-mcp-server/
    fetchedAt: 2026-10-20
  - fact: auth.oauth2.tokenUrl
    url: https://docs.slack.dev/reference/methods/oauth.v2.user.access/
    fetchedAt: 2026-10-20
  - fact: auth.oauth2.scopes
    url: https://docs.slack.dev/ai/slack-mcp-server/
    fetchedAt: 2026-10-20
  - fact: auth.oauth2.pkce
    url: https://mcp.slack.com/.well-known/oauth-authorization-server
