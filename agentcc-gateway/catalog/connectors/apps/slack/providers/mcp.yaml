x-omega:
  publicClient:
    supported: false
    evidence:
      - url: https://docs.slack.dev/ai/slack-mcp-server/
        fetchedAt: 2026-10-20
        sha256: 2e6daeb1dbe00dd14ffc6c27dd2352615c53b57f7f720684caccb86e38f96703
        quote: "Slack supports confidential OAuth for MCP clients. You'll need to use your app's client_id and client_secret for Slack OAuth."
      - url: https://mcp.slack.com/.well-known/oauth-authorization-server
        fetchedAt: 2026-10-20
        sha256: 0032884c8d36253d31313163faaa0a7126c6208505f27db762ad7ae5591839d9
        quote: '"token_endpoint_auth_methods_supported": ["client_secret_post"]'
    notes: "Unproven, not disproven: Slack's PKCE page (docs.slack.dev/authentication/using-pkce, saved 2026-10-22, sha256 fedd7c12...) makes a PKCE-enabled app a public client that calls oauth.v2.access without client_secret, and the MCP guide points desktop clients at it; whether oauth.v2.user.access, the MCP user-token endpoint, takes such an app is not stated. Set true only after a sign-in proves it."
