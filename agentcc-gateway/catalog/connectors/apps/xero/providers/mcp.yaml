# Xero's Remote MCP server, with the OAuth 2.0 flow Xero's API uses. Xero
# takes no dynamic registration: a client is an app created in the Xero
# Developer portal. Xero recommends a PKCE app, which has no client secret;
# the organization's own OAuth app here is a confidential client, so it is a
# web app (Auth Code grant) with a client secret, which Xero says also works
# but does not recommend. Its secret goes only to Xero's token and
# revocation endpoints, by HTTP Basic, as Xero's standard flow asks.
# Remote MCP is included for Commercial apps on the Core plan or above; a
# Starter app reaches only a demo organisation, and Custom Connections apps
# are not eligible. The scopes are those Xero's tool table lists, plus
# offline_access for a refresh token. At sign-in a person picks the
# organisations to share; each tool call runs against one of them.
# EE and OSS get none until a client of their own is proven.
schema: "connector-manifest/v1#provider"
app: xero
id: mcp
version: 1.0.0
kind: vendor_mcp
publisher: vendor
vendorStatus:
  label: ga
  source: https://developer.xero.com/documentation/guides/remote-mcp/overview
transport:
  kind: http
  url: https://api.xero.com/mcp/v1
  era: auto
hosted: true
trusted: false
accountModes: [agent, user]
auth:
  kind: oauth2
  help: "Use a Xero web app (Auth Code grant, with a client secret) that has FutureAGI's redirect URI, on the Core plan or above; on the Starter plan it reaches only a demo organisation."
  oauth2:
    authorizeUrl: https://login.xero.com/identity/connect/authorize
    tokenUrl: https://identity.xero.com/connect/token
    scopes:
      - offline_access
      - accounting.invoices.read
      - accounting.invoices
      - accounting.settings.read
      - accounting.settings
      - accounting.contacts.read
      - accounting.contacts
      - accounting.banktransactions.read
      - accounting.banktransactions
      - accounting.payments.read
      - accounting.payments
      - accounting.manualjournals.read
      - accounting.manualjournals
      - accounting.reports.profitandloss.read
      - accounting.reports.balancesheet.read
      - accounting.reports.trialbalance.read
      - accounting.reports.aged.read
    pkce: true
    tokenBody: form
    clientAuth: basic
    revocation:
      url: https://identity.xero.com/connect/revocation
      method: POST
      tokenBody: form
      tokenField: token
      clientAuth: basic
    registration: [preregistered]
tools: { source: upstream_mcp, defaultPosture: ask }
pricing: { model: vendor_plan }
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://developer.xero.com/documentation/guides/remote-mcp/overview
    fetchedAt: 2026-11-12
  - fact: transport.url
    url: https://developer.xero.com/faq/remote-mcp
    fetchedAt: 2026-11-12
  - fact: auth.kind
    url: https://developer.xero.com/documentation/guides/remote-mcp/overview
    fetchedAt: 2026-11-12
  - fact: auth.oauth2.authorizeUrl
    url: https://developer.xero.com/documentation/guides/oauth2/auth-flow
    fetchedAt: 2026-11-12
  - fact: auth.oauth2.tokenUrl
    url: https://developer.xero.com/documentation/guides/oauth2/auth-flow
    fetchedAt: 2026-11-12
  - fact: auth.oauth2.scopes
    url: https://developer.xero.com/documentation/guides/remote-mcp/overview
    fetchedAt: 2026-11-12
  - fact: auth.oauth2.scopes
    url: https://developer.xero.com/documentation/guides/oauth2/auth-flow
    fetchedAt: 2026-11-12
  - fact: auth.oauth2.pkce
    url: https://developer.xero.com/documentation/guides/remote-mcp/overview
    fetchedAt: 2026-11-12
  - fact: auth.oauth2.clientAuth
    url: https://developer.xero.com/documentation/guides/oauth2/auth-flow
    fetchedAt: 2026-11-12
  - fact: auth.oauth2.revocation.url
    url: https://developer.xero.com/documentation/guides/oauth2/auth-flow
    fetchedAt: 2026-11-12
  - fact: auth.oauth2.registration
    url: https://developer.xero.com/documentation/guides/remote-mcp/overview
    fetchedAt: 2026-11-12
  - fact: auth.oauth2.registration
    url: https://developer.xero.com/faq/remote-mcp
    fetchedAt: 2026-11-12
x-omega: { ee: exclude, oss: exclude }
