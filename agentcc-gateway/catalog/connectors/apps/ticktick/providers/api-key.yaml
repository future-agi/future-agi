# TickTick documents self-service API tokens as an alternative to OAuth on its hosted MCP server.
schema: "connector-manifest/v1#provider"
app: ticktick
id: api-key
version: 1.1.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.ticktick.com
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: TickTick API token
      help: "In the TickTick web app, open your avatar menu, then Settings > Account & Security > API Token to create a token. Supply the token without the Bearer prefix."
      helpUrl: https://help.ticktick.com/articles/7438129581631995904
tools: { source: upstream_mcp, defaultPosture: ask }
pricing: { model: vendor_plan }
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://help.ticktick.com/articles/7438129581631995904
    fetchedAt: 2026-11-09
  - fact: transport.variant
    url: https://help.ticktick.com/articles/7438129581631995904
    fetchedAt: 2026-11-09
  - fact: auth.kind
    url: https://help.ticktick.com/articles/7438129581631995904
    fetchedAt: 2026-11-09
  - fact: auth.credentialParts
    url: https://help.ticktick.com/articles/7438129581631995904
    fetchedAt: 2026-11-09
