schema: "connector-manifest/v1#provider"
app: diffbot
id: api-key
version: 1.1.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.diffbot.com/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: API token
      help: "Create a Diffbot account and obtain an API token. Supply the token without the Bearer prefix. Extraction, crawling and Knowledge Graph calls consume your plan's credits."
      helpUrl: https://www.diffbot.com/docs/interfaces/mcp-server
tools: { source: upstream_mcp, defaultPosture: ask }
pricing:
  model: vendor_metered
  source: https://www.diffbot.com/pricing/
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://www.diffbot.com/docs/interfaces/mcp-server
    fetchedAt: 2026-11-09
  - fact: transport.variant
    url: https://github.com/diffbot/diffbot-mcp
    fetchedAt: 2026-11-09
  - fact: auth.kind
    url: https://www.diffbot.com/docs/interfaces/mcp-server
    fetchedAt: 2026-11-09
  - fact: auth.credentialParts
    url: https://www.diffbot.com/docs/interfaces/mcp-server
    fetchedAt: 2026-11-09
