schema: "connector-manifest/v1#provider"
app: kagi
id: api-key
version: 1.1.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.kagi.com/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: API key
      help: "Create a Kagi API key in the API dashboard at kagi.com/api/keys. It authorizes Search and Extract tools, billed by search requests and extracted pages."
      helpUrl: https://kagi.com/api/docs
tools: { source: upstream_mcp, defaultPosture: ask }
pricing:
  model: vendor_metered
  source: https://kagi.com/api/pricing
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://kagi.com/api/docs
    fetchedAt: 2026-11-09
  - fact: transport.variant
    url: https://github.com/kagisearch/kagimcp
    fetchedAt: 2026-11-09
  - fact: auth.kind
    url: https://kagi.com/api/docs
    fetchedAt: 2026-11-09
  - fact: auth.credentialParts
    url: https://kagi.com/api/docs
    fetchedAt: 2026-11-09
