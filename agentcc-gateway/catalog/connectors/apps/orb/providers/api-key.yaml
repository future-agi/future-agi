# Orb's hosted Streamable HTTP server accepts an Orb API key as a bearer.
schema: "connector-manifest/v1#provider"
app: orb
id: api-key
version: 1.1.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.withorb.com/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: Orb API key
      help: "Use an Orb API key from Developers > API keys. The server inherits the key's permissions and test/live mode. Supply the key without the Bearer prefix."
      helpUrl: https://docs.withorb.com/api-reference/mcp-server.md
tools: { source: upstream_mcp, defaultPosture: ask }
pricing:
  model: vendor_metered
  source: https://www.withorb.com/pricing
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://docs.withorb.com/api-reference/mcp-server.md
    fetchedAt: 2026-11-09
  - fact: transport.variant
    url: https://docs.withorb.com/api-reference/mcp-server.md
    fetchedAt: 2026-11-09
  - fact: auth.kind
    url: https://docs.withorb.com/api-reference/mcp-server.md
    fetchedAt: 2026-11-09
  - fact: auth.credentialParts
    url: https://docs.withorb.com/api-reference/mcp-server.md
    fetchedAt: 2026-11-09
