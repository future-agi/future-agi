    url: https://oauth.pipedrive.com/.well-known/oauth-authorization-server
    fetchedAt: 2026-11-12
  - fact: auth.oauth2.scopes
    url: https://mcp.pipedrive.ai/.well-known/oauth-protected-resource/mcp
    fetchedAt: 2026-11-12
  - fact: auth.oauth2.scopes
