# W&B's managed multi-tenant Cloud MCP accepts a W&B API key as a bearer.
# Its --transport http client configuration selects Streamable HTTP.
schema: "connector-manifest/v1#provider"
app: weights-and-biases
id: api-key
version: 1.1.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.withwandb.com/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: W&B API key
      help: "Create a W&B API key in account settings. This endpoint is for multi-tenant Cloud, not Dedicated Cloud or Self-Managed instances. Supply the key without the Bearer prefix."
      helpUrl: https://docs.coreweave.com/products/wandb/platform/ai-assistants
tools: { source: upstream_mcp, defaultPosture: ask }
pricing: { model: vendor_plan }
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://docs.coreweave.com/products/wandb/platform/ai-assistants
    fetchedAt: 2026-11-09
  - fact: transport.variant
    url: https://docs.coreweave.com/products/wandb/platform/ai-assistants
    fetchedAt: 2026-11-09
  - fact: auth.kind
    url: https://docs.coreweave.com/products/wandb/platform/ai-assistants
    fetchedAt: 2026-11-09
  - fact: auth.credentialParts
    url: https://docs.coreweave.com/products/wandb/platform/ai-assistants
    fetchedAt: 2026-11-09
