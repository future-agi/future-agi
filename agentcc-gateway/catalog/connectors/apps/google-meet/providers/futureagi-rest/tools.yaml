{
  "schema": "connector-gen/rest-overlay/v1",
  "spec": "fixtures/spec/meet-v2.discovery.json.gz",
  "tools":
    [
      {
        "name": "get_space",
        "title": "Get space",
        "description": 'Read an app-created meeting space, for example name="spaces/space-fixture".',
        "operation": { "id": "meet.spaces.get" },
        "scopes": ["https://www.googleapis.com/auth/meetings.space.created"],
        "annotations": { "openWorldHint": false },
        "posture": "auto",
      },
      {
        "name": "create_space",
        "title": "Create space",
        "description": "Create a meeting space with vendor defaults. Pass an empty body object.",
        "operation": { "id": "meet.spaces.create" },
        "scopes": ["https://www.googleapis.com/auth/meetings.space.created"],
        "annotations": { "openWorldHint": false, "destructiveHint": false },
        "posture": "ask",
        "body":
          {
            "fields": ["config.accessType"],
            "description": "Empty request object; vendor defaults only.",
          },
      },
      {
        "name": "end_conference",
        "title": "End conference",
        "description": "End the active conference in spaces/space-fixture. This disrupts participants and requires approval.",
        "operation": { "id": "meet.spaces.endActiveConference" },
        "scopes": ["https://www.googleapis.com/auth/meetings.space.created"],
        "annotations": { "openWorldHint": false, "destructiveHint": true },
        "posture": "deny",
        "body":
          { "description": "Empty request object; vendor defaults only." },
      },
      {
        "name": "list_conferences",
        "title": "List conferences",
        "description": "List conference records for app-created spaces, using pageSize and pageToken.",
        "operation": { "id": "meet.conferenceRecords.list" },
        "scopes": ["https://www.googleapis.com/auth/meetings.space.created"],
        "annotations": { "openWorldHint": false },
        "posture": "auto",
      },
      {
        "name": "get_conference",
        "title": "Get conference",
        "description": "Read a conference record, for example conferenceRecords/conf-fixture.",
        "operation": { "id": "meet.conferenceRecords.get" },
        "scopes": ["https://www.googleapis.com/auth/meetings.space.created"],
        "annotations": { "openWorldHint": false },
        "posture": "auto",
      },
      {
        "name": "list_participants",
        "title": "List participants",
        "description": "List participants of conferenceRecords/conf-fixture with a bounded pageSize.",
        "operation": { "id": "meet.conferenceRecords.participants.list" },
        "scopes": ["https://www.googleapis.com/auth/meetings.space.created"],
        "annotations": { "openWorldHint": false },
        "posture": "auto",
      },
      {
        "name": "get_participant",
        "title": "Get participant",
        "description": "Read a participant by its full conferenceRecords/conf-fixture/participants/person-fixture resource name.",
        "operation": { "id": "meet.conferenceRecords.participants.get" },
        "scopes": ["https://www.googleapis.com/auth/meetings.space.created"],
        "annotations": { "openWorldHint": false },
        "posture": "auto",
      },
      {
        "name": "list_recordings",
        "title": "List recordings",
        "description": "List recording metadata for conferenceRecords/conf-fixture; this does not download recording files.",
        "operation": { "id": "meet.conferenceRecords.recordings.list" },
        "scopes": ["https://www.googleapis.com/auth/meetings.space.created"],
        "annotations": { "openWorldHint": false },
        "posture": "auto",
      },
      {
        "name": "list_transcripts",
        "title": "List transcripts",
        "description": "List transcript resources for conferenceRecords/conf-fixture; use list_transcript_entries to read text.",
        "operation": { "id": "meet.conferenceRecords.transcripts.list" },
        "scopes": ["https://www.googleapis.com/auth/meetings.space.created"],
        "annotations": { "openWorldHint": false },
        "posture": "auto",
      },
      {
        "name": "list_transcript_entries",
        "title": "List transcript entries",
        "description": "Read transcript text entries for a full conferenceRecords/conf-fixture/transcripts/transcript-fixture resource name.",
        "operation":
          { "id": "meet.conferenceRecords.transcripts.entries.list" },
        "scopes": ["https://www.googleapis.com/auth/meetings.space.created"],
        "annotations": { "openWorldHint": false },
        "posture": "auto",
      },
    ],
}
