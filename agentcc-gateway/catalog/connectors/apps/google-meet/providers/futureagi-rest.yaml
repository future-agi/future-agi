schema: connector-manifest/v1#provider
app: google-meet
id: futureagi-rest
version: 1.0.0
kind: rest
publisher: futureagi
vendorStatus:
  label: ga
  source: https://developers.google.com/workspace/meet/api/reference/rest
transport:
  kind: http
  url: https://{connectorsHost}/google-meet/mcp
  variant: streamable
hosted: true
trusted: false
accountModes:
  - agent
  - user
auth:
  kind: oauth2
  oauth2:
    authorizeUrl: https://accounts.google.com/o/oauth2/v2/auth
    tokenUrl: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/meetings.space.created
    pkce: true
    tokenBody: form
    clientAuth: body
    extraAuthorizeParams:
      access_type: offline
      prompt: consent
    refresh:
      supported: true
      rotates: false
    revocation:
      url: https://oauth2.googleapis.com/revoke
      method: POST
      tokenBody: form
      tokenField: token
      clientAuth: body
    registration:
      - preregistered
    clientGroup: google
  verify:
    tool: get_space
tools:
  source: operations
  defaultPosture: ask
  generated: tools.generated.json
pricing:
  model: free
upstream:
  spec:
    url: https://raw.githubusercontent.com/googleapis/google-api-go-client/b2487a489315d16e91d98a8d940dca2e59e0bd9d/meet/v2/meet-api.json
    format: google-discovery
    sha256: 16594cc9e431d62aea45d1d28f70fc477d370db1fbe099e5610d72cba47b098e
    licence: BSD-3-Clause (googleapis/google-api-go-client)
quality:
  tier: listed
  owner: connectors
lifecycle:
  status: active
