# Storyblok's hosted stateless HTTP MCP accepts a personal access token as bearer.
schema: "connector-manifest/v1#provider"
app: storyblok
id: api-key
version: 1.1.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.storyblok.com/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: Storyblok personal access token
      help: "Generate a personal access token in My account > Account settings > Personal access tokens. Limit its spaces and permissions where available. Supply the token without Bearer. This server exposes the Management API, not the Content Delivery API."
      helpUrl: https://www.storyblok.com/docs/concepts/access-tokens
tools: { source: upstream_mcp, defaultPosture: ask }
pricing:
  model: vendor_plan
  source: https://www.storyblok.com/pricing
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://www.storyblok.com/docs/tooling/mcp-server/setup
    fetchedAt: 2026-11-09
  - fact: transport.variant
    url: https://www.storyblok.com/docs/tooling/mcp-server/setup.md
    fetchedAt: 2026-11-09
  - fact: auth.kind
    url: https://www.storyblok.com/docs/tooling/mcp-server/setup
    fetchedAt: 2026-11-09
  - fact: auth.credentialParts
    url: https://www.storyblok.com/docs/tooling/mcp-server/setup
    fetchedAt: 2026-11-09
