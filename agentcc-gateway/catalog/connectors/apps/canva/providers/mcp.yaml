# Canva's hosted MCP server with a Developer Portal OAuth client. Each
# connection acts as the Canva user who signs in, not as a service account.
# The endpoints below are recorded from metadata, not pinned: sign-in must
# rediscover them and validate the protected resource, issuer, HTTPS
# endpoints and PKCE S256 before sending credentials. This is not the
# legacy mcp.canva.com CIMD/DCR client flow.
# The scope list is the set advertised by this MCP protected resource.
# Form encoding is documented for the same token endpoint in Canva's Admin
# API reference; that reference describes a different grant, not MCP.
# The issuer advertises refresh_token, but MCP refresh rotation and a
# revocation endpoint were not verified, so both optional blocks are omitted
# rather than copied from the REST API's different OAuth endpoints.
# No explicit maturity label or secretless pre-registered client support
# was verified; vendorStatus is unknown and publicClient is not asserted.
schema: "connector-manifest/v1#provider"
app: canva
id: mcp
version: 1.0.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://api.canva.com/connect/v1/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [user]
auth:
  kind: oauth2
  help: "Create a Developer Portal app, enable Canva MCP and configure its client ID, client secret and redirect URL. Each user must sign in with their own Canva account."
  oauth2:
    authorizeUrl: https://www.canva.com/api/oauth/authorize
    tokenUrl: https://api.canva.com/auth/v1/oauth/token
    scopes: ["profile:read", "design:meta:read", "design:content:write", "design:content:read", "folder:read", "folder:write", "brandtemplate:content:read", "brandtemplate:meta:read", "brandtemplate:content:write", "comment:write", "comment:read", "asset:read", "asset:write", "brandkit:read", "help:answers:read", "help:answers:write"]
    pkce: true
    tokenBody: form
    clientAuth: basic
    registration: [preregistered]
tools: { source: upstream_mcp, defaultPosture: ask }
pricing: { model: vendor_plan }
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
