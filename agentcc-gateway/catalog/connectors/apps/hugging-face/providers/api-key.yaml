schema: "connector-manifest/v1#provider"
app: hugging-face
id: api-key
version: 1.1.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://huggingface.co/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: User access token
      help: "Create a fine-grained user access token in Settings > Access Tokens. It authorizes Hub and configured Space tools subject to its permissions; compute tools can incur charges."
      helpUrl: https://huggingface.co/docs/hub/en/security-tokens
tools: { source: upstream_mcp, defaultPosture: ask }
pricing:
  model: vendor_metered
  source: https://huggingface.co/pricing
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://github.com/huggingface/hf-mcp-server
    fetchedAt: 2026-11-09
  - fact: transport.variant
    url: https://github.com/huggingface/hf-mcp-server
    fetchedAt: 2026-11-09
  - fact: auth.kind
    url: https://github.com/huggingface/hf-mcp-server
    fetchedAt: 2026-11-09
  - fact: auth.credentialParts
    url: https://github.com/huggingface/hf-mcp-server
    fetchedAt: 2026-11-09
