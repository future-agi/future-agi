# A Snowflake-managed MCP server with a programmatic access token (PAT) as
# the bearer. The server is an MCP SERVER object the customer creates in a
# schema of their own account, so its URL is the customer's: the account URL
# host, the database, the schema and the server's name. The
# account URL is admitted only in Snowflake's preferred orgname-account_name
# form, with hyphens for underscores as Snowflake advises for MCP hostnames;
# PrivateLink and legacy account-locator hosts are not offered. Snowflake
# advises OAuth over a stored token and a least-privileged role on any PAT.
schema: "connector-manifest/v1#provider"
app: snowflake
id: pat
version: 1.0.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://{accountUrl}/api/v2/databases/{database}/schemas/{schema}/mcp-servers/{serverName}
  urlVariables:
    accountUrl:
      description: "Your account URL's host in lowercase, orgname-account_name with hyphens for underscores, such as myorg-myaccount.snowflakecomputing.com."
      pattern: '^[a-z][a-z0-9]*-[a-z][a-z0-9-]*\.snowflakecomputing\.com$'
      scope: org
    database:
      description: "The database that holds the MCP SERVER object."
      pattern: "^[A-Za-z_][A-Za-z0-9_]{0,252}$"
      scope: org
    schema:
      description: "The schema that holds the MCP SERVER object."
      pattern: "^[A-Za-z_][A-Za-z0-9_]{0,252}$"
      scope: org
    serverName:
      description: "The MCP SERVER object's name."
      pattern: "^[A-Za-z_][A-Za-z0-9_]{0,252}$"
      scope: org
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: Programmatic access token
      help: "A Snowflake programmatic access token restricted to the least-privileged role that can use this MCP server. If your account uses network policies, they must admit the gateway's outbound addresses."
      helpUrl: https://docs.snowflake.com/en/user-guide/programmatic-access-tokens
tools: { source: upstream_mcp, defaultPosture: ask }
pricing: { model: vendor_plan }
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-mcp
    fetchedAt: 2026-10-21
  - fact: transport.urlVariables.accountUrl
    url: https://docs.snowflake.com/en/user-guide/admin-account-identifier
    fetchedAt: 2026-10-21
  - fact: transport.urlVariables.accountUrl
    url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-mcp
    fetchedAt: 2026-10-21
  - fact: transport.urlVariables.database
    url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-mcp
    fetchedAt: 2026-10-21
  - fact: transport.urlVariables.schema
    url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-mcp
    fetchedAt: 2026-10-21
  - fact: transport.urlVariables.serverName
    url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-mcp
    fetchedAt: 2026-10-21
  - fact: auth.kind
    url: https://docs.snowflake.com/en/user-guide/programmatic-access-tokens
    fetchedAt: 2026-10-21
  - fact: auth.kind
    url: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-mcp
    fetchedAt: 2026-10-21
  - fact: auth.credentialParts
    url: https://docs.snowflake.com/en/user-guide/programmatic-access-tokens
    fetchedAt: 2026-10-21
x-omega: { oss: exclude }
