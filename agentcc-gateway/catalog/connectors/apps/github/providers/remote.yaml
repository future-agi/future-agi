# GitHub's remote MCP server with a user access token from a GitHub App.
# GitHub's authorization server takes pre-registered clients only (its
# metadata names no registration endpoint). A GitHub App's only scope is
# offline_access, which returns an expiring token and a refresh token; the
# app's permissions, not scopes, decide what its tokens reach. So the client
# for this group, FutureAGI's or an org's own, is a GitHub App. A classic
# OAuth App asks for scopes such as repo and read:org instead (the server's
# protected-resource metadata lists them), so it is not this group's client.
schema: "connector-manifest/v1#provider"
app: github
id: remote
version: 1.0.1
kind: vendor_mcp
publisher: vendor
vendorStatus:
  label: ga
  source: https://github.blog/changelog/2025-09-04-remote-github-mcp-server-is-now-generally-available/
transport:
  kind: http
  url: https://api.githubcopilot.com/mcp/
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent, user]
auth:
  kind: oauth2
  oauth2:
    authorizeUrl: https://github.com/login/oauth/authorize
    tokenUrl: https://github.com/login/oauth/access_token
    scopes: [offline_access]
    pkce: true
    tokenBody: form
    clientAuth: body
    refresh: { supported: true, rotates: true }
    registration: [preregistered]
tools: { source: upstream_mcp, defaultPosture: ask }
pricing: { model: vendor_plan }
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
