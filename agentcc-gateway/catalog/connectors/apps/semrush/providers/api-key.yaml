# Semrush's hosted MCP accepts a self-serve API key with the Apikey scheme.
schema: "connector-manifest/v1#provider"
app: semrush
id: api-key
version: 1.0.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.semrush.com/v2/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Apikey "
      secret: true
      label: Semrush API key
      help: "Create a Semrush v4 API key in your profile's API keys section. Supply the key without the Apikey prefix. MCP calls consume the API units available to your plan."
      helpUrl: https://developer.semrush.com/api/v4/get-started/authorization/
tools: { source: upstream_mcp, defaultPosture: ask }
pricing:
  model: vendor_metered
  source: https://developer.semrush.com/api/v4/introduction/semrush-mcp/
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://developer.semrush.com/api/v4/introduction/semrush-mcp/
    fetchedAt: 2026-11-09
  - fact: transport.variant
    url: https://developer.semrush.com/api/v4/introduction/semrush-mcp/
    fetchedAt: 2026-11-09
  - fact: auth.kind
    url: https://developer.semrush.com/api/v4/introduction/semrush-mcp/
    fetchedAt: 2026-11-09
  - fact: auth.credentialParts
    url: https://developer.semrush.com/api/v4/introduction/semrush-mcp/
    fetchedAt: 2026-11-09
x-omega: { oss: exclude }
