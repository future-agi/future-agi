# SerpApi's hosted MCP server with a SerpApi API key as the bearer
# ("Authorization: Bearer <key>"), the form SerpApi recommends. SerpApi also
# takes the key in the URL path for clients that cannot set headers; a key
# in the path can appear in request logs, so that form is not used.
# Connecting and listing tools need no key; the search tools need one.
schema: "connector-manifest/v1#provider"
app: serpapi
id: api-key
version: 1.1.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.serpapi.com/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: API key
      help: "A SerpApi API key, sent as a bearer token in the Authorization header."
      helpUrl: https://serpapi.com/integrations/mcp
tools: { source: upstream_mcp, defaultPosture: ask }
pricing: { model: vendor_plan }
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://serpapi.com/integrations/mcp
    fetchedAt: 2026-11-12
  - fact: transport.variant
    url: https://serpapi.com/integrations/mcp
    fetchedAt: 2026-11-12
  - fact: auth.kind
    url: https://serpapi.com/integrations/mcp
    fetchedAt: 2026-11-12
  - fact: auth.credentialParts
    url: https://serpapi.com/integrations/mcp
    fetchedAt: 2026-11-12
