# The remote HubSpot MCP server with OAuth 2.1 and PKCE from its own
# authorization server, which takes no dynamic registration: a client is an
# MCP connector (earlier "MCP auth app") created under Development in a
# HubSpot account, which gives its client id and secret. A connector
# declares no scopes; HubSpot derives them from the server's tools and what
# the person grants at install, so the request carries none. HubSpot's
# pages do not say whether a connector created in one HubSpot account can
# be installed by others, so until that is known each org connects its own
# connector (CN11), and FutureAGI's own is OA-V HubSpot.
schema: "connector-manifest/v1#provider"
app: hubspot
id: mcp
version: 1.0.1
kind: vendor_mcp
publisher: vendor
vendorStatus:
  label: ga
  source: https://developers.hubspot.com/changelog/remote-hubspot-mcp-server-is-now-generally-available
transport:
  kind: http
  url: https://mcp.hubspot.com
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent, user]
auth:
  kind: oauth2
  oauth2:
    authorizeUrl: https://mcp.hubspot.com/oauth/authorize/user
    tokenUrl: https://mcp.hubspot.com/oauth/v3/token
    scopes: []
    pkce: true
    tokenBody: form
    clientAuth: body
    registration: [preregistered]
tools: { source: upstream_mcp, defaultPosture: ask }
pricing: { model: vendor_plan }
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
