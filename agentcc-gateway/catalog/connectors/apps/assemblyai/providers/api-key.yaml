schema: "connector-manifest/v1#provider"
app: assemblyai
id: api-key
version: 1.1.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: unknown }
transport:
  kind: http
  url: https://mcp.assemblyai.com/mcp
  variant: streamable
  era: auto
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Authorization
      prefix: "Bearer "
      secret: true
      label: API key
      help: "Create an AssemblyAI API key in the dashboard's API Keys page. Transcription and speech-understanding calls use your account's normal API rates and limits."
      helpUrl: https://www.assemblyai.com/docs/mcp-server
tools: { source: upstream_mcp, defaultPosture: ask }
pricing:
  model: vendor_metered
  source: https://www.assemblyai.com/docs/mcp-server
quality: { tier: listed, owner: connectors }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://www.assemblyai.com/docs/mcp-server
    fetchedAt: 2026-11-09
  - fact: transport.variant
    url: https://www.assemblyai.com/docs/mcp-server
    fetchedAt: 2026-11-09
  - fact: auth.kind
    url: https://www.assemblyai.com/docs/mcp-server
    fetchedAt: 2026-11-09
  - fact: auth.credentialParts
    url: https://www.assemblyai.com/docs/mcp-server
    fetchedAt: 2026-11-09
