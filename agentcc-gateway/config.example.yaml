# Cluster node registry for GET /-/cluster/nodes. Membership is per node: each
# gateway lists only itself, and redis_url is not read (a startup warning
# names it when set). Replicas share rate limits, budgets, credits, key
# revocations and provider key rotations through redis (below), not through
# this block.
# cluster:
#   enabled: true
#   node_id: "gateway-1"               # auto-generated if empty
#   heartbeat_interval: 5s
#   heartbeat_ttl: 15s
#   drain_timeout: 30s

# Shared state across replicas. Fallback to in-memory on Redis outage.
# redis:
#   enabled: true
#   address: "localhost:6379"
#   password: "${REDIS_PASSWORD}"
#   db: 0
#   pool_size: 20
#   timeout: 2s
#   prefix: "agentcc:"

