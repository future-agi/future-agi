# ── Org config sections (Gateway > Org Config in the app) ─────
# An organization's budgets, tool_policy and alerting sections are enforced
# on every gateway that org configs can reach: one with control_plane.url
# (the backend syncs them) or admin.token (PUT /-/orgs/{org_id}/config),
# whatever the node switches below say. Its ip_acl section is enforced on
# such a gateway with server.trusted_proxies or server.trusted_hops set (see
# server), or with ip_acl.enabled on; set one before an org relies on an IP
# list. An org that sets none of the sections is held to the node's rules
# only. The node switches (ip_acl.enabled, budgets.enabled,
# tool_policy.enabled, alerting.enabled) add the node's own rules on top.
# GET /-/config lists what this gateway enforces. An
# org's ip_acl applies to the model calls of chat and text completions, POST
# /v1/responses, /v1/messages, /v1beta, embeddings, images, audio, rerank,
# OCR, search and async jobs. The key-gated routes that make no model call
# (the models list, files, videos, scheduled jobs, async job and stored
# response reads, MCP, and the A2A request itself) apply it too. The items of
# an admin batch (/-/batches) are judged by the address that submitted the
# batch, resolved as for any request. An A2A task's model call
# (a2a.enabled) is judged by the address of the A2A request that started it,
# as the caller's chat call is. Calls the app's backend makes with an org's key
# (the Test Playground, console batch jobs) come from the backend's address,
# so an org allow list without it refuses them. With control_plane.url set,
# the gateway seeds an org's org, key and user budget counters whose period
# is the gateway's budgets.default_period (monthly when unset) with the
# spend the control plane recorded for that period when the gateway
# started; with budgets.enabled off, it seeds only the orgs whose budgets
# are on at start-up. The gateway counts each org's spend whether its
# budgets are on or off, so a budget an org turns on while the gateway runs
# is checked against the spend counted for its period, the seed included
# where one applies. An org's cache section needs this node's
# cache (cache.enabled) and its rate_limiting section needs
# rate_limiting.enabled (on by default).
# GET /-/config lists what this gateway enforces in org_sections_enforced.
# With more than one replica, turn on redis (below): budget spend and rate
# limits are then shared; without it each replica counts its own, so an
# org's budget or limit holds per replica. Alert windows are per replica
# either way; IP ACLs and tool policies keep no state.

# cache:
#   enabled: true
#   default_ttl: 5m                        # Default cache entry TTL
#   max_entries: 10000                     # Max entries in LRU cache
#   # Per-request headers:
#   #   x-agentcc-cache-ttl: "10m"           # Override TTL for this request
#   #   x-agentcc-cache-namespace: "prod"    # Isolate cache by namespace
#   #   x-agentcc-cache-force-refresh: true  # Skip cache read, refresh entry
#   #   Cache-Control: no-store            # Skip caching entirely

# rate_limiting:
