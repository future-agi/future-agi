  # A managed provider: FutureAGI's own OpenRouter account, offered to orgs
  # that opt in (org config managed_models.enabled). Its whole live catalog is
  # routable without listing models, and every request it serves is billed to
  # the org at upstream cost plus managed.markup_percent.
  #   catalog_source    where the managed catalog comes from: openrouter,
  #                     openai_compatible (any GET /models list, e.g. Together,
  #                     Fireworks, DeepInfra, Groq, the Hugging Face router)
  #                     or price_card (a static list-price card)
  #   upstream_fee_bps  what the upstream adds on top of model prices, for
  #                     landed cost: 550 is OpenRouter Standard's 5.5%
  #                     credit-purchase fee
  #   resale_terms_ref  the resale agreement that clears this provider for
  #                     launch; empty means not cleared (shown in
  #                     /-/capabilities; traffic is never blocked by it)
  # openrouter-managed:
  #   api_key: "${OPENROUTER_API_KEY}"
  #   base_url: "https://openrouter.ai/api"
  #   api_format: "openai"
  #   type: "openrouter"
  #   managed: true
  #   auto_discover: false
  #   catalog_source: "openrouter"
  #   upstream_fee_bps: 550
  #   resale_terms_ref: ""

  # A direct-provider managed source: FutureAGI's own account with a vendor,
  # priced from a list-price card instead of a live catalog, so a model it
  # shares with OpenRouter lands without OpenRouter's fee. Disabled: it needs
  # an account, confirmed card prices, and resale
  # terms. The bundled card (internal/catalog/pricecards/anthropic-direct.json)
  # is used when price_card_file is empty; a card older than 90 days marks
  # its models stale_price, and they are not offered until it is refreshed
  # (scripts/update-provider-catalogs.sh refreshes model details, never
  # prices). upstream_fee_bps must equal the card's.
  # anthropic-direct:
  #   api_key: "${ANTHROPIC_API_KEY}"
  #   base_url: "https://api.anthropic.com"
  #   api_format: "anthropic"
  #   managed: true
  #   auto_discover: false
  #   catalog_source: "price_card"
  #   price_card_file: ""            # empty: the bundled card for this provider id
  #   upstream_fee_bps: 0
  #   resale_terms_ref: ""

