# Pull config (keys, budgets, RBAC) from a Django control plane.
# Env: AGENTCC_CONTROL_PLANE_URL, AGENTCC_CONTROL_PLANE_TOKEN (defaults to the
# admin token), AGENTCC_WEBHOOK_SECRET, AGENTCC_SYNC_ON_STARTUP,
# AGENTCC_SYNC_INTERVAL, AGENTCC_KEY_SYNC_GRACE. Without sync_on_startup, keys
# created in the UI stop working when the gateway restarts; with more than one
# replica, set an interval so a key created on one reaches the others.
# key_sync_grace: for this long after a key is created through POST /-/keys,
# a sync whose list lacks it keeps it (the app stores the key about a second
# after the gateway answers, so a sync in between misses it). It covers that
# store latency only and does not depend on sync_interval; raise it only if
# the app's key-create request can take longer. Default 30s.
# control_plane:
#   url: "http://localhost:8000"
#   admin_token: "${CONTROL_PLANE_ADMIN_TOKEN}"
#   webhook_secret: "${CONTROL_PLANE_WEBHOOK_SECRET}"
#   sync_on_startup: true
#   sync_interval: 5m                  # 0 = disabled
#   key_sync_grace: 30s                # 0 = default (30s)

# Providers orgs add through the control plane (Gateway > Providers).
# org_providers:
#   # Let an org provider's base_url point at private/LAN addresses (RFC 1918,
#   # 100.64.0.0/10, fc00::/7, Docker service names): a local Ollama or vLLM.
#   # Off by default; enable only when every org on this gateway is trusted.
#   # Loopback, link-local, cloud metadata, multicast and unspecified addresses
#   # are refused regardless. Env: AGENTCC_ALLOW_PRIVATE_PROVIDER_URLS=true
#   # (set it on the backend too, for model discovery and saving providers).
#   allow_private_urls: false

# OpenAI-compatible Assistants API proxy (assistants, threads, vector stores).
# On by default; enabled: false answers 404 assistants_disabled on every one of
# those routes and sends nothing upstream.
# assistants:
#   enabled: true

# Model Context Protocol — expose tools from registered MCP servers to models.
# With auth.enabled, every request under the endpoint (any method, any subpath)
# needs a valid API key ("Authorization: Bearer <key>" or "x-api-key: <key>"),
# and the key's allowed_tools / denied_tools filter what it can list and call.
# The same holds for POST /a2a when a2a.enabled.
# mcp:
#   enabled: true
#   endpoint: "/mcp"
#   max_agent_depth: 5
#   tool_call_timeout: 30s
#   session_ttl: 30m
#   separator: "__"                    # server-name__tool-name
#   servers:
#     filesystem:
#       transport: "stdio"
#       command: "npx"
#       args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
#       tools_cache_ttl: 5m
#     search:
#       transport: "http"
#       url: "https://mcp.example.com"
#       auth:
#         type: "bearer"
#         token: "${MCP_SEARCH_TOKEN}"
#   guardrails:
#     enabled: true
#     blocked_tools: ["shell_exec"]
#     allowed_servers: ["filesystem", "search"]
#     validate_inputs: true
#     validate_outputs: false
#     tool_rate_limits:
#       filesystem__read_file: 100     # per minute
#   tool_versions:
#     filesystem__read_file:
#       version: "v2"
#       deprecated: false
#     filesystem__legacy_read:
#       version: "v1"
#       deprecated: true
#       deprecation_message: "Use read_file instead"
#       replaced_by: "filesystem__read_file"
#   # egress.private_allow is the operator's egress exception list. By default the
#   # gateway refuses to connect to a loopback, private/LAN, link-local or
#   # cloud-metadata address for any destination an organization or a caller
#   # chose: an MCP upstream, and a guardrail webhook, external guardrail
#   # service, FutureAGI eval base_url or alert channel an org configures. List
#   # a CIDR, or a host[:port], to allow a self-hosted service on such an
#   # address (a local Ollama, a presidio sidecar, an in-cluster webhook).
#   # Cloud-metadata addresses are refused even if listed. A public address
#   # never needs listing, nor does the gateway's own FI_BASE_URL (a FutureAGI
#   # eval check that names no base_url, the default, or exactly FI_BASE_URL).
#   # The gateway also adds the comma-separated entries of the environment
#   # variable AGENTCC_MCP_EGRESS_PRIVATE_ALLOW to this list; the Standalone
#   # install sets it to its own API (localhost:8000,127.0.0.1:8000).
#   egress:
#     private_allow:
#       - "10.0.0.0/8"
#       - "presidio.internal:5001"

