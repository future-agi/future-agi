# Restrict inbound traffic by IP / CIDR (the node's own rules; an org's ip_acl
# applies without this switch on a gateway with a trusted proxy, see "Org
# config sections" above). With it on, the items of an admin batch
# (/-/batches) are judged by the address that submitted the batch: for a
# console batch, the app's backend, so a node allow list without that address
# refuses them. The client IP comes from the TCP peer
# unless server.trusted_proxies (or server.trusted_hops) is set; see server.
# ip_acl.trusted_proxies is not read.
# ip_acl:
#   enabled: true
#   allow: ["10.0.0.0/8", "192.168.1.0/24"]
#   deny:  ["203.0.113.7"]                # deny takes precedence over allow

# Role-based access control for teams and users.
# rbac:
#   enabled: true
#   default_role: "viewer"
#   roles:
#     admin:
