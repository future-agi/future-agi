# Agentcc Gateway Configuration
# Copy to config.yaml and update with your settings.

server:
  port: 8080
  host: "0.0.0.0"
  read_header_timeout: 5s
  read_timeout: 60s
  write_timeout: 300s
  idle_timeout: 120s
  shutdown_timeout: 30s
  max_request_body_size: 10485760 # 10MB
  default_request_timeout: 60s
  # The one ceiling on a request, over any x-agentcc-timeout header or
  # per-model timeout. It may be longer than write_timeout, which then applies
  # only to a response this ceiling does not govern. Unset, it becomes
  # write_timeout. An async job writes no response, so async.max_job_timeout
  # bounds it instead. Read at startup, like the rest of this block.
  max_request_timeout: 300s
  # Proxies in front of the gateway (load balancer, ingress), as addresses or
  # CIDRs. Every IP rule (ip_acl, an org's ip_acl, a key's allowed_ips) checks
  # the client IP. With none set, that is the TCP peer, and X-Forwarded-For and
  # X-Real-IP are not read. With
  # trusted_proxies, X-Forwarded-For is read only from a trusted peer, right to
  # left past every trusted address; the first other entry is the client.
  # Behind a load balancer, list every address that connects to the gateway
  # and every address a proxy appends after the client, or every request comes
  # from the balancer and an allow list refuses everyone. A Google Cloud
  # external Application Load Balancer connects from 130.211.0.0/22 and
  # 35.191.0.0/16 and appends its own forwarding-rule IP after the client, so
  # list that IP too; an AWS ALB connects from its subnets. Keep the ranges
  # narrow: the gateway takes X-Forwarded-For from every address in them. Read at start-up.
  # trusted_proxies: ["130.211.0.0/22", "35.191.0.0/16", "203.0.113.10"]
  # Or, when the proxies' addresses are not known: the client is the
  # trusted_hops-th X-Forwarded-For entry from the right, so set it to the
  # number of entries your proxies append, the client's included: 1 behind one
  # nginx or AWS ALB, 2 behind a Google Cloud external Application Load
  # Balancer (it appends the client and its forwarding-rule IP), plus 1 for
  # each proxy after that. trusted_hops reads the entry by position, whoever
  # connected, so use it only where every request reaches the gateway through
  # those proxies; in Kubernetes, where pods reach the gateway's Service
  # directly, use trusted_proxies.
  # Set one of the two, not both.
  # trusted_hops: 1

# Async inference (x-agentcc-async: true). Every org's jobs share one pool of
# workers; these bound how much of it one org can hold. Each defaults when unset.
# async:
#   max_workers: 10
#   max_workers_per_org: 5   # default: half of max_workers
#   max_job_timeout: 60s     # default: the longest of server.default_request_timeout,
#                            # routing.model_timeouts and providers.*.default_timeout

providers:
  openai:
    base_url: "https://api.openai.com"
    api_key: "${OPENAI_API_KEY}" # Set via env var
    api_format: "openai"
    default_timeout: 60s
    max_concurrent: 100
    conn_pool_size: 100
    models:
      - gpt-4o
      - gpt-4o-mini
      - gpt-4-turbo
      - gpt-3.5-turbo
      - o1
      - o1-mini
    # Rotate this provider's key without a restart: POST
    # /-/admin/providers/openai/rotate {"new_key": "..."}, then
    # POST /-/admin/providers/openai/rotate/promote (admin token). The promote
    # first makes one upstream call with the new key (openai and azure list
    # models; other formats, and a server with no models endpoint, send a
    # one-token chat completion to the first of models) and refuses a key the
    # provider rejects (422). From the promote
    # on, every new call and retry sends the new key; calls already in flight
    # finish on the old one, whose connections close after drain_period. With
    # redis on, every replica switches too. The rotation lives in memory:
    # update the deployment config with the new key before the next restart
    # or rollout, or a restarted replica sends the old key again. Not for
    # bedrock (it signs with AWS credentials).
    # rotation:
    #   enabled: true
    #   drain_period: 30s

