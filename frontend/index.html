<!doctype html>
<html lang="en" style="max-height: 100vh;">
  <head>
    <meta charset="utf-8" />
    <!-- Keep product links clickable without speculative cross-origin DNS. -->
    <meta http-equiv="x-dns-prefetch-control" content="off" />
    <!-- Omega connect intake. Keep this the FIRST script on the page.
         `omega dev` prints links such as /dashboard/studio#connect=<url>&t=<token>.
         Take connect and t out of the address bar before GTM or any analytics
         SDK can read the URL, and hold them in memory only:
         window.__omegaConnect is non-enumerable and returns its value once.
         Nothing is written to storage. A link opened while a Future AGI page
         is already showing arrives as a fragment navigation, not a page load,
         so the same intake runs on popstate and hashchange; its listeners are
         registered before any other script's. A connect link without a usable
         key holds nothing; window.__omegaConnectKeyless (true, no key, no
         address) tells the Studio connect screen to say so. See
         src/sections/omega/embed and src/sections/omega/studio. -->
    <script data-omega-connect-intake>
      (function () {
        // The browser's own replaceState, saved before GTM or any SDK can wrap
        // it, so no wrapper ever sees the URL that still holds the token.
        const replaceState = window.history.replaceState;
        // Backend auth redirects must be cleaned before any telemetry starts.
        // This handoff is repeat-readable until its reader finishes, unlike
        // the one-shot Omega connect handoff below. Only marketplace onboarding
        // survives reload in tab storage; session credentials stay memory-only.
        function takeAuthRedirect() {
          const query = new URLSearchParams(window.location.search);
          // A callback marked with saml_code belongs to the SAML guard below:
          // it removes every credential that came with the marker before
          // analytics starts, so none of them may reach this legacy handoff.
          if (
            query.has("saml_code") ||
            new URLSearchParams(window.location.hash.slice(1)).has("saml_code")
          ) {
            return;
          }
          const credentials = [
            "sso_token", "access_token", "refresh_token",
            "onboarding_token", "onboarding_gcp_token",
          ];
          if (window.location.pathname === "/sos") {
            credentials.push("access", "refresh");
          }
          if (!credentials.some(function (key) { return query.has(key); })) return;
          const keys = credentials.concat(["is_new_user", "new_org", "auth", "next"]);
          const params = new URLSearchParams();
          const keep = [];
          // Keep unrelated query bytes as-is (including duplicate parameters,
          // percent encoding and valueless flags), not a reserialized query.
          window.location.search.slice(1).split("&").forEach(function (part) {
            const entry = new URLSearchParams("&" + part);
            const key = entry.keys().next().value;
            if (keys.indexOf(key) === -1) keep.push(part);
            else entry.forEach(function (value, name) { params.append(name, value); });
          });
          // A pathname can start with // without changing this page's origin.
          // Passing it alone would be interpreted as a protocol-relative host.
          const cleanUrl = new URL(window.location.href);
          cleanUrl.search = keep.length ? "?" + keep.join("&") : "";
          replaceState.call(window.history, window.history.state, "", cleanUrl.href);
          // Publish only after cleanup succeeds. If the browser rejects the
          // history write, do not expose a second copy through the handoff.
          Object.defineProperty(window, "__faiAuthRedirect", {
            configurable: true,
            enumerable: false,
            value: { pathname: window.location.pathname, params: params },
          });
          const onboarding = [];
          params.forEach(function (value, key) {
            if (key === "onboarding_token" || key === "onboarding_gcp_token") {
              onboarding.push([key, value]);
            }
          });
          if (onboarding.length) {
            try {
              // Keep this key/schema in sync with src/auth/auth-url-intake.js.
              window.sessionStorage.setItem("fai.auth.onboarding.v1", JSON.stringify({
                pathname: window.location.pathname,
                params: onboarding,
              }));
            } catch (e) {
              // Storage may be blocked; the in-memory handoff must still work.
            }
          }
        }
        try {
          takeAuthRedirect();
        } catch (e) {
          // Fail closed for the in-memory handoff, not the app: URL fallback
          // still works, but history-write failure cannot publish credentials.
          delete window.__faiAuthRedirect;
        }
        window.addEventListener("pagehide", function () {
          delete window.__faiAuthRedirect;
        });
        function take() {
          const hash = window.location.hash;
          if (!hash || hash.indexOf("connect=") === -1) return false;
          let rawUrl = null;
          let rawToken = null;
          const keep = [];
          const parts = hash.slice(1).split("&");
          for (let i = 0; i < parts.length; i++) {
            const cut = parts[i].indexOf("=");
            const key = cut === -1 ? parts[i] : parts[i].slice(0, cut);
            const value = cut === -1 ? "" : parts[i].slice(cut + 1);
            if (key === "connect") rawUrl = value;
            else if (key === "t") rawToken = value;
            else if (parts[i]) keep.push(parts[i]);
          }
          if (rawUrl === null) return false;
          // Remove the secret from the address bar before anything else.
          replaceState.call(
            window.history,
            window.history.state,
            "",
            window.location.pathname +
              window.location.search +
              (keep.length ? "#" + keep.join("&") : ""),
          );
          let held = null;
          try {
            if (rawToken) {
              held = {
                url: decodeURIComponent(rawUrl),
                token: decodeURIComponent(rawToken),
              };
            }
          } catch (e) {
            held = null;
          }
          Object.defineProperty(window, "__omegaConnect", {
            configurable: true,
            enumerable: false,
            get: function () {
              const value = held;
              held = null;
              return value;
            },
          });
          // A link cut off where the terminal wrapped it, or copied without
          // its t=, opens nothing. Mark that fact alone, so the Studio connect
          // screen can say what happened instead of showing nothing.
          if (held) {
            delete window.__omegaConnectKeyless;
          } else {
            Object.defineProperty(window, "__omegaConnectKeyless", {
              configurable: true,
              enumerable: false,
              value: true,
            });
          }
          return true;
        }
        function onNavigation() {
          try {
            if (take()) {
              window.dispatchEvent(new Event("omega:connect"));
              // A connect screen already showing read the mark during the
              // event; a screen shown later must not report this link.
              delete window.__omegaConnectKeyless;
            }
          } catch (e) {
            /* never break navigation */
          }
        }
        try {
          take();
        } catch (e) {
          /* A malformed link must never stop the app from starting. */
        }
        window.addEventListener("popstate", onNavigation);
        window.addEventListener("hashchange", onNavigation);
      })();
    </script>
    <!-- Normalize sign-in callback URLs before other resources or analytics load.
         Only the address changes; nothing is captured or stored here.
         Callbacks without a saml_code parameter keep their existing flow. -->
    <meta name="referrer" content="no-referrer" />
    <script id="saml-initial-marker-guard">
      (function () {
        var reserved = ["saml_code", "oauth_code", "oauth_provider", "sso_token", "access_token", "refresh_token", "auth"];
        function scrubCodeUrl(url) {
          var fragment = new URL("https://saml.invalid/?" + url.hash.slice(1)).searchParams;
          if (!url.searchParams.has("saml_code") && !fragment.has("saml_code")) return false;
          reserved.forEach(function (key) { url.searchParams.delete(key); });
          url.hash = "";
          return true;
        }
        Object.defineProperty(window, "__takeSamlUrlSanitizer", {
          configurable: true,
          value: function () { delete window.__takeSamlUrlSanitizer; return scrubCodeUrl; }
        });
        var url = new URL(window.location.href);
        if (!scrubCodeUrl(url)) return;
        try { window.history.replaceState(window.history.state, "", url.href); }
        catch (error) {
          // Record the failed update; entry.js then does not load the app.
          window.__authHandoffScrubFailed = true;
          window.__authLateMarkerScrubFailed = true;
          try { window.location.replace(url.href); } catch (navigationError) { /* Leave the address as it is. */ }
        }
      })();
    </script>
    <!-- Normalize callback parameters added after start-up. Installed before other listeners. -->
    <script id="saml-late-marker-guard">
      (function () {
        var history = window.history;
        var nativePush = history.pushState;
        var nativeReplace = history.replaceState;
        var scrubCodeUrl = window.__takeSamlUrlSanitizer();

        function scrubbed(value) {
          var url = new URL(value, document.baseURI);
          return scrubCodeUrl(url) ? url : null;
        }

        function safelyReplace(clean) {
          // Use the captured native method, not a later analytics/router wrapper.
          // This runs only after a successful native call or event suppression.
          try { nativeReplace.call(history, history.state, "", clean.href); }
          catch (error) {
            window.__authLateMarkerScrubFailed = true;
            // A same-origin navigation keeps the stored session. If it also
            // fails, the address stays as it is and the error is not sent to
            // monitoring.
            try { window.location.replace(clean.href); } catch (navigationError) { /* The failure flag above stays set. */ }
          }
        }

        function discardLateMarker() {
          var clean = scrubbed(window.location.href);
          if (!clean) return false;
          safelyReplace(clean);
          return true;
        }

        function guard(nativeMethod, receiver, args) {
          // Let native conversion/argument/structured-clone errors occur once,
          // before changing any state. Ordinary calls keep their exact values.
          if (receiver === history && args.length >= 3 && typeof args[2] === "string") {
            var target;
            try { target = new URL(args[2], document.baseURI); } catch (error) { /* Native call below owns errors. */ }
            var current = new URL(window.location.href);
            if (target && target.origin === current.origin && target.username === current.username && target.password === current.password) {
              var clean = scrubbed(target.href);
              if (clean) {
                args = Array.prototype.slice.call(args);
                args[2] = clean.href;
              }
            }
          }
          var result = Reflect.apply(nativeMethod, receiver, args);
          if (receiver === history) discardLateMarker();
          return result;
        }

        history.pushState = function pushState() { return guard(nativePush, this, arguments); };
        history.replaceState = function replaceState() { return guard(nativeReplace, this, arguments); };
        function onNavigation(event) {
          // HashChangeEvent.newURL retains the original marker even after the
          // address is scrubbed. Stop only these rejected protocol events before
          // later analytics/router listeners; ordinary anchors keep native flow.
          var clean = scrubbed(window.location.href);
          var rejected = Boolean(clean);
          if (event.type === "hashchange") {
            // Rapid hash updates can queue events after the current URL has
            // already been scrubbed. Their captured old/new URLs still count.
            rejected = Boolean(scrubbed(event.oldURL) || scrubbed(event.newURL)) || rejected;
          }
          if (!rejected) return;
          // Stop the event first, so later listeners do not receive its URLs
          // even if the address update below fails.
          event.stopImmediatePropagation();
          if (clean) safelyReplace(clean);
        }
        window.addEventListener("hashchange", onNavigation, true);
        window.addEventListener("popstate", onNavigation, true);
      })();
    </script>
    <!-- Load global styles outside the guarded application import. A blocked
         optional font must not reject main's CSS preload and loop on reload. -->
    <link rel="stylesheet" href="/src/global.css" />
    <!-- Google Tag Manager (gated on VITE_GTM_ID at build time so OSS
         builds don't load third-party tracking) -->
    <script>(function(){
      var GTM_ID = "%VITE_GTM_ID%";
      if (!GTM_ID || GTM_ID === "%" + "VITE_GTM_ID%") return;
      (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer',GTM_ID);
    })();
    </script>
    <!-- End Google Tag Manager -->

    <meta name="theme-color" content="#000000" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />

    <!-- Fonts: App uses Inter (system/bundled). Public Sans & Barlow removed — were unused, render-blocking, ~300KB wasted. -->

    <title>Future AGI</title>

    <meta
      name="description"
      content="Future AGI helps companies to align their AI to their users automatically"
    />
    <meta
      name="keywords"
      content="react,material,kit,application,dashboard,admin,template"
    />

    <!-- No preconnect to the reCAPTCHA hosts: the app loads reCAPTCHA only
         when the build has VITE_GOOGLE_SITE_KEY, and a self-hosted UI without
         one must not contact Google. -->
  </head>

  <body>
    <!-- No Google Tag Manager <noscript> iframe: markup cannot be gated on
         VITE_GTM_ID the way the script above is, and the app needs
         JavaScript anyway. -->

    <!-- FOUC prevention: set data-theme before first paint so CSS variables match -->
    <script>
      (function() {
        try {
          var s = JSON.parse(localStorage.getItem('settings'));
          var m = s && s.themeMode || 'system';
          if (m === 'system') {
            m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.body.setAttribute('data-theme', m);
        } catch (e) {}
      })();
    </script>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Boot splash: the same mark, name and line as <SplashScreen>, drawn on
         the first frame so the page is never blank while the bundle loads.
         SplashScreen keeps it up through the auth and deployment checks and
         removes it once the app has something else to show. -->
    <style>
      #boot-splash { position: fixed; inset: 0; z-index: 9998; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #FAFAFA; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; opacity: 0; animation: boot-in 0.2s ease-out 0.3s forwards; }
      #boot-splash .mark { width: 32px; height: 32px; background: #7857FC; -webkit-mask: url(/favicon/logo.svg) center / contain no-repeat; mask: url(/favicon/logo.svg) center / contain no-repeat; }
      #boot-splash .name { font-size: 15px; line-height: 22px; font-weight: 600; color: #18181B; }
      #boot-splash .track { width: 96px; height: 2px; margin-top: 4px; border-radius: 2px; overflow: hidden; background: #E4E4E7; }
      #boot-splash .track i { display: block; width: 40%; height: 100%; background: #7857FC; animation: boot-line 1.4s ease-in-out infinite; }
      body[data-theme="dark"] #boot-splash { background: #0A0A0B; }
      body[data-theme="dark"] #boot-splash .mark, body[data-theme="dark"] #boot-splash .track i { background: #EFEFF1; }
      body[data-theme="dark"] #boot-splash .name { color: #EFEFF1; }
      body[data-theme="dark"] #boot-splash .track { background: #232326; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-line { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .track i { animation: none; transform: translateX(75%); } }
    </style>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading">
      <div class="mark"></div>
      <div class="name">Future AGI</div>
      <div class="track"><i></i></div>
    </div>
    <!-- Runtime config — see frontend/docker-entrypoint.sh -->
    <script src="/config.js"></script>
    <script>
      const global = globalThis;
    </script>
    <!-- Track document departure before imports start. Leave preload failures
         uncancelled: lazyWithRetry owns route-aware, bounded deploy recovery. -->
    <script type="module" src="/src/utils/chunkRecovery.js"></script>
    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
