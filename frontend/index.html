<!doctype html>
<html lang="en" style="max-height: 100vh;">
  <head>
    <meta charset="utf-8" />
    <!-- Reject the unactivated code protocol before resources or analytics run.
         This is not a consumer: no capture, exchange, or stored-session change.
         The existing unmarked legacy transport is deliberately unchanged. -->
    <meta name="referrer" content="no-referrer" />
    <script id="saml-initial-marker-guard">
      (function () {
        var reserved = ["saml_code", "oauth_code", "oauth_provider", "sso_token", "access_token", "refresh_token", "auth"];
        function scrubCodeUrl(url) {
          var fragment = new URL("https://saml.invalid/?" + url.hash.slice(1)).searchParams;
          if (!url.searchParams.has("saml_code") && !fragment.has("saml_code")) return false;
          reserved.forEach(function (key) { url.searchParams.delete(key); });
          url.hash = "";
          return true;
        }
        Object.defineProperty(window, "__takeSamlUrlSanitizer", {
          configurable: true,
          value: function () { delete window.__takeSamlUrlSanitizer; return scrubCodeUrl; }
        });
        var url = new URL(window.location.href);
        if (!scrubCodeUrl(url)) return;
        try { window.history.replaceState(window.history.state, "", url.href); }
        catch (error) {
          // Do not load a legacy consumer while a mixed marked URL remains.
          window.__authHandoffScrubFailed = true;
          window.__authLateMarkerScrubFailed = true;
          try { window.location.replace(url.href); } catch (navigationError) { /* No credential adoption. */ }
        }
      })();
    </script>
    <!-- Late SAML markers are never a second login capability. Install before observers. -->
    <script id="saml-late-marker-guard">
      (function () {
        var history = window.history;
        var nativePush = history.pushState;
        var nativeReplace = history.replaceState;
        var scrubCodeUrl = window.__takeSamlUrlSanitizer();

        function scrubbed(value) {
          var url = new URL(value, document.baseURI);
          return scrubCodeUrl(url) ? url : null;
        }

        function safelyReplace(clean) {
          // Use the captured native method, not a later analytics/router wrapper.
          // This runs only after a successful native call or event suppression.
          try { nativeReplace.call(history, history.state, "", clean.href); }
          catch (error) {
            window.__authLateMarkerScrubFailed = true;
            // Same-origin replacement keeps stored session credentials. If
            // navigation also fails, the URL may remain; never publish the
            // platform exception or its capability URL to telemetry.
            try { window.location.replace(clean.href); } catch (navigationError) { /* Input stays denied. */ }
          }
        }

        function discardLateMarker() {
          var clean = scrubbed(window.location.href);
          if (!clean) return false;
          safelyReplace(clean);
          return true;
        }

        function guard(nativeMethod, receiver, args) {
          // Let native conversion/argument/structured-clone errors occur once,
          // before changing any state. Ordinary calls keep their exact values.
          if (receiver === history && args.length >= 3 && typeof args[2] === "string") {
            var target;
            try { target = new URL(args[2], document.baseURI); } catch (error) { /* Native call below owns errors. */ }
            var current = new URL(window.location.href);
            if (target && target.origin === current.origin && target.username === current.username && target.password === current.password) {
              var clean = scrubbed(target.href);
              if (clean) {
                args = Array.prototype.slice.call(args);
                args[2] = clean.href;
              }
            }
          }
          var result = Reflect.apply(nativeMethod, receiver, args);
          if (receiver === history) discardLateMarker();
          return result;
        }

        history.pushState = function pushState() { return guard(nativePush, this, arguments); };
        history.replaceState = function replaceState() { return guard(nativeReplace, this, arguments); };
        function onNavigation(event) {
          // HashChangeEvent.newURL retains the original marker even after the
          // address is scrubbed. Stop only these rejected protocol events before
          // later analytics/router listeners; ordinary anchors keep native flow.
          var clean = scrubbed(window.location.href);
          var rejected = Boolean(clean);
          if (event.type === "hashchange") {
            // Rapid hash updates can queue events after the current URL has
            // already been scrubbed. Their captured old/new URLs still count.
            rejected = Boolean(scrubbed(event.oldURL) || scrubbed(event.newURL)) || rejected;
          }
          if (!rejected) return;
          // Suppress first: a platform history failure must not expose the
          // event's captured capability URL to later observers.
          event.stopImmediatePropagation();
          if (clean) safelyReplace(clean);
        }
        window.addEventListener("hashchange", onNavigation, true);
        window.addEventListener("popstate", onNavigation, true);
      })();
    </script>
    <!-- Load global styles outside the guarded application import. A blocked
         optional font must not reject main's CSS preload and loop on reload. -->
    <link rel="stylesheet" href="/src/global.css" />
    <!-- Google Tag Manager (gated on VITE_GTM_ID at build time so OSS
         builds don't load third-party tracking) -->
    <script>(function(){
      var GTM_ID = "%VITE_GTM_ID%";
      if (!GTM_ID || GTM_ID === "%" + "VITE_GTM_ID%") return;
      (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer',GTM_ID);
    })();
    </script>
    <!-- End Google Tag Manager -->

    <meta name="theme-color" content="#000000" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />

    <!-- Fonts: App uses Inter (system/bundled). Public Sans & Barlow removed — were unused, render-blocking, ~300KB wasted. -->

    <title>Future AGI</title>

    <meta
      name="description"
      content="Future AGI helps companies to align their AI to their users automatically"
    />
    <meta
      name="keywords"
      content="react,material,kit,application,dashboard,admin,template"
    />

    <!-- No preconnect to the reCAPTCHA hosts: the app loads reCAPTCHA only
         when the build has VITE_GOOGLE_SITE_KEY, and a self-hosted UI without
         one must not contact Google. -->
  </head>

  <body>
    <!-- No Google Tag Manager <noscript> iframe: markup cannot be gated on
         VITE_GTM_ID the way the script above is, and the app needs
         JavaScript anyway. -->

    <!-- Appcues removed — no longer used -->
    
    <!-- FOUC prevention: set data-theme before first paint so CSS variables match -->
    <script>
      (function() {
        try {
          var s = JSON.parse(localStorage.getItem('settings'));
          var m = s && s.themeMode || 'system';
          if (m === 'system') {
            m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.body.setAttribute('data-theme', m);
        } catch (e) {}
      })();
    </script>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Runtime config — see frontend/docker-entrypoint.sh -->
    <script src="/config.js"></script>
    <script>
      const global = globalThis;
    </script>
    <!-- Handle Vite dynamic import errors (e.g. after a new deployment when old chunks are removed) -->
    <script>
      window.addEventListener('vite:preloadError', (event) => {
        event.preventDefault();
        // Allow reload to proceed without beforeunload confirmation (e.g. from ReplayDrawer)
        window.__RELOADING_FOR_VITE_PRELOAD_ERROR = true;
        window.location.reload();
      });
    </script>
    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
