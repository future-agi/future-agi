<!doctype html>
<html lang="en" style="max-height: 100vh;">
  <head>
    <meta charset="utf-8" />
    <!-- Normalize sign-in callback URLs before other resources or analytics load.
         Only the address changes; nothing is captured or stored here.
         Callbacks without a saml_code parameter keep their existing flow. -->
    <meta name="referrer" content="no-referrer" />
    <!-- GTM here and GA4 in the app use both the arrival decision and the live
         address check. Decide before callback cleanup; don't retain the URL. -->
    <script id="analytics-url-policy">
      (function () {
        var params = ["saml_code", "oauth_code", "oauth_provider", "sso_token", "access_token", "refresh_token", "auth", "token", "code"];
        var marketplaceParams = ["onboarding_token", "onboarding_gcp_token"];
        var paths = /^\/(?:auth\/jwt\/(?:verify|invitation\/accept|invitation\/set-password)\/|shared\/|sos(?:\/|$))/i;
        var consentPath = /^\/mcp\/(?:oauth\/)?authorize(?:\/|$)/i;
        function restriction(value, depth, base) {
          try {
            if (depth > 4) return "auth";
            // URLSearchParams decodes once; login/register also read an encoded path.
            if (depth && /^%2f/i.test(value)) value = decodeURIComponent(value);
            var url = new URL(value, base || document.baseURI);
            var fragment = new URLSearchParams(url.hash.slice(1));
            function present(key) { return url.searchParams.has(key) || fragment.has(key); }
            var path;
            try { path = decodeURIComponent(url.pathname).replace(/\/{2,}/g, "/"); }
            catch (error) { /* An unclassifiable path is denied below. */ }
            // A return to another origin is not a handoff to this app's consent page.
            var local = !depth || url.origin === new URL(base).origin;
            if (consentPath.test(path)) return local ? "consent" : "document";
            // A forwarding page inherits consent only from an actual consent
            // destination. Other restricted or unclassifiable returns stay tag-free.
            var next = url.searchParams.get("returnTo");
            var forwarded = next && restriction(next, depth + 1, url.href);
            if (local && forwarded === "consent") return "consent";
            if (forwarded || marketplaceParams.some(present)) return "document";
            return path === undefined || paths.test(path) || params.some(present) ? "auth" : null;
          } catch (error) {
            return "auth";
          }
        }
        function allowed(value) {
          return !window.__authHandoffScrubFailed && !window.__authLateMarkerScrubFailed && !restriction(value, 0);
        }
        var arrival = restriction(window.location.href, 0);
        Object.defineProperty(window, "__analyticsAllowedAtLoad", {
          value: !window.__authHandoffScrubFailed && !window.__authLateMarkerScrubFailed && !arrival
        });
        Object.defineProperty(window, "__analyticsConsentHandoffAtLoad", { value: arrival === "consent" });
        Object.defineProperty(window, "__analyticsUrlAllowed", { value: allowed });
        Object.defineProperty(window, "__analyticsNeedsFreshDocument", {
          value: function (url) {
            if (window.__analyticsTagStarted !== true) return false;
            var kind = restriction(url, 0);
            return kind === "document" || kind === "consent";
          }
        });
        Object.defineProperty(window, "__analyticsNavigateDocument", {
          value: function (method, href) {
            var cancel;
            try {
              if (restriction(href, 0) === "consent") cancel = window.__prepareConsentIdentityHandoff?.();
            } catch (error) { /* Analytics is optional. */ }
            try {
              return method === "reload" ? window.location.reload() : window.location.replace(href);
            } catch (error) {
              try { if (typeof cancel === "function") cancel(); } catch (ignored) { /* Preserve the navigation error. */ }
              throw error;
            }
          }
        });
      })();
    </script>
    <script id="saml-initial-marker-guard">
      (function () {
        var reserved = ["saml_code", "oauth_code", "oauth_provider", "sso_token", "access_token", "refresh_token", "auth"];
        function scrubCodeUrl(url) {
          var fragment = new URL("https://saml.invalid/?" + url.hash.slice(1)).searchParams;
          if (!url.searchParams.has("saml_code") && !fragment.has("saml_code")) return false;
          reserved.forEach(function (key) { url.searchParams.delete(key); });
          url.hash = "";
          return true;
        }
        Object.defineProperty(window, "__takeSamlUrlSanitizer", {
          configurable: true,
          value: function () { delete window.__takeSamlUrlSanitizer; return scrubCodeUrl; }
        });
        var url = new URL(window.location.href);
        if (!scrubCodeUrl(url)) return;
        try { window.history.replaceState(window.history.state, "", url.href); }
        catch (error) {
          // Record the failed update; entry.js then does not load the app.
          window.__authHandoffScrubFailed = true;
          window.__authLateMarkerScrubFailed = true;
          try { window.location.replace(url.href); } catch (navigationError) { /* Leave the address as it is. */ }
        }
      })();
    </script>
    <!-- Install auth navigation guards before other history wrappers and listeners. -->
    <script id="saml-late-marker-guard">
      (function () {
        var history = window.history;
        var nativePush = history.pushState;
        var nativeReplace = history.replaceState;
        var scrubCodeUrl = window.__takeSamlUrlSanitizer();
        var navigateDocument = window.__analyticsNavigateDocument || function (method, href) {
          return method === "reload" ? window.location.reload() : window.location.replace(href);
        };

        function scrubbed(value) {
          var url = new URL(value, document.baseURI);
          return scrubCodeUrl(url) ? url : null;
        }

        function safelyReplace(clean) {
          // Use the captured native method, not a later analytics/router wrapper.
          // This runs only after a successful native call or event suppression.
          try { nativeReplace.call(history, history.state, "", clean.href); }
          catch (error) {
            window.__authLateMarkerScrubFailed = true;
            // A same-origin navigation keeps the stored session. If it also
            // fails, the address stays as it is and the error is not sent to
            // monitoring.
            try { window.location.replace(clean.href); } catch (navigationError) { /* The failure flag above stays set. */ }
          }
        }

        function discardLateMarker() {
          var clean = scrubbed(window.location.href);
          if (!clean) return false;
          safelyReplace(clean);
          return true;
        }

        var needsFreshDocument = window.__analyticsNeedsFreshDocument;
        function canRewrite(current, target) {
          if (target.protocol !== current.protocol || target.host !== current.host ||
              target.username !== current.username || target.password !== current.password) return false;
          if (current.protocol === "https:" || current.protocol === "http:") return true;
          if (current.protocol === "file:") return current.pathname === target.pathname;
          return current.href.split("#")[0] === target.href.split("#")[0];
        }
        function guard(nativeMethod, receiver, args) {
          var result;
          // Brand, arity and nullable URL checks precede Web IDL conversions.
          // Without a tag, leave object conversion and late callback cleanup to
          // the existing native path. With a tag we must inspect *any* URL type.
          if (receiver === history && args.length >= 3 && args[2] !== null && args[2] !== undefined &&
              (typeof args[2] === "string" || window.__analyticsTagStarted === true)) {
            // DOMString title, then nullable USVString URL. ToString with the
            // string hint (unlike String(Symbol())) rejects symbols. Pass the
            // primitives on so native code never invokes caller conversions twice.
            args[1] = `${args[1]}`;
            args[2] = `${args[2]}`;
            var target;
            // The empty History URL keeps the document URL, even with <base>.
            try { if (args[2] !== "") target = new URL(args[2], document.baseURI); } catch (error) { /* Native owns invalid URLs. */ }
            var current = new URL(window.location.href);
            // Invalid rewrites (including a blob URL with the same origin) go
            // through History unchanged so it owns serialization and URL errors.
            if (target && canRewrite(current, target)) {
              var clean = scrubbed(target.href);
              if (clean) {
                target = clean;
                args[2] = clean.href;
              }
              if (target.href !== current.href && needsFreshDocument && needsFreshDocument(target.href)) {
                // Let History serialize for storage and enforce its own limits
                // before starting a handoff. Push creates the slot; replace reuses
                // it. Never put the protected URL into this document's history.
                var previousState = history.state;
                args[2] = current.href;
                if (target.href.split("#")[0] === current.href.split("#")[0]) {
                  // Location.replace of a fragment alone is not a document load.
                  var slot = new URL(current.href);
                  slot.searchParams.append("__document_navigation", "");
                  args[2] = slot.href;
                }
                result = Reflect.apply(nativeMethod, receiver, args);
                try { navigateDocument("replace", target.href); }
                catch (error) {
                  // Recover the visible entry, not by traversing the stack (which
                  // would be async and could move a different, later navigation).
                  try { nativeReplace.call(history, previousState, "", current.href); } catch (ignored) { /* Preserve the original error. */ }
                  throw error;
                }
                return result;
              }
              // Keep the inspected destination pinned if serializing caller state
              // synchronously changes the document's base URL.
              if (window.__analyticsTagStarted === true) args[2] = target.href;
            }
          }
          result = Reflect.apply(nativeMethod, receiver, args);
          if (receiver === history) discardLateMarker();
          return result;
        }

        history.pushState = function pushState() { "use strict"; return guard(nativePush, this, arguments); };
        history.replaceState = function replaceState() { "use strict"; return guard(nativeReplace, this, arguments); };
        function onNavigation(event) {
          // HashChangeEvent.newURL retains the original marker even after the
          // address is scrubbed. Stop only these rejected protocol events before
          // later analytics/router listeners; ordinary anchors keep native flow.
          var clean = scrubbed(window.location.href);
          var rejected = Boolean(clean);
          if (event.type === "hashchange") {
            // Rapid hash updates can queue events after the current URL has
            // already been scrubbed. Their captured old/new URLs still count.
            rejected = Boolean(scrubbed(event.oldURL) || scrubbed(event.newURL)) || rejected;
          }
          // On a browser traversal the address has already changed. Start the
          // guarded destination afresh before the router renders it here.
          var newDocument = needsFreshDocument && needsFreshDocument(clean ? clean.href : window.location.href);
          if (!rejected && !newDocument) return;
          event.stopImmediatePropagation();
          if (clean) safelyReplace(clean);
          if (newDocument && !window.__authLateMarkerScrubFailed) navigateDocument("reload", window.location.href);
        }
        window.addEventListener("hashchange", onNavigation, true);
        window.addEventListener("popstate", onNavigation, true);
      })();
    </script>
    <!-- Load global styles outside the guarded application import. A blocked
         optional font must not reject main's CSS preload and loop on reload. -->
    <link rel="stylesheet" href="/src/global.css" />
    <!-- Google Tag Manager (gated on VITE_GTM_ID at build time so OSS
         builds don't load third-party tracking) -->
    <script id="google-tag-manager">(function(){
      var GTM_ID = "%VITE_GTM_ID%";
      if (!GTM_ID || GTM_ID === "%" + "VITE_GTM_ID%") return;
      if (window.__analyticsAllowedAtLoad !== true ||
          typeof window.__analyticsUrlAllowed !== "function" ||
          window.__analyticsUrlAllowed(window.location.href) !== true) return;
      window.__analyticsTagStarted = true;
      (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer',GTM_ID);
    })();
    </script>
    <!-- End Google Tag Manager -->

    <meta name="theme-color" content="#000000" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />

    <!-- Fonts: App uses Inter (system/bundled). Public Sans & Barlow removed — were unused, render-blocking, ~300KB wasted. -->

    <title>Future AGI</title>

    <meta
      name="description"
      content="Future AGI helps companies to align their AI to their users automatically"
    />
    <meta
      name="keywords"
      content="react,material,kit,application,dashboard,admin,template"
    />

    <!-- No preconnect to the reCAPTCHA hosts: the app loads reCAPTCHA only
         when the build has VITE_GOOGLE_SITE_KEY, and a self-hosted UI without
         one must not contact Google. -->
  </head>

  <body>
    <!-- No Google Tag Manager <noscript> iframe: markup cannot be gated on
         VITE_GTM_ID the way the script above is, and the app needs
         JavaScript anyway. -->

    <!-- FOUC prevention: set data-theme before first paint so CSS variables match -->
    <script>
      (function() {
        try {
          var s = JSON.parse(localStorage.getItem('settings'));
          var m = s && s.themeMode || 'system';
          if (m === 'system') {
            m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.body.setAttribute('data-theme', m);
        } catch (e) {}
      })();
    </script>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Boot splash: the same mark, name and line as <SplashScreen>, drawn on
         the first frame so the page is never blank while the bundle loads.
         SplashScreen keeps it up through the auth and deployment checks and
         removes it once the app has something else to show. -->
    <style>
      #boot-splash { position: fixed; inset: 0; z-index: 9998; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #FAFAFA; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; opacity: 0; animation: boot-in 0.2s ease-out 0.3s forwards; }
      #boot-splash .mark { width: 32px; height: 32px; background: #7857FC; -webkit-mask: url(/favicon/logo.svg) center / contain no-repeat; mask: url(/favicon/logo.svg) center / contain no-repeat; }
      #boot-splash .name { font-size: 15px; line-height: 22px; font-weight: 600; color: #18181B; }
      #boot-splash .track { width: 96px; height: 2px; margin-top: 4px; border-radius: 2px; overflow: hidden; background: #E4E4E7; }
      #boot-splash .track i { display: block; width: 40%; height: 100%; background: #7857FC; animation: boot-line 1.4s ease-in-out infinite; }
      body[data-theme="dark"] #boot-splash { background: #0A0A0B; }
      body[data-theme="dark"] #boot-splash .mark, body[data-theme="dark"] #boot-splash .track i { background: #EFEFF1; }
      body[data-theme="dark"] #boot-splash .name { color: #EFEFF1; }
      body[data-theme="dark"] #boot-splash .track { background: #232326; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-line { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .track i { animation: none; transform: translateX(75%); } }
    </style>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading">
      <div class="mark"></div>
      <div class="name">Future AGI</div>
      <div class="track"><i></i></div>
    </div>
    <!-- Runtime config — see frontend/docker-entrypoint.sh -->
    <script src="/config.js"></script>
    <script>
      const global = globalThis;
    </script>
    <!-- Handle Vite dynamic import errors (e.g. after a new deployment when old chunks are removed) -->
    <script>
      window.addEventListener('vite:preloadError', (event) => {
        // A hover preload failing (routes/preload.js) must not reload the
        // page; the real import on click retries and recovers on its own.
        if (window.__fagiHoverPreloads > 0) return;
        event.preventDefault();
        // Allow reload to proceed without beforeunload confirmation (e.g. from ReplayDrawer)
        window.__RELOADING_FOR_VITE_PRELOAD_ERROR = true;
        window.location.reload();
      });
    </script>
    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
