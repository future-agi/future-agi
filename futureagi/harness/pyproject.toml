[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fi-harness"
version = "0.1.0"
description = "Builds a real environment from an agent's source, writes proved scenarios, and runs them"
requires-python = ">=3.11"
license-files = ["LICENSE", "NOTICE"]

# Deliberately short. The harness reaches for six third-party packages and nothing else; the
# repository it came from carries twenty-three, none of the rest of which it touches.
dependencies = [
  "claude-agent-sdk>=0.2.139",   # every stage is a session driven through this
  "pydantic>=2.0,<3",
  "requests>=2.32.5,<3",
  "ai-evaluation>=1.1.0",        # supplies fi.evals, for sub-goals settled by a platform eval
]

[project.optional-dependencies]
# What harness.ui.app needs to serve the harness over HTTP.
ui = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
# Only for a world whose store is a real Postgres rather than a file.
postgres = ["psycopg[binary]>=3.1"]
# httpx is what fastapi.testclient drives the app with.
dev = ["pytest>=8.3", "ruff>=0.9", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
