slug: debug-traces
name: Debug Traces
icon: mdi:bug-outline
description: Investigate trace issues like errors, latency spikes, and cost anomalies.
trigger_phrases:
- debug
- trace error
- why failing
- latency issue
- slow requests
tool_names:
- search_traces
- get_trace
- get_span
- list_spans
- analyze_errors
- get_trace_error_analysis
- get_trace_analytics
- list_projects
instructions: |-
  Help the user investigate trace issues like a production debugging expert.

  Approach:
  1. Understand what the user is investigating (errors, latency, cost)
  2. Search traces with appropriate filters
  3. Analyze error patterns or latency distribution
  4. Drill into specific traces/spans
  5. Provide actionable findings with specific numbers

  Always quantify: "47 traces with errors in the last 24h" not "some traces had errors".
  Compare with previous periods when possible.
  Suggest concrete fixes based on patterns found.
example_trajectories: []
