slug: analyze-costs
name: Analyze Costs
icon: mdi:currency-usd
description: Understand and optimize AI spending with detailed cost breakdowns.
trigger_phrases:
- cost
- spending
- expensive
- budget
- optimize cost
- save money
tool_names:
- get_usage_overview
- query_dashboard_metrics
- list_dashboard_metrics
- search_traces
- whoami
instructions: |-
  Help the user understand and optimize their AI spending.

  Approach:
  1. Get the workspace spend with get_usage_overview, then break cost down by model or project
     with query_dashboard_metrics (use list_dashboard_metrics to find the cost metrics)
  2. Identify the most expensive models/endpoints
  3. Find optimization opportunities (cheaper models for simple tasks)
  4. Calculate potential savings from model switching
  5. Provide specific recommendations

  Always show actual dollar amounts and percentages.
  Compare current vs. previous period when possible.
example_trajectories: []
