# Generated once by the hub-backend lane from the omega_hub urlconf; kept in step by
# omega_hub/tests/test_openapi.py. The integrator regenerates api_contracts/ from the app.
openapi: 3.1.0
info:
  title: Omega Hub registry API
  version: 1.0.0
  description:
    "The Omega Hub registry in the Future AGI private fork (Django app omega_hub). Public reads return approved
    versions only. There are no comment, discussion, question, reply or thread endpoints (SPEC §2.2); conversation lives on
    Discord. Errors use {error: {code, message, fix}}; texts are the OMEGA_HUB_* keys of tfc/utils/error_codes.py."
servers:
  - url: http://127.0.0.1:8740
    description: lane dev server (scripts/omega-hub/dev-up.sh)
  - url: https://api.futureagi.com
    description: production (owner decision 10)
tags:
  - name: public
  - name: signed-in
  - name: publishing
  - name: maintainers
  - name: checker
paths:
  /omega-hub/v1/entries:
    get:
      summary: Search and list entries (cards)
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                      - string
                      - "null"
                  previous:
                    type:
                      - string
                      - "null"
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/EntryCard"
                  facets:
                    type: object
                  sort:
                    description:
                      The order applied. Without a sort parameter it is trending once any
                      listed entry has a non-zero Trending score, and new until then; relevance when
                      q is set.
                    enum:
                      - trending
                      - new
                      - likes
                      - installs
                      - relevance
        default:
          $ref: "#/components/responses/Error"
      description: Unranked entries appear only when q is set, after every ranked match.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            enum:
              - app
              - agent
              - team
              - skill
              - plugin
              - mcp
              - workflow
        - name: vendor
          in: query
          required: false
          schema:
            type: string
        - name: noKey
          in: query
          required: false
          schema:
            enum:
              - "1"
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: tier
          in: query
          required: false
          schema:
            enum:
              - official
              - verified
              - community
        - name: publisher
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            enum:
              - trending
              - new
              - likes
              - installs
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
  /omega-hub/v1/entries/{publisher}/{name}:
    get:
      summary: Entry detail with the latest version inline
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryDetail"
        "301": &id001
          $ref: "#/components/responses/Moved"
        "410": &id002
          $ref: "#/components/responses/Gone"
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/publisher"
        - $ref: "#/components/parameters/name"
  /omega-hub/v1/entries/{publisher}/{name}/versions:
    get:
      summary: Versions of an entry
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionRow"
        "301": *id001
        "410": *id002
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/publisher"
        - $ref: "#/components/parameters/name"
  /omega-hub/v1/entries/{publisher}/{name}/versions/{version}:
    get:
      summary: One approved (or yanked) version
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDetail"
        "301": *id001
        "410": *id002
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/publisher"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/version"
  /omega-hub/v1/entries/{publisher}/{name}/versions/{version}/files/{path}:
    get:
      summary: A file of an approved version (text/plain, or image bytes with CSP default-src 'none')
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: File
          content:
            text/plain: {}
            image/png: {}
        "301": *id001
        "410": *id002
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/publisher"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/version"
        - name: path
          in: path
          required: true
          schema:
            type: string
  /omega-hub/v1/entries/{publisher}/{name}/versions/{version}/bundle:
    get:
      summary: The canonical bundle; counted per SPEC §6.2
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: omega-hub-bundle/v1
          headers:
            X-Omega-Hub-Digest:
              schema:
                type: string
            X-Omega-Hub-Bundle-Sha256:
              schema:
                type: string
            X-Omega-Hub-Yanked:
              schema:
                type: string
          content:
            application/gzip: {}
        "301": *id001
        "410": *id002
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/publisher"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/version"
        - name: source
          in: query
          required: false
          description:
            Web downloads return the same bundle without recording a download count.
            An omitted source still counts as cli; other unknown sources are refused.
          schema:
            enum:
              - cli
              - studio
              - deploy
              - console
              - web
            default: cli
  /omega-hub/v1/entries/{publisher}/{name}/versions/{version}/cast:
    get:
      summary: The demo cast
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: asciicast
          content:
            text/plain: {}
        "301": *id001
        "410": *id002
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/publisher"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/version"
  /omega-hub/v1/entries/{publisher}/{name}/remixes:
    get:
      summary: Approved entries whose latest version remixes this one
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntryCard"
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/publisher"
        - $ref: "#/components/parameters/name"
  /omega-hub/v1/publishers:
    get:
      summary: Publishers index
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - name: tier
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            enum:
              - installs
              - new
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
    post:
      summary: Create a publisher
      tags:
        - signed-in
      security:
        - bearerJwt: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedPublisher"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                handle:
                  type: string
                kind:
                  enum:
                    - user
                    - organization
                organizationId:
                  type: string
                displayName:
                  type: string
              required:
                - handle
                - kind
                - displayName
  /omega-hub/v1/publishers/{handle}:
    get:
      summary: Publisher profile, totals and entry cards
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publisher"
        "301": *id001
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/handle"
    patch:
      summary: Edit the profile (owner, or the organisation's Admins and Owners)
      tags:
        - signed-in
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedPublisher"
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/handle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                bio:
                  type: string
                website:
                  type: string
                githubLogin:
                  type: string
  /omega-hub/v1/publishers/{handle}/avatar:
    get:
      summary: The publisher's uploaded avatar (no third-party images)
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: PNG or JPEG
          content:
            image/png: {}
            image/jpeg: {}
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/handle"
    post:
      summary: Upload an avatar (PNG or JPEG, at most 256 KiB)
      tags:
        - signed-in
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/handle"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
              required:
                - avatar
  /omega-hub/v1/publishers/{handle}/verification-request:
    post:
      summary: Ask a maintainer to verify the publisher
      tags:
        - signed-in
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/handle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                evidence:
                  type: string
                  maxLength: 1000
              required:
                - evidence
  /omega-hub/v1/picks:
    get:
      summary: Maintainer picks for a week
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntryCard"
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - name: week
          in: query
          required: false
          schema:
            type: string
            format: date
  /omega-hub/v1/tags:
    get:
      summary: Tags with counts
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tag:
                      type: string
                    count:
                      type: integer
        default:
          $ref: "#/components/responses/Error"
  /omega-hub/v1/export:
    get:
      summary: The registry export omega-hub-registry/v1 (ETag, If-None-Match, max-age=300)
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryExport"
        "304":
          description: Not modified
        default:
          $ref: "#/components/responses/Error"
  /omega-hub/v1/rules:
    get:
      summary: The rules file omega-hub-rules/v1 (ETag)
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "304":
          description: Not modified
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: integer
  /omega-hub/v1/blocklist:
    get:
      summary: The blocklist omega-hub-blocklist/v1 (ETag, If-None-Match; not counted, nothing stored)
      tags:
        - public
      security:
        - {}
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blocklist"
        "304":
          description: Not modified
        default:
          $ref: "#/components/responses/Error"
  /omega-hub/v1/me:
    get:
      summary: "Who am I: user, publishers, isMaintainer, emailVerified"
      tags:
        - signed-in
      security:
        - bearerJwt: []
        - hubToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
  /omega-hub/v1/me/tokens:
    get:
      summary: My Hub tokens
      tags:
        - signed-in
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Create a Hub token (plaintext returned once)
      tags:
        - signed-in
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publisher:
                  type: string
                name:
                  type: string
                days:
                  type: integer
                  minimum: 1
                  maximum: 365
              required:
                - publisher
                - name
  /omega-hub/v1/me/tokens/{tokenId}:
    delete:
      summary: Revoke a Hub token
      tags:
        - signed-in
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /omega-hub/v1/me/likes:
    get:
      summary: Entries I liked (only for myself)
      tags:
        - signed-in
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntryCard"
        default:
          $ref: "#/components/responses/Error"
  /omega-hub/v1/me/email-verification:
    post:
      summary: Email me a link that confirms my address (likes, reports and new publishers need it)
      description:
        Sends nothing and answers 200 when the address is already confirmed. The link
        expires in 24 hours and works only while signed in as the account it was sent to.
      tags:
        - signed-in
      security:
        - bearerJwt: []
      responses:
        "200":
          description: Already confirmed; nothing sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailVerificationSent"
        "202":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailVerificationSent"
        default:
          $ref: "#/components/responses/Error"
  /omega-hub/v1/me/email-verification/confirm:
    post:
      summary: Confirm my address with the emailed link's token
      tags:
        - signed-in
      security:
        - bearerJwt: []
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    const: true
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
  /omega-hub/v1/submissions:
    get:
      summary: My submissions
      tags:
        - publishing
      security:
        - bearerJwt: []
        - hubToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - name: mine
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
    post:
      summary: Submit a bundle for checks and review
      tags:
        - publishing
      security:
        - bearerJwt: []
        - hubToken: []
      responses:
        "201":
          description: Received
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    const: received
                  url:
                    type: string
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                bundle:
                  type: string
                  format: binary
                publisher:
                  type: string
                channel:
                  enum:
                    - cli
                    - web
                    - github
                name:
                  type: string
                version:
                  type: string
                notes:
                  type: string
                  maxLength: 500
                githubCommit:
                  type: string
              required:
                - bundle
  /omega-hub/v1/submissions/{submissionId}:
    get:
      summary: "One submission: status, timeline, findings, decision and notes"
      tags:
        - publishing
      security:
        - bearerJwt: []
        - hubToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/submissionId"
  /omega-hub/v1/submissions/{submissionId}/bundle:
    get:
      summary: The raw upload (submitter or maintainer only)
      tags:
        - publishing
      security:
        - bearerJwt: []
      responses:
        "200":
          description: Bytes
          content:
            application/octet-stream: {}
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/submissionId"
  /omega-hub/v1/submissions/{submissionId}/withdraw:
    post:
      summary: Withdraw (received, checking or in_review)
      tags:
        - publishing
      security:
        - bearerJwt: []
        - hubToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/submissionId"
  /omega-hub/v1/entries/{publisher}/{name}/like:
    post:
      summary: Like (browser session only)
      tags:
        - signed-in
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  likes:
                    type: integer
                  likedByMe:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
      description: A Hub token or an org X-Api-Key/X-Secret-Key pair gets 403 OMEGA_HUB_LIKE_NEEDS_SESSION.
      parameters:
        - $ref: "#/components/parameters/publisher"
        - $ref: "#/components/parameters/name"
    delete:
      summary: Unlike (browser session only)
      tags:
        - signed-in
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  likes:
                    type: integer
                  likedByMe:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/publisher"
        - $ref: "#/components/parameters/name"
  /omega-hub/v1/entries/{publisher}/{name}/versions/{version}/yank:
    post:
      summary: Yank a version (publisher)
      tags:
        - publishing
      security:
        - bearerJwt: []
        - hubToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/publisher"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required:
                - reason
  /omega-hub/v1/entries/{publisher}/{name}/unlist:
    post:
      summary: Unlist an entry (publisher)
      tags:
        - publishing
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/publisher"
        - $ref: "#/components/parameters/name"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
  /omega-hub/v1/reports:
    post:
      summary: Report an entry privately (one way, to maintainers)
      tags:
        - signed-in
      security:
        - bearerJwt: []
      responses:
        "201":
          description: Received
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    const: received
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: string
                version:
                  type: string
                reason:
                  enum:
