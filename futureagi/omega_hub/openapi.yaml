components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      description: The Future AGI app session (accounts APIKeyAuthentication)
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description:
        "An explicitly person-created personal API key pair (with X-Secret-Key),
        admitted only while its owner and memberships remain active. A key is not an interactive session:
        operations requiring a signed-in browser session answer 403 OMEGA_HUB_SESSION_REQUIRED
        (likes answer OMEGA_HUB_LIKE_NEEDS_SESSION). Public reads do not use keys to personalize results.
        Retired organization keys are refused with 401, including on public reads."
    secretKey:
      type: apiKey
      in: header
      name: X-Secret-Key
      description: "The secret half of the explicitly person-created personal API key pair; see apiKey."
    hubToken:
      type: apiKey
      in: header
      name: X-Omega-Hub-Token
      description: ohp_<40 base62>; never as a Bearer value
    checkerToken:
      type: apiKey
      in: header
      name: X-Omega-Hub-Checker-Token
    metricsToken:
      type: apiKey
      in: header
      name: X-Omega-Hub-Metrics-Token
      description: Read-only credential for Prometheus metrics; never use the checker credential.
  parameters:
    publisher:
      name: publisher
      in: path
      required: true
      schema:
        type: string
    name:
      name: name
      in: path
      required: true
      schema:
        type: string
    version:
      name: version
      in: path
      required: true
      schema:
        type: string
        pattern: ^\d+\.\d+\.\d+$
    handle:
      name: handle
      in: path
      required: true
      schema:
        type: string
    submissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
