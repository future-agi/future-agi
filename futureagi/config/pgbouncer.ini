[databases]
; Security: credentials MUST be overridden via environment variables.
; The values below are placeholders — never use them in production.
; Set PG_USER and PG_PASSWORD environment variables before starting.
tfc = host=db port=5432 dbname=tfc user=${PG_USER:?PG_USER must be set} password=${PG_PASSWORD:?PG_PASSWORD must be set}

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
; Security: use scram-sha-256 instead of plain to prevent credential
; exposure on the wire. Requires PostgreSQL 10+ and hashed passwords
; in the auth_file.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 100
log_connections = 1
log_disconnections = 1
server_reset_query = DISCARD ALL
server_check_query = select 1
server_check_delay = 30
max_db_connections = 200
max_user_connections = 200
reserve_pool_size = 20
reserve_pool_timeout = 3
server_idle_timeout = 300
server_lifetime = 3600
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 6
