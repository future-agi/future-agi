eval_id: 205
name: rag_faithfulness
description: Evaluates whether the model answer is strictly grounded in the retrieved
  context using claim-by-claim reasoning.
criteria: 'You are evaluating the factual faithfulness of the generated response against
  the retrieved context passage.


  ## Chain-of-Thought Evaluation Steps

  1. Decompose the generated output into individual atomic factual statements or claims.

  2. For each claim, check if it is directly stated in or strictly deducible from
  the provided context.

  3. Identify any external knowledge injection, ungrounded speculation, or direct
  hallucinations.


  ## Scoring

  - Passed (1.0): Every single claim in the response is directly supported by the
  context.

  - Failed (0.0): One or more claims cannot be verified from the context alone.


  ## Inputs

  <input>{{input}}</input>

  <output>{{output}}</output>

  <context>{{context}}</context>'
eval_tags:
- RAG
- Hallucination
visible_ui: true
permissions:
  allow_edit: false
  allow_copy: true
choices:
- Passed
- Failed
output_type_normalized: pass_fail
pass_threshold: 0.5
config:
  required_keys:
  - output
  - context
  optional_keys:
  - input
  output: Pass/Fail
  eval_type_id: AgentEvaluator
  config_params_desc:
    input: The initial user input or prompt
    output: The generated agent response to verify
    context: The retrieved context passages
  param_modalities:
    input:
    - TEXT
    - JSON
    output:
    - TEXT
    - JSON
    context:
    - TEXT
    - KNOWLEDGE_BASE
    - JSON
    - LIST
    - ARRAY
  rule_prompt: 'You are evaluating the factual faithfulness of the generated response
