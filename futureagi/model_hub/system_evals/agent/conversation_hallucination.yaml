eval_id: 200
name: conversation_hallucination
description: "Detects fabricated attributions, false dialogue history, material contradictions, and misrepresentation of supplied factual context."
criteria: |-
  Evaluate fabricated or misrepresented information in the agent's statements against the conversation and relevant supplied context.

  ## Criteria
  1. Attribution: Claims about another participant's statements, requests, or agreement must match that participant's actual contributions.
  2. Dialogue history: Claims about earlier exchanges must match the available history; the agent's own unsupported assertion is not independent evidence.
  3. Consistency: Material claims must remain consistent unless new information or an explicit correction supports a change; repeated misrepresentation remains a failure.
  4. Grounding: Assess factual claims against relevant supplied context, including unsupported additions falsely presented as grounded in that context.

  ## Anti-bias Rules
  - Allow explicit corrections that are retained, reasonable supported inferences, labeled proposals or hypotheticals, and statements of uncertainty.
  - Participant statements establish what was said, not necessarily its external truth; instructions describe expected behavior, not proof of events.
  - Do not infer fabrication from unclear speech, transcription artifacts, incomplete capture, or missing context.
  - If supplied inputs cannot verify an external claim, neither fail it solely for absent support nor describe it as verified.

  ## Scoring
  - Return 'Failed' for an established fabricated attribution, false account of prior dialogue, unresolved or repeated material contradiction, or misrepresentation of supplied factual context.
  - Return 'Passed' when no such failure is established; this does not certify claims the supplied inputs cannot verify.

  ## Explanation
  Identify the claim and decisive evidence, considering corrections or new information; distinguish a demonstrated error from an uncheckable claim.

  ## Inputs
  <conversation>{{conversation}}</conversation>
  <context>{{context}}</context>

eval_tags:
- Hallucination
- Conversation
- Agents
visible_ui: true
permissions:
  allow_edit: false
  allow_copy: true
choices:
- Passed
- Failed
output_type_normalized: pass_fail
pass_threshold: 0.5
config:
  required_keys:
  - conversation
  - context
  optional_keys:
  - context
  output: Pass/Fail
  eval_type_id: AgentEvaluator
  config: {}
  config_params_desc:
    conversation: The full conversation (user and agent turns) to be evaluated for hallucinations in the agent's responses
    context: Optional external grounding (e.g., retrieved documents, knowledge base) against which agent factual claims should also be validated
  param_modalities:
    conversation:
    - TEXT
    - AUDIO
    - JSON
    - LIST
    - NUMBER
    - BOOLEAN
    - INTEGER
    - FLOAT
    - ARRAY
    - DATETIME
    context:
    - TEXT
    - AUDIO
    - IMAGE
    - PDF
    - KNOWLEDGE_BASE
    - JSON
    - LIST
    - NUMBER
    - BOOLEAN
    - INTEGER
    - FLOAT
    - ARRAY
    - DATETIME
    - IMAGES
