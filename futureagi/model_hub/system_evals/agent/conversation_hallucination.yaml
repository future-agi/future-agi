eval_id: 200
name: conversation_hallucination
description: "Identifies fabricated customer attributions, false accounts of prior dialogue, repeated contradictions, and claims contradicted by supplied context; does not verify unseen tool execution or unsupported external facts."
criteria: |-
  You are evaluating fabricated attributions and factual inconsistencies in the agent's conversation. Use the conversation and any relevant context actually supplied; do not infer hidden tool execution or backend truth.

  ## Criteria
  1. Customer-attributed fabrication: Compare claims about what the customer said, requested, confirmed, or corrected with the customer's actual turns. Invented details, different numbers attributed to the customer, swapped roles, or denying a clearly given confirmation are failures when established by the conversation. Track who introduced a value; a false agent statement does not become grounded merely because it appears earlier in the history.
  2. False accounts of earlier dialogue: Check claims such as "I already gave you the options" or "you have not confirmed" against the preceding exchanges. Distinguish a statement about an observable conversational action from an unverifiable claim about a hidden backend action.
  3. Contradictions and repairs: Compare the agent's material statements about the same detail, service, requirement, or outcome across turns. An explicitly framed correction that is then consistently retained is allowed. Continuing a contradicted claim after a clear correction, or reverting to it after repair, is a failure; a later generic success announcement does not erase repeated contradictions. Legitimate changes supported by a customer update or new supplied evidence are not contradictions.
  4. Context-grounded facts: When relevant factual context is supplied, check claims against that evidence. An instruction to use a tool is not the tool's result, and a topic being within the agent's scope does not establish a particular policy, entitlement, or capability. Without relevant evidence, external facts and claims about completed backend actions are outside what this evaluation can verify. Do not fail them solely for lacking independent support, or describe them as verified because the agent asserted them. An audible contradiction involving such a claim remains assessable.

  ## Anti-bias Rules
  - Evaluate only the agent. Customer turns establish what the customer said, not whether every customer belief is true in the world.
  - A single tentative read-back followed by explicit correction and consistent recovery is not fabrication. Repeatedly attributing the same corrected wrong value to the customer is different.
  - Do not infer false statements from inaudible speech, incomplete capture, isolated transcription spellings, or clipped intent. For example, "I was asking" after an interruption need not claim an earlier question was fully delivered. State uncertainty rather than inventing missing dialogue.
  - Reasonable inferences, generic filler, and explicit admissions of uncertainty are not hallucinations. Distinguish a clearly offered alternative from a fabricated claim about the customer's preference.
  - No external lookup or tool trace is required. An announced completion is not a hallucination merely because the backend cannot be checked. Lack of context is not evidence of fabrication, and absence of a contradiction is not proof of external truth.

  ## Scoring
  Return 'Failed' when the assessable evidence establishes a fabricated customer attribution, a false account of earlier dialogue, an unrepaired or repeated material contradiction, or a factual claim contradicted by supplied context. Return 'Passed' when no such failure is established. A pass covers assessable conversation consistency and supplied grounding only; it does not certify external facts, policies, or backend execution that cannot be checked.

  ## Explanation
  Quote the disputed claim and the customer turn, earlier agent statement, or supplied context that establishes the problem. Explain why any apparent repair does or does not resolve it. For a pass, describe the assessed scope and any uncheckable claims without calling them verified.

  ## Inputs
  <conversation>{{conversation}}</conversation>
  <context>{{context}}</context>
eval_tags:
- Hallucination
- Conversation
- Agents
visible_ui: true
permissions:
  allow_edit: false
  allow_copy: true
choices:
- Passed
- Failed
output_type_normalized: pass_fail
pass_threshold: 0.5
config:
  required_keys:
  - conversation
  - context
  optional_keys:
  - context
  output: Pass/Fail
  eval_type_id: AgentEvaluator
  config: {}
  config_params_desc:
    conversation: The full conversation (user and agent turns) to be evaluated for hallucinations in the agent's responses
    context: Optional external grounding (e.g., retrieved documents, knowledge base) against which agent factual claims should also be validated
  param_modalities:
    conversation:
    - TEXT
    - AUDIO
    - JSON
    - LIST
    - NUMBER
    - BOOLEAN
    - INTEGER
    - FLOAT
    - ARRAY
    - DATETIME
    context:
    - TEXT
    - AUDIO
    - IMAGE
    - PDF
    - KNOWLEDGE_BASE
    - JSON
    - LIST
    - NUMBER
    - BOOLEAN
    - INTEGER
    - FLOAT
    - ARRAY
    - DATETIME
    - IMAGES
