eval_id: 133
name: customer_agent_task_completion
description: "Checks whether the user's primary objective and stated conditions were fulfilled in the conversation."
criteria: |-
  Evaluate whether the user's primary objective was completed, using the supplied conversation.

  ## Criteria
  1. Identify the primary objective and stated conditions, including explicit changes or accepted alternatives.
  2. Compare the communicated outcome with that objective; a success statement does not override contradictory details or unresolved conditions.
  3. An explanation or refusal may answer an informational question, but does not fulfill an unmet request for action.
  4. Apply only requirements established by the conversation or supplied instructions; do not assume a particular workflow or approval procedure.

  ## Anti-bias Rules
  - Distinguish non-completion from agent fault; a limitation or user withdrawal explains an unfinished task but does not make it complete.
  - Judge the requested stage of work: confirmed initiation can satisfy a request to begin a process, but a promise alone cannot.
  - Accept clear conversational evidence without requiring external execution records or claiming unseen actions were verified.
  - Exclude unclear or missing content from error judgments; do not invent exchanges or penalize unrelated minor issues.

  ## Scoring
  - Return PASS when the conversation establishes fulfillment of the primary objective and its stated conditions, or an explicitly accepted and fulfilled alternative.
  - Return FAIL when assessable evidence establishes an unmet objective, or claimed completion conflicts with an unresolved material condition.

  ## Explanation
  State the objective, outcome, decisive evidence, and any evidence limitation; explain non-completion separately from fault.

  ## Input
  <agent_prompt>{{agent_prompt}}</agent_prompt>
  <conversation>{{conversation}}</conversation>

eval_tags:
- Agents
- Conversation
visible_ui: true
permissions:
  allow_edit: false
  allow_copy: true
choices:
- Passed
- Failed
output_type_normalized: pass_fail
pass_threshold: 0.5
config:
  required_keys:
  - agent_prompt
  - conversation
  output: Pass/Fail
  eval_type_id: AgentEvaluator
  config: {}
  config_params_desc:
    agent_prompt: The agent's system prompt defining its task and behavior
    conversation: The conversation to be evaluated
  param_modalities:
    agent_prompt:
    - TEXT
    - JSON
    - LIST
    - NUMBER
    - BOOLEAN
    - INTEGER
    - FLOAT
    - ARRAY
    - DATETIME
    conversation:
    - TEXT
    - AUDIO
    - JSON
    - LIST
    - NUMBER
    - BOOLEAN
    - INTEGER
    - FLOAT
    - ARRAY
    - DATETIME
