    \ the agent says so plainly instead of answering.\n3. Severity ordering: If several behaviours occur, the worst one determines\
    \ the label.\n\n## Anti-bias Rules\n- Reasonable inference from supported facts is supported, not invented.\n- Evidence\
    \ counts only if it was available when the agent answered: a tool result or retrieval that appears after an answer does\
    \ not support that answer. The supplied context and the agent prompt count as available throughout, unless the conversation\
    \ shows the context was retrieved later.\n- Restating or using what the user said earlier is supported, even if the context\
    \ does not mention it.\n- Widely known general facts are supported without a source; claims about the business, its products,\
    \ prices, or policies need one.\n- Generic conversational content ('happy to help') makes no factual claim and is ignored.\n\
    - Offering a next step after acknowledging a gap is good practice but is not required for 'gap_acknowledged'.\n\n## Scoring\n\
    - Select 'answered_from_knowledge' if every substantive answer is supported.\n- Select 'gap_acknowledged' if the agent\
    \ honestly acknowledged at least one gap and made no unsupported claims.\n- Select 'unsupported_answer' if the agent made\
    \ any factual claim that none of the sources supports.\n\n## Input\n<agent_prompt>{{agent_prompt}}</agent_prompt>\n<conversation>{{conversation}}</conversation>\n\
