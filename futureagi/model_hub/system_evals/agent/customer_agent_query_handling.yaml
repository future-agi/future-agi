eval_id: 114
name: customer_agent_query_handling
description: "Evaluates whether every substantive question and request, including multipart, secondary, and deferred questions, is understood and addressed without overlooking repeated nonanswers or unresolved decision-essential issues."
criteria: |-
  You are evaluating whether the agent understands and addresses the customer's questions and requests throughout the conversation, including every part of a multipart query.

  ## Criteria
  1. Identify every substantive issue: Split a customer turn into its distinct questions, clarification requests, corrections, and action requests. Include secondary and follow-up questions, even when they accompany approval of the main task. Track a repeated question as an unresolved issue with repeated attempts, rather than treating each repetition as new evidence of successful handling.
  2. Match each issue to a response: Check whether the agent answers that specific question, asks a necessary clarification, or directly explains a relevant limitation and available next step. Answering one part does not answer the others. An acknowledgment, a repeated script, or related information that does not address what was asked is a nonanswer. For example, explaining where a code came from does not explain why it is needed.
  3. Follow deferred questions through to resolution: A reasonable deferral while gathering necessary information can be appropriate, but remains pending until addressed. Repeatedly promising to answer, requesting already supplied information, or presenting options without answering a question about those options is not resolution. A successful primary task does not erase unanswered secondary questions.
  4. Respect decision-essential questions and conditions: Questions about the requested service, corrected details, eligibility, capacity, or conditions on consent may determine whether the customer can proceed. Do not let many routine exchanges outweigh an unresolved issue essential to the customer's stated decision or outcome.
  5. Handle unexpected questions appropriately: Judge scope from the conversation and any role information actually available. A clarification about the current task is not out of scope merely because the agent labels it that way. Genuinely unrelated questions may receive a polite, relevant boundary or redirection.

  ## Anti-bias Rules
  - A clarification is good handling when information is genuinely ambiguous or missing; asking again for a clear answer already supplied is not.
  - An honest "I don't know" or "I cannot provide that information" can be responsive when it directly addresses the question and explains the limitation or offers an available next step. Do not require an invented answer, tool access, or an unavailable capability.
  - A short direct answer can address several questions; do not require one turn per question. Do not count greetings, filler, or statements needing no response as unanswered queries.
  - Exclude inaudible or missing portions from judgments about comprehension or omission. Do not assume an answer occurred in a missing segment or infer that it was omitted solely because capture is incomplete; state the limitation.
  - Evaluate the responses themselves, not hidden tool execution or backend success. Politeness and eventual task completion do not compensate for nonanswers or repeated misunderstanding.

  ## Scoring
  - Select 'never' when no substantive issue is handled meaningfully, or the agent consistently responds with misunderstanding or nonanswers.
  - Select 'occasionally' when some issues are handled but others are materially mishandled. An unresolved decision-essential issue or repeated nonanswers to the same substantive question caps the rating at 'occasionally', even when routine parts of the task are handled correctly.
  - Select 'frequently' when most issues are handled, remaining omissions are minor, and no decision-essential issue or repeated nonanswer remains unresolved. Use this rather than 'always' when a material initial misunderstanding requires repair, even if the later answer is good.
  - Select 'always' only when every assessable substantive part, including secondary and deferred questions, is appropriately addressed without material misunderstanding or unresolved omission.

  ## Explanation
  Identify the question or subquestion that determines the rating and the response that addresses it, fails to address it, or never arrives. For repeated nonanswers, cite the repeated request and relevant replies. Do not assign the agent's misunderstanding to the customer or claim that answering the primary request answered every part.

  ## Inputs
  <conversation>{{conversation}}</conversation>
eval_tags:
- Agents
- Conversation
visible_ui: true
permissions:
  allow_edit: false
  allow_copy: true
choices:
- never
- occasionally
- frequently
- always
output_type_normalized: deterministic
config:
  required_keys:
  - conversation
  output: choices
  eval_type_id: AgentEvaluator
  param_modalities:
    conversation:
    - TEXT
    - AUDIO
    - JSON
    - LIST
    - NUMBER
    - BOOLEAN
    - INTEGER
    - FLOAT
    - ARRAY
    - DATETIME
  config_params_desc:
    conversation: The conversation to be evaluated
