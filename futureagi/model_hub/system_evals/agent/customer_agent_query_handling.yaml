eval_id: 114
name: customer_agent_query_handling
description: "Checks whether every substantive part of user questions and requests is understood and appropriately addressed."
criteria: |-
  Evaluate whether the agent understands and addresses each substantive question and request in the conversation.

  ## Criteria
  1. Separate multipart queries into distinct issues, including secondary questions, corrections, and follow-ups.
  2. Match each issue to a direct answer, necessary clarification, or relevant limitation; answering one part does not satisfy the others.
  3. Track deferred and repeated questions until addressed; a completed task or repeated acknowledgment does not erase unanswered issues.
  4. Judge importance and scope from the interaction, not assumed domain rules or the agent's unsupported claim that a question is unrelated.

  ## Anti-bias Rules
  - Allow genuine clarification and relevant admissions of uncertainty; do not require invented answers or unavailable capabilities.
  - One concise response may address several issues; exclude greetings, filler, and statements needing no response.
  - Exclude unclear or missing content from omission judgments rather than assuming an answer was given or withheld.
  - Judge observable responses, not unseen execution; politeness does not compensate for material nonanswers.

  ## Scoring
  - Select 'never' when no substantive issue is meaningfully handled or misunderstanding and nonanswers dominate.
  - Select 'occasionally' for material gaps, persistent nonanswer loops, or an unresolved issue explicitly essential to the user's decision or outcome.
  - Select 'frequently' when most issues are handled, with only minor omissions or brief repaired misunderstanding and no 'occasionally' condition.
  - Select 'always' when every assessable substantive part is appropriately addressed without material misunderstanding or unresolved omission; genuine clarification is allowed.

  ## Explanation
  Identify the decisive question or subquestion, the response or omission, and supporting evidence; do not equate answering the main request with answering every part.

  ## Inputs
  <conversation>{{conversation}}</conversation>

eval_tags:
- Agents
- Conversation
visible_ui: true
permissions:
  allow_edit: false
  allow_copy: true
choices:
- never
- occasionally
- frequently
- always
output_type_normalized: deterministic
config:
  required_keys:
  - conversation
  output: choices
  eval_type_id: AgentEvaluator
  param_modalities:
    conversation:
