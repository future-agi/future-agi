eval_id: 212
name: unclear_audio_handling
description: 'Evaluates how the agent handles unclear, cut-off, or silent user audio and background noise: asks the user to
  repeat instead of guessing, ignores background speech and media, and breaks out of repeat loops under persistent noise.'
criteria: "You are evaluating the agent's behaviour whenever the user's audio was unclear, cut off, silent, or mixed with\
  \ background noise. Judge only moments where this is evidenced: in the call audio, by transcript markers such as [inaudible],\
  \ [noise], or cut-off fragments, or by the agent asking the user to repeat. The agent prompt, if provided, may define how\
  \ clarification must be done.\n\n## Criteria\n1. Clarify, do not guess or act: When the user's words are unintelligible\
  \ or cut off, the agent briefly asks them to repeat (in the language the agent prompt specifies for clarification, otherwise\
  \ the user's language), makes no tool call on that turn, and does not act on a guessed interpretation. If the agent prompt\
  \ forbids fillers such as 'one moment' on unclear turns, saying one is also a failure.\n2. Background is not the caller:\
  \ Speech or media in the background (TV, music, side conversations) is not treated as the user's request.\n3. Break persistent-noise\
  \ loops: After two consecutive failed exchanges due to noise or unclear audio, the agent's next response gives actionable\
  \ guidance (e.g. moving somewhere quieter) instead of a third plain repeat request.\n\n## Anti-bias Rules\n- Criterion 2\
  \ (background speech) can only be judged from audio or explicit transcript markers; without them, skip it and say so in\
  \ the explanation.\n- If neither the audio nor the transcript shows any unclear audio, return PASS and begin the explanation\
  \ with 'Not applicable: no unclear audio', then state which evidence was available (audio, markers, or plain transcript\
  \ only).\n- Accents, code-switching, and non-native phrasing are not unclear audio.\n- One clarifying request followed by\
  \ success is ideal handling, not a failure.\n- Do not penalise the agent for the environment itself, only for its response\
  \ to it.\n\n## Scoring\n- Return PASS if the agent asked for clarification instead of guessing or acting, ignored background\
  \ speech, and gave guidance by the third consecutive failed exchange.\n- Return FAIL if it acted on unclear input (including\
  \ a tool call, or a filler the prompt forbids), responded to background audio as the caller, clarified in a language the\
  \ prompt forbids, or made a third plain repeat request without guidance.\n\n## Input\n<agent_prompt>{{agent_prompt}}</agent_prompt>\n\
  <conversation>{{conversation}}</conversation>"
eval_tags:
- Agents
- Conversation
- Audio
visible_ui: true
permissions:
  allow_edit: false
  allow_copy: true
choices:
- Passed
- Failed
output_type_normalized: pass_fail
pass_threshold: 0.5
config:
  required_keys:
  - agent_prompt
  - conversation
  optional_keys:
  - agent_prompt
  output: Pass/Fail
  eval_type_id: AgentEvaluator
  config: {}
  config_params_desc:
    agent_prompt: 'The agent''s system prompt (persona, script and behavioural instructions). Optional: leave unmapped if
      not available'
    conversation: The full conversation (user and agent turns), as transcript text or call audio
  param_modalities:
    agent_prompt:
    - TEXT
    conversation:
    - TEXT
    - AUDIO
    - JSON
    - LIST
