eval_id: 200
name: context_precision_score
description: 'RAG Context Precision: Measures rank-weighted precision of retrieved context chunks. Rewards relevant contexts positioned at top ranks using Average Precision@K.'
eval_tags:
- RAG
- Retrieval Systems
- Output Validation
visible_ui: true
permissions:
  allow_edit: false
  allow_copy: true
output_type_normalized: percentage
pass_threshold: 0.5
config:
  required_keys:
  - hypothesis
  - reference
  output: score
  eval_type_id: CustomCodeEval
  config: {}
  config_params_desc:
    hypothesis: Ranked retrieved context chunks (list or JSON string)
    reference: Ground-truth relevant reference contexts (list or JSON string)
    k: Optional rank cutoff (int)
  code: |
    def evaluate(input, output, expected, context, **kwargs):
        import json
        import ast
        import re
        from collections import Counter
        def _parse(val):
            if val is None:
                return []
            if isinstance(val, list):
                return [str(x).strip() for x in val if str(x).strip()]
            if isinstance(val, str):
                val = val.strip()
                if not val:
                    return []
                try:
                    p = json.loads(val)
                    if isinstance(p, list):
                        return [str(x).strip() for x in p if str(x).strip()]
                except Exception:
                    pass
                try:
                    p = ast.literal_eval(val)
                    if isinstance(p, list):
                        return [str(x).strip() for x in p if str(x).strip()]
                except Exception:
                    pass
                return [x.strip() for x in val.splitlines() if x.strip()]
            return [str(val).strip()]
        def _tokenize(text):
            return re.findall(r'\b\w+\b', str(text).lower())
        def _is_rel(chunk, refs, min_overlap=0.6):
            c_toks = _tokenize(chunk)
            if not c_toks:
                return False
            c_counts = Counter(c_toks)
            for r in refs:
                r_toks = _tokenize(r)
                if not r_toks:
                    continue
                r_counts = Counter(r_toks)
                overlap = sum((c_counts & r_counts).values())
                p = overlap / len(c_toks)
                rec = overlap / len(r_toks)
                f1 = (2 * p * rec / (p + rec)) if (p + rec) > 0 else 0.0
                if f1 >= min_overlap or p >= min_overlap or rec >= min_overlap:
                    return True
                if str(r).lower().strip() in str(chunk).lower().strip() or str(chunk).lower().strip() in str(r).lower().strip():
                    return True
            return False
        ret = _parse(kwargs.get('hypothesis', kwargs.get('output', output)))
        ref = _parse(kwargs.get('reference', kwargs.get('expected', expected)))
        if not ref:
            return {'score': 1.0 if not ret else 0.0, 'reason': 'No reference contexts'}
        if not ret:
            return {'score': 0.0, 'reason': 'No retrieved contexts'}
        k = kwargs.get('k', None)
        if k is not None:
            try:
                k = max(1, int(k))
                ret = ret[:k]
            except Exception:
                pass
        hits = 0
        cum_prec = 0.0
        for i, chunk in enumerate(ret, 1):
            if _is_rel(chunk, ref):
                hits += 1
                cum_prec += (hits / i)
        score = (cum_prec / hits) if hits > 0 else 0.0
        return {'score': float(score), 'reason': f'Context Precision: {score:.4f} ({hits}/{len(ret)} relevant)'}
