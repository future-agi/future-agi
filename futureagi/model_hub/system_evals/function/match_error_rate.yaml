eval_id: 189
name: match_error_rate
description: "Computes Match Error Rate (MER) for speech recognition. MER = edits / (hits + edits). Returns 1-MER as score."
eval_tags:
- NLP Metrics
- Audio
visible_ui: true
permissions: {allow_edit: false, allow_copy: true}
output_type_normalized: percentage
pass_threshold: 0.5
config:
  required_keys: [reference, hypothesis]
  output: score
  eval_type_id: CustomCodeEval
  config: {}
  function_params_schema:
    normalize:
      type: boolean
      default: false
    tokenize:
      type: string
      default: null
      nullable: true
      enum: [auto, word, char]
  config_params_desc:
    reference: Ground truth transcription
    hypothesis: ASR output
    normalize: Casefold, fold full-width ASCII, remove ASCII/CJK punctuation and collapse whitespace (default false).
    tokenize: 'auto: CJK characters plus other whitespace words; word: whitespace words; char: non-whitespace characters. Leave unset to preserve legacy tokenization (including spaces for CER).'
  code: |
    def evaluate(input, output, expected, context, **kwargs):
        def transcription_tokens(value, normalize=False, tokenize=None, character=False):
            """Opt-in ASR normalization; an omitted tokenizer preserves legacy spacing."""
            import re

            if tokenize not in (None, "auto", "word", "char"):
                raise ValueError("tokenize must be auto, word, char, or None")
            text = str(value)
            if normalize:
                # Width folding, not NFKC: do not change other scripts or accents.
                text = "".join(
                    chr(ord(char) - 0xFEE0) if "！" <= char <= "～"
                    else " " if char == "　" else char
                    for char in text
                ).casefold()
                text = re.sub(
                    r"[!-/:-@\[-`{-~‐-‧、-〃〈-】"
                    r"〔-〟〰〽・｟-･]", "", text
                )
                text = " ".join(text.split())
            else:
                text = text.strip().lower()
            if tokenize is None:
                return list(text) if character else text.split()
            if tokenize == "word":
                return text.split()
            if tokenize == "char":
                return list("".join(text.split()))
            # Han (including extensions), kana and Hangul are individual units;
            # Latin and other non-CJK scripts remain whitespace-delimited words.
            cjk = (
                r"㐀-䶿一-鿿豈-﫿\U00020000-\U000323af"
                r"぀-ヿㇰ-ㇿｦ-ﾟ\U0001b000-\U0001b16f"
                r"ᄀ-ᇿ㄰-㆏ꥠ-꥿가-퟿"
            )
            return re.findall(f"[{cjk}]|[^{cjk}\\s]+", text)

        def align_counts(ref, hyp):
            n, m = len(ref), len(hyp)
            dp = [[0] * (m + 1) for _ in range(n + 1)]
            for i in range(n + 1): dp[i][0] = i
            for j in range(m + 1): dp[0][j] = j
            for i in range(1, n + 1):
                for j in range(1, m + 1):
                    cost = 0 if ref[i - 1] == hyp[j - 1] else 1
                    dp[i][j] = min(dp[i - 1][j - 1] + cost, dp[i - 1][j] + 1, dp[i][j - 1] + 1)
            hits = sub = dele = ins = 0
            i, j = n, m
            while i > 0 or j > 0:
                if i > 0 and j > 0 and ref[i - 1] == hyp[j - 1] and dp[i][j] == dp[i - 1][j - 1]:
                    hits += 1; i -= 1; j -= 1
                elif i > 0 and j > 0 and dp[i][j] == dp[i - 1][j - 1] + 1:
                    sub += 1; i -= 1; j -= 1
                elif i > 0 and dp[i][j] == dp[i - 1][j] + 1:
                    dele += 1; i -= 1
                else:
                    ins += 1; j -= 1
            return hits, sub, dele, ins

        ref = transcription_tokens(kwargs.get("reference", expected or ""), kwargs.get("normalize", False), kwargs.get("tokenize"))
        hyp = transcription_tokens(kwargs.get("hypothesis", output or ""), kwargs.get("normalize", False), kwargs.get("tokenize"))
        if not ref and not hyp:
            return {"score": 1.0, "reason": "MER: 0% (both empty)"}
        if not ref:
            return {"score": 0.0, "reason": "Empty reference"}
        hits, S, D, I = align_counts(ref, hyp)
        ops = S + D + I
        mer = ops / (hits + ops) if (hits + ops) > 0 else 1.0
        return {"score": float(max(0.0, 1 - mer)), "reason": f"MER: {mer * 100:.1f}% (H={hits}, S={S}, D={D}, I={I})"}
