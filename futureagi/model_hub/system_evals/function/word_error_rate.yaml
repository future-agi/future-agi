eval_id: 163
name: word_error_rate
description: Computes Word Error Rate (WER) for ASR/STT evaluation. WER measures the edit distance at the word level between
  reference and hypothesis transcriptions. Returns 1-WER as score (higher=better).
criteria: Measures speech recognition accuracy by counting word-level insertions, deletions, and substitutions.
eval_tags:
- NLP Metrics
- Audio
visible_ui: true
permissions:
  allow_edit: false
  allow_copy: true
output_type_normalized: percentage
pass_threshold: 0.5
config:
  required_keys:
  - reference
  - hypothesis
  output: score
  eval_type_id: CustomCodeEval
  config: {}
  function_params_schema:
    normalize:
      type: boolean
      default: false
    tokenize:
      type: string
      default: null
      nullable: true
      enum: [auto, word, char]
  config_params_desc:
    reference: Ground truth transcription
    hypothesis: ASR/STT output transcription
    normalize: Casefold, fold full-width ASCII, remove ASCII/CJK punctuation and collapse whitespace (default false).
    tokenize: 'auto: CJK characters plus other whitespace words; word: whitespace words; char: non-whitespace characters. Leave unset to preserve legacy tokenization (including spaces for CER).'
  code: |
    def evaluate(input, output, expected, context, **kwargs):
        def transcription_tokens(value, normalize=False, tokenize=None, character=False):
            """Opt-in ASR normalization; an omitted tokenizer preserves legacy spacing."""
            import re

            if tokenize not in (None, "auto", "word", "char"):
                raise ValueError("tokenize must be auto, word, char, or None")
            text = str(value)
            if normalize:
                # Width folding, not NFKC: do not change other scripts or accents.
                text = "".join(
                    chr(ord(char) - 0xFEE0) if "！" <= char <= "～"
                    else " " if char == "　" else char
                    for char in text
                ).casefold()
                text = re.sub(
                    r"[!-/:-@\[-`{-~‐-‧、-〃〈-】"
                    r"〔-〟〰〽・｟-･]", "", text
                )
                text = " ".join(text.split())
            else:
                text = text.strip().lower()
            if tokenize is None:
                return list(text) if character else text.split()
            if tokenize == "word":
                return text.split()
            if tokenize == "char":
                return list("".join(text.split()))
            # Han (including extensions), kana and Hangul are individual units;
            # Latin and other non-CJK scripts remain whitespace-delimited words.
            cjk = (
                r"㐀-䶿一-鿿豈-﫿\U00020000-\U000323af"
                r"぀-ヿㇰ-ㇿｦ-ﾟ\U0001b000-\U0001b16f"
                r"ᄀ-ᇿ㄰-㆏ꥠ-꥿가-퟿"
            )
            return re.findall(f"[{cjk}]|[^{cjk}\\s]+", text)

        reference = kwargs.get("reference", expected or "")
        hypothesis = kwargs.get("hypothesis", output or "")
        ref_words = transcription_tokens(reference, kwargs.get("normalize", False), kwargs.get("tokenize"))
        hyp_words = transcription_tokens(hypothesis, kwargs.get("normalize", False), kwargs.get("tokenize"))
        if not ref_words and not hyp_words:
            return {"score": 1.0, "reason": "WER: 0.0% (both empty)"}
        if not ref_words:
            return {"score": 0.0, "reason": f"WER: 100%+ ({len(hyp_words)} insertions)"}
        n, m = len(ref_words), len(hyp_words)
        dp = list(range(m + 1))
        for i in range(1, n + 1):
            prev = dp[:]
            dp[0] = i
            for j in range(1, m + 1):
                cost = 0 if ref_words[i-1] == hyp_words[j-1] else 1
                dp[j] = min(dp[j-1]+1, prev[j]+1, prev[j-1]+cost)
        distance = dp[m]
        wer = distance / len(ref_words)
        score = max(0.0, 1.0 - wer)
        return {"score": float(score), "reason": f"WER: {wer*100:.1f}% ({distance} edits / {len(ref_words)} words)"}
