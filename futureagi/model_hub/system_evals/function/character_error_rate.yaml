eval_id: 164
name: character_error_rate
description: Computes Character Error Rate (CER) for ASR/OCR evaluation. CER measures character-level edit distance between
  reference and hypothesis. Returns 1-CER as score (higher=better).
criteria: Measures transcription/OCR accuracy at the character level.
eval_tags:
- NLP Metrics
- Audio
visible_ui: true
permissions:
  allow_edit: false
  allow_copy: true
output_type_normalized: percentage
pass_threshold: 0.5
config:
  required_keys:
  - reference
  - hypothesis
  output: score
  eval_type_id: CustomCodeEval
  config: {}
  function_params_schema:
    normalize:
      type: boolean
      default: false
    tokenize:
      type: string
      default: null
      nullable: true
      enum: [auto, word, char]
  config_params_desc:
    reference: Ground truth text
    hypothesis: OCR/ASR output text
    normalize: Casefold, fold full-width ASCII, remove ASCII/CJK punctuation and collapse whitespace (default false).
    tokenize: 'auto: CJK characters plus other whitespace words; word: whitespace words; char: non-whitespace characters. Leave unset to preserve legacy tokenization (including spaces for CER).'
  code: |
    def evaluate(input, output, expected, context, **kwargs):
        def transcription_tokens(value, normalize=False, tokenize=None, character=False):
            """Opt-in ASR normalization; an omitted tokenizer preserves legacy spacing."""
            import re

            if tokenize not in (None, "auto", "word", "char"):
                raise ValueError("tokenize must be auto, word, char, or None")
            text = str(value)
            if normalize:
                # Width folding, not NFKC: do not change other scripts or accents.
                text = "".join(
                    chr(ord(char) - 0xFEE0) if "！" <= char <= "～"
                    else " " if char == "　" else char
                    for char in text
                ).casefold()
                text = re.sub(
                    r"[!-/:-@\[-`{-~‐-‧、-〃〈-】"
                    r"〔-〟〰〽・｟-･]", "", text
                )
                text = " ".join(text.split())
            else:
                text = text.strip().lower()
            if tokenize is None:
                return list(text) if character else text.split()
            if tokenize == "word":
                return text.split()
            if tokenize == "char":
                return list("".join(text.split()))
            # Han (including extensions), kana and Hangul are individual units;
            # Latin and other non-CJK scripts remain whitespace-delimited words.
            cjk = (
                r"㐀-䶿一-鿿豈-﫿\U00020000-\U000323af"
                r"぀-ヿㇰ-ㇿｦ-ﾟ\U0001b000-\U0001b16f"
                r"ᄀ-ᇿ㄰-㆏ꥠ-꥿가-퟿"
            )
            return re.findall(f"[{cjk}]|[^{cjk}\\s]+", text)

        reference = transcription_tokens(kwargs.get("reference", expected or ""), kwargs.get("normalize", False), kwargs.get("tokenize"), character=True)
        hypothesis = transcription_tokens(kwargs.get("hypothesis", output or ""), kwargs.get("normalize", False), kwargs.get("tokenize"), character=True)
        if not reference and not hypothesis:
            return {"score": 1.0, "reason": "CER: 0.0% (both empty)"}
        if not reference:
            return {"score": 0.0, "reason": f"CER: 100%+ ({len(hypothesis)} insertions)"}
        n, m = len(reference), len(hypothesis)
        dp = list(range(m + 1))
        for i in range(1, n + 1):
            prev = dp[:]
            dp[0] = i
            for j in range(1, m + 1):
                cost = 0 if reference[i-1] == hypothesis[j-1] else 1
                dp[j] = min(dp[j-1]+1, prev[j]+1, prev[j-1]+cost)
        distance = dp[m]
        cer = distance / len(reference)
        score = max(0.0, 1.0 - cer)
        return {"score": float(score), "reason": f"CER: {cer*100:.1f}% ({distance} edits / {len(reference)} chars)"}
