eval_id: 190
name: word_info_lost
description: "Computes Word Information Lost (WIL) for speech. WIL = 1 - (hits/ref * hits/hyp). Returns 1-WIL as score."
eval_tags:
- NLP Metrics
- Audio
visible_ui: true
permissions: {allow_edit: false, allow_copy: true}
output_type_normalized: percentage
pass_threshold: 0.5
config:
  required_keys: [reference, hypothesis]
  output: score
  eval_type_id: CustomCodeEval
  config: {}
  config_params_desc: {reference: Ground truth, hypothesis: ASR output}
  code: |
    def evaluate(input, output, expected, context, **kwargs):
        import Levenshtein

        def align_counts(ref, hyp):
            hits = substitutions = deletions = insertions = 0
            for opcode in Levenshtein.opcodes(ref, hyp):
                operation = opcode[0]
                ref_start = opcode[1]
                ref_end = opcode[2]
                hyp_start = opcode[3]
                hyp_end = opcode[4]
                ref_count = ref_end - ref_start
                hyp_count = hyp_end - hyp_start
                if operation == "equal":
                    hits += ref_count
                elif operation == "replace":
                    substitutions += min(ref_count, hyp_count)
                    deletions += max(ref_count - hyp_count, 0)
                    insertions += max(hyp_count - ref_count, 0)
                elif operation == "delete":
                    deletions += ref_count
                elif operation == "insert":
                    insertions += hyp_count
            return hits, substitutions, deletions, insertions

        reference_value = kwargs.get("reference", expected)
        hypothesis_value = kwargs.get("hypothesis", output)
        ref = str(reference_value if reference_value is not None else "").strip().lower().split()
        hyp = str(hypothesis_value if hypothesis_value is not None else "").strip().lower().split()
        if not ref and not hyp:
            return {"score": 1.0, "reason": "WIL: 0 (both empty)"}
        if not ref or not hyp:
            return {"score": 0.0, "reason": "WIL: 1 (one empty)"}
        n = len(ref)
        m = len(hyp)
        hits = align_counts(ref, hyp)[0]
        wil = 1 - (hits / n) * (hits / m)
        return {"score": float(max(0.0, 1 - wil)), "reason": f"WIL: {wil:.4f} (H={hits}, |ref|={n}, |hyp|={m})"}
