eval_id: 190
name: word_info_lost
description: "Computes Word Information Lost (WIL) for speech. WIL = 1 - (hits/ref * hits/hyp). Returns 1-WIL as score."
eval_tags:
- NLP Metrics
- Audio
visible_ui: true
permissions: {allow_edit: false, allow_copy: true}
output_type_normalized: percentage
pass_threshold: 0.5
config:
  required_keys: [reference, hypothesis]
  output: score
  eval_type_id: CustomCodeEval
  config: {}
  function_params_schema:
    normalize:
      type: boolean
      default: false
    tokenize:
      type: string
      default: null
      nullable: true
      enum: [auto, word, char]
  config_params_desc:
    reference: Ground truth
    hypothesis: ASR output
    normalize: Casefold, fold full-width ASCII, remove ASCII/CJK punctuation and collapse whitespace (default false).
    tokenize: 'auto: CJK characters plus other whitespace words; word: whitespace words; char: non-whitespace characters. Leave unset to preserve legacy tokenization (including spaces for CER).'
  code: |
    def evaluate(input, output, expected, context, **kwargs):
        def transcription_tokens(value, normalize=False, tokenize=None, character=False):
            """Opt-in ASR normalization; an omitted tokenizer preserves legacy spacing."""
            import re

            if tokenize not in (None, "auto", "word", "char"):
                raise ValueError("tokenize must be auto, word, char, or None")
            text = str(value)
            if normalize:
                # Width folding, not NFKC: do not change other scripts or accents.
                text = "".join(
                    chr(ord(char) - 0xFEE0) if "！" <= char <= "～"
                    else " " if char == "　" else char
                    for char in text
                ).casefold()
                text = re.sub(
                    r"[!-/:-@\[-`{-~‐-‧、-〃〈-】"
                    r"〔-〟〰〽・｟-･]", "", text
                )
                text = " ".join(text.split())
            else:
                text = text.strip().lower()
            if tokenize is None:
                return list(text) if character else text.split()
            if tokenize == "word":
                return text.split()
            if tokenize == "char":
                return list("".join(text.split()))
            # Han (including extensions), kana and Hangul are individual units;
            # Latin and other non-CJK scripts remain whitespace-delimited words.
            cjk = (
                r"㐀-䶿一-鿿豈-﫿\U00020000-\U000323af"
                r"぀-ヿㇰ-ㇿｦ-ﾟ\U0001b000-\U0001b16f"
                r"ᄀ-ᇿ㄰-㆏ꥠ-꥿가-퟿"
            )
            return re.findall(f"[{cjk}]|[^{cjk}\\s]+", text)

        import Levenshtein

        def align_counts(ref, hyp):
            hits = substitutions = deletions = insertions = 0
            for opcode in Levenshtein.opcodes(ref, hyp):
                operation = opcode[0]
                ref_start = opcode[1]
                ref_end = opcode[2]
                hyp_start = opcode[3]
                hyp_end = opcode[4]
                ref_count = ref_end - ref_start
                hyp_count = hyp_end - hyp_start
                if operation == "equal":
                    hits += ref_count
                elif operation == "replace":
                    substitutions += min(ref_count, hyp_count)
                    deletions += max(ref_count - hyp_count, 0)
                    insertions += max(hyp_count - ref_count, 0)
                elif operation == "delete":
                    deletions += ref_count
                elif operation == "insert":
                    insertions += hyp_count
            return hits, substitutions, deletions, insertions

        reference_value = kwargs.get("reference", expected)
        hypothesis_value = kwargs.get("hypothesis", output)
        ref = transcription_tokens(reference_value if reference_value is not None else "", kwargs.get("normalize", False), kwargs.get("tokenize"))
        hyp = transcription_tokens(hypothesis_value if hypothesis_value is not None else "", kwargs.get("normalize", False), kwargs.get("tokenize"))
        if not ref and not hyp:
            return {"score": 1.0, "reason": "WIL: 0 (both empty)"}
        if not ref or not hyp:
            return {"score": 0.0, "reason": "WIL: 1 (one empty)"}
        n = len(ref)
        m = len(hyp)
        hits = align_counts(ref, hyp)[0]
        wil = 1 - (hits / n) * (hits / m)
        return {"score": float(max(0.0, 1 - wil)), "reason": f"WIL: {wil:.4f} (H={hits}, |ref|={n}, |hyp|={m})"}
