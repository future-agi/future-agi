# Production agent certification suite — v1.
#
# This manifest freezes the audited production-agent set from
# rl-environment/test-agent-matrix.md. Every entry ships `enabled: false`
# with explicit `pending` reasons: the matrix records commit SHAs for only
# the two google/adk-samples agents, and no authorization records for
# automated production calls exist yet. Campaign admission
# (require_admission_ready) rejects this suite until entries are
# materialized — pinned source commit, committed scenario config
# (config_ref + config_sha256), declared secret_ref_set, and an
# authorization block with automated_production_calls: approved.
#
# Note: the plan names this a 25-agent campaign; the matrix lists 26 rows.
# All 26 are recorded here so the count discrepancy is explicit rather than
# silently dropped — confirm the intended 25th entry when materializing.

version: 1
suite_key: production_agents_v1
defaults:
  interaction_count: 2
  max_duration_seconds: 1800
  artifacts:
    level: full
  trace_reference: https://traces.internal/certification/production_agents_v1

cases:
  - case_key: ride_booking__primary
    enabled: false
    pending: [source_commit_unverified, authorization_unverified]
    agent:
      name: Ride Booking
      source: { repository: https://github.com/future-agi/ride-voice-agent }
    target: { kind: hosted_service }
    interactions:
      - { interaction: 1 }
      - { interaction: 2 }

