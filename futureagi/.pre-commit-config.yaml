  # - repo: https://github.com/Riverside-Healthcare/djlint
  #   rev: v1.36.4
  #   hooks:
  #     - id: djlint-reformat-django
  #       files: '\.(html)$'
  #       types_or: [html]
  #     - id: djlint-django
  #       files: '\.(html)$'
  #       types_or: [html]

  # No mypy hook: a whole-repo run takes minutes, too slow for every commit.
  # CI's "Python types (advisory)" workflow checks it against
  # mypy-baseline.txt; `make mypy` shows the same result before pushing.

# Configuration for specific tools
default_language_version:
  python: python3

# Files to exclude globally
exclude: |
  (?x)^(
      .*migrations/.*|
      .*\.min\.js|
      .*\.min\.css|
      node_modules/.*|
      static/.*|
      media/.*|
      htmlcov/.*|
      .pytest_cache/.*|
      __pycache__/.*
  )$

# Fail fast - stop on first failure
fail_fast: false
