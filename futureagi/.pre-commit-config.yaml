repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements

  # Python linting, import sorting and formatting with ruff, configured in
  # pyproject.toml. rev is the ruff that CI pins (RUFF_VERSION in
  # .github/workflows/python-lint.yml); scripts/test_check_python_lint_delta.py
  # checks they match. Like CI and the lint-staged hook, both hooks cover only
  # Python files under futureagi/: the upstream ruff-format hook also takes
  # Markdown, and the repo's other Python has no ruff config.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^futureagi/
        types_or: [python, pyi]
      - id: ruff-format
        files: ^futureagi/
        types_or: [python, pyi]

