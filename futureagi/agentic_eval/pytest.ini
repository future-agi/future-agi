[pytest]
# Pytest configuration for agentic_eval

# Test discovery. There is no single top-level tests/ dir: tests live
# co-located next to the code they cover (core/tests/, core/utils/tests/,
# core_evals/fi_evals/function/tests/, ...), matching the rest of the repo's
# convention. "testpaths = tests" pointed at a directory that never existed.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Enforce the marker registrations below. `--strict-markers` in addopts does
# NOT do this on the pinned pytest (9.0.2): the flag became an override of the
# `strict_markers` ini key, and the override only lands when the flag arrives
# on real argv, not from addopts. Verified on this tree — an unregistered
# marker collects clean under the addopts flag and errors under either
# `-o strict_markers=true` or `--strict-markers` passed directly. The addopts
# entry is left in place so the intent still reads on older pytest.
strict_markers = true

# Output options
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --durations=10
    --color=yes
    --maxfail=5
    --ignore=agenthub.egg-info
    --ignore=.pytest_cache
    --ignore=htmlcov
    --ignore=test-reports
    -m "not live_llm and not live_image and not e2e and not vapi and not phone and not benchmark and not stress"

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    serial: Tests that must run serially (not in parallel)
    network: Tests requiring network access
    serving: Model serving related tests
    embedding: Embedding functionality tests
    agents: Agent-related tests
    evaluations: Evaluation tests
    performance: Performance tests
    clickhouse: Tests requiring ClickHouse
    live_llm: Tests requiring live LLM API calls
    live_image: Tests that call live image generation APIs
    external: Tests requiring external services
    requires_ee: test needs the enterprise `ee/` package; skipped in the OSS lane

# Minimum Python version
minversion = 3.8

# Environment variables for tests
# env =
#     TESTING=true
#     PYTHONDONTWRITEBYTECODE=1

# Disable warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    ignore::RuntimeWarning

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */test_*
    setup.py
    */venv/*
    */__pycache__/*
    agenthub.egg-info/*
    core/results/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.
    class .*\(Protocol\):
    @(abc\.)?abstractmethod

show_missing = True
precision = 2 