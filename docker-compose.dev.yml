x-dev-worker: &dev-worker
  image: futureagi/future-agi:dev
  working_dir: /app/backend
  pull_policy: never
  volumes:
    - ./futureagi:/app/backend
    # .env names the key by a path relative to the working directory, which lands inside the
    # mounted source tree where no key lives. Supplied here instead, from the one copy at the
    # repository root, and named absolutely below.
    - ${VERTEX_CREDENTIALS:-./Vertex_AI_Creds.json}:/etc/vertex/creds.json:ro
  environment:
    FAST_STARTUP: "true"
    HARNESS_INTERNAL_URL: http://harness:8777
    GOOGLE_APPLICATION_CREDENTIALS: /etc/vertex/creds.json

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    image: futureagi/frontend:dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: !override
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_USE_POLLING: "true"
      VITE_HOST_API: ${VITE_HOST_API:-http://localhost:8000}
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-development}
      VITE_GOOGLE_SITE_KEY: ${VITE_GOOGLE_SITE_KEY:-}
      VITE_HELP_LINK: ${VITE_HELP_LINK:-}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: futureagi/future-agi:dev
    ports:
      - "${BACKEND_GRPC_PORT:-50051}:50051"
      - "${FLOWER_PORT:-5555}:5555"
    volumes:
      - ./futureagi:/app/backend
      - harness-artifacts:/app/harness-artifacts
      # Same reason as the worker anchor above: the one key lives at the repository root.
      - ${VERTEX_CREDENTIALS:-./Vertex_AI_Creds.json}:/etc/vertex/creds.json:ro
    environment:
      FAST_STARTUP: "true"
      HARNESS_INTERNAL_URL: http://harness:8777
      GOOGLE_APPLICATION_CREDENTIALS: /etc/vertex/creds.json
      HARNESS_LINKS_DIR: /app/harness-artifacts/platform-links

  # agentcc-gateway, serving, and code-executor are separate services we
  # don't modify in local dev, so they are NOT built from source here —
  # they inherit the pulled images from docker-compose.yml
  # (futureagi/<svc>:${VERSION:-latest}). Only backend and frontend build
  # from source. This also avoids pulling serving's private ECR base image.

  worker:
    <<: *dev-worker
    deploy:
      replicas: 0

  worker-default:
    <<: *dev-worker
    profiles: !reset []
  worker-tasks-s:
    <<: *dev-worker
    profiles: !reset []
  worker-tasks-l:
    <<: *dev-worker
    profiles: !reset []
  worker-tasks-xl:
    <<: *dev-worker
    profiles: !reset []
  worker-trace-ingestion:
    <<: *dev-worker
    profiles: !reset []
  worker-agent-compass:
    <<: *dev-worker
    profiles: !reset []

  # SDK-bearing image (can't reuse *dev-worker); built from the local wheel via
  # Dockerfile.simulation-runner.dev FROM futureagi/future-agi:dev (backend first).
  worker-simulation-runner:
    build:
      context: .
      dockerfile: Dockerfile.simulation-runner.dev
      args:
        BACKEND_IMAGE: futureagi/future-agi:dev
    image: futureagi/future-agi-simulation-runner:dev
    pull_policy: never
    working_dir: /app/backend
    volumes:
      - ./futureagi:/app/backend
    environment:
      FAST_STARTUP: "true"
      PYTHONUNBUFFERED: "1"
    profiles: !reset []

  postgres:
    ports: !override
      - "${PG_PORT:-5432}:5432"

  clickhouse:
    ports: !override
      - "${CH_HTTP_PORT:-8123}:8123"
      - "${CH_PORT:-9000}:9000"

  redis:
    ports: !override
      - "${REDIS_PORT:-6379}:6379"

  minio:
    ports: !override
      - "${MINIO_API_PORT:-9005}:9000"
      - "${MINIO_CONSOLE_PORT:-9006}:9001"

  temporal:
    ports: !override
      - "${TEMPORAL_PORT:-7233}:7233"

  rabbitmq:
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  temporal-ui:
    profiles: !reset []

  temporal-admin-tools:
    profiles: !reset []

  peerdb-catalog:
    profiles: !reset []
  peerdb-temporal:
    profiles: !reset []
  peerdb-minio:
    profiles: !reset []
  peerdb-flow-api:
    profiles: !reset []
  peerdb-flow-worker:
    profiles: !reset []
  peerdb-flow-snapshot-worker:
    profiles: !reset []
  peerdb-server:
    profiles: !reset []
  peerdb-ui:
    profiles: !reset []
  peerdb-temporal-init:
    profiles: !reset []
  peerdb-init:
    profiles: !reset []

  pgbouncer:
    image: edoburu/pgbouncer:1.18.0
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./futureagi/config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./futureagi/config/userlist.txt:/etc/pgbouncer/userlist.txt
    restart: unless-stopped

  docker-proxy:
    image: alpine/socat
    command: -t 900 TCP-LISTEN:2375,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock
    user: root
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped

  # Agent-testing harness. Internal-only: the backend proxies to it at
  # /simulate/harness/, so neither port is published to the host. Never
  # restart it mid-suite — a run in flight is lost.
  harness:
    build: ./futureagi/harness
    env_file:
      - path: .env
        required: false
      # The WebRTC target and the harness must use the same LiveKit project. Keep
      # platform/model settings from this repo, but take LiveKit credentials from
      # the local agent that is actually registered for these calls.
      - path: ../uber-voice-agent/.env.local
        required: false
    environment:
      HARNESS_HOST: 0.0.0.0
      HARNESS_PORT: 8777
      HARNESS_WEBHOOK_HOST: 0.0.0.0
      HARNESS_WEBHOOK_PORT: 8787
      # Reachable by name inside the network, so no cloudflared tunnel starts.
      HARNESS_WEBHOOK_URL: http://harness:8787
      DOCKER_HOST: tcp://docker-proxy:2375
      # Store containers the harness starts join this network and are
      # addressed by container name instead of loopback.
      ALK_DOCKER_NETWORK: ${HARNESS_DOCKER_NETWORK:-futureagi_default}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Evals are scored against the hosted platform, where the templates live; runs are
      # reported to the backend beside us, so they appear in the UI being looked at.
      HARNESS_PLATFORM_URL: ${HARNESS_PLATFORM_URL:-http://backend:80}
      HARNESS_PLATFORM_API_KEY: ${HARNESS_PLATFORM_API_KEY:-}
      HARNESS_PLATFORM_SECRET_KEY: ${HARNESS_PLATFORM_SECRET_KEY:-}
      # Voice. 1.1.2 reaches a LiveKit worker over WebRTC; the caller and the agent must be
      # on the same LiveKit instance, so this is the agent's project, not the EU one.
      HARNESS_VOICE_CASE: ${HARNESS_VOICE_CASE:-1.1.2}
      # Empty means voice_cases falls back to LIVEKIT_URL from the agent env file.
      ACCEPTANCE_LIVEKIT_URL: ""
      # Match the dedicated local worker; the generic name may also be registered by
      # old or remote deployments and makes scenario identity nondeterministic.
      LIVEKIT_TARGET_AGENT_NAME: uber-voice-booking-harness-local
      LIVEKIT_TARGET_SYSTEM_PROMPT: ${LIVEKIT_TARGET_SYSTEM_PROMPT:-}
      # Flash Lite tended to repeat the caller's opening line instead of using
      # scenario details (address, OTP, payment) after the target asked for them.
      SIMULATOR_LLM_MODEL: gemini-2.5-flash
      # A normal booking needs enough room for address confirmation, fares,
      # payment verification and final read-back without a hard two-minute cut.
      VOICE_MAX_SECONDS: ${VOICE_MAX_SECONDS:-240}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      # .env names the credentials by a path relative to the host checkout, which resolves to
      # nothing in here. Mounted below at a fixed location and repointed, or every stage fails
      # at its first model call.
      GOOGLE_APPLICATION_CREDENTIALS: /etc/harness/vertex.json
    volumes:
      # Source of truth for every session, world and recording — not a cache.
      - harness-artifacts:/app/artifacts
      # Source edits apply on restart without a rebuild.
      - ./futureagi/harness:/app
      - ${HARNESS_VERTEX_CREDENTIALS:-./Vertex_AI_Creds.json}:/etc/harness/vertex.json:ro
    depends_on:
      - docker-proxy
    restart: unless-stopped

volumes:
  harness-artifacts:
