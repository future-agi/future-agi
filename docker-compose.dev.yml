# ============================================================================
# Hot-reload development on the Standalone stack: the everyday loop.
#
#   ./bin/dev
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Reloads on save:
#   futureagi/**   the API and the Temporal worker embedded in it restart
#                  (granian --reload)
#   frontend/**    Vite hot module replacement on http://localhost:3000
# Needs `./bin/dev rebuild`: Python or Node dependency changes, fi-collector
# and agentcc-gateway (Go) code, deploy/platform/**.
#
# Docker Desktop and Colima bind mounts deliver no inotify events for edits
# made on the host, so both reloaders poll.
#
# For changes that need the Distributed topology (PeerDB, per-queue workers,
# Kafka catalog) use ./bin/dev --distributed (docker-compose.distributed.dev.yml).
# ============================================================================
services:
  app:
    # Built from this checkout by ./bin/dev (./bin/install --from-source).
    image: futureagi/platform:local
    pull_policy: never
    # Port 3000 belongs to the Vite dev server below; the built UI inside the
    # app container stays up for the healthcheck only.
    ports: !override
      - "${BACKEND_PORT:-8000}:8000"
      - "127.0.0.1:${FI_COLLECTOR_OTLP_PORT:-4317}:4317"
      - "127.0.0.1:${FI_COLLECTOR_OTLP_HTTP_PORT:-4318}:4318"
      - "${AGENTCC_GATEWAY_PORT:-8090}:8080"
      - "127.0.0.1:${MINIO_API_PORT:-9005}:9005"
    volumes:
      - ./futureagi:/app/backend
      # Hide a host virtualenv: the image's interpreter and packages are used,
      # and the polling reloader does not have to scan it.
      - /app/backend/.venv
    environment:
      DEBUG: "true"
      # bin/start turns this into granian --reload with one --reload-paths
      # per top-level code directory (granian reads a single value per
      # option from the environment, and a polling watcher must not walk
      # dependency caches such as .venv or .uv-cache in the checkout).
      FI_DEV_RELOAD: "true"
      WATCHFILES_FORCE_POLLING: "true"
      # A reload restarts the embedded Temporal worker; don't wait 30 s for
      # in-flight activities to drain.
      TEMPORAL_GRACEFUL_SHUTDOWN_TIMEOUT: "3"

  frontend:
    build:
      context: ./frontend
      target: dev
    image: futureagi/frontend:dev
    pull_policy: never
    volumes:
      - ./frontend:/app
      # Seeded from the image on first start; ./bin/dev rebuild frontend
      # drops it after a dependency change.
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_USE_POLLING: "true"
      VITE_HOST_API: ${VITE_HOST_API:-http://localhost:${BACKEND_PORT:-8000}}
      VITE_ENVIRONMENT: development
      VITE_HELP_LINK: ${VITE_HELP_LINK:-}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  frontend-node-modules:
