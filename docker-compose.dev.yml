x-dev-worker: &dev-worker
  image: futureagi/future-agi:dev
  working_dir: /app/backend
  pull_policy: never
  volumes:
    - ./futureagi:/app/backend
  environment:
    FAST_STARTUP: "true"
    NO_STARTUP_DB_MUTATIONS: "true"
    CH25_DROP_LEGACY_CDC_CHAIN: "false"
    CH25_TRACE_DUAL_WRITE: "false"
    CH_DUAL_WRITE: "false"

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    image: futureagi/frontend:dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: !override
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_USE_POLLING: "true"
      VITE_HOST_API: ${VITE_HOST_API:-http://localhost:8000}
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-development}
      VITE_GOOGLE_SITE_KEY: ${VITE_GOOGLE_SITE_KEY:-}
      VITE_HELP_LINK: ${VITE_HELP_LINK:-}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: futureagi/future-agi:dev
    # The DEV API proxy owns the public HTTP port so OTLP/HTTP can be routed
    # directly to fi-collector without exposing the collector itself.
    ports: !override
      - "${BACKEND_GRPC_PORT:-50051}:50051"
      - "${FLOWER_PORT:-5555}:5555"
    volumes:
      - ./futureagi:/app/backend
    environment:
      FAST_STARTUP: "true"
      NO_STARTUP_DB_MUTATIONS: "true"
      CH25_DROP_LEGACY_CDC_CHAIN: "false"
      CH25_TRACE_DUAL_WRITE: "false"
      CH_DUAL_WRITE: "false"

  # The supervisor runs Django management commands from this checkout. Keep it
  # on the same locally-built image and bind mount as backend; inheriting the
  # root compose's release image can leave new commands unavailable on dev.
  property-catalog-supervisor:
    image: futureagi/future-agi:dev
    pull_policy: never
    volumes:
      - ./futureagi:/app/backend

  dev-api-proxy:
    image: nginx:1.27-alpine
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Restrict envsubst to these settings so native nginx variables such as
      # $host and $remote_addr remain intact in the rendered configuration.
      NGINX_ENVSUBST_FILTER: "^DEV_API_PROXY_"
      DEV_API_PROXY_OTLP_MAX_BODY_SIZE: "${DEV_API_PROXY_OTLP_MAX_BODY_SIZE:-16m}"
      DEV_API_PROXY_CONNECT_TIMEOUT: "${DEV_API_PROXY_CONNECT_TIMEOUT:-5s}"
      DEV_API_PROXY_READ_TIMEOUT: "${DEV_API_PROXY_READ_TIMEOUT:-30s}"
      DEV_API_PROXY_SEND_TIMEOUT: "${DEV_API_PROXY_SEND_TIMEOUT:-30s}"
    volumes:
      - ./deploy/dev-api-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_started
      fi-collector:
        condition: service_started
    restart: unless-stopped

  # agentcc-gateway, serving, and code-executor are separate services we
  # don't modify in local dev, so they are NOT built from source here —
  # they inherit the pulled images from docker-compose.yml
  # (futureagi/<svc>:${VERSION:-latest}). Only backend and frontend build
  # from source. This also avoids pulling serving's private ECR base image.

  worker:
    <<: *dev-worker
    deploy:
      replicas: 0

  worker-default:
    <<: *dev-worker
    profiles: !reset []
  worker-tasks-s:
    <<: *dev-worker
    profiles: !reset []
  worker-tasks-l:
    <<: *dev-worker
    profiles: !reset []
  worker-tasks-xl:
    <<: *dev-worker
    profiles: !reset []
  worker-exact-aggregation:
    <<: *dev-worker
    profiles: !reset []
  worker-trace-ingestion:
    <<: *dev-worker
    profiles: !reset []
  worker-agent-compass:
    <<: *dev-worker
    profiles: !reset []

  # SDK-bearing image (can't reuse *dev-worker); built from the local wheel via
  # Dockerfile.simulation-runner.dev FROM futureagi/future-agi:dev (backend first).
  worker-simulation-runner:
    build:
      context: .
      dockerfile: Dockerfile.simulation-runner.dev
      args:
        BACKEND_IMAGE: futureagi/future-agi:dev
    image: futureagi/future-agi-simulation-runner:dev
    pull_policy: never
    working_dir: /app/backend
    volumes:
      - ./futureagi:/app/backend
    environment:
      FAST_STARTUP: "true"
      PYTHONUNBUFFERED: "1"
    profiles: !reset []

  postgres:
    ports: !override
      - "${PG_PORT:-5432}:5432"

  clickhouse:
    ports: !override
      - "${CH_HTTP_PORT:-8123}:8123"
      - "${CH_PORT:-9000}:9000"

  redis:
    ports: !override
      - "${REDIS_PORT:-6379}:6379"

  minio:
    ports: !override
      - "${MINIO_API_PORT:-9005}:9000"
      - "${MINIO_CONSOLE_PORT:-9006}:9001"

  temporal:
    ports: !override
      - "${TEMPORAL_PORT:-7233}:7233"

  rabbitmq:
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  temporal-ui:
    profiles: !reset []

  temporal-admin-tools:
    profiles: !reset []

  peerdb-catalog:
    profiles: !reset []
  peerdb-temporal:
    profiles: !reset []
  peerdb-minio:
    profiles: !reset []
  peerdb-flow-api:
    profiles: !reset []
  peerdb-flow-worker:
    profiles: !reset []
  peerdb-flow-snapshot-worker:
    profiles: !reset []
  peerdb-server:
    profiles: !reset []
  peerdb-ui:
    profiles: !reset []
  peerdb-temporal-init:
    profiles: !reset []
  peerdb-init:
    profiles: !reset []

  pgbouncer:
    image: edoburu/pgbouncer:1.18.0
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./futureagi/config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./futureagi/config/userlist.txt:/etc/pgbouncer/userlist.txt
    restart: unless-stopped

  docker-proxy:
    image: alpine/socat
    command: -t 900 TCP-LISTEN:2375,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock
    user: root
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped
