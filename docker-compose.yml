# ============================================================================
# Future AGI — Standalone, the default self-hosted install. Three containers:
#
#   app         futureagi/platform (deploy/platform): API with the Temporal
#               worker in one process, Temporal dev server, fi-collector,
#               agentcc-gateway, UI, Redis, object storage and the code-evals
#               sandbox, under supervisord
#   postgres    postgres:16 with small-host settings
#   clickhouse  clickhouse-server 25.3 with small-host settings
#
# Optional services in this file:
#   --profile ml        `serving`: embedding-based evals and knowledge bases
#   --profile sandbox   privileged nsjail `code-executor` for code evals
#
#   ./bin/install        or        docker compose up -d
#
# Code evals run inside `app` by default, as an unprivileged user with
# resource limits but in the app's network namespace (see the sandbox program
# in deploy/platform/supervisord.conf). Installs whose users must not trust
# one another should set COMPOSE_PROFILES=sandbox in .env: the nsjail
# executor then starts with the stack and the app sends code evals to it.
#
# docker-compose.distributed.yml is the Distributed setup: one container per
# service, PeerDB CDC, Kafka-backed observed attributes, per-queue workers.
# ============================================================================
name: futureagi

services:
  app:
    image: futureagi/platform:${FUTURE_AGI_VERSION:-latest}
    env_file:
      - path: .env
        required: false
    environment:
      # Local-only defaults, as in docker-compose.distributed.yml. On a fresh install
      # ./bin/install generates real values for the secrets into .env.
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-not-for-production-replace-me}
      # 'local' keeps settings.py's local fallbacks (e.g. a throwaway
      # INTEGRATION_ENCRYPTION_KEY); DEBUG stays off for users.
      ENV_TYPE: ${ENV_TYPE:-local}
      DEBUG: ${DEBUG:-false}
      EE_LICENSE_KEY: ${EE_LICENSE_KEY:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      DJANGO_SETTINGS_MODULE: tfc.settings.settings
      # Only the bootstrap process (deploy/platform/bin/bootstrap.py) changes
      # schema; the API and `docker compose exec` sessions never do.
      NO_STARTUP_DB_MUTATIONS: "true"
      FI_SKIP_CH25_MIGRATION: "1"
      # Postgres -> ClickHouse change data capture: capture triggers plus a
      # Temporal drain inside the app, no PeerDB.
      FI_CDC_MODE: ${FI_CDC_MODE:-outbox}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      FUTURE_AGI_VERSION: ${FUTURE_AGI_VERSION:-unknown}
      FUTURE_AGI_DEPLOYMENT_TYPE: ${FUTURE_AGI_DEPLOYMENT_TYPE:-docker}
      FUTURE_AGI_TELEMETRY_DISABLED: ${FUTURE_AGI_TELEMETRY_DISABLED:-false}
      FUTURE_AGI_TELEMETRY_JITTER_SECONDS: ${FUTURE_AGI_TELEMETRY_JITTER_SECONDS:-1800}
      # Root-only (bin/start); /tmp is writable by the code-evals sandbox.
      FUTURE_AGI_TELEMETRY_BUFFER_DIR: ${FUTURE_AGI_TELEMETRY_BUFFER_DIR:-/data/telemetry}
      FUTURE_AGI_TELEMETRY_URL: ${FUTURE_AGI_TELEMETRY_URL:-https://api.futureagi.com}
      FUTURE_AGI_TELEMETRY_INTERVAL_HOURS: ${FUTURE_AGI_TELEMETRY_INTERVAL_HOURS:-6}
      FUTURE_AGI_TELEMETRY_TIMEOUT_SECONDS: ${FUTURE_AGI_TELEMETRY_TIMEOUT_SECONDS:-5}

      # --- processes -------------------------------------------------------
      GRANIAN_THREADS: ${GRANIAN_THREADS:-2}
      ENABLE_GRPC: "false"
      # Exact analytics keep a dedicated single-slot worker in the API process.
      EXACT_AGGREGATION_TASK_QUEUE: ${EXACT_AGGREGATION_TASK_QUEUE:-exact_aggregation}
      # The hosted simulation runner needs its own image (distributed topology).
      TEMPORAL_EXCLUDED_QUEUES: ${TEMPORAL_EXCLUDED_QUEUES:-simulation_runner}
      # Slots per queue of the one embedded worker. Own names: a .env written
      # for the distributed stack sets TEMPORAL_MAX_CONCURRENT_* for its big workers,
      # and this block wins over env_file.
      TEMPORAL_MAX_CONCURRENT_ACTIVITIES: ${FI_APP_TEMPORAL_MAX_CONCURRENT_ACTIVITIES:-8}
      TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASKS: ${FI_APP_TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASKS:-8}
      # The worker drains on stop; this must fit in stop_grace_period below.
      TEMPORAL_GRACEFUL_SHUTDOWN_TIMEOUT: "30"
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-128mb}

      # --- services inside this container ----------------------------------
      TEMPORAL_HOST: 127.0.0.1:7233
      TEMPORAL_NAMESPACE: default
      # Redis requires this password: code evals share the container's
      # network. ./bin/install generates it (URL-safe); bin/start writes it
      # to Redis's root-only config.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-dev-only-redis-password}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-only-redis-password}@127.0.0.1:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD:-local-dev-only-redis-password}@127.0.0.1:6379/1
      REDIS_LOCK_URL: redis://:${REDIS_PASSWORD:-local-dev-only-redis-password}@127.0.0.1:6379/2
      REDIS_STATE_URL: redis://:${REDIS_PASSWORD:-local-dev-only-redis-password}@127.0.0.1:6379/2
      CHANNEL_LAYER_BACKEND: redis
      CHANNEL_REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-only-redis-password}@127.0.0.1:6379/3
      # Temporal activities relay live updates to the API; keep it in-container
      # whatever BASE_URL says.
      WEBSOCKET_ENDPOINT: http://127.0.0.1:8000/call-websocket/
      AGENTCC_INTERNAL_URL: http://127.0.0.1:8080
      AGENTCC_GATEWAY_INTERNAL_URL: http://127.0.0.1:8080
      ALK_RUNNER_API_URL: ${ALK_RUNNER_API_URL:-http://127.0.0.1:8000}
      # extra_hosts maps code-executor to the in-container sandbox. With
      # COMPOSE_PROFILES=sandbox in .env, bin/start points this default at
      # the nsjail executor (code-executor-nsjail) instead.
      CODE_EXECUTOR_URL: ${CODE_EXECUTOR_URL:-http://code-executor:8060}
      # Never fall back to running eval code inside the API process when the
      # executor is down: that process holds every secret and /data.
      CODE_EXECUTOR_LOCAL_FALLBACK: "false"
      # Read by bin/start to pick the executor; passed through so a
      # shell-exported value works as well as the one in .env.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      # Resolves only with --profile ml; without it serving counts as not
      # deployed and the features that need it are unavailable.
      MODEL_SERVING_URL: ${MODEL_SERVING_URL:-http://serving:8080}
      # The setup screen probes the in-container collector. The environment
      # wins over env_file, where FI_COLLECTOR_OTLP_PORT is the host port.
      FI_COLLECTOR_HOST: 127.0.0.1
      FI_COLLECTOR_OTLP_PORT: "4317"
      # The OTLP/HTTP URL SDKs send traces to (their FI_BASE_URL), as the UI
      # shows it.
      FI_COLLECTOR_PUBLIC_URL: ${FI_COLLECTOR_PUBLIC_URL:-http://localhost:${FI_COLLECTOR_OTLP_HTTP_PORT:-4318}}
      # The UI's host, without a scheme: invite and password-reset links.
      APP_URL: ${APP_URL:-localhost:${FRONTEND_PORT:-3000}}
      # S3_ENDPOINT_URL is the app's own view of object storage; MINIO_URL is
      # baked into URLs handed to the browser and must be reachable from it.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      S3_ENDPOINT_URL: http://127.0.0.1:9005
      MINIO_URL: ${MINIO_URL:-http://localhost:${MINIO_API_PORT:-9005}}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-futureagi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-futureagi}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-futureagi}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-futureagi}
      S3_BUCKET: futureagi

      # --- Postgres and ClickHouse -----------------------------------------
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${PG_USER:-futureagi}
      PG_PASSWORD: ${PG_PASSWORD:-futureagi}
      PG_DB: ${PG_DB:-futureagi}
      PGBOUNCER_HOST: postgres
      PGBOUNCER_PORT: "5432"
      CH_HOST: clickhouse
      CH_PORT: "9000"
      CH_HTTP_PORT: "8123"
      CH_USER: default
      CH_USERNAME: ${CH_USERNAME:-default}
      CH_PASSWORD: ""
      CH_ENABLED: "true"
      CH_DATABASE: ${CH_DATABASE:-default}
      CH25_DATABASE: ${CH25_DATABASE:-${CH_DATABASE:-default}}
      CH_USE_REPLICATED_ENGINES: "false"
      CH25_DROP_LEGACY_CDC_CHAIN: ${CH25_DROP_LEGACY_CDC_CHAIN:-true}
      CH25_EVAL_LOGGER_TABLE: ${CH25_EVAL_LOGGER_TABLE:-tracer_eval_logger}
      CH25_QUERY_TYPES_V2_ONLY: ${CH25_QUERY_TYPES_V2_ONLY:-span_list,trace_list,session_list,voice_call_list,dashboard,monitor_metrics,eval_metrics,filter_builder,trace_detail,annotation_labels}
      # Observed-attribute index: the bootstrap creates it (empty) and its
      # users; suggestions are collected only by the distributed topology's Kafka.
      PROPERTY_CATALOG_DATABASE: ${PROPERTY_CATALOG_DATABASE:-property_catalog}
      PROPERTY_CATALOG_CH_HOST: clickhouse
      PROPERTY_CATALOG_CH_PORT: "9000"
      PROPERTY_CATALOG_CH_USER: observed_catalog_reader
      PROPERTY_CATALOG_CH_PASSWORD: ${PROPERTY_CATALOG_API_PASSWORD:-oss-observed-reader-local-only}
      PROPERTY_CATALOG_CONSUMER_PASSWORD: ${PROPERTY_CATALOG_CONSUMER_PASSWORD:-oss-observed-writer-local-only}

      # --- fi-collector ----------------------------------------------------
      FI_CH_URL: http://clickhouse:8123
      FI_CH_DATABASE: ${FI_CH_DATABASE:-${CH25_DATABASE:-${CH_DATABASE:-default}}}
      # Collector releases before the split FI_PG_WRITE_{HOST,...} fields read
      # only these DSNs; without them they fall back to a baked-in db:5432.
      # bin/start percent-encodes PG_USER/PG_PASSWORD/PG_DB when they need it.
      FI_PG_WRITE: postgres://${PG_USER:-futureagi}:${PG_PASSWORD:-futureagi}@postgres:5432/${PG_DB:-futureagi}?sslmode=disable
      FI_PG_READ: postgres://${PG_USER:-futureagi}:${PG_PASSWORD:-futureagi}@postgres:5432/${PG_DB:-futureagi}?sslmode=disable
      PGSSLMODE: ${PGSSLMODE:-prefer}
      PGSSLROOTCERT: ${PGSSLROOTCERT:-}
      PGSSLCERT: ${PGSSLCERT:-}
      PGSSLKEY: ${PGSSLKEY:-}
      FI_AUTH_REDIS_ADDR: 127.0.0.1:6379
      FI_AUTH_REDIS_PASSWORD: ${REDIS_PASSWORD:-local-dev-only-redis-password}
      FI_GRPC_ADDR: ":4317"
      FI_HTTP_ADDR: ":4318"
      FI_ADMIN_ADDR: 127.0.0.1:9464
      FI_DEAD_LETTER_FILE: /data/collector/dead_letter.jsonl
      FI_OBSERVED_CATALOG_MODE: disabled
      FI_PROPERTY_CATALOG_MODE: disabled
      FI_ERROR_FEED_KAFKA_BROKERS: ""

      # --- LLM gateway, mail, captcha --------------------------------------
      AGENTCC_INTERNAL_API_KEY: ${AGENTCC_INTERNAL_API_KEY:-local-dev-only-shared-secret-replace-me}
      AGENTCC_WEBHOOK_SECRET: ${AGENTCC_WEBHOOK_SECRET:-}
      AGENTCC_HARNESS_API_KEY: ${AGENTCC_HARNESS_API_KEY:-}
      AGENTCC_BASE_URL: ${AGENTCC_BASE_URL:-}
      AGENTCC_ADMIN_TOKEN: ${AGENTCC_ADMIN_TOKEN:-local-dev-only-admin-token-replace-me}
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-false}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_SENDER_DOMAIN: ${MAILGUN_SENDER_DOMAIN:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      SERVER_EMAIL: ${SERVER_EMAIL:-}

      # --- BYOK LLM provider keys (optional) -------------------------------
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}

      TEMPORAL_TEST_EXECUTION_ENABLED: ${TEMPORAL_TEST_EXECUTION_ENABLED:-true}

      # --- hosted agent harness (same defaults as the distributed topology) --------
      HARNESS_PUBLIC_BASE_URL: ${HARNESS_PUBLIC_BASE_URL:-}
      HARNESS_PROVIDER: ${HARNESS_PROVIDER:-daytona}
      HOSTED_SANDBOX_PROVIDER: ${HOSTED_SANDBOX_PROVIDER:-daytona}
      ALK_HOSTED_BASE_EGRESS_DOMAINS: ${ALK_HOSTED_BASE_EGRESS_DOMAINS:-}
      ALK_HOSTED_EGRESS_UNRESTRICTED: ${ALK_HOSTED_EGRESS_UNRESTRICTED:-false}
      ALK_HOSTED_AUTHORING_MAX_DURATION_SECONDS: ${ALK_HOSTED_AUTHORING_MAX_DURATION_SECONDS:-3600}
      ALK_HOSTED_AUTHORING_TIMEOUT: ${ALK_HOSTED_AUTHORING_TIMEOUT:-}
      ALK_HOSTED_SANDBOX_TTL_SECONDS: ${ALK_HOSTED_SANDBOX_TTL_SECONDS:-7200}
      ALK_HOSTED_CHAT_TTL_SECONDS: ${ALK_HOSTED_CHAT_TTL_SECONDS:-1800}
      ALK_HOSTED_WEBRTC_EGRESS_CIDRS: ${ALK_HOSTED_WEBRTC_EGRESS_CIDRS:-}
      ALK_HOSTED_BUNDLE_DIR: ${ALK_HOSTED_BUNDLE_DIR:-}
      ALK_HARNESS: ${ALK_HARNESS:-}
      ALK_HARNESS_MODEL: ${ALK_HARNESS_MODEL:-}
      ALK_HOSTED_AGENTCC_BASE_URL: ${ALK_HOSTED_AGENTCC_BASE_URL:-}
      ALK_HOSTED_AGENTCC_MODEL: ${ALK_HOSTED_AGENTCC_MODEL:-vertex_ai/gemini-3.7-flash}
      SIMULATOR_LLM_PROVIDER: ${SIMULATOR_LLM_PROVIDER:-vertex}
      SIMULATOR_LLM_MODEL: ${SIMULATOR_LLM_MODEL:-gemini-3.7-flash}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-}
      DAYTONA_ORGANIZATION_ID: ${DAYTONA_ORGANIZATION_ID:-}
      ALK_DAYTONA_SNAPSHOT: ${ALK_DAYTONA_SNAPSHOT:-}
      ALK_DAYTONA_SNAPSHOT_DIGEST: ${ALK_DAYTONA_SNAPSHOT_DIGEST:-}
      ALK_DAYTONA_DOCKERFILE: ${ALK_DAYTONA_DOCKERFILE:-}
      E2B_API_KEY: ${E2B_API_KEY:-}
      ALK_E2B_TEMPLATE_REFERENCE: ${ALK_E2B_TEMPLATE_REFERENCE:-}
      ALK_E2B_TEMPLATE_BUILD_ID: ${ALK_E2B_TEMPLATE_BUILD_ID:-}
      ALK_E2B_TEMPLATE_CPU_UNITS: ${ALK_E2B_TEMPLATE_CPU_UNITS:-4}
      ALK_E2B_TEMPLATE_MEMORY_MB: ${ALK_E2B_TEMPLATE_MEMORY_MB:-8192}
      ALK_E2B_TEMPLATE_DISK_GB: ${ALK_E2B_TEMPLATE_DISK_GB:-10}
      ALK_E2B_MAX_TTL_SECONDS: ${ALK_E2B_MAX_TTL_SECONDS:-0}

      # --- UI runtime config (config.js, written at container start) --------
      # Empty -> the SPA calls http://localhost:<BACKEND_PORT> (default set in
      # deploy/platform/bin/start). Set the public API URL when the UI is
      # reached through another host name.
      VITE_HOST_API: ${VITE_HOST_API:-}
      VITE_HELP_LINK: ${VITE_HELP_LINK:-}
    extra_hosts:
      - "code-executor:127.0.0.1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
      - "${BACKEND_PORT:-8000}:8000"
      - "127.0.0.1:${FI_COLLECTOR_OTLP_PORT:-4317}:4317"
      - "127.0.0.1:${FI_COLLECTOR_OTLP_HTTP_PORT:-4318}:4318"
      - "${AGENTCC_GATEWAY_PORT:-8090}:8080"
      - "127.0.0.1:${MINIO_API_PORT:-9005}:9005"
    volumes:
      # Temporal (SQLite), object storage and the collector's dead-letter file.
      - app-data:/data
      # Secrets go under /etc/futureagi/secrets, a directory only root can
      # enter: bind mounts keep the host's file mode (often world-readable),
      # and code evals run in this container.
      # LLM gateway providers; override with AGENTCC_CONFIG_PATH in .env.
      - ./${AGENTCC_CONFIG_PATH:-agentcc-gateway/config.example.yaml}:/etc/futureagi/secrets/agentcc.yaml:ro
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/etc/futureagi/secrets/vertex.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      # The image's HEALTHCHECK (deploy/platform/Dockerfile) probes the API
      # plus every in-container service it relies on: collector, gateway, UI
      # and object storage. Only its timings are repeated here.
      interval: 15s
      timeout: 10s
      retries: 5
      # A first boot migrates an empty database before the API starts.
      start_period: 900s
    # Covers the Temporal worker drain (supervisord stopwaitsecs=50).
    stop_grace_period: 60s
    # Caps a fork bomb in a code eval at the container, not the host.
    pids_limit: 4096
    restart: unless-stopped

  postgres:
    # Same image as docker-compose.distributed.yml, so a volume works with either
    # file: Debian (glibc) and Alpine (musl) images sort text differently,
    # which silently corrupts indexes built by the other.
    image: postgres:16
    # Small-host settings. wal_level=logical and the slot limit are kept so a
    # volume from a distributed install (PeerDB slots) still boots and the app can
    # explain what to do, instead of Postgres refusing to start.
    # max_connections covers the API (a connection per running sync view),
    # the embedded worker's activity slots, the CDC drain and the collector.
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c wal_buffers=4MB
      -c max_wal_size=512MB
      -c min_wal_size=64MB
      -c wal_level=logical
      -c max_replication_slots=25
    environment:
      POSTGRES_USER: ${PG_USER:-futureagi}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-futureagi}
      POSTGRES_DB: ${PG_DB:-futureagi}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER:-futureagi} -d ${PG_DB:-futureagi}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  clickhouse:
    # 25.3 is the floor for the v2 spans schema (typed-JSON columns).
    image: clickhouse/clickhouse-server:25.3-alpine
    environment:
      # Keep the upstream default user (no IP allowlist), as in the distributed stack.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_DB: ${CH_DATABASE:-default}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # `tiered` storage policy required by the v2 spans schema.
      - ./futureagi/.ci/clickhouse-storage-policy.xml:/etc/clickhouse-server/config.d/storage-policy.xml:ro
      # Smaller caches and merge pools, no system log tables.
      - ./deploy/platform/clickhouse/config.d/zz-small-host.xml:/etc/clickhouse-server/config.d/zz-small-host.xml:ro
      - ./deploy/platform/clickhouse/users.d/zz-small-host.xml:/etc/clickhouse-server/users.d/zz-small-host.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # IPv4 literal: `localhost` resolves IPv6 first on some hosts (Colima).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --profile ml: embedding model server for embedding-based evals and
  # knowledge bases (a few GB of RAM once models load).
  serving:
    image: futureagi/serving:${SERVING_VERSION:-latest}
    profiles: ["ml"]
    env_file:
      - path: .env
        required: false
    environment:
      # No collector in this container to export traces to.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
    restart: unless-stopped

  # --profile sandbox: nsjail-isolated code evals for installs whose users
  # must not trust one another. Needs privileged: true (Linux namespaces), so
  # not every platform allows it. Enable it with COMPOSE_PROFILES=sandbox in
  # .env: bin/start then routes code evals to code-executor-nsjail (the app's
  # own `code-executor` name points at its built-in sandbox). nsjail allows
  # network access, as in the distributed stack.
  code-executor:
    image: futureagi/code-executor:${CODE_EXECUTOR_VERSION:-latest}
    profiles: ["sandbox"]
    privileged: true
    networks:
      default:
        aliases: [code-executor-nsjail]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"
    restart: unless-stopped

volumes:
  app-data:
  postgres-data:
  clickhouse-data:
