name: Publish E2E build cache

# No candidate checkout, artifacts, or workflow_run inputs. This is an
# optimization for future builds, not a dependency of E2E Tests Pass.
on:
  push:
    branches: [dev, main]

permissions:
  contents: read

# These are mutable cache tags. Coalesce cache refreshes, never suite verdicts.
concurrency:
  group: publish-e2e-build-cache
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: backend, context: futureagi, file: futureagi/Dockerfile.oss}
          - {tag: backend-slim, context: futureagi, file: futureagi/Dockerfile.oss, args: IMAGE_VARIANT=slim}
          - {tag: code-executor, context: futureagi/code-executor, file: futureagi/code-executor/Dockerfile}
          - {tag: fi-collector, context: fi-collector, file: fi-collector/Dockerfile}
          - {tag: frontend, context: frontend, file: frontend/Dockerfile}
          - {tag: gateway, context: agentcc-gateway, file: agentcc-gateway/Dockerfile}
    env:
      CACHE_REPO: ghcr.io/${{ github.repository }}/e2e-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: scripts/reclaim-runner-disk.sh
      # The standard backend build places the verified URL-pinned lock wheels
      # (en-core-web-sm) in its context exactly as E2E CI's Distributed shards
      # do, so the extras layer it writes is the one they look up. The slim
      # build installs no extras and, like Standalone's shards, places none.
      - name: Key the lock wheels by their uv.lock hashes
        if: matrix.tag == 'backend'
        id: lock-wheels
        run: python3 -I futureagi/.ci/lock_wheels.py key futureagi/uv.lock >> "$GITHUB_OUTPUT"
      - name: Restore lock wheels (verified against uv.lock before use)
        if: matrix.tag == 'backend'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/lock-wheels-cache
          key: ${{ steps.lock-wheels.outputs.key }}
      - name: Fetch, verify and place the lock wheels in the build context
        if: matrix.tag == 'backend'
        timeout-minutes: 4
        run: |
          python3 -I futureagi/.ci/lock_wheels.py fetch futureagi/uv.lock "$RUNNER_TEMP/lock-wheels-cache" "$RUNNER_TEMP/lock-wheels"
          cp "$RUNNER_TEMP"/lock-wheels/*.whl futureagi/docker/lock-wheels/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          outputs: type=cacheonly
          cache-from: |
            type=registry,ref=${{ env.CACHE_REPO }}:${{ matrix.tag }}
            ${{ matrix.tag == 'backend-slim' && format('type=registry,ref=ghcr.io/{0}/build-cache:backend-slim-amd64', github.repository) || '' }}
          cache-to: type=registry,ref=${{ env.CACHE_REPO }}:${{ matrix.tag }},mode=max
