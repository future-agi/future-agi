# TEMPORARY diagnostic for the DB reuse PR. Removed before review.
name: tmp db reuse diagnostic
on:
  push:
    branches: [perf/ci-backend-db-reuse]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LITELLM_MODE: PRODUCTION
      CH25_DATABASE: test_tfc
      CH_DATABASE: test_tfc
      OBSERVED_CATALOG_TEST_CH_HOST: 127.0.0.1
      OBSERVED_CATALOG_TEST_CH_PORT: "18123"
      OBSERVED_CATALOG_TEST_CH_USER: default
      OBSERVED_CATALOG_TEST_CH_PASSWORD: ""
      OBSERVED_CATALOG_TEST_NATIVE_PORT: "19000"
      FI_CH_TEST_SIDECAR_NATIVE_PORT: "19000"
      FI_CH_TEST_SIDECAR_HTTP_PORT: "18123"
      PYTHONHASHSEED: "0"
      FI_CH25_SCHEMA_APPLY_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lock wheels
        run: python3 -I futureagi/.ci/lock_wheels.py fetch futureagi/uv.lock "$RUNNER_TEMP/lock-wheels-cache" "$RUNNER_TEMP/lock-wheels"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-lock-wheels
          path: ${{ runner.temp }}/lock-wheels/*.whl
          compression-level: 0
      - uses: future-agi/future-agi/.github/actions/checkout-ee@6a05e37f2c9e35dc4cea484d5e6263d4f33e2fc2
        with:
          token: ${{ secrets.EE_REPO_READ_TOKEN }}
          branch: dev
          base-ref: dev
      - uses: ./.github/actions/backend-test-packages/environment
      - name: Fresh migrates and round trip
        working-directory: futureagi
        run: |
          set -euo pipefail
          pg=(docker compose -f docker-compose.test.yml -p futureagi-test exec -T test-db)
          d=$RUNNER_TEMP/diag; mkdir -p "$d"
          t=$SECONDS
          CI_PRESEED_DIGEST=$d/int.digest CI_PRESEED_DUMP=$d/int.sql.gz uv run pytest .ci/migrated_db.py --create-db -q
          echo "internal fresh migrate: $((SECONDS-t)) s"
          mv ee/cloud "$RUNNER_TEMP/held"
          for n in 1 2; do
            t=$SECONDS
            CI_PRESEED_DIGEST=$d/pub$n.digest CI_PRESEED_DUMP=$d/pub$n.sql.gz PG_TEST_DB=test_ci_public uv run pytest .ci/migrated_db.py --create-db -q
            echo "public fresh migrate $n: $((SECONDS-t)) s"
          done
          mv "$RUNNER_TEMP/held" ee/cloud
          t=$SECONDS
          "${pg[@]}" createdb -U test_user test_ci_roundtrip
          python3 -I .ci/db_dump.py restore "$d/pub1.sql.gz" test_user test_ci_roundtrip "${pg[@]}"
          echo "restore: $((SECONDS-t)) s"
          t=$SECONDS
          CI_PRESEED_DIGEST=$d/rt.digest CI_PRESEED_DUMP=$d/rt.sql.gz PG_TEST_DB=test_ci_roundtrip uv run pytest .ci/migrated_db.py -q
          echo "replay migrate on restored db (with overlay): $((SECONDS-t)) s"
          for a in int pub2 rt; do cmp -s "$d/pub1.digest" "$d/$a.digest" && echo "digest pub1 == $a" || echo "digest pub1 != $a"; done
          cd .. && python3 -I .github/tmp-db-diag.py "$d"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diag-public-dump
          path: ${{ runner.temp }}/diag/pub1.sql.gz
          retention-days: 1
