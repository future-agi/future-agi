name: Collector and compose CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "fi-collector/**"
      - "docker-compose*.yml"
      - "bin/install*"
      - "bin/lib/**"
      - "bin/uninstall"
      - "bin/dev"
      - "bin/e2e"
      - "deploy/**"
      - "e2e/stack/**"
      - "futureagi/scripts/property_catalog_oss/**"
      - "futureagi/tracer/services/clickhouse/oss_*.py"
      - "futureagi/tracer/services/clickhouse/tests/test_oss_*.py"
      - "futureagi/tracer/services/clickhouse/v2/observed_catalog/**"
      - "futureagi/tracer/services/clickhouse/v2/schema/**"
      - ".github/workflows/fi-collector-ci.yml"
  push:
    branches: [dev, main]
    paths:
      - "fi-collector/**"
      - "docker-compose*.yml"
      - "bin/install*"
      - "bin/lib/**"
      - "bin/uninstall"
      - "bin/dev"
      - "bin/e2e"
      - "deploy/**"
      - "e2e/stack/**"
      - "futureagi/scripts/property_catalog_oss/**"
      - "futureagi/tracer/services/clickhouse/oss_*.py"
      - "futureagi/tracer/services/clickhouse/tests/test_oss_*.py"
      - "futureagi/tracer/services/clickhouse/v2/observed_catalog/**"
      - "futureagi/tracer/services/clickhouse/v2/schema/**"
      - ".github/workflows/fi-collector-ci.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fi-collector/go.mod
          cache-dependency-path: fi-collector/go.sum
      - name: Collector unit and race tests
        working-directory: fi-collector
        run: go test -race ./...
      - name: Non-race pricing, latency, waits and authenticated regressions
        working-directory: fi-collector
        env:
          GOMAXPROCS: "2"
        run: go test -count=1 -p 1 -timeout 5m -run 'TestPrice|TestGRPCLargeMessage|TestScan|TestPool|TestWireGrowers|TestAuthenticated|TestQuotaRefusal' ./pkg/server
      - name: Compile shipped commands
        working-directory: fi-collector
        run: go build ./cmd/fi-collector ./cmd/fi-property-catalog-consumer ./cmd/fi-observed-catalog-backfill ./cmd/otlpbench

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OBS_TEST_PROJECT: observed-catalog-ci-${{ github.run_id }}-${{ github.run_attempt }}
      OBS_TEST_CH_PORT: "18143"
      OBS_TEST_KAFKA_PORT: "19094"
      OBS_TEST_PG_PORT: "15543"
      OBS_TEST_CH_URL: http://127.0.0.1:18143
      OBS_TEST_KAFKA_BROKER: 127.0.0.1:19094
      OBS_TEST_PG_DSN: postgres://test:test@127.0.0.1:15543/observed_catalog_test
      OBS_TEST_REPLICA_URLS: ""
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fi-collector/go.mod
          cache-dependency-path: fi-collector/go.sum
      - name: Start only the isolated integration dependencies
        timeout-minutes: 5
        run: |
          docker compose --env-file /dev/null \
            -f fi-collector/test/observed-catalog/compose.yml \
            -p "$OBS_TEST_PROJECT" up -d --wait --wait-timeout 180
      - name: Repeat the actual local OSS bootstrap
        timeout-minutes: 2
        run: |
          for attempt in 1 2; do
            docker compose --env-file /dev/null \
              -f fi-collector/test/observed-catalog/compose.yml \
              -p "$OBS_TEST_PROJECT" run --rm --no-deps \
              --entrypoint /bin/sh -e CLICKHOUSE_HOST=clickhouse \
              -v "$PWD/futureagi/scripts/property_catalog_oss:/bootstrap:ro" \
              -v "$PWD/futureagi/tracer/services/clickhouse/v2/observed_catalog:/observed-catalog:ro" \
              clickhouse /bootstrap/bootstrap_clickhouse.sh
          done
      - name: Real ClickHouse, Kafka, PostgreSQL and OTLP HTTP tests
        working-directory: fi-collector
        timeout-minutes: 10
        run: |
          set -o pipefail
          go test -race -count=1 -p 1 -timeout 8m -json \
            -run '^(TestClickHouse|TestKafka|TestPostgres|TestBackfillCLIThroughKafkaWithResume|TestObservedCatalogHTTPToLocalStack|TestValidateKey|TestRoutingColumnCheckSeesBothColumns|TestRoutingColumnStateIsSharedThroughNew|TestEnsureSimulationProject)' \
            ./cmd/fi-observed-catalog-backfill ./pkg/server ./pkg/auth \
            | tee "$RUNNER_TEMP/observed-integration.jsonl"
      - name: Require executed integration proofs, not skipped tests
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = {
              "TestClickHouseStringParametersRoundTrip",
              "TestClickHouseMigratedStringOverflowBackfill",
              "TestClickHouseSourceKeysetAndPhysicalVersions",
              "TestClickHouseObservedIndexReplayBeforeMerges",
              "TestClickHouseObservedSinkPlainWithRestrictedWriter",
              "TestKafkaMultipleConsumersAndWorkspaceScale",
              "TestKafkaSpoolRestartAndPartialConsumerWrite",
              "TestKafkaRejectsLegacyWireWithoutCommittingPastIt",
              "TestPostgresOwnershipIsCurrentAndReadOnly",
              "TestBackfillCLIThroughKafkaWithResume",
              "TestObservedCatalogHTTPToLocalStack",
              "TestClickHouseDirectObservedCatalogFromOTLPHTTP",
              "TestValidateKeyReadsTheAgentOfAnIngestKey",
              "TestValidateKeyFallsBackWhenTheColumnDisappears",
              "TestRoutingColumnCheckSeesBothColumns",
              "TestRoutingColumnStateIsSharedThroughNew",
              "TestEnsureSimulationProject",
          }
          evidence = Path(os.environ["RUNNER_TEMP"]) / "observed-integration.jsonl"
          events = [json.loads(line) for line in evidence.read_text().splitlines()]
          passed = {event.get("Test") for event in events if event["Action"] == "pass"}
          missing = required - passed
          if missing:
              raise SystemExit(f"Integration proofs missing or skipped: {sorted(missing)}")
          print(f"Confirmed {len(required)} real integration proofs")
          PY
      - name: Collect isolated fixture logs
        if: always()
        timeout-minutes: 1
        run: |
          docker compose --env-file /dev/null \
            -f fi-collector/test/observed-catalog/compose.yml \
            -p "$OBS_TEST_PROJECT" logs --no-color --tail 150 \
            > "$RUNNER_TEMP/observed-services.log" 2>&1 || true
      - name: Remove only this job's integration project
        if: always()
        timeout-minutes: 2
        run: |
          : "${OBS_TEST_PROJECT:?exact integration project is required}"
          docker compose --env-file /dev/null \
            -f fi-collector/test/observed-catalog/compose.yml \
            -p "$OBS_TEST_PROJECT" down --volumes --remove-orphans --timeout 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observed-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/observed-integration.jsonl
            ${{ runner.temp }}/observed-services.log
          if-no-files-found: warn
          retention-days: 7

  otlp-benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OTLPBENCH_CI_PROJECT: otlpbench-ci-${{ github.run_id }}-${{ github.run_attempt }}
      OTLPBENCH_CI_CH_PORT: "18147"
      OTLPBENCH_LIVE_CH_URL: http://127.0.0.1:18147
      OTLPBENCH_LIVE_CH_DATABASE: otlpbench_ci
      OTLPBENCH_LIVE_CH_USER: test
      OTLPBENCH_LIVE_CH_PASSWORD: test
      OTLPBENCH_LIVE_CONFIRM: isolated-test-stack
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fi-collector/go.mod
          cache-dependency-path: fi-collector/go.sum
      - name: Start isolated pinned ClickHouse for the benchmark smoke
        timeout-minutes: 3
        run: |
          docker compose --env-file /dev/null -f fi-collector/benchmark/ci-compose.yml \
            -p "$OTLPBENCH_CI_PROJECT" up -d --wait --wait-timeout 120
      - name: Apply actual canonical schema and curated table DDL
        timeout-minutes: 2
        run: |
          compose=(docker compose --env-file /dev/null -f fi-collector/benchmark/ci-compose.yml -p "$OTLPBENCH_CI_PROJECT")
          "${compose[@]}" exec -T clickhouse clickhouse-client --user test --password test \
            --query 'CREATE DATABASE otlpbench_ci'
          "${compose[@]}" exec -T clickhouse clickhouse-client --user test --password test \
            --database otlpbench_ci --allow_experimental_json_type 1 --multiquery \
            < futureagi/tracer/services/clickhouse/v2/schema/002_spans_v2.sql
          # The smoke uses canonical spans plus curated writes, not app dictionaries.
          # Extract existing table DDL; never replace it with a mock span schema.
          python3 - <<'PY' > "$RUNNER_TEMP/otlpbench-curated.sql"
          import re
          from pathlib import Path
          schema = Path('futureagi/tracer/services/clickhouse/v2/schema')
          for name in ('015_traces_and_trace_dict.sql', '017_end_users.sql', '018_trace_sessions.sql'):
              match = re.search(r'^CREATE TABLE IF NOT EXISTS [\s\S]*?;\s*$', (schema / name).read_text(), re.MULTILINE)
              if not match:
                  raise SystemExit(f'Missing curated CREATE TABLE in {name}')
              print(match.group(0))
          PY
          "${compose[@]}" exec -T clickhouse clickhouse-client --user test --password test \
            --database otlpbench_ci --multiquery < "$RUNNER_TEMP/otlpbench-curated.sql"
      - name: Require actual collector to ClickHouse ID verification, backpressure accounting and recovery
        timeout-minutes: 8
        working-directory: fi-collector
        run: |
          set -o pipefail
          # The backpressure case uses current byte leases behind a slow insert
          # path over HTTP protobuf, HTTP JSON+gzip and uncompressed gRPC.
          # HTTP 503 is a retryable refusal; gRPC UNAVAILABLE stays ambiguous
          # because it can also originate from the transport. Requests too large
          # for the entire work pool are permanently refused, never admitted as
          # a row-budget overshoot. The tamper case drops 3 stored rows and
          # stores 3 spans twice; exact-ID SQL must report
          # exactly 3 missing and 3 duplicates. The bucket case checks the durable lag's SQL bucketing
          # against the Go histogram. Regression proofs also require later-only
          # namespace reuse refusal, exact cross-window fault loss, and a visible
          # sentinel beyond 4,096 permanently missing earlier identities.
          # The recovery case restarts the real collector mid-run and, separately,
          # holds every writer request to ClickHouse for 1.5 s; no acknowledged
          # span may be missing and each fault must recover within the run.
          OTLPBENCH_LIVE_RESULT="$RUNNER_TEMP/otlpbench-real-smoke.json" \
          OTLPBENCH_LIVE_BACKPRESSURE_RESULT="$RUNNER_TEMP/otlpbench-real-backpressure.json" \
          OTLPBENCH_LIVE_RECOVERY_RESULT="$RUNNER_TEMP/otlpbench-real-recovery.json" \
          OTLPBENCH_LIVE_TAMPER_RESULT="$RUNNER_TEMP/otlpbench-real-tamper.json" \
            go test -race -count=1 -p 1 -timeout 360s -json \
            -run '^(TestLiveClickHouseCollectorPipeline|TestLiveClickHouseBackpressureAccounting|TestLiveClickHouseRecovery|TestLiveClickHouseVerifierCountsDroppedAndDuplicatedSpans|TestLiveClickHouseLatencyBucketsMatchGo|TestLiveClickHouseReusePreflightChecksLaterTraces|TestLiveClickHouseFaultLossAttribution|TestLiveClickHouseSentinelPollingFairness)$' ./pkg/ingestbench \
            | tee "$RUNNER_TEMP/otlpbench-smoke-tests.jsonl"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          events = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / 'otlpbench-smoke-tests.jsonl').read_text().splitlines()]
          passed = {e.get('Test') for e in events if e['Action'] == 'pass'}
          required = {
              'TestLiveClickHouseCollectorPipeline',
              'TestLiveClickHouseBackpressureAccounting',
              'TestLiveClickHouseBackpressureAccounting/protobuf-gzip-false',
              'TestLiveClickHouseBackpressureAccounting/json-gzip-true',
              'TestLiveClickHouseBackpressureAccounting/grpc-gzip-false',
              'TestLiveClickHouseRecovery',
              'TestLiveClickHouseRecovery/collector-restart',
              'TestLiveClickHouseRecovery/clickhouse-pause',
              'TestLiveClickHouseVerifierCountsDroppedAndDuplicatedSpans',
              'TestLiveClickHouseLatencyBucketsMatchGo',
              'TestLiveClickHouseReusePreflightChecksLaterTraces',
              'TestLiveClickHouseFaultLossAttribution',
              'TestLiveClickHouseSentinelPollingFairness',
          }
          missing = required - passed
          if missing:
              raise SystemExit(f'Real ClickHouse benchmark proofs missing or skipped: {sorted(missing)}')
          print(f'Confirmed {len(required)} real ClickHouse benchmark proofs')
          PY
      - name: Publish the real smoke result (headline must be withheld for a 1 s run)
        timeout-minutes: 2
        working-directory: fi-collector
        run: |
          set -o pipefail
          go run ./cmd/otlpbench publish \
            --markdown "$RUNNER_TEMP/otlpbench-real-smoke.md" \
            --json "$RUNNER_TEMP/otlpbench-real-smoke.publication.json" \
            "$RUNNER_TEMP/otlpbench-real-smoke.json" | tee "$RUNNER_TEMP/otlpbench-publish.txt"
          grep -q '^headline withheld: .*below the configured minimum' "$RUNNER_TEMP/otlpbench-publish.txt"
          grep -q '^## Not measured' "$RUNNER_TEMP/otlpbench-real-smoke.md"
      - name: Collect only this smoke project's logs
        if: always()
        run: |
          docker compose --env-file /dev/null -f fi-collector/benchmark/ci-compose.yml \
            -p "$OTLPBENCH_CI_PROJECT" logs --no-color --tail 100 \
            > "$RUNNER_TEMP/otlpbench-services.log" 2>&1 || true
      - name: Remove only this isolated CI project
        if: always()
        timeout-minutes: 2
        run: |
          : "${OTLPBENCH_CI_PROJECT:?exact test project is required}"
          docker compose --env-file /dev/null -f fi-collector/benchmark/ci-compose.yml \
            -p "$OTLPBENCH_CI_PROJECT" down --volumes --remove-orphans --timeout 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: otlpbench-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/otlpbench-real-smoke.json
            ${{ runner.temp }}/otlpbench-real-backpressure.json
            ${{ runner.temp }}/otlpbench-real-recovery.json
            ${{ runner.temp }}/otlpbench-real-tamper.json
            ${{ runner.temp }}/otlpbench-real-smoke.md
            ${{ runner.temp }}/otlpbench-real-smoke.publication.json
            ${{ runner.temp }}/otlpbench-smoke-tests.jsonl
            ${{ runner.temp }}/otlpbench-services.log
          if-no-files-found: warn
          retention-days: 7

  replicated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OBS_TEST_PROJECT: observed-replicated-ci-${{ github.run_id }}-${{ github.run_attempt }}
      OBS_TEST_REPLICA_URLS: http://127.0.0.1:18144,http://127.0.0.1:18145,http://127.0.0.1:18146
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fi-collector/go.mod
          cache-dependency-path: fi-collector/go.sum
      - name: Start isolated exact-version replicated ClickHouse
        run: |
          docker compose --env-file /dev/null \
            -f fi-collector/test/observed-catalog/replicated.yml \
            -p "$OBS_TEST_PROJECT" up -d --wait --wait-timeout 180
      - name: Single-replica and majority-quorum regression tests
        working-directory: fi-collector
        run: go test -race -count=1 -timeout 3m -v -run '^TestReplicatedObservedSink' ./cmd/fi-observed-catalog-backfill
      - name: Remove only this job's isolated replica fixtures
        if: always()
        run: |
          : "${OBS_TEST_PROJECT:?exact test project is required}"
          docker compose --env-file /dev/null \
            -f fi-collector/test/observed-catalog/replicated.yml \
            -p "$OBS_TEST_PROJECT" down --volumes --remove-orphans --timeout 10

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compose and bootstrap contracts without running services
        run: python -m unittest discover -s deploy/tests -p 'test_observed_catalog_*.py' -v
      - name: Shell syntax
        run: |
          for script in bin/install bin/uninstall bin/dev bin/e2e bin/lib/*.sh deploy/standalone/bin/start deploy/standalone/bin/after-bootstrap; do
            bash -n "$script"
          done
          sh -n futureagi/scripts/property_catalog_oss/bootstrap_clickhouse.sh
      - name: PowerShell installer syntax
        shell: pwsh
        run: |
          foreach ($file in @("$PWD/bin/install.ps1") + (Get-ChildItem "$PWD/bin/lib/*.ps1").FullName) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
