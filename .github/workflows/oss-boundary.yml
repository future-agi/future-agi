name: OSS Boundary

# Runs billing-boundary and entitlement-gate tests WITHOUT the private ee
# checkout. This is the only job that mechanically catches
# "works on EE, broken/free on OSS" regressions — e.g. gates that skip on OSS,
# _NoopBilling call-shape drift, or imports of ee.usage leaking outside
# tfc/billing/boundary.py.
#
# The leak-check has to run on any PR that can introduce a leak, not just on
# PRs that touch the boundary itself — so the path filter is the whole backend.
on:
  pull_request:
    branches: [main, develop, dev]
    paths:
      - "futureagi/**"
      - ".github/workflows/oss-boundary.yml"
  push:
    branches: [main, develop, dev]
    paths:
      - "futureagi/**"
      - ".github/workflows/oss-boundary.yml"
  workflow_dispatch:

jobs:
  oss-boundary-tests:
    # No fork guard: this job consumes no secrets (every service is a local
    # container), and fork PRs are the likeliest source of unguarded ee imports.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: futureagi
    env:
      PG_HOST: localhost
      PG_PORT: 5432
      PG_DB: postgres
      PG_TEST_DB: test_tfc_test
      PG_USER: postgres
      PG_PASSWORD: postgres
      CH_HOST: localhost
      CH_PORT: 19000
      CH_DATABASE: test_tfc
      CH25_HOST: localhost
      CH25_HTTP_PORT: 18123
      CH25_TCP_PORT: 19000
      CH25_DATABASE: test_tfc
      CH_USE_REPLICATED_ENGINES: "false"
      CH25_DROP_LEGACY_CDC_CHAIN: "true"
      REDIS_URL: redis://localhost:6379/0
      REDIS_LOCK_URL: redis://localhost:6379/2
      TESTING: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Assert the private ee package is absent
        run: |
          if [ -d ee ]; then
            echo "::error::futureagi/ee exists in an OSS-leg checkout; this job must run without the private ee package."
            exit 1
          fi

      - name: Start ClickHouse test service
        run: |
          docker run -d \
            --name futureagi-oss-boundary-clickhouse \
            --ulimit nofile=262144:262144 \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            -e CLICKHOUSE_DB=test_tfc \
            -p 18123:8123 \
            -p 19000:9000 \
            -v "$PWD/.ci/clickhouse-test-config.xml:/etc/clickhouse-server/config.d/test-overrides.xml:ro" \
            -v "$PWD/.ci/clickhouse-storage-policy.xml:/etc/clickhouse-server/config.d/001_storage_policy.xml:ro" \
            clickhouse/clickhouse-server:25.3-alpine

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18123/ping >/dev/null; then
              echo "ClickHouse is ready"
              exit 0
            fi
            sleep 2
          done

          docker logs futureagi-oss-boundary-clickhouse
          echo "::error::ClickHouse did not become ready on localhost:18123"
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Apply ClickHouse test schema
        run: >
          uv run python -m tracer.services.clickhouse.v2.apply_schema
          --schema-dir tracer/services/clickhouse/v2/schema
          --ch-host localhost
          --ch-http-port 18123
          --ch-user default
          --ch-database test_tfc

      - name: Check ee.usage does not leak outside the boundary
        run: |
          # Grandfathered FILES below either pre-date the boundary (guarded
          # try/except ImportError lazy imports on EE-only paths) or are the
          # environment oracle itself. Exemptions are pinned to exact file
          # paths — NOT import-string patterns — so a new unguarded
          # `from ee.usage.models import ...` in any other file still fails.
          # New leaks must go through the boundary.
          exempt='^\./(tfc/billing/boundary|tfc/ee_gating|tfc/ee_gates'
          exempt+='|tfc/temporal/billing/activities|tfc/temporal/schedules/retention'
          exempt+='|tfc/temporal/schedules/billing|tfc/temporal/common/registry'
          exempt+='|tfc/deployment_telemetry/config|tfc/constants/api_calls'
          exempt+='|simulate/services/test_executor|model_hub/utils/composite_execution'
          exempt+='|model_hub/views/separate_evals|model_hub/views/develop_optimiser'
          exempt+='|model_hub/tasks/user_evaluation|mcp_server/rate_limiter'
          exempt+='|analytics/mixpanel_util|accounts/views/workspace_management'
          exempt+='|accounts/aws_marketplace_utils|ai_tools/tools/usage/get_cost_breakdown'
          exempt+='|ai_tools/tools/prompts/get_prompt_execution_results'
          exempt+='|ai_tools/tools/evaluations/(get_eval_logs|get_eval_log_detail|delete_eval_template|delete_eval_logs|trigger_error_localization)'
          exempt+='|ai_tools/tools/context/whoami)\.py:'
          leaks=$(grep -rEn "from ee\.usage|import ee\.usage" \
            --include="*.py" \
            --exclude-dir=ee \
            --exclude-dir=tests \
            . \
            | grep -vE "^[^:]+:[0-9]+:\s*#" \
            | grep -vE "$exempt" \
            || true)
          if [ -n "$leaks" ]; then
            echo "::error::ee.usage imported outside tfc/billing/boundary.py (grandfathered files are pinned in this step):"
            echo "$leaks"
            exit 1
          fi

      - name: Run OSS billing-boundary and entitlement-gate tests
        env:
          TESTING: "true"
        run: >
          uv run pytest -q --tb=line
          tfc/billing/tests/
          model_hub/tests/test_annotation_workflow_api.py
          model_hub/tests/test_annotation_advanced_api.py
