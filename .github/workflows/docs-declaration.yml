# Every PR states whether it needs a public docs change, so the docs PR is
# raised with the code instead of drifting behind it. The PR body must carry
# exactly one `Docs:` line: a future-agi/docs PR, or `none (<reason>)`
# (`none needed (<reason>)` is accepted too).
#
# On top of that line (.github/scripts/docs-declaration.mjs):
#   • the docs PR named must exist and be open or merged
#   • every linked TH ticket must carry a type label
#   • qualifying tickets get a Linear comment / Docs sub-issue
#   • the dev→main release PR lists shipped features whose docs PR hasn't merged
# The line rules always fail. The newer rules warn until vars.DOCS_GATE_MODE == 'enforce';
# then add "Docs declaration" as a required check in the dev merge-queue ruleset.
#
# Skips drafts, release-please PRs, and dev<->main release/back-merge PRs (the release job
# handles dev→main).
name: docs-declaration

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  merge_group:

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Every first-attempt PR event (opened, edited, synchronize, ...) shares one slot per PR, so two
  # runs never post the same comment or create the same Linear sub-issue at once. Only a new push
  # cancels; an edit waits its turn. Reruns use a separate slot so diagnosing an old SHA cannot
  # cancel newer work.
  group: >-
    docs-declaration-${{ github.event_name }}-${{
    github.event_name == 'pull_request' && github.run_attempt == '1' &&
    format('pr-{0}', github.event.pull_request.number) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.run_attempt == '1' }}

jobs:
  check:
    name: Docs declaration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'merge_group' || (
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'release-please--') &&
      github.head_ref != 'dev' && github.head_ref != 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Self-test
        run: node --test .github/scripts/docs-declaration.test.mjs
      - name: Check the Docs line
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Empty on fork PRs: the GitHub-side check still runs, Linear is skipped.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          DOCS_GATE_MODE: ${{ vars.DOCS_GATE_MODE }}
        run: node .github/scripts/docs-declaration.mjs pr

  release:
    name: Docs ready for release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.head_ref == 'dev' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: List shipped features whose docs PR hasn't merged
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_GATE_MODE: ${{ vars.DOCS_GATE_MODE }}
        run: node .github/scripts/docs-declaration.mjs release
