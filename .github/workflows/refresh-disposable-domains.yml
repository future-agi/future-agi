name: Refresh disposable-email-domains

# Every Thursday morning: rebuild futureagi/accounts/disposable_domains.py
# from the latest disposable-email-domains release upstream and open a PR if
# the list moved. We vendor the list instead of depending on the package at
# runtime, so this is what keeps it from going stale — nobody has to notice


on:
  schedule:
    # 09:00 IST (UTC+5:30) → 03:30 UTC, Thursdays.
    - cron: "30 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    # Skip on forks — the app token secrets aren't available there.
    if: github.repository == 'future-agi/future-agi'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the latest source list
        id: fetch
        run: |
          set -euo pipefail

          meta=$(curl -sf https://pypi.org/pypi/disposable-email-domains/json)
          version=$(jq -r '.info.version' <<< "$meta")
          sdist_url=$(jq -r '.urls[] | select(.packagetype == "sdist") | .url' <<< "$meta")

          echo "Latest release: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          curl -sfL "$sdist_url" -o /tmp/pkg.tar.gz
          tar xzf /tmp/pkg.tar.gz -C /tmp

          conf=$(find /tmp -maxdepth 2 -name disposable_email_blocklist.conf)
          sort -u "$conf" > /tmp/upstream_domains.txt
          echo "Upstream domain count: $(wc -l < /tmp/upstream_domains.txt)"

      - name: Regenerate the vendored file
        id: generate
        run: |
          set -euo pipefail
          python3 scripts/generate_disposable_domains.py \
            --domains /tmp/upstream_domains.txt \
            --version "${{ steps.fetch.outputs.version }}" \
            --out futureagi/accounts/disposable_domains.py

          if git diff --quiet -- futureagi/accounts/disposable_domains.py; then
            echo "No change — already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          added=$(git diff -- futureagi/accounts/disposable_domains.py | grep -c '^+        "')
          removed=$(git diff -- futureagi/accounts/disposable_domains.py | grep -c '^-        "')
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "added=$added" >> "$GITHUB_OUTPUT"
          echo "removed=$removed" >> "$GITHUB_OUTPUT"

      - name: Mint an app token
        # A GITHUB_TOKEN-authored push never triggers other workflows, so the
        # PR would sit with no CI. Same app used by release-please.yml.
        if: steps.generate.outputs.changed == 'true'
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Open the PR
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.fetch.outputs.version }}
          ADDED: ${{ steps.generate.outputs.added }}
          REMOVED: ${{ steps.generate.outputs.removed }}
        run: |
          set -euo pipefail

          git config user.name "future-agi-bot[bot]"
          git config user.email "future-agi-bot[bot]@users.noreply.github.com"

          branch="chore/disposable-domains-$VERSION"
          git checkout -b "$branch"
          git add futureagi/accounts/disposable_domains.py
          git commit -m "chore(accounts): refresh disposable email domain list ($VERSION)"
          git push origin "$branch"

          gh pr create \
            --base dev \
            --head "$branch" \
            --title "chore(accounts): refresh disposable email domain list ($VERSION)" \
            --body "$(cat <<EOF
          Scheduled refresh (TH-7620) — upstream disposable-email-domains $VERSION moved.

          | | |
          |---|---|
          | Added | $ADDED |
          | Removed | $REMOVED |

          Regenerated by \`scripts/generate_disposable_domains.py\` from the upstream source list. Please review the diff before merging — this feeds the signup gate.
          EOF
          )"
