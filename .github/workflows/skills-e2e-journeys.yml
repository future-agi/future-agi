name: Skills registered journeys

# Seven registered Skills journeys each need a whole machine (their own full
# stack, a 160 GB disk and up to three hours). Each runs on its own ephemeral
# Blacksmith runner: no cloud credentials, no SSH and nothing to tear down.
on:
  workflow_call:
    inputs:
      sdk: {required: true, type: string}
      traceai: {required: true, type: string}
      pair_sha256: {required: true, type: string}
      application_sha256: {required: true, type: string}
      # JSON list of the journeys this change selects (all seven off pull requests).
      journeys: {required: true, type: string}

permissions:
  contents: read

jobs:
  worker:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 185
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        journey: ${{ fromJSON(inputs.journeys) }}
    env:
      JOURNEY: ${{ matrix.journey }}
      RUNNER_LABEL: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Record the tested source identity
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          BASE=${BASE:-$(git rev-parse HEAD^)}
          [[ $BASE =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE}^{commit}" || git fetch --no-tags --depth=1 origin "$BASE"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: skill-pair-${{ github.sha }}
          path: ${{ runner.temp }}/pair
      - uses: actions/download-artifact@v4
        if: matrix.journey == '063'
        with:
          name: skill-application-wheels-${{ github.sha }}
          path: ${{ runner.temp }}/application
      - name: Bind same-run artifacts to independent producer outputs
        env:
          SDK: ${{ inputs.sdk }}
          TRACEAI: ${{ inputs.traceai }}
          PAIR_SHA: ${{ inputs.pair_sha256 }}
          APP_SHA: ${{ inputs.application_sha256 }}
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          [[ $SDK =~ ^[0-9a-f]{40}$ && $TRACEAI =~ ^[0-9a-f]{40}$ && $PAIR_SHA =~ ^[0-9a-f]{64}$ && $APP_SHA =~ ^[0-9a-f]{64}$ ]]
          echo "$PAIR_SHA  pair/pair.json" | sha256sum -c -
          jq -e --arg product "$GITHUB_SHA" --arg sdk "$SDK" --arg traceai "$TRACEAI" '.schema == 2 and .sources == {$product,$sdk,$traceai}' pair/pair.json >/dev/null
          jq -n --arg sdk "$SDK" --arg traceai "$TRACEAI" --arg pair_sha256 "$PAIR_SHA" --arg application_sha256 "$APP_SHA" \
            '{$sdk,$traceai,$pair_sha256,$application_sha256}' > "$HOME/receipt.json"
          mv pair "$HOME/pair"
          if [[ $JOURNEY == 063 ]]; then mv application "$HOME/application"; fi
      - name: Run the registered case on its own stack
        id: run
        timeout-minutes: 170
        run: |
          # The job log is public. Raw build, stack and Playwright output stays in a
          # private file on this ephemeral runner and is never uploaded.
          umask 077
          SKILLS_JOURNEY_CASE=$JOURNEY SKILLS_JOURNEY_BASE=$BASE SKILLS_JOURNEY_TREE=$TREE \
            bash e2e/scripts/skills-journey-worker.sh > "$HOME/worker-private.log" 2>&1
      - name: Collect bounded worker log and the browser result
        if: always()
        id: collect
        run: |
          set -eu
          # A fresh directory: only the three files written below are ever uploaded.
          out=$(mktemp -d "$RUNNER_TEMP/public.XXXXXX")
          echo "dir=$out" >> "$GITHUB_OUTPUT"
          # Only fixed stage names, UTC timestamps and failure locations leave the runner.
          stage=$(head -c 32 "$HOME/stage" 2>/dev/null) || stage=unavailable
          case "$stage" in bootstrap|packages|build|boot|provenance|playwright|completed) ;; *) stage=unavailable ;; esac
          {
            head -c 1024 "$HOME/stages.log" 2>/dev/null | \
              grep -Ex '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z (bootstrap|packages|build|boot|provenance|playwright|completed)' || true
            echo "last_stage=$stage"
          } > "$out/$JOURNEY-stage.log"
          head -c 4096 "$HOME/worker.log" 2>/dev/null | \
            grep -Ex '(stage (bootstrap|packages|build|boot|provenance|playwright|completed)|failed (identity|apt|docker-check|verify-pair|node-install|harness-install|browser-install|client-install|build-standalone|build-distributed|build-gateway|bootstrap|packages|build|boot|provenance|playwright) [0-9]{1,3} [0-9]{1,5})' > "$out/$JOURNEY-worker.log" || true
          cat "$out/$JOURNEY-stage.log" "$out/$JOURNEY-worker.log"
          raw=$(mktemp)
          head -c 8192 "$HOME/result.json" > "$raw" 2>/dev/null || { echo "No browser result"; exit 1; }
          # Every record must carry this run's observed Blacksmith identity; the
          # collector checks it and never supplies it.
          jq -e --arg id "$JOURNEY" --arg sha "$GITHUB_SHA" --arg tree "$TREE" --arg base "$BASE" --arg runner "$RUNNER_LABEL" --arg run_id "$GITHUB_RUN_ID" '
            def digest: type == "string" and test("\\A[a-f0-9]{64}\\z");
            def record:
              select(.environment == "blacksmith" and .runner == $runner and .run_id == $run_id and
                .product_head == $sha and .product_base == $base and .product_tree == $tree and
                (.sdk_commit | test("\\A[a-f0-9]{40}\\z")) and (.dirty | type == "boolean") and
                ([.runtime_digest,.fixture_hash] | all(digest)) and
                ([.package_hashes,.lockfile_hashes] | all(type == "array" and length > 0 and all(digest))) and
                (.name | IN("cold","configured","guest","campaign")) and
                (.status | IN("completed","failed","not_measured","registered"))) |
              {name,status,environment,runner,run_id,product_head,product_base,product_tree,sdk_commit,dirty,runtime_digest,fixture_hash,package_hashes,lockfile_hashes};
            select(.case == $id and .sha == $sha and (.pair_sha256 | digest) and (.count | type == "number") and
              (.passed | type == "boolean") and (.duration_ms | type == "number") and (.error_line | type == "number") and
              (.records | type == "array" and length > 0)) |
            [.records[] | record] as $records |
            select(($records | length) == (.records | length)) |
            {case:$id, sha:$sha, environment:"blacksmith", runner:$runner, run_id:$run_id, pair_sha256, count, passed, duration_ms, error_line, records:$records}' "$raw" > "$out/$JOURNEY.json.tmp"
          mv "$out/$JOURNEY.json.tmp" "$out/$JOURNEY.json"
      - uses: actions/upload-artifact@v4
        if: always() && steps.collect.outputs.dir != ''
        with:
          name: skills-journey-${{ matrix.journey }}
          overwrite: true
          path: |
            ${{ steps.collect.outputs.dir }}/${{ matrix.journey }}-stage.log
            ${{ steps.collect.outputs.dir }}/${{ matrix.journey }}-worker.log
            ${{ steps.collect.outputs.dir }}/${{ matrix.journey }}.json
          retention-days: 7
          if-no-files-found: error
