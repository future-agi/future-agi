name: Skills E2E on GCP

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-gcp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      applicable: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.any == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            any:
              - 'futureagi/**'
              - 'fi-collector/**'
              - 'agentcc-gateway/**'
              - 'frontend/**'
              - 'e2e/**'
              - 'bin/e2e'
              - 'docker-compose.yml'
              - 'docker-compose.distributed.yml'
              - 'docker-compose.dev.yml'
              - 'docker-compose.distributed.dev.yml'
              - 'deploy/**'
              - 'bin/install*'
              - 'bin/lib/**'
              - 'bin/uninstall'
              - 'scripts/reclaim-runner-disk.sh'
              - '.github/workflows/e2e-ci.yml'
              - '.github/workflows/skills-e2e-gcp.yml'
              - '.github/scripts/resolve-sdk-test-ref.py'
              - '.github/scripts/test_resolve_sdk_test_ref.py'

  worker:
    needs: changes
    if: >-
      needs.changes.outputs.applicable == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    environment: skills-e2e-gcp
    runs-on: ubuntu-latest
    timeout-minutes: 185
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        journey: [j3, j4, '056', '057', '058', '059', '063']
    env:
      CLOUDSDK_CORE_PROJECT: fagi-omega-staging
      CLOUDSDK_COMPUTE_ZONE: ${{ vars.GCP_E2E_ZONE }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
      VM: skills-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.journey }}
      JOURNEY: ${{ matrix.journey }}
      PR: ${{ github.event.pull_request.number || 0 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Pack only Git objects, before cloud authentication
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          files=(.git/objects)
          if test -f .git/shallow; then files+=(.git/shallow); fi
          tar czf "$RUNNER_TEMP/source.tgz" "${files[@]}"
          echo "BASE=${BASE:-$(git rev-parse HEAD^)}" >> "$GITHUB_ENV"
          echo "TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          project_id: fagi-omega-staging
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_E2E_SERVICE_ACCOUNT || secrets.GCP_E2E_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Fetch the exact-checkout package set and independent receipt
        env:
          DIST: ${{ vars.GCP_E2E_PAIR_PREFIX }}
          RECEIPTS: ${{ vars.GCP_E2E_RECEIPT_PREFIX }}
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          : "${DIST:?Configure the verified Skills package prefix}" "${RECEIPTS:?Configure the independent producer receipt prefix}"
          [[ $DIST == gs://* && $RECEIPTS == gs://* ]]
          mkdir pair
          gcloud storage cp "${RECEIPTS%/}/$GITHUB_SHA.json" producer.json
          jq '{product,sdk,traceai,pair_sha256}' producer.json > receipt.json
          jq -e --arg sha "$GITHUB_SHA" '.product == $sha and ([.sdk,.traceai] | all(test("^[a-f0-9]{40}$"))) and (.pair_sha256 | test("^[a-f0-9]{64}$"))' receipt.json >/dev/null
          gcloud storage cp "${DIST%/}/$GITHUB_SHA/pair.json" pair/pair.json
          echo "$(jq -r '.pair_sha256' receipt.json)  pair/pair.json" | sha256sum -c -
          jq -er '[.artifacts[].file] | select(length == 5 and all(test("^[A-Za-z0-9][A-Za-z0-9_.+-]+\\.(whl|tgz)$"))) | .[]' pair/pair.json > names
          while IFS= read -r name; do gcloud storage cp "${DIST%/}/$GITHUB_SHA/$name" "pair/$name"; done < names
          tar czf inputs.tgz receipt.json pair
      - name: Create private expiring worker
        id: create
        env:
          SUBNET: ${{ vars.GCP_E2E_SUBNET }}
        run: |
          : "${CLOUDSDK_COMPUTE_ZONE:?Configure the worker zone}" "${SUBNET:?Configure the isolated worker subnet}"
          gcloud compute instances create "$VM" --machine-type=e2-standard-8 \
            --subnet="$SUBNET" --no-address --no-service-account --no-scopes \
            --image-family=debian-12 --image-project=debian-cloud --boot-disk-size=160GB --boot-disk-auto-delete \
            --max-run-duration=3h --instance-termination-action=DELETE --no-restart-on-failure \
            --labels="app=skills-e2e,pr=$PR,run-id=$GITHUB_RUN_ID" \
            --metadata="enable-oslogin=TRUE,block-project-ssh-keys=TRUE,skills-head=$GITHUB_SHA,skills-base=$BASE,skills-tree=$TREE,skills-case=$JOURNEY"
      - name: Copy object pack and test inputs over IAP
        working-directory: ${{ runner.temp }}
        timeout-minutes: 7
        run: |
          for attempt in $(seq 1 20); do
            if gcloud compute ssh "$VM" --tunnel-through-iap --command=true; then break; fi
            sleep 6
          done
          gcloud compute scp --tunnel-through-iap source.tgz inputs.tgz "$VM:~/"
      - name: Run the registered case on its own stack
        timeout-minutes: 160
        run: |
          # No cloud credentials, SSH agent forwarding or controller working tree on the worker.
          gcloud compute ssh "$VM" --tunnel-through-iap --ssh-flag='-oForwardAgent=no' --ssh-flag='-oServerAliveInterval=30' --command="
            set -eu; umask 077; exec >\"\$HOME/worker.log\" 2>&1
            echo checkout >stage; mkdir src; tar xzf inputs.tgz; cd src
            sudo apt-get -qq update; sudo apt-get -qq install -y git curl ca-certificates
            git init -q; tar xzf ../source.tgz; umask 022; git checkout -q --detach '$GITHUB_SHA'
            test \"\$(git rev-parse 'HEAD^{tree}')\" = '$TREE'
            exec bash e2e/scripts/skills-gcp-worker.sh
          "
      - name: Refresh controller credentials for evidence and cleanup
        if: always() && steps.create.outcome != 'skipped'
        uses: google-github-actions/auth@v2
        with:
          project_id: fagi-omega-staging
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_E2E_SERVICE_ACCOUNT || secrets.GCP_E2E_SERVICE_ACCOUNT }}
      - name: Collect allowlisted result and last worker stage
        if: always() && steps.create.outcome == 'success'
        timeout-minutes: 2
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          mkdir -p public
          # No Playwright traces, request bodies, child output or actor files leave the VM.
          stage=$(gcloud compute ssh "$VM" --tunnel-through-iap --command='head -c 32 ~/stage' 2>/dev/null) || stage=unavailable
          case "$stage" in checkout|bootstrap|packages|build|boot|provenance|playwright|completed) ;; *) stage=unavailable ;; esac
          {
            # Only fixed stage names and UTC timestamps, never the build/test log.
            gcloud compute ssh "$VM" --tunnel-through-iap --command='head -c 1024 ~/stages.log' 2>/dev/null | \
              grep -Ex '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z (bootstrap|packages|build|boot|provenance|playwright|completed)' || true
            echo "last_stage=$stage"
          } > "public/$JOURNEY-stage.log"
          gcloud compute ssh "$VM" --tunnel-through-iap --command='head -c 8192 ~/result.json' > raw 2>/dev/null
          jq -e --arg id "$JOURNEY" --arg sha "$GITHUB_SHA" --arg tree "$TREE" --arg base "$BASE" '
            def digest: type == "string" and test("\\A[a-f0-9]{64}\\z");
            def record:
              select(.product_head == $sha and .product_base == $base and .product_tree == $tree and
                (.sdk_commit | test("\\A[a-f0-9]{40}\\z")) and (.dirty | type == "boolean") and
                ([.runtime_digest,.fixture_hash] | all(digest)) and
                ([.package_hashes,.lockfile_hashes] | all(type == "array" and length > 0 and all(digest))) and
                (.name | IN("cold","configured","guest","fixture","campaign")) and
                (.status | IN("completed","failed","not_measured","fixture","registered"))) |
              {name,status,product_head,product_base,product_tree,sdk_commit,dirty,runtime_digest,fixture_hash,package_hashes,lockfile_hashes};
            select(.case == $id and .sha == $sha and (.count | type == "number") and
              (.passed | type == "boolean") and (.duration_ms | type == "number") and (.error_line | type == "number")) |
            {case:$id, sha:$sha, environment:"gcp", project:"fagi-omega-staging", count, passed, duration_ms, error_line, records:[.records[] | record]}' raw > "public/$JOURNEY.json"
      - name: Delete worker and boot disk
        if: always() && steps.create.outcome != 'skipped'
        timeout-minutes: 5
        run: gcloud compute instances delete "$VM" --quiet --delete-disks=all
      - uses: actions/upload-artifact@v4
        if: always() && steps.create.outcome == 'success'
        with:
          name: skills-gcp-${{ matrix.journey }}
          overwrite: true
          path: ${{ runner.temp }}/public/
          retention-days: 7
          if-no-files-found: error

  coverage:
    name: Skills GCP coverage
    needs: [changes, worker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require authorized workers for applicable runs
        env:
          CHANGES: ${{ needs.changes.result }}
          APPLICABLE: ${{ needs.changes.outputs.applicable }}
          WORKERS: ${{ needs.worker.result }}
        run: |
          test "$CHANGES" = success
          [[ $APPLICABLE == true || $APPLICABLE == false ]]
          if test "$APPLICABLE" = true; then
            test "$WORKERS" = success || { echo 'Missing successful GCP workers. Fork PRs require a reviewed internal run.'; exit 1; }
          fi
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.applicable == 'true'
        with:
          pattern: skills-gcp-*
          path: receipts
      - name: Require each registered ID and both harnesses exactly once
        if: needs.changes.outputs.applicable == 'true'
        run: |
          jq -se --arg sha "$GITHUB_SHA" '
            map(.case) as $ids | ($ids | sort) == ["056","057","058","059","063","j3","j4"]
            and all(.sha == $sha and .count == 1 and .passed == true and
              (if .case == "j4" then ([.records[] | select(.status == "completed").name] | sort) == ["cold","configured"]
               elif .case == "j3" then [.records[].name] == ["fixture"]
               elif .case == "063" then [.records[].name] == ["guest"]
               else [.records[].name] == ["campaign"] end))' receipts/*/*.json
