name: Skills E2E on GCP

on:
  # Independent of the worker and caller: GCE clears maximum run time on stop.
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_call:
    inputs:
      sdk: {required: true, type: string}
      traceai: {required: true, type: string}
      pair_sha256: {required: true, type: string}
      application_sha256: {required: true, type: string}

permissions:
  contents: read

# One seven-case matrix per repository across all caller refs; the sweeper must
# not wait for it. The worker matrix permits at most two simultaneous creates.
concurrency:
  group: skills-e2e-gcp-${{ inputs.sdk && 'workers' || 'sweep' }}
  cancel-in-progress: false

jobs:
  sweep:
    if: github.event_name == 'schedule' && !inputs.sdk
    environment: skills-e2e-gcp-cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSDK_CORE_PROJECT: fagi-omega-staging
    steps:
      # No checkout, worker key, or PR input on the scheduled cleanup path.
      - uses: google-github-actions/auth@v2
        with:
          project_id: fagi-omega-staging
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_E2E_CLEANUP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Delete expired workers in any power state
        shell: bash
        run: |
          set -euo pipefail
          [[ $GITHUB_REPOSITORY_ID =~ ^[0-9]+$ ]]
          cutoff=$(date -u -d '3 hours ago' +%s)
          scope="labels.app=skills-e2e AND labels.workflow=skills-e2e-gcp AND labels.repository=$GITHUB_REPOSITORY_ID"
          gcloud compute instances list --filter="$scope" --format='value(name,zone.basename(),id,creationTimestamp)' > "$RUNNER_TEMP/workers"
          rc=0
          while IFS=$'\t' read -r vm zone id created; do
            [[ $vm == skills-* && -n $zone && $id =~ ^[0-9]+$ && $created =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
            created_epoch=$(date -u -d "$created" +%s)
            (( created_epoch <= cutoff )) || continue
            # Re-read the immutable ID and labels before deleting. A name alone is not ownership.
            current=$(gcloud compute instances describe "$vm" --zone="$zone" --format='value(id,labels.app,labels.workflow,labels.repository)') || { rc=1; continue; }
            IFS=$'\t' read -r current_id app workflow repo <<< "$current"
            [[ $current_id == "$id" && $app == skills-e2e && $workflow == skills-e2e-gcp && $repo == "$GITHUB_REPOSITORY_ID" ]] || continue
            gcloud compute instances delete "$vm" --zone="$zone" --quiet || rc=1
          done < "$RUNNER_TEMP/workers"
          exit "$rc"

  worker:
    if: inputs.sdk != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    environment: skills-e2e-gcp
    runs-on: ubuntu-latest
    timeout-minutes: 185
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        journey: [j3, j4, '056', '057', '058', '059', '063']
    env:
      CLOUDSDK_CORE_PROJECT: fagi-omega-staging
      CLOUDSDK_COMPUTE_ZONE: ${{ vars.GCP_E2E_ZONE }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
      JOURNEY: ${{ matrix.journey }}
      PR: ${{ github.event.pull_request.number || 0 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Pack only Git objects, before cloud authentication
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          BASE=${BASE:-$(git rev-parse HEAD^)}
          [[ $BASE =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE}^{commit}" || git fetch --no-tags --depth=1 origin "$BASE"
          files=(.git/objects)
          if test -f .git/shallow; then files+=(.git/shallow); fi
          tar czf "$RUNNER_TEMP/source.tgz" "${files[@]}"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: skill-pair-${{ github.sha }}
          path: ${{ runner.temp }}/pair
      - uses: actions/download-artifact@v4
        if: matrix.journey == '063'
        with:
          name: skill-application-wheels-${{ github.sha }}
          path: ${{ runner.temp }}/application
      - name: Bind same-run artifacts to independent producer outputs
        env:
          SDK: ${{ inputs.sdk }}
          TRACEAI: ${{ inputs.traceai }}
          PAIR_SHA: ${{ inputs.pair_sha256 }}
          APP_SHA: ${{ inputs.application_sha256 }}
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          [[ $SDK =~ ^[0-9a-f]{40}$ && $TRACEAI =~ ^[0-9a-f]{40}$ && $PAIR_SHA =~ ^[0-9a-f]{64}$ && $APP_SHA =~ ^[0-9a-f]{64}$ ]]
          echo "$PAIR_SHA  pair/pair.json" | sha256sum -c -
          jq -e --arg product "$GITHUB_SHA" --arg sdk "$SDK" --arg traceai "$TRACEAI" '.schema == 1 and .sources == {$product,$sdk,$traceai}' pair/pair.json >/dev/null
          jq -n --arg sdk "$SDK" --arg traceai "$TRACEAI" --arg pair_sha256 "$PAIR_SHA" --arg application_sha256 "$APP_SHA" \
            '{$sdk,$traceai,$pair_sha256,$application_sha256}' >receipt.json
          files=(receipt.json pair)
          if [[ $JOURNEY == 063 ]]; then files+=(application); fi
          tar czf inputs.tgz "${files[@]}"
      - uses: google-github-actions/auth@v2
        with:
          project_id: fagi-omega-staging
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_E2E_SERVICE_ACCOUNT || secrets.GCP_E2E_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Create private expiring worker
        id: create
        env:
          SUBNET: ${{ vars.GCP_E2E_SUBNET }}
        run: |
          set -euo pipefail
          : "${CLOUDSDK_COMPUTE_ZONE:?Configure the worker zone}" "${SUBNET:?Configure the isolated worker subnet}"
          nonce=$(tr -d '-' < /proc/sys/kernel/random/uuid)
          VM="skills-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$JOURNEY-${nonce:0:12}"
          id=$(gcloud compute instances create "$VM" --machine-type=e2-standard-8 \
            --subnet="$SUBNET" --no-address --no-service-account --no-scopes \
            --image-family=debian-12 --image-project=debian-cloud --boot-disk-size=160GB --boot-disk-auto-delete \
            --max-run-duration=3h --instance-termination-action=DELETE --no-restart-on-failure \
            --labels="app=skills-e2e,workflow=skills-e2e-gcp,repository=$GITHUB_REPOSITORY_ID,pr=$PR,run-id=$GITHUB_RUN_ID" \
            --metadata="enable-oslogin=TRUE,block-project-ssh-keys=TRUE,skills-head=$GITHUB_SHA,skills-base=$BASE,skills-tree=$TREE,skills-case=$JOURNEY" \
            --format='value(id)')
          # Failed creates (including ALREADY_EXISTS) never authorize teardown.
          [[ $id =~ ^[0-9]+$ ]]
          echo "VM=$VM" >> "$GITHUB_ENV"
          echo "instance_id=$id" >> "$GITHUB_OUTPUT"
      - name: Create a job-only OS Login key with a fixed deadline
        run: |
          umask 077
          ssh-keygen -q -t ed25519 -N '' -C skills-ci -f "$RUNNER_TEMP/skills-ssh"
          echo "KEY_EXPIRY=$(date -u -d '+3 hours' +%FT%TZ)" >> "$GITHUB_ENV"
      - name: Copy object pack and test inputs over IAP
        working-directory: ${{ runner.temp }}
        timeout-minutes: 7
        run: |
          for attempt in $(seq 1 20); do
            if gcloud compute ssh --ssh-key-file="$RUNNER_TEMP/skills-ssh" --ssh-key-expiration="$KEY_EXPIRY" "$VM" --tunnel-through-iap --command=true; then break; fi
            sleep 6
          done
          gcloud compute scp --ssh-key-file="$RUNNER_TEMP/skills-ssh" --ssh-key-expiration="$KEY_EXPIRY" --tunnel-through-iap source.tgz inputs.tgz "$VM:~/"
      - name: Run the registered case on its own stack
        timeout-minutes: 160
        run: |
          # No cloud credentials, SSH agent forwarding or controller working tree on the worker.
          gcloud compute ssh --ssh-key-file="$RUNNER_TEMP/skills-ssh" --ssh-key-expiration="$KEY_EXPIRY" "$VM" --tunnel-through-iap --ssh-flag='-oForwardAgent=no' --ssh-flag='-oServerAliveInterval=30' \
            --command="bash -s -- '$GITHUB_SHA' '$TREE'" <<'BOOTSTRAP'
          set -eu
          umask 077
          exec >"$HOME/worker-private.log" 2>&1
          echo checkout >stage
          op=unpack
          trap 'rc=$?; printf "failed %s %d %d\n" "$op" "$rc" "$LINENO" >> "$HOME/worker.log"; exit "$rc"' ERR
          mkdir src; tar xzf inputs.tgz; cd src
          op=apt; sudo apt-get -qq update; sudo apt-get -qq install -y git curl ca-certificates
          op=checkout; git init -q; tar xzf ../source.tgz; umask 022; git checkout -q --detach "$1"
          test "$(git rev-parse 'HEAD^{tree}')" = "$2"
          exec bash e2e/scripts/skills-gcp-worker.sh
          BOOTSTRAP
      - name: Refresh controller credentials for evidence and cleanup
        if: always() && steps.create.outcome == 'success' && steps.create.outputs.instance_id != ''
        uses: google-github-actions/auth@v2
        with:
          project_id: fagi-omega-staging
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_E2E_SERVICE_ACCOUNT || secrets.GCP_E2E_SERVICE_ACCOUNT }}
      - name: Collect bounded worker log before attempting to collect the browser result
        if: always() && steps.create.outcome == 'success'
        timeout-minutes: 2
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          mkdir -p public
          # No Playwright traces, request bodies, child output or actor files leave the VM.
          stage=$(gcloud compute ssh --ssh-key-file="$RUNNER_TEMP/skills-ssh" --ssh-key-expiration="$KEY_EXPIRY" "$VM" --tunnel-through-iap --command='head -c 32 ~/stage' 2>/dev/null) || stage=unavailable
          case "$stage" in checkout|bootstrap|packages|build|boot|provenance|playwright|completed) ;; *) stage=unavailable ;; esac
          {
            # Only fixed stage names and UTC timestamps, never the build/test log.
            gcloud compute ssh --ssh-key-file="$RUNNER_TEMP/skills-ssh" --ssh-key-expiration="$KEY_EXPIRY" "$VM" --tunnel-through-iap --command='head -c 1024 ~/stages.log' 2>/dev/null | \
              grep -Ex '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z (bootstrap|packages|build|boot|provenance|playwright|completed)' || true
            echo "last_stage=$stage"
          } > "public/$JOURNEY-stage.log"
          gcloud compute ssh --ssh-key-file="$RUNNER_TEMP/skills-ssh" --ssh-key-expiration="$KEY_EXPIRY" "$VM" --tunnel-through-iap --command='head -c 4096 ~/worker.log' 2>/dev/null | \
            grep -Ex '(stage (bootstrap|packages|build|boot|provenance|playwright|completed)|failed (unpack|apt|checkout|bootstrap|packages|build|boot|provenance|playwright|docker-repository|docker-install|docker-start|verify-pair|node-install|harness-install|browser-install|client-install|build-standalone|build-distributed|build-gateway) [0-9]{1,3} [0-9]{1,5})' > "public/$JOURNEY-worker.log" || true
          gcloud compute ssh --ssh-key-file="$RUNNER_TEMP/skills-ssh" --ssh-key-expiration="$KEY_EXPIRY" "$VM" --tunnel-through-iap --command='head -c 8192 ~/result.json' > raw 2>/dev/null
          jq -e --arg id "$JOURNEY" --arg sha "$GITHUB_SHA" --arg tree "$TREE" --arg base "$BASE" '
            def digest: type == "string" and test("\\A[a-f0-9]{64}\\z");
            def record:
              select(.product_head == $sha and .product_base == $base and .product_tree == $tree and
                (.sdk_commit | test("\\A[a-f0-9]{40}\\z")) and (.dirty | type == "boolean") and
                ([.runtime_digest,.fixture_hash] | all(digest)) and
                ([.package_hashes,.lockfile_hashes] | all(type == "array" and length > 0 and all(digest))) and
                (.name | IN("cold","configured","guest","campaign")) and
                (.status | IN("completed","failed","not_measured","registered"))) |
              {name,status,product_head,product_base,product_tree,sdk_commit,dirty,runtime_digest,fixture_hash,package_hashes,lockfile_hashes};
            select(.case == $id and .sha == $sha and (.pair_sha256 | digest) and (.count | type == "number") and
              (.passed | type == "boolean") and (.duration_ms | type == "number") and (.error_line | type == "number")) |
            {case:$id, sha:$sha, environment:"gcp", project:"fagi-omega-staging", pair_sha256, count, passed, duration_ms, error_line, records:[.records[] | record]}' raw > "public/$JOURNEY.json"
      - name: Remove only this worker's OS Login key
        if: always() && steps.create.outcome == 'success'
        run: |
          if [[ -f $RUNNER_TEMP/skills-ssh.pub ]]; then
            gcloud compute os-login ssh-keys remove --key-file="$RUNNER_TEMP/skills-ssh.pub" --quiet >/dev/null 2>&1 || echo 'Key not removed; fixed OS Login expiry still applies.'
          fi
      - name: Delete worker and boot disk
        if: always() && steps.create.outcome == 'success' && steps.create.outputs.instance_id != ''
        timeout-minutes: 5
        env:
          CREATED_ID: ${{ steps.create.outputs.instance_id }}
        run: |
          set -euo pipefail
          current=$(gcloud compute instances describe "$VM" --format='value(id)')
          [[ $current == "$CREATED_ID" ]] || { echo 'Worker ID changed; leaving it untouched.' >&2; exit 1; }
          gcloud compute instances delete "$VM" --quiet
      - uses: actions/upload-artifact@v4
        if: always() && steps.create.outcome == 'success'
        with:
          name: skills-gcp-${{ matrix.journey }}
          overwrite: true
          path: ${{ runner.temp }}/public/
          retention-days: 7
          if-no-files-found: error
