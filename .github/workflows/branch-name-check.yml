name: Branch name check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Reruns use a separate slot so diagnosing an old SHA cannot cancel newer work.
  group: >-
    branch-name-check-${{ github.event_name }}-${{
    github.event_name == 'pull_request' && github.run_attempt == '1' &&
    format('pr-{0}', github.event.pull_request.number) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.run_attempt == '1' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          # Pass the (attacker-influenceable on fork PRs) head_ref via env so
          # bash never sees the raw value during template expansion. Without
          # this indirection, a branch named e.g. `";id;"` would inject shell
          # commands into the runner.
          BRANCH: ${{ github.head_ref }}
        run: |
          # Skip validation for release branches and dependabot
          if [[ "$BRANCH" =~ ^(main|dev|release/.+|release-please--.+|dependabot/.+)$ ]]; then
            echo "✅ Skipping validation for $BRANCH"
            exit 0
          fi

          # Enforce type/short-description pattern
          PATTERN="^(feat|fix|chore|docs|refactor|test|perf)/[A-Za-z0-9][A-Za-z0-9._-]+$"

          if [[ "$BRANCH" =~ $PATTERN ]]; then
            echo "✅ Branch name '$BRANCH' follows convention"
          else
            echo "❌ Branch name '$BRANCH' does not follow the naming convention."
            echo ""
            echo "Expected: type/short-description"
            echo "  Types: feat, fix, chore, docs, refactor, test, perf"
            echo "  Example: fix/session-list-pagination"
            echo ""
            echo "See CONTRIBUTING.md for details."
            exit 1
          fi
