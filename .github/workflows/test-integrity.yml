name: Test integrity

# Advisory rollout: do not make this a required status check yet. Errors fail
# the job; warnings only ask for review. No branches filter, including stacked PRs.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      base:
        description: Base ref to compare with (the checker resolves the merge base)
        required: false
        default: origin/dev

permissions:
  contents: read

concurrency:
  group: test-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-integrity:
    name: Test integrity (new errors and review warnings)
    runs-on: ubuntu-latest
    # A dev-to-main promotion compares thousands of files; 5 minutes cut it off.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Annotation lines must match the PR head, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The self-tests run from the merge result, the same tree this workflow comes
      # from. A PR head that predates a newly added script would otherwise fail on a
      # file it never had. The self-tests build their own throwaway repositories.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: merged
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Self-test the gate and its throwaway-repository canary
        working-directory: merged
        run: python3 -I scripts/test_check_test_integrity.py
      - name: Self-test the before-push scripts
        working-directory: merged
        # scripts/check_new_tests_in_ci.py fails a change whose new test files no job
        # runs, so its own tests and the runner's are named here.
        run: |
          python3 -I scripts/test_check_new_tests_in_ci.py
          python3 -I scripts/test_before_push.py
      - name: Report test-integrity changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base || 'origin/dev' }}
        run: python3 -I scripts/check_test_integrity.py --base "$BASE_REF"
