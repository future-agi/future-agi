name: Frontend Feature Branch Pipeline

on:
  push:
    branches: [feat/*, fix/*, chore/*, docs/*, refactor/*, test/*, perf/*]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-feature.yml"

permissions:
  contents: read

concurrency:
  # A newer push to the branch cancels the older run.
  group: frontend-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branch name validation
  validate-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          branch_name="$GITHUB_REF_NAME"
          echo "Branch name: $branch_name"

          # Define the regex pattern for valid branch names
          # Types match Conventional Commits prefixes used in CONTRIBUTING.md.
          branch_regex="^(feat|fix|chore|docs|refactor|test|perf)\/[a-zA-Z0-9]+([a-zA-Z0-9\-]*[a-zA-Z0-9])?$"

          # Validate branch name
          if [[ ! $branch_name =~ $branch_regex ]]; then
            echo "❌ Invalid branch name: '$branch_name'"
            echo "Please see BRANCH_NAMING_CONVENTION.md for guidelines"
            exit 1
          fi

          echo "✅ Branch name '$branch_name' is valid"

  # Essential tests for feature branches
  essential-tests:
    runs-on: ubuntu-latest
    needs: validate-branch-name
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # The design-system check diffs against origin/dev or origin/main.
          fetch-depth: 0
          persist-credentials: false

      # A PR branch name, or even an open PR at this commit, isn't coverage.
      # Delegate only after the equivalent PR checks have passed. On a race
      # or lookup error the feature run keeps its own verdict.
      - name: Find equivalent frontend PR run
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const assert = require('node:assert/strict');
            const { execFileSync } = require('node:child_process');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim();
            const repo = context.repo;
            const id = context.payload.repository.id;
            const sha = context.sha;
            const branch = process.env.GITHUB_REF_NAME;
            const samePR = p => p.head?.repo?.id === id && p.base?.repo?.id === id && p.head.ref === branch && p.head.sha === sha;
            const passed = x => x.status === 'completed' && x.conclusion === 'success';
            const step = (job, name) => job.steps?.some(s => s.name === name && passed(s));
            const quality = ['Design system lint (changed lines)', 'Design system opt-outs', 'Type check (advisory)', 'Run all tests'];
            const marker = p => `PR inputs ${p.base.sha} ${sha} ${p.merge_commit_sha}`;
            function equivalent(p, run, jobs, nearest, sameTree) {
              return samePR(p) && p.base.sha === nearest && sameTree && run?.head_repository?.id === id &&
                run.head_sha === sha && passed(run) && run.pull_requests?.some(r => r.number === p.number &&
                  r.head.sha === sha && r.base.sha === p.base.sha) &&
                jobs.some(j => j.name === 'quality-and-tests' && passed(j) && [...quality, marker(p)].every(n => step(j, n))) &&
                jobs.some(j => j.name === 'build-check' && passed(j) && step(j, 'Build application'));
            }

            // Exercise the decision independently of API availability. Matching a
            // branch, a stale job or only the tree of a stacked PR is not proof.
            const fixture = { number: 1, base: { repo: { id }, sha: 'base' }, head: { repo: { id }, ref: branch, sha }, merge_commit_sha: 'merge' };
            const success = { status: 'completed', conclusion: 'success' };
            const pending = { status: 'in_progress', conclusion: null };
            const proof = { head_repository: { id }, head_sha: sha, ...success, pull_requests: [fixture] };
            const checks = [
              { name: 'quality-and-tests', ...success, steps: [...quality, marker(fixture)].map(name => ({ name, ...success })) },
              { name: 'build-check', ...success, steps: [{ name: 'Build application', ...success }] },
            ];
            assert(equivalent(fixture, proof, checks, 'base', true));
            const unfinished = checks.map(j => ({ ...j, ...pending, steps: j.steps.map(s =>
              ['Run all tests', 'Build application'].includes(s.name) ? { ...s, ...pending } : s) }));
            assert(!equivalent(fixture, { ...proof, ...pending }, unfinished, 'base', true));
            for (const i of [0, 1]) {
              for (const state of [pending, { ...success, conclusion: 'failure' }, { ...success, conclusion: 'cancelled' }]) {
                assert(!equivalent(fixture, proof, checks.with(i, { ...checks[i], ...state }), 'base', true));
              }
              assert(!equivalent(fixture, proof, checks.with(i, { ...checks[i], steps: unfinished[i].steps }), 'base', true));
            }
            assert(!equivalent({ ...fixture, head: { ...fixture.head, repo: { id: -1 } } }, proof, checks, 'base', true));
            assert(!equivalent(fixture, { ...proof, head_sha: 'old' }, checks, 'base', true));
            assert(!equivalent(fixture, proof, checks, 'stack-parent', true));
            assert(!equivalent(fixture, proof, checks, 'base', false));
            assert(!equivalent(fixture, proof, checks.slice(0, 1), 'base', true));
            assert(!equivalent(fixture, { ...proof, status: 'completed', conclusion: 'cancelled' }, checks, 'base', true));

            async function lookup() {
              const { data: pulls } = await github.rest.pulls.list({ ...repo, state: 'open', head: `${repo.owner}:${branch}` });
              const matches = pulls.filter(samePR);
              if (matches.length !== 1) return;
              const [pr] = matches;
              if (!/^[0-9a-f]{40}$/.test(pr.merge_commit_sha)) return;

              // Match lint-ds-changed's nearest-base contract. If the PR would
              // lint fewer lines than the feature push, retain the feature check.
              let nearest, best = Infinity;
              for (const ref of ['origin/dev', 'origin/main']) {
                let base;
                try { base = git('merge-base', 'HEAD', ref); } catch { continue; }
                const distance = Number(git('rev-list', '--count', `${base}..HEAD`));
                if (distance < best) { nearest = base; best = distance; }
              }
              if (nearest !== pr.base.sha) return;
              const { data: merge } = await github.rest.git.getCommit({ ...repo, commit_sha: pr.merge_commit_sha });
              const sameTree = git('rev-parse', 'HEAD^{tree}') === merge.tree.sha;
              if (!sameTree) return;
              const { data } = await github.rest.actions.listWorkflowRuns({ ...repo, workflow_id: 'frontend-develop.yml', event: 'pull_request', head_sha: sha, per_page: 1 });
              const [run] = data.workflow_runs;
              if (!run || !passed(run)) return;
              const { data: { jobs } } = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs', {
                ...repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100,
              });
              if (equivalent(pr, run, jobs, nearest, sameTree)) return `${run.html_url}/attempts/${run.run_attempt}`;
            }
            let url;
            try { url = await lookup(); } catch (error) { core.warning(`PR evidence unavailable: ${error.message}`); }
            core.setOutput('covered', Boolean(url));
            await core.summary.addRaw(url
              ? `Frontend lint, type check, tests and build delegated to [the equivalent PR run](${url}); see it for the verdict.`
              : 'No equivalent PR run confirmed; running the feature checks.').write();

      - name: Setup Node.js
        if: steps.pr.outputs.covered != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        if: steps.pr.outputs.covered != 'true'
        run: yarn install --frozen-lockfile

      - name: Design system lint (changed lines)
        if: steps.pr.outputs.covered != 'true'
        run: yarn lint:ds:changed

      - name: Design system opt-outs
        if: steps.pr.outputs.covered != 'true'
        run: yarn ds:optouts

      # The real compiler now runs (frontend/tsconfig.json). 36 generated-contract
      # diagnostics remain, so this stays advisory until they are resolved, as in
      # frontend-develop.yml.
      - name: Type check (advisory)
        if: steps.pr.outputs.covered != 'true'
        continue-on-error: true
        run: yarn type-check

      - name: Run unit tests
        if: steps.pr.outputs.covered != 'true'
        run: yarn test:unit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build check
        if: steps.pr.outputs.covered != 'true'
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  # Feature branch summary
  feature-summary:
    runs-on: ubuntu-latest
    needs: [validate-branch-name, essential-tests]
    if: always()
    steps:
      - name: Feature Branch Summary
        run: |
          echo "## ✨ Feature Branch Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch Validation: ${{ needs.validate-branch-name.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Essential Tests: ${{ needs.essential-tests.result }}" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.validate-branch-name.result }}" == "success" && "${{ needs.essential-tests.result }}" == "success" ]]; then
            echo "Feature pipeline completed; see Essential Tests for the source of the frontend verdict." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some checks failed - Please fix before merging" >> $GITHUB_STEP_SUMMARY
          fi
