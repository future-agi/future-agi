name: PR approval

# Approves a pull request into dev for the merge queue, so it does not wait
# for a second reviewer. Every merge to dev still goes through the queue and
# its three required checks. Dev dismisses stale approvals on push, so each
# new head is approved again. The repository variable APPROVAL_MODE picks the
# rule:
#
# - admin (the default, also when unset): approve when the author and the
#   event's sender are both repository admins, so a push by a non-admin to an
#   admin's branch keeps the normal review.
# - observe: the admin rule keeps approving; the devflow rule only writes
#   what it would do to the job summary, so its decisions can be compared
#   with people's before the switch.
# - devflow: on a passing devflow agent review by the assigned reviewer, the
#   final tier (the highest of the reviewer's tier, the diff-only tier_check
#   and a deterministic scan of the changed files) decides. Low: approve the
#   head and add devflow:train so the batch train may take it. Medium: no
#   bot approval; once a person with write access approves the head (a
#   pull_request_review event), add devflow:train. High: the needs-human
#   label, and the pull request goes alone; under CI_SCOPE_MODE=light the
#   job also adds ci:full and re-runs the head's light Backend CI run in full. When the variable
#   APPROVAL_MODE_TIGHT is "1", the lowest tier is medium; it never adds
#   needs-human. Paths that need a person are the floor block in
#   .github/CODEOWNERS: the dev ruleset's code owner review enforces it,
#   whatever the bot approves.
#   See .github/scripts/devflow_approval.py.
#
# pull_request and pull_request_review run this file from the pull request's
# merge with dev, never from main. Fork pull requests and drafts are ignored;
# only same-repository pull requests get a token that can write. This file
# replaces admin-pr-approval.yml, whose pull_request_target copy on main is
# disabled when devflow mode is switched on.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
    branches: [dev]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  admin:
    # Only events whose sender pushed or opened the change: a label or a review
    # by an admin must not approve a non-admin's push.
    if: >-
      vars.APPROVAL_MODE != 'devflow' &&
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      # Not main's admin-pr-approval group: groups are repo-wide, and the two
      # copies would cancel each other.
      group: devflow-approval-admin-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Approve the head commit when the author is a repository admin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Both the author and whoever triggered this event (on synchronize, the
          # pusher) must be admins: a non-admin push to an admin's branch is
          # reviewed normally.
          for who in "$AUTHOR" "$SENDER"; do
            permission=$(gh api "repos/$REPO/collaborators/$who/permission" --jq .permission)
            if [[ $permission != admin ]]; then
              echo "$who has $permission permission; normal review applies."
              exit 0
            fi
          done
          # Approve only the commit this event is about; a later push gets its own run.
          current=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [[ $current != "$HEAD_SHA" ]]; then
            echo "Head moved to $current; the newer event approves it."
            exit 0
          fi
          # Main's copy of this workflow can approve the same head until the next release.
          approved=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and .state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\") | .id")
          if [[ -n $approved ]]; then
            echo "Already approved $HEAD_SHA."
            exit 0
          fi
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" \
            -f commit_id="$HEAD_SHA" -f event=APPROVE \
            -f body="Approved automatically: the author is a repository admin. The change still lands only through the dev merge queue and its required checks." \
            --jq '"approved \(.commit_id)"'

  devflow:
    # A new review, a new head, or the devflow:reviewed label (the nudge when a
    # review was posted by a token whose events start no workflow).
    if: >-
      (vars.APPROVAL_MODE == 'devflow' || vars.APPROVAL_MODE == 'observe') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'dev' &&
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'devflow:reviewed')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write # adds the needs-human, ci:full or devflow:train label
      actions: write # re-runs a high pull request's light Backend CI run in full
    # Job level, so a skipped run (another label) never cancels a decision.
    # Each run reads the pull request live, so the newest queued run is enough.
    concurrency:
      group: devflow-approval-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Approve, ask for a person, or wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          APPROVAL_MODE: ${{ vars.APPROVAL_MODE }}
          APPROVAL_MODE_TIGHT: ${{ vars.APPROVAL_MODE_TIGHT }}
          CI_SCOPE_MODE: ${{ vars.CI_SCOPE_MODE }}
        run: python3 -I .github/scripts/devflow_approval.py --repo "$REPO" --pr "$PR" --mode "$APPROVAL_MODE"
