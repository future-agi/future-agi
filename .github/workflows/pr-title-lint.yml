# Conventional-commit PR titles feed release-please's notes; this makes the
# format a merge gate. Skips bot PRs and the dev->main release PR (whose title
# is a release name, not a commit).
name: pr-title-lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, main]

permissions:
  pull-requests: read

concurrency:
  # Reruns use a separate slot so diagnosing an old SHA cannot cancel newer work.
  group: >-
    pr-title-lint-${{ github.event_name }}-${{
    github.event_name == 'pull_request' && github.run_attempt == '1' &&
    (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') &&
    format('pr-{0}', github.event.pull_request.number) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.run_attempt == '1' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    if: >-
      !startsWith(github.head_ref, 'release-please--') &&
      !(github.head_ref == 'dev' && github.base_ref == 'main')
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            ci
            revert
          requireScope: false
