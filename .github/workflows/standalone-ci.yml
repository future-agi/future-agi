# Standalone install CI. Builds futureagi/standalone from this checkout (the
# slim backend variant, frontend, fi-collector and agentcc-gateway images
# first, then deploy/standalone/Dockerfile on top of them, as a release does),
# checks the compressed size of all five and of the whole standalone install
# against scripts/image_size_budget.json (the same check a release runs), then
# runs ./bin/install on a fresh runner and drives the standalone stack end to
# end: health, UI, first-run setup checks, supervised programs, sign-in, API
# keys, an OTLP/HTTP trace through fi-collector on :4318 read back through the
# Observe API, and a workflow completed by the in-process Temporal worker.
#
# linux/amd64 runs whenever the standalone install can change. linux/arm64
# (native runner: build, binary check and size budget, no install) runs when
# what gets compiled or bundled changes: backend dependencies, the backend
# Dockerfile, or deploy/standalone.
#
# Size budget: every image must fit its budget in
# scripts/image_size_budget.json, and so must what a fresh standalone install
# downloads (standalone + postgres + clickhouse, distinct layers); a PR that
# needs more changes that file, where review sees it. On top of that,
# futureagi/standalone may grow at most STANDALONE_SIZE_BUDGET_PERCENT
# (repository variable, default 10; 0 turns it off) over :latest; a PR that
# grows it on purpose takes the `image-size-approved` label (re-run the failed
# job after adding it).
#
# Labels: all five images get the VERSION/REVISION/CREATED build args a
# release passes (TESTING.md › Image conventions), and the job checks that each one carries
# the org.opencontainers.image.* labels, as build-image-multiarch.yml does.
#
# The default (standard) backend variant is not built here: e2e-ci.yml builds
# it for every backend change (the Distributed stack it tests), its build-time
# smoke test (futureagi/docker/runtime_smoke.py) checks the extras, git, uv,
# ffmpeg and NLTK data it promises, and a release checks its size budget and
# contents again before any tag moves.
#
# Upgrade (weekly, on demand, and on a PR that carries the upgrade-check
# label when the run starts: add it, then push): v1.41.1, whose
# docker-compose.yml was the Distributed stack, installed with its own
# ./bin/install and sent a trace, then ./bin/install re-run at this commit.
# The install must stay Distributed (COMPOSE_FILE=docker-compose.distributed.yml
# in .env) and run this commit's images, and its account must still sign in
# and read the trace.
name: Standalone install CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    paths:
      - "docker-compose.yml"
      - "deploy/standalone/**"
      - "deploy/tests/**"
      - "bin/install*"
      - "bin/lib/**"
      - "bin/dev"
      - ".env.example"
      - "futureagi/**"
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - "frontend/security-headers.conf"
      - "fi-collector/Dockerfile"
      - "agentcc-gateway/Dockerfile"
      - "scripts/image_size_budget.*"
      - "scripts/install-smoke.sh"
      - "scripts/test_install_smoke.py"
      - "scripts/reclaim-runner-disk.sh"
      - ".github/workflows/standalone-ci.yml"
  workflow_dispatch:
  # The upgrade job only.
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter and the size-budget label read the PR

concurrency:
  group: standalone-ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Layer caches, read only: e2e-ci.yml's (amd64, written on every push to
  # dev and main) and the release builds' (per architecture).
  CACHE_REPO: ghcr.io/future-agi/future-agi/e2e-cache
  BUILD_CACHE: ghcr.io/future-agi/future-agi/build-cache
  # Registry on the runner: buildx pushes the component images here so the
  # standalone build can use them as bases, and the size check reads the
  # compressed layer sizes from the manifest it stores.
  REGISTRY: localhost:5000
  SIZE_BUDGET_PERCENT: ${{ vars.STANDALONE_SIZE_BUDGET_PERCENT || '10' }}
  SIZE_WAIVER_LABEL: image-size-approved

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      install: ${{ steps.filter.outputs.install || steps.always.outputs.install }}
      arches: ${{ steps.arches.outputs.arches }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          # Pushes compare with the branch before the push; PRs with their base.
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          filters: |
            install:
              - 'docker-compose.yml'
              - 'deploy/standalone/**'
              - 'deploy/tests/**'
              - 'bin/install*'
              - 'bin/lib/**'
              - 'bin/dev'
              - '.env.example'
              - 'futureagi/**'
              - 'frontend/Dockerfile'
              - 'frontend/.dockerignore'
              - 'frontend/security-headers.conf'
              - 'fi-collector/Dockerfile'
              - 'agentcc-gateway/Dockerfile'
              - 'scripts/image_size_budget.*'
              - 'scripts/install-smoke.sh'
              - 'scripts/test_install_smoke.py'
              - 'scripts/reclaim-runner-disk.sh'
              - '.github/workflows/standalone-ci.yml'
            arm64:
              - 'deploy/standalone/**'
              - 'futureagi/Dockerfile.oss'
              - 'futureagi/.dockerignore'
              - 'futureagi/docker/**'
              - 'futureagi/bin/install_nltk_data.py'
              - 'futureagi/requirements.txt'
              - 'futureagi/pyproject.toml'
              - 'futureagi/uv.lock'
              - 'frontend/Dockerfile'
              - 'fi-collector/Dockerfile'
              - 'agentcc-gateway/Dockerfile'
              - 'scripts/image_size_budget.*'
              - '.github/workflows/standalone-ci.yml'
      - id: always
        if: github.event_name == 'workflow_dispatch'
        run: echo "install=true" >> "$GITHUB_OUTPUT"
      - id: arches
        env:
          ARM64: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.arm64 == 'true' }}
        run: |
          if [ "$ARM64" = "true" ]; then
            echo 'arches=["amd64","arm64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'arches=["amd64"]' >> "$GITHUB_OUTPUT"
          fi

  # The Standalone first boot (deploy/standalone/bin/bootstrap.py and its
  # starting page), the production overlay's checks and the install smoke
  # checks, with fakes for the backend, the datastores and docker: standard
  # library only, seconds to run.
  standalone-unit:
    name: standalone bootstrap unit tests
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deploy/tests (standalone bootstrap, first run, production setup) and install-smoke.sh
        run: |
          python -m unittest discover -s deploy/tests -p 'test_standalone_*.py' -v
          python -m unittest discover -s deploy/tests -p 'test_production_setup.py' -v
          python -m unittest discover -s scripts -p 'test_install_smoke.py' -v

  standalone-install:
    name: standalone install (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.install == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.changes.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read # ghcr layer caches
      pull-requests: read
    env:
      # Same build args as release-images.yml, pointed at this run's images.
      STANDALONE_BUILD_ARGS: |
        BACKEND_IMAGE=localhost:5000/futureagi/future-agi:ci
        FRONTEND_IMAGE=localhost:5000/futureagi/frontend:ci
        FI_COLLECTOR_IMAGE=localhost:5000/futureagi/fi-collector:ci
        AGENTCC_GATEWAY_IMAGE=localhost:5000/futureagi/agentcc-gateway:ci
      # ./bin/install then uses the image this job built (docker compose
      # resolves futureagi/standalone:local) instead of pulling a release.
      FUTURE_AGI_VERSION: local
      FAGI_ADMIN_EMAIL: ci-admin@example.com
      FAGI_ADMIN_NAME: CI Admin
      FAGI_ADMIN_PASSWORD: Ci-Smoke-2026!x
      SMOKE_PROJECT: ci-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        # Same move as e2e-ci.yml: docker's data goes to /mnt, which has room
        # for the build cache, the local registry and the running stack.
        # Before setup-buildx, whose builder container lives under the root.
        if: matrix.arch == 'amd64'
        run: scripts/reclaim-runner-disk.sh

      - name: Start the local registry
        # Published on every address family: `localhost` resolves to ::1
        # first on some hosts.
        run: |
          docker run -d --name ci-registry -p 5000:5000 registry:2.8.3
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:5000/v2/ >/dev/null; do sleep 1; done'

      - uses: docker/setup-buildx-action@v3
        with:
          # The builder container reaches the registry on the runner's loopback.
          driver-opts: network=host

      - name: ghcr login (layer cache reads)
        # Fork PRs get no token and build cold until the cache packages are
        # public.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build args match the Dockerfiles
        # docker only warns about an unused --build-arg, so a renamed ARG
        # would quietly build from the Dockerfile's default: the :latest
        # images, or the default backend variant instead of -slim. Covers this
        # workflow and the local builds of ./bin/install --from-source,
        # install.ps1 -FromSource and ./bin/dev (bin/lib/build-local.*): the
        # standalone build's args against deploy/standalone/Dockerfile, every
        # other build arg (the backend's IMAGE_VARIANT) against
        # futureagi/Dockerfile.oss. The scripts build nothing of their own.
        run: |
          set -euo pipefail
          declared() { sed -nE 's/^[[:space:]]*ARG[[:space:]]+([A-Za-z_][A-Za-z0-9_]*).*/\1/p' "$1" | sort -u; }
          names() { { grep -ohE -- "--build-arg['\", ]+[A-Za-z_][A-Za-z0-9_]*=" || true; } \
            | sed -E "s/.*['\", ]([A-Za-z_][A-Za-z0-9_]*)=$/\1/" | sort -u; }
          standalone=$({
            printf '%s\n' "$STANDALONE_BUILD_ARGS" | sed -nE 's/^[[:space:]]*([A-Za-z_][A-Za-z0-9_]*)=.*/\1/p'
            { sed -n '/build_local_image futureagi\/standalone:local/,/[^\\]$/p' bin/lib/build-local.sh
              sed -n "/Build-Image 'futureagi\/standalone:local'/,/)/p" bin/lib/build-local.ps1; } | names
          } | sort -u)
          backend=$(cat bin/lib/build-local.sh bin/lib/build-local.ps1 | names | comm -23 - <(printf '%s\n' "$standalone"))
          failed=0
          if own=$(grep -l -- '--build-arg' bin/install bin/install.ps1 bin/dev); then
            echo "::error::build the local images with bin/lib/build-local.*, not in $(paste -sd' ' - <<<"$own")"
            failed=1
          fi
          unknown=$(comm -13 <(declared deploy/standalone/Dockerfile) <(printf '%s\n' "$standalone"))
          if [ -n "$unknown" ]; then
            echo "::error::build args not declared in deploy/standalone/Dockerfile: $(paste -sd' ' - <<<"$unknown")"
            failed=1
          fi
          unknown=$(comm -13 <(declared futureagi/Dockerfile.oss) <(printf '%s\n' "$backend" | sed '/^$/d'))
          if [ -n "$unknown" ]; then
            echo "::error::build args not declared in futureagi/Dockerfile.oss: $(paste -sd' ' - <<<"$unknown")"
            failed=1
          fi
          echo "standalone: $(paste -sd' ' - <<<"$standalone"); backend: $(paste -sd' ' - <<<"$backend")"
          exit "$failed"

      - name: Image label build args
        id: labels
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          {
            echo "revision=$revision"
            echo 'args<<EOF'
            echo "VERSION=ci"
            echo "REVISION=$revision"
            echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build backend image (slim variant)
        # The base of futureagi/standalone, as in a release (-slim). Its
        # dependency layers are the default variant's, so it reads those
        # caches too.
        uses: docker/build-push-action@v5
        with:
          context: futureagi
          file: futureagi/Dockerfile.oss
          push: true
          provenance: false
          build-args: |
            IMAGE_VARIANT=slim
            ${{ steps.labels.outputs.args }}
          tags: ${{ env.REGISTRY }}/futureagi/future-agi:ci
          cache-from: |
            type=registry,ref=${{ env.BUILD_CACHE }}:backend-slim-${{ matrix.arch }}
            type=registry,ref=${{ env.BUILD_CACHE }}:backend-${{ matrix.arch }}
            ${{ matrix.arch == 'amd64' && format('type=registry,ref={0}:backend', env.CACHE_REPO) || '' }}

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          provenance: false
          build-args: ${{ steps.labels.outputs.args }}
          tags: ${{ env.REGISTRY }}/futureagi/frontend:ci
          cache-from: |
            type=registry,ref=${{ env.BUILD_CACHE }}:frontend-${{ matrix.arch }}
            ${{ matrix.arch == 'amd64' && format('type=registry,ref={0}:frontend', env.CACHE_REPO) || '' }}

      - name: Build fi-collector image
        uses: docker/build-push-action@v5
        with:
          context: fi-collector
          file: fi-collector/Dockerfile
          push: true
          provenance: false
          build-args: ${{ steps.labels.outputs.args }}
          tags: ${{ env.REGISTRY }}/futureagi/fi-collector:ci
          cache-from: |
            type=registry,ref=${{ env.BUILD_CACHE }}:fi-collector-${{ matrix.arch }}
            ${{ matrix.arch == 'amd64' && format('type=registry,ref={0}:fi-collector', env.CACHE_REPO) || '' }}

      - name: Build agentcc-gateway image
        uses: docker/build-push-action@v5
        with:
          context: agentcc-gateway
          file: agentcc-gateway/Dockerfile
          push: true
          provenance: false
          build-args: ${{ steps.labels.outputs.args }}
          tags: ${{ env.REGISTRY }}/futureagi/agentcc-gateway:ci
          cache-from: |
            type=registry,ref=${{ env.BUILD_CACHE }}:agentcc-gateway-${{ matrix.arch }}
            ${{ matrix.arch == 'amd64' && format('type=registry,ref={0}:gateway', env.CACHE_REPO) || '' }}

      - name: Build futureagi/standalone from those images
        uses: docker/build-push-action@v5
        with:
          context: deploy/standalone
          file: deploy/standalone/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/futureagi/standalone:ci
          build-args: |
            ${{ env.STANDALONE_BUILD_ARGS }}
            ${{ steps.labels.outputs.args }}

      - name: OCI labels on every image
        # The same check build-image-multiarch.yml runs before a release
        # tags anything (TESTING.md › Image conventions).
        shell: bash
        env:
          REVISION: ${{ steps.labels.outputs.revision }}
        run: |
          set -euo pipefail
          failed=0
          for image in future-agi frontend fi-collector agentcc-gateway standalone; do
            labels=$(docker buildx imagetools inspect "$REGISTRY/futureagi/$image:ci" --format '{{json .Image}}' \
              | jq -c 'if has("config") then .config.Labels else (to_entries[0].value.config.Labels) end')
            for key in title description source url documentation vendor licenses version revision created; do
              if ! jq -e --arg k "org.opencontainers.image.$key" '.[$k] // "" | length > 0' <<<"$labels" >/dev/null; then
                echo "::error::futureagi/$image: label org.opencontainers.image.$key is missing"
                failed=1
              fi
            done
            got=$(jq -r '.["org.opencontainers.image.revision"] // ""' <<<"$labels")
            if [ "$got" != "$REVISION" ]; then
              echo "::error::futureagi/$image: revision label is '$got', expected '$REVISION'"
              failed=1
            fi
            echo "futureagi/$image: $(jq -r '[.["org.opencontainers.image.title"], .["org.opencontainers.image.licenses"]] | join(" | ")' <<<"$labels")"
          done
          exit "$failed"

      - name: Verify the bundled binaries on linux/${{ matrix.arch }}
        # The same script release-images.yml runs before any tag moves.
        run: |
          docker pull --quiet "$REGISTRY/futureagi/standalone:ci"
          docker run --rm --entrypoint /opt/futureagi/bin/verify-binaries "$REGISTRY/futureagi/standalone:ci"

      - name: Size budget (linux/${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
          STANDALONE_GROWTH_PERCENT: ${{ env.SIZE_BUDGET_PERCENT }}
          WAIVER_LABEL: ${{ env.SIZE_WAIVER_LABEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        # The same check build-image-multiarch.yml runs before a release tags
        # anything, against this run's images.
        run: |
          set -uo pipefail
          check() { # image, tag suffix of its budget and baseline, extra args...
            local image=$1 suffix=$2
            shift 2
            python3 scripts/image_size_budget.py check --image "$image" "--tag-suffix=$suffix" \
              --arch "$ARCH" --ref "$REGISTRY/$image:ci" --baseline "docker.io/$image:latest$suffix" "$@"
          }
          failed=0
          check futureagi/future-agi -slim || failed=1
          check futureagi/frontend "" || failed=1
          check futureagi/fi-collector "" || failed=1
          check futureagi/agentcc-gateway "" || failed=1
          check futureagi/standalone "" --standalone-install \
            --max-growth-percent "$STANDALONE_GROWTH_PERCENT" || failed=1
          exit "$failed"

      # ---- linux/amd64 only: install and drive the standalone stack ----------

      - name: Tag the image for the installer and drop the build cache
        # The install needs the disk more than a finished build does.
        if: matrix.arch == 'amd64'
        run: |
          docker tag "$REGISTRY/futureagi/standalone:ci" futureagi/standalone:local
          docker buildx prune -af || true
          df -h / /mnt

      - name: ./bin/install (standalone stack, fresh runner)
        if: matrix.arch == 'amd64'
        timeout-minutes: 30
        # CI=true makes the installer non-interactive; FAGI_ADMIN_* above has
        # it create the first account.
        run: ./bin/install -y

      - name: Smoke-test the running stack
        if: matrix.arch == 'amd64'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          . scripts/install-smoke.sh
          api=$SMOKE_API
          pass() { echo "PASS  $*"; echo "- PASS: $*" >> "$GITHUB_STEP_SUMMARY"; }
          fail() { echo "::error::$*"; echo "- FAIL: $*" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "### Standalone install smoke test (linux/amd64)" >> "$GITHUB_STEP_SUMMARY"

          curl -fsS --max-time 10 -o /dev/null "$api/health/" || fail "API /health/ on :8000"
          pass "API /health/ on :8000"
          curl -fsS --max-time 10 -o /dev/null http://127.0.0.1:3000/ || fail "UI on :3000"
          pass "UI on :3000"

          # The first-run screen blocks sign-up while a required check fails.
          setup_ok() {
            curl -fsS --max-time 30 "$api/api/setup-checks/?mode=experiment" > "$RUNNER_TEMP/setup-checks.json" &&
              jq -e '.result.status == "ok"' "$RUNNER_TEMP/setup-checks.json" >/dev/null
          }
          if ! eventually 120 setup_ok; then
            jq -r '.result.checks[]? | select(.status != "passed") | "\(.id): \(.status)"' \
              "$RUNNER_TEMP/setup-checks.json" || true
            fail "first-run setup checks report issues (GET /api/setup-checks/)"
          fi
          pass "setup checks: $(jq -r '[.result.checks[] | "\(.id)=\(.status)"] | join(", ")' "$RUNNER_TEMP/setup-checks.json")"

          # A program that went FATAL leaves /health/ green; only one-shot
          # programs (the bootstrap) may have exited.
          programs=$(docker compose exec -T app supervisorctl -c /etc/futureagi/supervisord.conf status || true)
          printf '%s\n' "$programs"
          down=$(awk '$2 != "RUNNING" && $2 != "EXITED"' <<<"$programs")
          if [ -z "$programs" ] || [ -n "$down" ]; then
            fail "supervised programs not running: ${down:-no status}"
          fi
          pass "every supervised program is running"

          token=$(smoke_sign_in) || fail "sign-in as $FAGI_ADMIN_EMAIL (POST /accounts/token/)"
          pass "sign-in with the account ./bin/install created"

          keys=$(smoke_keys "$token") || fail "no API key pair from GET /accounts/keys/"
          { read -r api_key; read -r secret_key; } <<<"$keys"
          echo "::add-mask::$secret_key"
          pass "API key pair issued"

          why=$(smoke_send_trace "$SMOKE_PROJECT" "$api_key" "$secret_key" 2>&1) || fail "$why"
          pass "OTLP/HTTP trace accepted by fi-collector on :4318"

          eventually 180 smoke_trace_readable "$token" "$SMOKE_PROJECT" \
            || fail "the trace never showed up in the Observe API: $(head -c 300 "$RUNNER_TEMP/spans.json" 2>/dev/null || true)"
          pass "trace read back through the Observe API (project $SMOKE_PROJECT)"

          workflow_completed() {
            docker compose exec -T app temporal workflow count --address 127.0.0.1:7233 \
              --query 'ExecutionStatus="Completed"' 2>/dev/null | grep -Eq 'Total: [1-9]'
          }
          eventually 180 workflow_completed || fail "no Temporal workflow completed; is the in-process worker polling?"
          pass "Temporal workflows completed by the worker in the API process"

      - name: Footprint
        if: matrix.arch == 'amd64'
        run: |
          sleep 30
          {
            echo "### Standalone install footprint (docker stats)"
            echo '```'
            docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect diagnostics
        if: failure() && matrix.arch == 'amd64'
        run: |
          out="$RUNNER_TEMP/diagnostics"
          mkdir -p "$out"
          cp install-*.log "$RUNNER_TEMP"/*.json "$RUNNER_TEMP"/*.txt "$out/" 2>/dev/null || true
          docker compose ps -a > "$out/ps.txt" 2>&1 || true
          docker compose exec -T app supervisorctl -c /etc/futureagi/supervisord.conf status \
            > "$out/supervisorctl.txt" 2>&1 || true
          docker compose logs --no-color --tail 3000 app postgres clickhouse > "$out/compose.log" 2>&1 || true
          tail -n 150 "$out/compose.log"

      - uses: actions/upload-artifact@v4
        if: failure() && matrix.arch == 'amd64'
        with:
          name: standalone-install-diagnostics
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 7

  upgrade:
    name: upgrade from v1.41.1 (Distributed)
    # The label is read from the event: a re-run keeps the labels of the run
    # it repeats.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'upgrade-check'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read # ghcr layer caches
    env:
      FROM_VERSION: v1.41.1
      FAGI_ADMIN_EMAIL: ci-admin@example.com
      FAGI_ADMIN_PASSWORD: Ci-Smoke-2026!x
      SMOKE_PROJECT: ci-upgrade
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the v1.41.1 tag

      - name: Reclaim runner disk
        # Same move as standalone-install: two releases' images and a build.
        run: scripts/reclaim-runner-disk.sh

      - uses: docker/setup-buildx-action@v3

      - name: ghcr login (layer cache reads)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep this commit's smoke checks
        # The v1.41.1 checkout has no scripts/install-smoke.sh.
        run: cp scripts/install-smoke.sh "$RUNNER_TEMP/"

      - name: ./bin/install at v1.41.1
        timeout-minutes: 40
        env:
          # Its own images rather than :latest; it builds fi-collector from
          # its checkout, as it always did.
          FUTURE_AGI_VERSION: ${{ env.FROM_VERSION }}
          FRONTEND_VERSION: ${{ env.FROM_VERSION }}
          AGENTCC_GATEWAY_VERSION: ${{ env.FROM_VERSION }}
          # With FAGI_ADMIN_EMAIL and FAGI_ADMIN_PASSWORD it creates the first
          # account. The install at this commit does not get the name, so it
          # does not try again.
          FAGI_ADMIN_NAME: CI Admin
        run: |
          git -c advice.detachedHead=false checkout "$FROM_VERSION"
          ./bin/install -y

      - name: Send a trace to the v1.41.1 install
        timeout-minutes: 10
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/install-smoke.sh"
          token=$(smoke_sign_in)
          keys=$(smoke_keys "$token")
          { read -r api_key; read -r secret_key; } <<<"$keys"
          echo "::add-mask::$secret_key"
          smoke_send_trace "$SMOKE_PROJECT" "$api_key" "$secret_key"
          eventually 180 smoke_trace_readable "$token" "$SMOKE_PROJECT"

      - name: Back to this commit
        run: git -c advice.detachedHead=false checkout "$GITHUB_SHA"

      # This commit's Distributed images, tagged `local` as --from-source tags
      # them, from the layer caches e2e-ci.yml and the release builds keep.
      # Not fi-collector: ./bin/install builds it (`up --build`, its build:
      # section in docker-compose.distributed.yml).
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: futureagi
          file: futureagi/Dockerfile.oss
          load: true
          tags: futureagi/future-agi:local
          cache-from: |
            type=registry,ref=${{ env.CACHE_REPO }}:backend
            type=registry,ref=${{ env.BUILD_CACHE }}:backend-amd64

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          tags: futureagi/frontend:local
          cache-from: type=registry,ref=${{ env.CACHE_REPO }}:frontend

      - name: Build agentcc-gateway image
        uses: docker/build-push-action@v5
        with:
          context: agentcc-gateway
          file: agentcc-gateway/Dockerfile
          load: true
          tags: futureagi/agentcc-gateway:local
          cache-from: type=registry,ref=${{ env.CACHE_REPO }}:gateway

      - name: Drop the build cache
        run: |
          docker buildx prune -af || true
          df -h / /mnt

      - name: ./bin/install at this commit
        timeout-minutes: 40
        env:
          FUTURE_AGI_VERSION: local
          FRONTEND_VERSION: local
          FI_COLLECTOR_VERSION: local
          AGENTCC_GATEWAY_VERSION: local
        run: ./bin/install -y

      - name: The install stayed Distributed, on this commit's images, with its account and trace
        timeout-minutes: 10
        run: |
          set -euo pipefail
          . scripts/install-smoke.sh
          fail() { echo "::error::$*"; exit 1; }
          grep -qx 'COMPOSE_FILE=docker-compose.distributed.yml' .env \
            || fail ".env records $(grep '^COMPOSE_FILE=' .env || echo 'no COMPOSE_FILE'), not COMPOSE_FILE=docker-compose.distributed.yml"
          echo "PASS  .env records COMPOSE_FILE=docker-compose.distributed.yml"
          # Containers left from v1.41.1 would pass every other check here.
          # fi-collector is `local` in both releases, so its tag proves nothing.
          why=$(smoke_services_run_tag local backend worker frontend agentcc-gateway 2>&1) || fail "$why"
          echo "PASS  backend, worker, frontend and agentcc-gateway run this commit's :local images"
          token=$(smoke_sign_in) || fail "the account v1.41.1 created no longer signs in"
          echo "PASS  sign-in with the account v1.41.1 created"
          eventually 180 smoke_trace_readable "$token" "$SMOKE_PROJECT" \
            || fail "the trace sent to v1.41.1 is gone: $(head -c 300 "$RUNNER_TEMP/spans.json" 2>/dev/null || true)"
          echo "PASS  the trace sent to v1.41.1 reads back"

      - name: Collect diagnostics
        if: failure()
        run: |
          out="$RUNNER_TEMP/diagnostics"
          mkdir -p "$out"
          cp install-*.log "$out/" 2>/dev/null || true
          grep -E '^(COMPOSE_FILE|COMPOSE_PROJECT_NAME|COMPOSE_PROFILES)=' .env > "$out/env-mode.txt" 2>/dev/null || true
          docker compose ps -a > "$out/ps.txt" 2>&1 || true
          docker compose logs --no-color --tail 500 > "$out/compose.log" 2>&1 || true
          tail -n 150 "$out/compose.log"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: upgrade-diagnostics
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 7
