name: Reviewer Assigner

on:
  # The sweep runs on every merge to dev and every 10 minutes, with the
  # approver App token: the approval job trusts only that App's review
  # requests. A pull request run never gets the key, so the cron is what gives a
  # new pull request its reviewer within 10 minutes on a quiet dev. Schedules
  # run the default branch's copy, which lags dev until the next promotion.
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would change, write nothing."
        type: boolean
        default: false
      pr_number:
        description: "PR number to assign (leave blank to sweep all open PRs)"
        required: false
      run_pings:
        description: "Also run ping (Slack DMs) and summary jobs. Default off — flip this on to test the daily reminder flow manually."
        type: boolean
        default: false
  schedule:
    # 10:00 IST (UTC+5:30) → 04:30 UTC — same morning slot as pr-digest.
    - cron: "30 4 * * *"
    - cron: "*/10 * * * *"

jobs:
  sweep:
    if: >-
      github.repository == 'future-agi/future-agi' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       github.event.schedule == '*/10 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The approver App key; the environment admits only main and dev.
    environment:
      name: devflow-approver
      deployment: false
    concurrency:
      group: reviewer-sweep
      cancel-in-progress: true # the script finishes the PR it is writing, then stops
    permissions:
      contents: read
    steps:
      - name: Fail without the approver App
        env:
          CLIENT_ID: ${{ secrets.DEVFLOW_APPROVER_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.DEVFLOW_APPROVER_PRIVATE_KEY }}
          BOT: ${{ vars.DEVFLOW_APPROVER_BOT }}
        run: |
          if [[ -z $CLIENT_ID || -z $PRIVATE_KEY || $BOT != *"[bot]" ]]; then
            echo "::error::DEVFLOW_APPROVER_CLIENT_ID, DEVFLOW_APPROVER_PRIVATE_KEY or DEVFLOW_APPROVER_BOT is not set. No reviewer was requested; this workflow never requests one with GITHUB_TOKEN."
            exit 1
          fi
      - name: Mint the approver App token
        id: approver
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEVFLOW_APPROVER_CLIENT_ID }}
          private-key: ${{ secrets.DEVFLOW_APPROVER_PRIVATE_KEY }}
          permission-pull-requests: write # review requests
          permission-issues: write # the sticky assignment comment
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Assign reviewers and move stale requests
        env:
          MODE: sweep
          GITHUB_TOKEN: ${{ steps.approver.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ASSIGNER_LOGIN: ${{ vars.DEVFLOW_APPROVER_BOT }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/reviewer-assigner.mjs

  ping:
    if: >-
      github.repository == 'future-agi/future-agi' &&
      (github.event.schedule == '30 4 * * *' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_pings))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: DM stale reviewers
        env:
          MODE: ping
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Cron runs respect the repo secret as the on/off switch.
          # Manual dispatch with run_pings=true forces the gate open so a tester
          # doesn't have to flip the secret each time.
          REVIEWER_PING_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_pings) && 'true' || secrets.REVIEWER_PING_ENABLED }}
        run: node .github/scripts/reviewer-assigner.mjs

  summary:
    if: >-
      github.repository == 'future-agi/future-agi' &&
      (github.event.schedule == '30 4 * * *' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_pings))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Post reviewer-load summary
        env:
          MODE: summary
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node .github/scripts/reviewer-assigner.mjs
