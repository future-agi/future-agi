name: Backend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    # Every base branch, so stacked PRs into feature branches get CI too.
  push:
    branches: [dev, main]
  # The queue entrypoint calls this workflow without forwarding any secrets.
  workflow_call:
    outputs:
      verdict:
        description: Result of the required backend aggregate step
        value: ${{ jobs.backend-tests.outputs.verdict }}
  workflow_dispatch:
    inputs:
      backend_setup:
        type: choice
        description: Frozen shard dependency/service setup for a paired timing run
        default: baseline
        options: [baseline, overlap, tuned]
      backend_cold_fanout:
        type: boolean
        description: On an exact cold miss, try one validated producer before scheduling shards
        default: false

permissions:
  contents: read

concurrency:
  # PRs: one active run per PR, cancel stale. Push: per-SHA so dev/main runs
  # never cancel each other (their checks gate release PRs and deploys).
  # Keyed on github.ref, not head_ref: for PRs that is refs/pull/N/merge, unique
  # per PR even across forks, whereas a fork branch also named "dev" would share
  # a head_ref group with internal dev runs and cancel them.
  # Manual profiles can be dispatched together without replacing a pending trial.
  group: backend-ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name == 'push' && github.sha || github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.body || github.event.changes.title) && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Shard counts. "pytest shard N" runs everything but the Metrics suite on
  # every selected backend change; "metrics shard N" runs its complementary
  # suite on the same candidates and full controls. The Metrics suite was
  # measured at about 368 test-minutes; its two longest cases run about 19
  # minutes each against the real pass deadline, which bounds every shard.
  # The main suite was measured at about 196 test-minutes (dev, 21 Nov 2026),
  # so 16 legs carry about 12 minutes of tests each.
  SPLITS: "16"
  METRICS_SPLITS: "16"
  # pytest.ini's addopts -m, which a command-line -m replaces. Each shard
  # adds its suite's term (futureagi/.ci/test_backend_ci_output.py pins this).
  PYTEST_MARKERS: "not live_llm and not e2e and not vapi and not phone and not benchmark and not stress and not multiworker"

jobs:
  policy-self-test:
    name: Scope policy fixtures
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.body || github.event.changes.title)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise the candidate policy against Git fixtures
        run: python3 -I .github/scripts/test_ci_scope.py

  changes:
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.body || github.event.changes.title)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      queue_target: ${{ steps.queue.outputs.target }}
      backend: ${{ steps.filter.outputs.backend }}
      update_safety: ${{ steps.filter.outputs.update_safety }}
      executor_base: ${{ steps.filter.outputs.executor_base }}
      metrics: ${{ steps.filter.outputs.metrics }}
      scope: ${{ steps.filter.outputs.scope }}
      shards: ${{ steps.shards.outputs.matrix }}
      internal: ${{ steps.overlay.outputs.internal }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/workflows
      - id: queue
        if: github.event_name == 'merge_group'
        env:
          BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          [[ $BASE_REF == refs/heads/* ]]
          git check-ref-format "$BASE_REF"
          printf 'target=%s\n' "${BASE_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
      - name: Plan from the event base and complete candidate diff
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          CI_SCOPE_MODE: ${{ vars.CI_SCOPE_MODE }}
          STANDALONE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-standalone') }}
        # Bootstrap is workflow policy; never execute a candidate loader.
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request|merge_group)
              for sha in "$BASE_SHA" "$HEAD_SHA"; do
                [[ $sha =~ ^[0-9a-f]{40}$ && ! $sha =~ ^0+$ ]]
                git cat-file -e "${sha}^{commit}"
              done
              if [[ $GITHUB_EVENT_NAME == merge_group ]]; then
                [[ $HEAD_SHA == "$GITHUB_SHA" ]]
                git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
              else
                [[ $(git show -s --format=%P HEAD) == "$BASE_SHA $HEAD_SHA" ]]
              fi
              policy=$BASE_SHA ;;
            *) policy=$GITHUB_SHA; export BASE_SHA=$policy HEAD_SHA=$policy ;;
          esac
          file=.github/scripts/ci_scope.py
          # Check presence separately: a corrupt/missing object is not a legacy base.
          entry=$(git ls-tree "$policy" -- "$file")
          if [[ -n $entry ]]; then
            git show "$policy:$file" > "$RUNNER_TEMP/ci-scope.py"
            exec python3 -I "$RUNNER_TEMP/ci-scope.py"
          fi
          # First landing / stacked PR onto a base predating the planner. Run all suites.
          # The unpublished executor-tag assertion applies only to changes to its inputs.
          pin=false
          if [[ $GITHUB_EVENT_NAME == pull_request || $GITHUB_EVENT_NAME == merge_group ]]; then
            start=$BASE_SHA
            if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
              if ! start=$(git merge-base --all "$BASE_SHA" "$HEAD_SHA"); then start=unknown; fi
            fi
            if ! [[ $start =~ ^[0-9a-f]{40}$ ]] || ! git diff --quiet --no-renames "$start" "$HEAD_SHA" -- \
                futureagi/code-executor/{Dockerfile.base,requirements.sandbox.txt} ||
                ! git diff --quiet --no-renames "$BASE_SHA" "$GITHUB_SHA" -- \
                futureagi/code-executor/{Dockerfile.base,requirements.sandbox.txt}; then pin=true; fi
          fi
          {
            for key in backend metrics any collector ordinary_update update_safety tooling built python; do echo "$key=true"; done
            echo "executor_base=$pin"
            echo "scope=$(jq -cn --arg sha "$GITHUB_SHA" --arg base "$policy" '{version:0,mode:"full",reason:"legacy policy base",tested_commit:$sha,policy_base:$base}')"
          } >> "$GITHUB_OUTPUT"
      - id: overlay
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # The merge-group event does not attest to the provenance of every member.
          internal=false
          case "$GITHUB_EVENT_NAME" in
            pull_request) if [[ -n $PR_HEAD_REPO && $PR_HEAD_REPO == "$GITHUB_REPOSITORY" ]]; then internal=true; fi ;;
            push|workflow_dispatch|schedule) internal=true ;;
          esac
          echo "internal=$internal" >> "$GITHUB_OUTPUT"
      - id: shards
        # The pytest shard matrix: the main legs always, the Metrics legs only
        # when that suite is due. An absent leg leaves no check, so say which.
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          METRICS: ${{ steps.filter.outputs.metrics }}
        run: |
          set -euo pipefail
          legs() { # suite, check name, marker term, timeout minutes, shard count
            jq -nc --arg suite "$1" --arg name "$2" --arg markers "$3" \
              --argjson timeout "$4" --argjson n "$5" \
              '[{suite: $suite, name: $name, markers: $markers, timeout: $timeout,
                 splits: $n, group: range(1; $n + 1)}]'
          }
          [[ "$METRICS" == true || "$METRICS" == false ]]
          [[ "$BACKEND" == "$METRICS" ]]
          [[ $SPLITS =~ ^[1-9][0-9]*$ && $METRICS_SPLITS =~ ^[1-9][0-9]*$ ]]
          main='[]' metrics='[]'
          if [[ $BACKEND == true ]]; then
            main=$(legs main pytest "not metrics" 45 "$SPLITS")
            metrics=$(legs metrics metrics metrics 50 "$METRICS_SPLITS")
          fi
          echo "matrix=$(jq -nc --argjson a "$main" --argjson b "$metrics" '{include: ($a + $b)}')" >> "$GITHUB_OUTPUT"

  update-safety:
    name: OSS migrations and unattended update safety
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.update_safety == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: futureagi
    env:
      # Production OSS settings, not test.py (which deliberately enables EE).
      DJANGO_SETTINGS_MODULE: tfc.settings.settings
      EE_LICENSE_KEY: ""
      ENV_TYPE: local
      LITELLM_MODE: PRODUCTION
      NO_STARTUP_DB_MUTATIONS: "true"
      FI_SKIP_CH25_MIGRATION: "1"
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: futureagi/uv.lock
      - name: Install OSS backend dependencies
        run: uv sync --frozen --no-dev
      - name: Honest-mistake gate tests in the real OSS backend environment (serial)
        # unittest discovery must retain the repo/import roots; reserve -I for
        # direct gate scripts and child processes reading historical sources.
        run: |
          uv run --no-sync python -m unittest discover -s ../deploy/tests -p test_update_safety_gate.py -v
          uv run --no-sync python -m unittest discover -s tests -p test_update_safety_gate_django.py -v
      - name: Models must have migrations (no database writes)
        run: uv run --no-sync python manage.py makemigrations --check --dry-run
      - name: Resolve the comparison base for this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          base=$(bash ../scripts/update-safety-base.sh)
          git rev-parse --verify "${base}^{commit}"
          echo "UPDATE_SAFETY_BASE=$base" >> "$GITHUB_ENV"
      - name: Real OSS MigrationLoader, layout and high-volume migration risk
        run: |
          uv run --no-sync python -I ../scripts/check_update_safety.py \
            --static --django --base "$UPDATE_SAFETY_BASE" --json \
            > "$RUNNER_TEMP/update-safety-migrations.json"
      - name: Calibrate real historical loaders (read-only tags, not product qualification)
        run: |
          uv run --no-sync python -I ../scripts/check_update_safety.py --calibrate --json \
            > "$RUNNER_TEMP/update-safety-historical.json"
      - name: Retain large-volume rehearsal requirements
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: update-safety-migration-requirements
          path: |
            ${{ runner.temp }}/update-safety-migrations.json
            ${{ runner.temp }}/update-safety-historical.json
          if-no-files-found: error

  plan:
    # Pins one durations snapshot per run so re-runs shard identically —
    # a floating cache can move a failed test to a shard that never
    # re-runs, turning the gate green without re-executing it. The snapshot
    # is the newest one the timings job saved on a dev push, or the committed
    # .test_durations when there is none.
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.backend_cold_fanout && 45 || 5 }}
    outputs:
      cold_control: ${{ steps.cold.outcome }}
      db_artifact: ${{ steps.cold.outputs.artifact }}
      db_recipe: ${{ steps.cold.outputs.recipe }}
    env: &backend_database_env
      LITELLM_MODE: PRODUCTION
      CH25_DATABASE: test_tfc
      CH_DATABASE: test_tfc
      OBSERVED_CATALOG_TEST_CH_HOST: 127.0.0.1
      OBSERVED_CATALOG_TEST_CH_PORT: "18123"
      OBSERVED_CATALOG_TEST_CH_USER: default
      OBSERVED_CATALOG_TEST_CH_PASSWORD: ""
      OBSERVED_CATALOG_TEST_NATIVE_PORT: "19000"
      # Native port docker-compose.test.yml publishes for this job's own
      # ClickHouse. Live ClickHouse test modules issue DDL, so they take a
      # forwarded port only from this variable, and only after the server
      # reports the replica macro .ci/clickhouse-test-config.xml sets
      # (conftest.py, _open_ch_test_native_client).
      FI_CH_TEST_SIDECAR_NATIVE_PORT: "19000"
      # The same sidecar's HTTP port, for modules that go over HTTP
      # (conftest.py, _open_ch_test_http_client).
      FI_CH_TEST_SIDECAR_HTTP_PORT: "18123"
      PYTHONHASHSEED: "0"
      FI_CH25_SCHEMA_APPLY_STRICT: "1"
      EE_REPO_BRANCH: ${{ needs.changes.outputs.queue_target || github.head_ref || github.ref_name }}
      EE_BASE_REF: ${{ needs.changes.outputs.queue_target || github.base_ref || 'dev' }}
      # Queue events identify a base branch, not the origin of every queued PR.
      IS_INTERNAL_RUN: ${{ needs.changes.outputs.internal }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore newest timing cache over the committed floor
        uses: actions/cache/restore@v4
        with:
          path: futureagi/.test_durations
          key: test-durations-${{ github.run_id }} # never matches; forces prefix restore
          restore-keys: |
            test-durations-
      - name: Test CI asset verification and failure paths
        run: python3 -I -m unittest discover -s futureagi/.ci -p 'test_*.py' -v
      - name: Restore pinned Temporal archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/temporal-archive
          key: temporal-test-server-linux-x64-${{ hashFiles('futureagi/.ci/temporal-test-server.sh') }}
      - name: Prefetch and verify Temporal test server once per run
        run: bash futureagi/.ci/temporal-test-server.sh fetch "$RUNNER_TEMP/temporal-archive"
      # The opt-in cold trial reuses this prerequisite runner. The normal and
      # warm paths never depend on the independent fresh-migration control.
      - name: Checkout EE package (internal runs only)
        if: inputs.backend_cold_fanout && env.IS_INTERNAL_RUN == 'true'
        uses: future-agi/future-agi/.github/actions/checkout-ee@6a05e37f2c9e35dc4cea484d5e6263d4f33e2fc2
        with: &ee_checkout
          token: ${{ secrets.EE_REPO_READ_TOKEN }}
          branch: ${{ env.EE_REPO_BRANCH }}
          base-ref: ${{ env.EE_BASE_REF }}

      - name: Probe the exact recipe for the cold trial
        if: inputs.backend_cold_fanout
        id: probe
        working-directory: futureagi
        run: |
          docker compose -f docker-compose.test.yml -p futureagi-test pull --quiet
          key=$(bash ../.github/actions/backend-test-packages/database/key.sh probe)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - id: present
        if: inputs.backend_cold_fanout
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/migrated-db
          key: ${{ steps.probe.outputs.key }}
          lookup-only: true
      - id: cold
        if: inputs.backend_cold_fanout && steps.present.outputs.cache-hit != 'true'
        uses: ./.github/actions/backend-test-packages/database
        with:
          profile: ${{ inputs.backend_setup }}
          handoff: 'true'
      - name: Dump producer service logs on failure
        if: failure() && steps.cold.outcome == 'failure'
        working-directory: futureagi
        run: docker compose -f docker-compose.test.yml -p futureagi-test logs --tail 200

      - name: Distribute pinned Temporal archive to shards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: temporal-test-server
          path: ${{ runner.temp }}/temporal-archive/*.tar.gz
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: test-durations-plan
          path: futureagi/.test_durations
          # .test_durations is a dotfile and upload-artifact@v4 defaults
          # include-hidden-files: false, dropping it even when named literally.
          include-hidden-files: true
          if-no-files-found: error


  test:
    # "pytest shard N" and "metrics shard N" share these steps; the changes
    # job builds the matrix (suite, splits, marker term, timeout per leg).
    name: ${{ matrix.name }} shard ${{ matrix.group }}
    needs: [changes, plan]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.shards) }}
    defaults:
      run:
        working-directory: futureagi
    env: *backend_database_env
    steps:
      - uses: actions/checkout@v4

      - name: Prefetch service images in the background
        # Pull-only on purpose: compose has no cross-invocation locking, so a
        # background `up` can race the health gate's `up` on container creation
        # when pulls are cold and the uv cache is warm. Concurrent pulls of the
        # same image are safe at the daemon level; the gate stays the only
        # invocation that creates containers.
        run: |
          nohup docker compose -f docker-compose.test.yml -p futureagi-test \
            pull --quiet > /tmp/compose-up.log 2>&1 &

      - name: Checkout EE package (internal runs only)
        if: env.IS_INTERNAL_RUN == 'true'
        uses: future-agi/future-agi/.github/actions/checkout-ee@6a05e37f2c9e35dc4cea484d5e6263d4f33e2fc2
        with: *ee_checkout

      - uses: ./.github/actions/backend-test-packages/environment
        with:
          profile: ${{ inputs.backend_setup || 'baseline' }}

      - name: Fetch this run's pinned Temporal archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: temporal-test-server
          path: ${{ runner.temp }}/temporal-archive

      - name: Verify and install Temporal test server (no downloads)
        run: |
          bash .ci/temporal-test-server.sh install "$RUNNER_TEMP/temporal-archive" "$RUNNER_TEMP/temporal-bin"
          echo "TEMPORAL_TEST_SERVER=$RUNNER_TEMP/temporal-bin/temporal-test-server" >> "$GITHUB_ENV"

      - name: Key of the migrated database for this checkout
        id: db-key
        run: |
          key=$(bash ../.github/actions/backend-test-packages/database/key.sh)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Fetch the same-run dump only for the identical recipe
        if: needs.plan.outputs.db_artifact != '' && needs.plan.outputs.db_recipe == steps.db-key.outputs.key
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.plan.outputs.db_artifact }}
          path: ${{ runner.temp }}/migrated-db
      - name: Look for a dump of the migrated database
        id: cached-db
        if: needs.plan.outputs.db_artifact == '' || needs.plan.outputs.db_recipe != steps.db-key.outputs.key
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/migrated-db
          key: ${{ steps.db-key.outputs.key }}
      - name: Validate the selected recipe
        id: db-dump
        working-directory: ${{ runner.temp }}
        env:
          RECIPE: ${{ steps.db-key.outputs.key }}
          FOUND: ${{ steps.cached-db.outputs.cache-hit == 'true' || (needs.plan.outputs.db_artifact != '' && needs.plan.outputs.db_recipe == steps.db-key.outputs.key) }}
        run: |
          if [[ $FOUND == true ]]; then
            hit=$(bash "$GITHUB_WORKSPACE/.github/actions/backend-test-packages/database/verify-record.sh" migrated-db "$RECIPE")
            echo "cache-hit=$hit" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the migrated database (exact key hit only)
        if: steps.db-dump.outputs.cache-hit == 'true'
        run: |
          db=(docker compose -f docker-compose.test.yml -p futureagi-test exec -T test-db)
          "${db[@]}" createdb -U test_user test_tfc_test
          python3 -I .ci/db_dump.py restore "$RUNNER_TEMP/migrated-db/dump.sql.gz" test_user test_tfc_test "${db[@]}"
          # conftest applies the ClickHouse schema to this runner's real
          # sidecar with FI_CH25_SCHEMA_APPLY_STRICT. The dump is Postgres only.
          CI_PRESEED_DIGEST="$RUNNER_TEMP/replayed" uv run pytest .ci/migrated_db.py -q
          cmp "$RUNNER_TEMP/replayed" "$RUNNER_TEMP/migrated-db/preseed"

      - name: Migrate the test database from zero (no dump for this key)
        if: steps.db-dump.outputs.cache-hit != 'true'
        run: uv run pytest .ci/migrated_db.py --create-db -q

      - name: Apply pinned sharding plan
        uses: actions/download-artifact@v4
        with:
          name: test-durations-plan
          path: futureagi

      - name: Exercise terminal recording with the installed shard pytest
        if: matrix.group == 1 && matrix.suite == 'main'
        run: uv run --no-sync python -I .ci/test_collected_ids.py PluginProtocolTest RecordTest

      - name: Collect the eligible inventory without sharding
        if: matrix.group == 1
        env:
          PYTHONPATH: .ci
          ELIGIBLE_IDS_FILE: ${{ runner.temp }}/shard-receipt/eligible.json
          SUITE_MARKERS: ${{ matrix.markers }}
        run: |
          mkdir -p "$RUNNER_TEMP/shard-receipt"
          # A failure in the independent inventory must not preempt the real shard.
          # The terminal verifier requires a successful exit as well as the inventory.
          status=0
          uv run pytest --collect-only -q --ignore=tests/stress -p collected_ids \
            -m "($PYTEST_MARKERS) and $SUITE_MARKERS" > "$RUNNER_TEMP/collection.log" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/shard-receipt/inventory-exit.txt"
          if [[ $status != 0 ]]; then tail -c 8192 "$RUNNER_TEMP/collection.log"; fi

      - name: Run shard
        id: run-shard
        env:
          SUITE: ${{ matrix.suite }}
          GROUP: ${{ matrix.group }}
          SHARDS: ${{ needs.changes.outputs.shards }}
          SUITE_MARKERS: ${{ matrix.markers }}
          SUITE_SPLITS: ${{ matrix.splits }}
          DB_KEY: ${{ steps.db-key.outputs.key }}
          PYTHONPATH: .ci
          COLLECTED_IDS_FILE: ${{ runner.temp }}/shard-receipt/collected-ids.txt
          TERMINAL_IDS_FILE: ${{ runner.temp }}/shard-receipt/terminal.jsonl
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shard-receipt"
          ee=oss
          if [[ $IS_INTERNAL_RUN == true ]]; then ee=$(git -C ee/cloud rev-parse HEAD); fi
          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          jq -nc --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg suite "$SUITE" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" --argjson group "$GROUP" --arg ee "$ee" --arg db "${DB_KEY:?}" \
            --arg matrix "$(printf %s "$SHARDS" | sha256sum | cut -d' ' -f1)" \
            --arg durations "$(sha256sum .test_durations | cut -d' ' -f1)" \
            --arg temporal "$(sha256sum "$TEMPORAL_TEST_SERVER" | cut -d' ' -f1)" \
            '$ARGS.named' > "$RUNNER_TEMP/shard-receipt/receipt.json"
          # pytest.ini adds -v; -q restores compact module progress. Verbose
          # auto-generated parameter IDs can exceed 1 MiB and stall Actions log
          # processing after the tests have passed. Keep full JUnit results.
          uv run pytest -q -ra --ignore=tests/stress -p collected_ids \
            -m "($PYTEST_MARKERS) and $SUITE_MARKERS" \
            --splits "$SUITE_SPLITS" --group "${{ matrix.group }}" \
            --splitting-algorithm least_duration \
            --durations-path .test_durations \
            --durations=25 --durations-min=1.0 \
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && '--store-durations' || '' }} \
            --junitxml=junit-${{ matrix.group }}.xml
          echo "Restore through last test: $(( $(date +%s) - $(cat "$RUNNER_TEMP/backend-setup-start") ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit results
        # Skip when the shard never ran: a missing-file error here would bury
        # the real failure (EE checkout, service health, dependency install).
        if: ${{ !cancelled() && steps.run-shard.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ matrix.suite }}-${{ matrix.group }}
          path: futureagi/junit-${{ matrix.group }}.xml
          overwrite: true
          if-no-files-found: error

      - name: Upload the record of what this shard collected
        if: ${{ !cancelled() && steps.run-shard.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: collected-ids-${{ matrix.suite }}-${{ matrix.group }}
          path: ${{ runner.temp }}/shard-receipt
          retention-days: 3
          overwrite: true
          if-no-files-found: error

      - name: Upload timing data (dev pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: timing-data-${{ matrix.suite }}-${{ matrix.group }}
          path: futureagi/.test_durations
          # .test_durations is a dotfile and upload-artifact@v4 defaults
          # include-hidden-files: false, dropping it even when named literally.
          include-hidden-files: true
          overwrite: true

      - name: Dump service logs on failure
        if: failure()
        run: |
          cat /tmp/compose-up.log || true
          docker compose -f docker-compose.test.yml -p futureagi-test ps
          docker compose -f docker-compose.test.yml -p futureagi-test logs --tail 200

  saml-multiworker:
    # The SAML race guarantees (one token per duplicated ACS post, no usable
    # credential from any TX-B interleaving) need two real server processes
    # sharing one database, so the shards deselect them. This job runs them
    # against two Granian workers on the test database pytest creates.
    name: SAML multiworker races
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: futureagi
    env:
      CH25_DATABASE: test_tfc
      CH_DATABASE: test_tfc
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: futureagi/uv.lock

      - uses: ./.github/actions/backend-test-packages

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Start test services
        run: docker compose -f docker-compose.test.yml -p futureagi-test up -d --wait --wait-timeout 180

      - name: Create and migrate the test database
        # Collecting the module needs the database; without SAML_MULTIWORKER
        # every case skips, and --reuse-db (pytest.ini) keeps the database.
        run: uv run pytest saml2_auth/tests/test_multiworker.py -m multiworker --create-db -q

      - name: Run the races against two workers
        run: |
          for port in 38001 38002; do
            DJANGO_SETTINGS_MODULE=tfc.settings.test PG_DB=test_tfc_test \
            BASE_URL=http://127.0.0.1:38001 APP_URL=127.0.0.1:38001 \
            SAML_TX_B_BARRIERS_ENABLED=1 \
              uv run granian --interface asgi --host 127.0.0.1 --port "$port" \
              --workers 1 tfc.asgi:application > "$RUNNER_TEMP/worker-$port.log" 2>&1 &
          done
          for port in 38001 38002; do
            timeout 120 bash -c "until curl -s -o /dev/null http://127.0.0.1:$port/health/; do sleep 2; done"
          done
          SAML_MULTIWORKER=1 SAML_WORKER_URLS=http://127.0.0.1:38001,http://127.0.0.1:38002 \
            uv run pytest saml2_auth/tests/test_multiworker.py -m multiworker -q -ra

      - name: Dump worker and service logs on failure
        if: failure()
        run: |
          tail -n 200 "$RUNNER_TEMP"/worker-*.log || true
          docker compose -f docker-compose.test.yml -p futureagi-test logs --tail 100

      - name: Stop the workers
        # The two `uv run granian` workers above run in the background and
        # hold uv's cache lock. If they are still alive, setup-uv's post step
        # waits the full lock timeout (300 s) to prune the cache and then
        # fails with exit code 2, turning this job red after the races pass.
        if: always()
        run: |
          pkill -TERM -f 'granian --interface asgi' || true
          for _ in $(seq 1 15); do pgrep -f 'granian --interface asgi' >/dev/null || exit 0; sleep 1; done
          pkill -KILL -f 'granian --interface asgi' || true

  migrated-database:
    # Exactly one fresh control: plan owns it on an opt-in cold miss. On a
    # warm hit this job and all shards start independently after plan.
    name: Fresh migrate and database dump
    needs: [changes, plan]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env: *backend_database_env
    steps:
      - uses: actions/checkout@v4
        if: needs.plan.outputs.cold_control != 'success'
      - name: Checkout EE package (internal runs only)
        if: needs.plan.outputs.cold_control != 'success' && env.IS_INTERNAL_RUN == 'true'
        uses: future-agi/future-agi/.github/actions/checkout-ee@6a05e37f2c9e35dc4cea484d5e6263d4f33e2fc2
        with: *ee_checkout

      - uses: ./.github/actions/backend-test-packages/database
        if: needs.plan.outputs.cold_control != 'success'
        with:
          profile: ${{ inputs.backend_setup || 'baseline' }}
      - name: Dump test service logs on failure
        if: failure()
        working-directory: futureagi
        run: docker compose -f docker-compose.test.yml -p futureagi-test logs --tail 100

  agentic-eval:
    # This suite has its own pytest root and is excluded from the backend shards.
    name: Evaluator test setup and offline suite
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: futureagi
    env:
      LITELLM_MODE: PRODUCTION
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      NLTK_DOWNLOAD_MISSING: "false"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: futureagi/uv.lock
      - uses: ./.github/actions/backend-test-packages
      - name: Install frozen backend and test dependencies
        run: uv sync --frozen --extra dev
      - name: Start test dependencies
        run: docker compose -f docker-compose.test.yml -p futureagi-test up -d --wait --wait-timeout 180
      - name: Run evaluator suite from the backend working directory
        id: evaluator-suite
        # The backend cwd is required by existing fixtures' relative paths.
        # Keep the nested root: importing the parent conftest would hide a
        # regression in agentic_eval's own Django setup.
        run: |
          uv run --no-sync python -m pytest \
            -c agentic_eval/pytest.ini --confcutdir=agentic_eval agentic_eval \
            -q -ra --color=no --junitxml=agentic-eval-junit.xml
      - name: Retain evaluator results
        if: ${{ !cancelled() && steps.evaluator-suite.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: agentic-eval-junit
          path: futureagi/agentic-eval-junit.xml
          if-no-files-found: error
      - name: Dump test service logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml -p futureagi-test logs --tail 100

  slim-smoke:
    # The only leg that exercises the slim (base-only) environment the OSS
    # image ships: every other job syncs --all-extras, so a MODULE-LEVEL
    # import of an extras package (torch, av, weaviate, retell, ...) in base
    # code would merge green and break the published image. This job syncs
    # without extras, boots Django, force-loads the full URLconf, and loads
    # both halves of the temporal worker registry (workflows AND activities),
    # asserting simulation orchestrators still register when the voice extra
    # is absent. Scope note: this catches module-level imports only —
    # function-scoped request-time imports are invisible here; the
    # tfc.utils.lazy_extras boundary is the defense for those. The drift
    # check guards the committed requirements exports against uv.lock, so a
    # dependency change can't ship a slim image that silently lost it.
    name: Slim image boot smoke (no extras)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: futureagi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: futureagi/uv.lock

      - name: Install base dependencies only (no extras)
        run: uv sync --frozen --no-dev

      - name: uv.lock matches pyproject.toml and uv.toml
        # Run from futureagi/ so uv.toml applies (prerelease = if-necessary is
        # recorded in the lock). A stale lock would otherwise be rewritten by
        # every `uv run` and developer `uv sync`.
        run: uv lock --check

      - name: Requirements exports match uv.lock (drift check)
        # requirements.txt = the base dependencies the OSS image installs;
        # ee/requirements.txt = every extra but `dev` (what the EE and cloud
        # images install), so a new extra lands there without editing this
        # step. The generated header lines record the exact command and are
        # not compared.
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-hashes --no-emit-project \
            -o "$RUNNER_TEMP/requirements.txt" >/dev/null
          uv export --frozen --no-dev --no-hashes --no-emit-project \
            --all-extras --no-extra dev \
            -o "$RUNNER_TEMP/ee-requirements.txt" >/dev/null
          drift=0
          for pair in "requirements.txt:$RUNNER_TEMP/requirements.txt" \
                      "ee/requirements.txt:$RUNNER_TEMP/ee-requirements.txt"; do
            committed=${pair%%:*}
            fresh=${pair#*:}
            if ! diff -u <(grep -v '^#' "$committed") <(grep -v '^#' "$fresh"); then
              echo "::error file=futureagi/${committed}::${committed} is out of date with uv.lock"
              drift=1
            fi
          done
          if [ "$drift" -ne 0 ]; then
            echo "Regenerate from futureagi/:"
            echo "  uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt"
            echo "  uv export --frozen --no-dev --no-hashes --no-emit-project --all-extras --no-extra dev -o ee/requirements.txt"
          fi
          exit "$drift"

      - name: Boot Django, load URLconf and temporal registry
        run: |
          .venv/bin/python - <<'EOF'
          import importlib
          import os

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "tfc.settings.settings")

          import django

          django.setup()
          print("django.setup() OK")

          from django.urls import get_resolver

          patterns = get_resolver().url_patterns
          print(f"URLconf loaded OK: {len(patterns)} top-level patterns")

          from tfc.temporal.common import registry

          workflows = registry.get_workflows_for_queue("tasks_l")
          names = {w.__name__ for w in workflows}
          missing = {"TestExecutionWorkflow", "RerunCoordinatorWorkflow"} - names
          assert not missing, (
              f"simulation orchestrators failed to register without the "
              f"voice extra: missing {missing}"
          )
          print(f"temporal workflow registry OK: {sorted(names)} on tasks_l")

          # Activities use a different import closure than workflows. Import
          # every required module directly because the registry deliberately
          # skips optional modules and otherwise swallows ImportError.
          optional_activity_modules = {
              "ee.voice.tasks.call_log_tasks",
              "ee.cloud.telemetry.deployment_telemetry_integrations",
          }
          unexpected_import_failures = {}
          for module_name in registry.TEMPORAL_ACTIVITY_MODULES:
              try:
                  importlib.import_module(module_name)
              except ImportError as exc:
                  if module_name not in optional_activity_modules:
                      unexpected_import_failures[module_name] = str(exc)
          assert not unexpected_import_failures, (
              "required temporal activity modules failed to import: "
              f"{unexpected_import_failures}"
          )

          activity_count = sum(
              len(registry.get_activities_for_queue(queue))
              for queue in registry.get_all_queues()
          )
          assert activity_count > 0, "no temporal activities registered"
          print(f"temporal activity registry OK: {activity_count} activities")
          EOF

  code-executor-base-pin:
    # futureagi/code-executor/Dockerfile builds FROM the base image tag it
    # pins (ARG CODE_EXECUTOR_BASE), and base tags are immutable: a release
    # publishes the pinned tag only when it does not exist yet. So a change to
    # what goes into the base must come with a new, unpublished pin, or it
    # would never ship.
    name: code-executor base pin is new
    needs: changes
    if: needs.changes.outputs.executor_base == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The pinned base tag is not published yet
        shell: bash
        run: |
          set -euo pipefail
          tag=$(scripts/code-executor-base-pin.sh)
          code=$(curl -sS --max-time 20 --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/futureagi/code-executor-base/tags/${tag}")
          case "$code" in
            404) echo "futureagi/code-executor-base:${tag} is not published yet; the next release publishes it." ;;
            200)
              echo "::error file=futureagi/code-executor/Dockerfile::Dockerfile.base or requirements.sandbox.txt changed, but CODE_EXECUTOR_BASE still pins the published ${tag}. Bump it to a new version."
              exit 1
              ;;
            *) echo "::error::Docker Hub answered HTTP ${code}; re-run the job"; exit 1 ;;
          esac

  timings:
    # Each shard of a dev push records its tests' times (--store-durations).
    # This job merges them into one .test_durations and saves it under the
    # cache key the plan job restores, so the next runs split on fresh times.
    # Without it the committed file was the only input and went stale. Not a
    # dependency of "Backend Tests Pass": a failure here costs balance, not
    # correctness, and it still turns this run red.
    name: Save test timings (dev pushes)
    needs: [plan, test]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch this run's sharding plan
        uses: actions/download-artifact@v4
        with:
          name: test-durations-plan
          path: ${{ runner.temp }}/timings/plan
      - name: Fetch the shards' timing files
        # One directory per shard. A shard that failed uploaded none; its
        # tests keep the plan's times.
        uses: actions/download-artifact@v4
        with:
          pattern: timing-data-*
          path: ${{ runner.temp }}/timings/shards
      - name: Merge into one .test_durations
        run: |
          python3 -I futureagi/.ci/merge_test_durations.py \
            "$RUNNER_TEMP/timings/plan/.test_durations" \
            "$RUNNER_TEMP"/timings/shards/*/.test_durations > futureagi/.test_durations
      - name: Save for the next runs' plan
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: futureagi/.test_durations
          key: test-durations-${{ github.run_id }}

  collection:
    # pytest-split runs each test exactly once only when every shard collects
    # the same test ids; a random value in an id lets a test run twice or
    # never, with every job green. Each shard records what it collected
    # (.ci/collected_ids.py) and this job compares the records. It runs
    # whenever the shards ran, and the gate fails if it did not succeed then.
    name: Every shard collected the same tests
    needs: [changes, test]
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: futureagi/.ci
      - uses: actions/download-artifact@v4
        with:
          pattern: collected-ids-*
          path: ${{ runner.temp }}/collected
      - name: Compare the shards' collection records
        env:
          SHARDS: ${{ needs.changes.outputs.shards }}
        run: |
          python3 -I futureagi/.ci/check_collected_ids.py "$(jq '.include | length' <<<"$SHARDS")" \
            "$RUNNER_TEMP"/collected/*/collected-ids.txt

  terminal-parity:
    # Verify the unsharded eligible inventory against terminal outcomes. Use
    # artifact IDs/digests and the latest producer attempt, not names alone.
    permissions:
      contents: read
      actions: read
    name: Backend terminal inventory qualification
    needs: [changes, test]
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: futureagi/.ci
      - name: Verify each planned shard receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SHARDS: ${{ needs.changes.outputs.shards }}
        run: python3 -I futureagi/.ci/check_collected_ids.py --terminal

  backend-tests:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.body || github.event.changes.title) && 'Backend metadata edit' || 'Backend Tests Pass' }} # the ONLY required status check
    needs:
      [
        changes,
        policy-self-test,
        update-safety,
        plan,
        test,
        collection,
        terminal-parity,
        saml-multiworker,
        migrated-database,
        agentic-eval,
        slim-smoke,
        code-executor-base-pin,
      ]
    if: ${{ always() && !(github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.body || github.event.changes.title)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.verdict.outcome }}
    steps:
      - id: verdict
        name: Require exactly the outcomes the change plan selected
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            def flag: if . == "true" then true elif . == "false" then false else error("invalid plan flag") end;
            def status: if . then "success" else "skipped" end;
            .changes.outputs as $p | ($p.backend|flag) as $b | ($p.metrics|flag) as $m |
            ($p.update_safety|flag) as $u | ($p.executor_base|flag) as $x |
            .changes.result == "success" and .["policy-self-test"].result == "success" and ($m == $b) and
            .["update-safety"].result == (($b or $u)|status) and
            .["code-executor-base-pin"].result == ($x|status) and
            ([.plan, .test, .collection, .["terminal-parity"], .["saml-multiworker"], .["migrated-database"],
              .["agentic-eval"], .["slim-smoke"]] | all(.result == ($b|status)))
          ' <<<"$NEEDS"
