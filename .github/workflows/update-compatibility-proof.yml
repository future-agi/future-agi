# NON-PUBLISHING proof-packager lane. No OIDC, secrets or release writes.
# PR tests use explicitly synthetic fixtures, never certification evidence.
# A reviewed reusable caller must supply update-compatibility-evidence from
# THIS run after real exact-image rehearsals. No run-id/URL override, waiver,
# downloaded executable, or conversion of unit test success into eligibility.
# The artifact contains target.json (resolved manifest), evidence.json,
# <predecessor-raw-sha256>.json and bound JUnit reports; the reviewed policy
# always comes from this checkout. Missing/failed/skipped evidence fails closed.
# This lane packages evidence; it does NOT implement the product rehearsal
# harness. Until that caller exists and passes, default policy stays uncertified.
# A resulting Actions artifact is NOT a production release or signing proof.
name: update-compatibility-proof

on:
  pull_request:
    paths:
      - .github/workflows/update-compatibility-proof.yml
      - scripts/build_update_compatibility_proof.py
      - deploy/update/**
      - deploy/tests/test_update*release*.py
  workflow_call:
    inputs:
      produce:
        description: Package real same-run evidence after all rehearsals pass
        type: boolean
        default: true
        required: false

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Evidence contract and rejection tests, not release certification
        env:
          FUTURE_AGI_UPDATE_E2E: "0"
        run: |
          umask 022
          python3 -m unittest discover -s deploy/tests -p 'test_update*release*.py' -v

  proof:
    needs: contracts
    if: inputs.produce && github.repository == 'future-agi/future-agi' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: future-agi/future-agi
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: update-compatibility-evidence
          path: ${{ runner.temp }}/evidence
      - name: Bind actual rehearsal evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          mkdir -p "$RUNNER_TEMP/proof"
          python3 scripts/build_update_compatibility_proof.py \
            --target "$RUNNER_TEMP/evidence/target.json" \
            --policy deploy/update/release-policy.json \
            --evidence "$RUNNER_TEMP/evidence" --run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/proof/compatibility.json" \
            --manifest-output "$RUNNER_TEMP/proof/candidate.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NON-PRODUCTION-compatibility-proof
          path: ${{ runner.temp }}/proof
          if-no-files-found: error
          retention-days: 30
