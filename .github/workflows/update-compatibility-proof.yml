# Nonpublishing exact-product-image rehearsal, called after candidate resolution.
# PRs run contracts ONLY. They cannot generate shipping evidence. No externally
# supplied success JSON, downloaded executable, URL or run-id input is accepted.
# The same job executes our checked-out producer, derives policy from completed
# assertions, re-verifies predecessor bundles, and packages the frozen candidate.
name: update-compatibility-proof

on:
  pull_request:
    paths:
      - .github/workflows/update-compatibility-proof.yml
      - .github/workflows/release-update-manifest.yml
      - scripts/build_update_compatibility_proof.py
      - scripts/rehearse_update_compatibility.py
      - scripts/update_rehearsal_shipping.py
      - deploy/standalone/**
      - deploy/update/high-volume-tables.json
      - .github/workflows/build-image-multiarch.yml
      - .github/workflows/release-images.yml
      - scripts/generate_update_manifest.py
      - deploy/update/**
      - deploy/tests/test_update*release*.py
      - deploy/tests/test_update_rehearsal_driver.py
      - deploy/tests/update_e2e/automatic_publisher.py
      - deploy/tests/update_e2e/test_automatic_publisher.py
  workflow_call:
    inputs:
      produce:
        description: Rehearse the frozen candidate from this protected release run
        type: boolean
        default: true
        required: false

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install host test verifier
        uses: ./.github/actions/setup-helm-tools
        with:
          cosign: "true"
      - name: Synthetic contract tests, never image certification
        env:
          FUTURE_AGI_UPDATE_E2E: "0"
        run: |
          umask 022
          python3 -m unittest discover -s deploy/tests -p 'test_update*release*.py' -v
          python3 -m unittest discover -s deploy/tests -p 'test_update_rehearsal_driver.py' -v
          python3 -m unittest deploy.tests.update_e2e.test_automatic_publisher -v
          python3 -m unittest deploy.tests.test_update_standalone_state -v

  proof:
    needs: contracts
    if: inputs.produce && github.repository == 'future-agi/future-agi' && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: future-agi/future-agi
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install host verifier
        uses: ./.github/actions/setup-helm-tools
        with:
          cosign: "true"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: update-candidate
          path: ${{ runner.temp }}/candidate
      - name: Execute product assertions, then package in the same job
        id: package
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # A8: a native amd64 job only; no emulation and no borrowed arm64 row.
          test "$RUNNER_ARCH" = X64
          # The 330-minute producer budget leaves 30 minutes for bounded cleanup
          # and packaging inside this 360-minute job. Startup is 4200s, not 900s.
          # Wave-3 PR CI may call the same entrypoint with --purpose pr-validation;
          # that evidence is deliberately ineligible for this product packager.
          # A new workspace is mandatory. No artifact is executed or imported.
          python3 -I scripts/rehearse_update_compatibility.py \
            --target "$RUNNER_TEMP/candidate/future-agi-update-manifest.json" \
            --workspace "$RUNNER_TEMP/rehearsal-workspace" \
            --output "$RUNNER_TEMP/evidence" --run-id "$GITHUB_RUN_ID" \
            --docker-context default --platform linux/amd64 --purpose product \
            --startup-timeout-seconds 4200 --rehearsal-timeout-seconds 19800
          mkdir "$RUNNER_TEMP/qualified"
          evidence=(--policy "$RUNNER_TEMP/evidence/policy.json" --evidence "$RUNNER_TEMP/evidence")
          eligible=true
          if [ -f "$RUNNER_TEMP/evidence/manual.json" ]; then
            # Missing/failed/timed-out/unrun suites are explicitly notify-only.
            # The unchanged frozen candidate is packaged WITHOUT a proof.
            evidence=(--manual-decision "$RUNNER_TEMP/evidence/manual.json")
            eligible=false
          fi
          python3 -I scripts/build_update_compatibility_proof.py \
            --target "$RUNNER_TEMP/candidate/future-agi-update-manifest.json" \
            "${evidence[@]}" --run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/qualified/future-agi-update-compatibility.json" \
            --manifest-output "$RUNNER_TEMP/qualified/future-agi-update-manifest.json"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-manifest
          path: ${{ runner.temp }}/qualified/future-agi-update-manifest.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.package.outputs.eligible == 'true'
        with:
          name: update-compatibility-proof
          path: ${{ runner.temp }}/qualified/future-agi-update-compatibility.json
          if-no-files-found: error
          retention-days: 30
      # Only bounded assertion reports/failure classification, never private
      # env, keys, backups, database contents or an executable checkout.
      - name: Retain executed assertion diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-rehearsal-diagnostics
          path: |
            ${{ runner.temp }}/evidence/*.xml
            ${{ runner.temp }}/evidence/failure.json
            ${{ runner.temp }}/evidence/manual.json
          if-no-files-found: ignore
          retention-days: 30
