name: Release script checks
on:
  pull_request:
    paths:
      - ".github/workflows/release-images.yml"
      - ".github/workflows/worker-release-checks.yml"
      - "scripts/release-error-feed-worker.py"
      - "scripts/test_release_error_feed_worker.py"
      - "scripts/verify-platform-image-tags.py"
      - "scripts/test_verify_platform_image_tags.py"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the release scripts' own tests. The other scripts' tests run in their own
      # workflows, which provide what they need (ruff, MYPY_BIN); this job has neither.
      - run: python3 -m unittest -v test_release_error_feed_worker test_verify_platform_image_tags
        working-directory: scripts
