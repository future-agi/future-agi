name: Release script checks
on:
  pull_request:
    paths:
      - ".github/workflows/release-images.yml"
      - ".github/workflows/worker-release-checks.yml"
      - "scripts/release-error-feed-worker.py"
      - "scripts/test_release_error_feed_worker.py"
      - "scripts/verify-platform-image-tags.py"
      - "scripts/test_verify_platform_image_tags.py"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
