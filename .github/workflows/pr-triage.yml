name: Issue and PR triage

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issues:
    types: [opened, edited, labeled, reopened]
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the grouping report; do not comment, label, or notify"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-triage-${{ github.event.issue.number || github.event.pull_request.number || 'global' }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.repository == 'future-agi/future-agi'
    runs-on: ubuntu-latest
    steps:
      # This checks out only the base/default repository ref. The workflow never
      # checks out or executes code from a forked pull request.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run issue and PR triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node .github/scripts/pr-triage.mjs
