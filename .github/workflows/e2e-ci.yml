name: E2E CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  merge_group:
  # The Standalone leg (E2E_STACK=standalone): nightly, on demand, and next to
  # the Distributed leg on a PR that carries the e2e-standalone label.
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      stack:
        description: Which setup the suite runs against
        type: choice
        options: [distributed, standalone]
        default: standalone

permissions:
  contents: read

concurrency:
  group: e2e-ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CACHE_REPO: ghcr.io/future-agi/future-agi/e2e-cache
  # The release builds' layer cache, read only (the slim backend's).
  BUILD_CACHE: ghcr.io/future-agi/future-agi/build-cache

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads the PR's file list
    outputs:
      any: ${{ steps.filter.outputs.any || steps.always.outputs.any }}
      backend: ${{ steps.filter.outputs.backend || steps.always.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend || steps.always.outputs.frontend }}
      gateway: ${{ steps.filter.outputs.gateway || steps.always.outputs.gateway }}
      stacks: ${{ steps.stacks.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'futureagi/**'
              - 'fi-collector/**'
            frontend:
              - 'frontend/**'
            gateway:
              - 'agentcc-gateway/**'
            any:
              - 'futureagi/**'
              - 'fi-collector/**'
              - 'agentcc-gateway/**'
              - 'frontend/**'
              - 'e2e/**'
              - 'bin/e2e'
              - 'docker-compose.yml'
              - 'docker-compose.distributed.yml'
              - 'docker-compose.dev.yml'
              - 'docker-compose.distributed.dev.yml'
              - 'deploy/**'
              - 'bin/install*'
              - 'bin/lib/**'
              - 'bin/uninstall'
              - 'scripts/reclaim-runner-disk.sh'
              - '.github/workflows/e2e-ci.yml'
      - id: always
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "any=true"
            echo "backend=true"
            echo "frontend=true"
            echo "gateway=true"
          } >> "$GITHUB_OUTPUT"
      - id: stacks
        env:
          EVENT: ${{ github.event_name }}
          DISPATCHED: ${{ inputs.stack }}
          # The labels the PR had when this run started: a re-run keeps them,
          # so add the label, then push.
          STANDALONE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-standalone') }}
        run: |
          case "$EVENT" in
            schedule) stacks='["standalone"]' ;;
            workflow_dispatch) stacks="[\"$DISPATCHED\"]" ;;
            pull_request)
              if [ "$STANDALONE_LABEL" = true ]; then
                stacks='["distributed","standalone"]'
              else
                stacks='["distributed"]'
              fi ;;
            *) stacks='["distributed"]' ;;
          esac
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (${{ matrix.stack }} ${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.any == 'true'
    strategy:
      # A labelled PR runs both legs; one failing must not cancel the other.
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.stacks) }}
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # ghcr build-cache: read on PRs, written on pushes
    env:
      # bin/e2e and lib/managed-mock.ts pick the stack from this.
      E2E_STACK: ${{ matrix.stack }}
      # Always from source: the stack's compose file runs backend modules at
      # boot (e.g. tracer.services.clickhouse.oss_cdc_install), so a released
      # :latest that predates them fails the boot for every PR that does not
      # touch futureagi/ — the same drift BUILD_FRONTEND/BUILD_GATEWAY avoid.
      BUILD_BACKEND: "true"
      # Always from source: specs land with the frontend behavior they assert,
      # so the released frontend image can be too old for them (TH-7733).
      BUILD_FRONTEND: "true"
      # Always from source for the same reason: gateway flows (GW-E2E-002)
      # land with the gateway behavior they assert, so a PR that does not
      # touch agentcc-gateway/ would otherwise run them against a released
      # :latest that predates that behavior.
      BUILD_GATEWAY: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Tag for the images built below
        # Standalone runs the tag e2e/stack/standalone-e2e.env names
        # (FUTURE_AGI_VERSION), which `bin/e2e build standalone-app` reads too;
        # Distributed runs e2e-ci, which a later step writes into e2e.env.
        run: |
          if [ "$E2E_STACK" = standalone ]; then
            tag=$(sed -n 's/^FUTURE_AGI_VERSION=//p' e2e/stack/standalone-e2e.env)
          else
            tag=e2e-ci
          fi
          echo "IMAGE_TAG=${tag:?no FUTURE_AGI_VERSION in e2e/stack/standalone-e2e.env}" >> "$GITHUB_ENV"

      - name: Reclaim runner disk
        # / is the small volume and the backend image alone unpacks ~15GB of
        # CUDA/nvidia libs, so docker moves to /mnt (~65GB free). Must run
        # before setup-buildx creates its builder container under the old root.
        run: scripts/reclaim-runner-disk.sh

      - uses: docker/setup-buildx-action@v3

      - name: ghcr login (cache writes on trusted pushes only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ghcr login (cache reads on internal PRs and the Standalone leg)
        # Fork PRs get no token and read anonymously, which works only once the
        # e2e-cache package is made public — a one-time manual step in the org's
        # package settings. Until then forks build cold.
        if: >-
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
          || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The backend, frontend and gateway images are always built from this
      # PR's code (see the env block above); the registry cache keeps the
      # backend build short.
      - name: Build images from PR code
        env:
          CACHE_WRITE: ${{ github.event_name == 'push' && matrix.shard == 1 }}
        run: |
          build() {
            local name=$1 context=$2 tag=$3
            shift 3
            local cache_to=()
            if [ "$CACHE_WRITE" = true ]; then
              cache_to=(--cache-to "type=registry,ref=$CACHE_REPO:$name,mode=max")
            fi
            docker buildx build --load --tag "$tag" \
              --cache-from "type=registry,ref=$CACHE_REPO:$name" "${cache_to[@]}" \
              "$@" "$context" > "/tmp/build-$name.log" 2>&1
          }
          backend_args=(--file futureagi/Dockerfile.oss)
          if [ "$E2E_STACK" = standalone ]; then
            backend_args+=(--build-arg IMAGE_VARIANT=slim
              --cache-from "type=registry,ref=$BUILD_CACHE:backend-slim-amd64")
          fi
          declare -A pids
          if [ "$BUILD_BACKEND" = true ]; then
            build backend futureagi "futureagi/future-agi:$IMAGE_TAG" "${backend_args[@]}" &
            pids[backend]=$!
            build fi-collector fi-collector "futureagi/fi-collector:$IMAGE_TAG" --file fi-collector/Dockerfile &
            pids[fi-collector]=$!
          fi
          if [ "$BUILD_FRONTEND" = true ]; then
            build frontend frontend "futureagi/frontend:$IMAGE_TAG" --file frontend/Dockerfile &
            pids[frontend]=$!
          fi
          if [ "$BUILD_GATEWAY" = true ]; then
            build gateway agentcc-gateway "futureagi/agentcc-gateway:$IMAGE_TAG" --file agentcc-gateway/Dockerfile &
            pids[gateway]=$!
          fi
          failed=0
          for name in "${!pids[@]}"; do
            if wait "${pids[$name]}"; then status=ok; else status=FAILED; failed=1; fi
            echo "::group::$name build ($status)"
            cat "/tmp/build-$name.log"
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Assemble futureagi/standalone from those images
        if: matrix.stack == 'standalone'
        # The docker driver's builder sees the images loaded above; the buildx
        # container builder would look for them on Docker Hub.
        env:
          BUILDX_BUILDER: default
        run: bin/e2e build standalone-app

      - name: Drop the buildkit copy of the built images
        # buildx holds a second copy of every loaded image; the cross-run
        # cache lives in the registry, so the local one is free to drop.
        run: |
          docker buildx prune -af || true
          df -h / /mnt

      - name: Point the stack at the built images
        # printf, not echo: e2e.env's last line may lack a trailing newline.
        # standalone-e2e.env already names the Standalone leg's tag.
        if: matrix.stack == 'distributed'
        run: |
          if [ "$BUILD_BACKEND" = "true" ]; then
            printf '\n%s\n' "FUTURE_AGI_VERSION=$IMAGE_TAG" >> e2e/stack/e2e.env
            printf '%s\n' "E2E_FI_COLLECTOR_VERSION=$IMAGE_TAG" >> e2e/stack/e2e.env
          fi
          if [ "$BUILD_FRONTEND" = "true" ]; then
            printf '\n%s\n' "FRONTEND_VERSION=$IMAGE_TAG" >> e2e/stack/e2e.env
          fi
          if [ "$BUILD_GATEWAY" = "true" ]; then
            printf '\n%s\n' "AGENTCC_GATEWAY_VERSION=$IMAGE_TAG" >> e2e/stack/e2e.env
          fi

      - name: Prefetch vendor images
        # fi-collector, agentcc-gateway and the app images are deliberately
        # absent: their tag is the locally built IMAGE_TAG and a pull would
        # 404 (failing the whole invocation, not just that image); `up`
        # resolves whatever is left.
        run: |
          if [ "$E2E_STACK" = standalone ]; then
            services=(postgres clickhouse mock-llm)
          else
            services=(postgres clickhouse redis minio temporal mock-llm
              peerdb-server peerdb-flow-worker peerdb-flow-snapshot-worker
              peerdb-flow-api peerdb-catalog peerdb-temporal peerdb-temporal-init
              peerdb-minio)
          fi
          nohup bin/e2e compose pull --quiet "${services[@]}" > /tmp/e2e-pull.log 2>&1 &

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: yarn
          cache-dependency-path: e2e/yarn.lock

      - name: Install harness
        working-directory: e2e
        run: yarn install --frozen-lockfile

      - name: Restore Playwright browser cache
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('e2e/yarn.lock') }}

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Save Playwright browser cache
        if: github.event_name == 'push' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('e2e/yarn.lock') }}

      - name: Flow catalog is current
        working-directory: e2e
        run: yarn catalog:check

      - name: Restore the migrated Postgres snapshot
        id: pg-snapshot
        if: matrix.stack == 'distributed'
        uses: actions/cache/restore@v4
        with:
          path: e2e/stack/pg-snapshot/futureagi.sql.gz
          key: e2e-pg-snapshot-v1-${{ hashFiles('futureagi/**/migrations/**', 'futureagi/model_hub/system_evals/**', 'futureagi/model_hub/management/commands/seed_system_evals.py', 'futureagi/Dockerfile.oss') }}

      - name: Migrate an empty database and snapshot it
        if: matrix.stack == 'distributed' && steps.pg-snapshot.outputs.cache-hit != 'true'
        run: bin/e2e snapshot

      - name: Save the Postgres snapshot
        if: matrix.stack == 'distributed' && steps.pg-snapshot.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@v4
        with:
          path: e2e/stack/pg-snapshot/futureagi.sql.gz
          key: e2e-pg-snapshot-v1-${{ hashFiles('futureagi/**/migrations/**', 'futureagi/model_hub/system_evals/**', 'futureagi/model_hub/management/commands/seed_system_evals.py', 'futureagi/Dockerfile.oss') }}

      - name: Boot the e2e stack
        run: bin/e2e up

      - name: Run E2E suite
        run: bin/e2e test --shard=${{ matrix.shard }}/6

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.stack }}-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 1
          # A job that dies before the suite runs has no report; the real
          # failure is upstream and must not be buried by an upload error.
          if-no-files-found: warn

      - name: Dump stack state on failure
        if: failure()
        run: |
          df -h / /mnt
          cat /tmp/e2e-pull.log || true
          bin/e2e ps
          bin/e2e logs --tail 200

  e2e-report:
    name: e2e report (${{ matrix.stack }})
    needs: [changes, e2e]
    if: ${{ !cancelled() && needs.changes.outputs.any == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.stacks) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: yarn
          cache-dependency-path: e2e/yarn.lock

      - name: Install harness
        working-directory: e2e
        run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-${{ matrix.stack }}-*
          path: e2e/all-blob-reports
          merge-multiple: true

      - name: Merge shard reports
        working-directory: e2e
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.stack == 'standalone' && 'playwright-report-standalone' || 'playwright-report' }}
          path: e2e/playwright-report
          retention-days: 7

  e2e-tests:
    name: E2E Tests Pass
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless every dependency succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # No -e flag and a non-empty success output: `jq -e` exits 4 when a
          # filter produces no output, which would fail the gate on green runs.
          echo "$NEEDS" | jq 'with_entries(.value |= .result)
            | to_entries
            | map(select(.value != "success" and .value != "skipped"))
            | if length > 0 then ("failing: " + (map(.key) | join(", ")) | halt_error)
              else "all dependencies green (or legitimately skipped)" end'
