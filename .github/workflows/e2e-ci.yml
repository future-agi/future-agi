          name: skill-passes-${{ matrix.cohort }}
          path: ${{ runner.temp }}/${{ matrix.cohort }}.json
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  # The JavaScript executor needs no package pin, so it does not wait for the pair.
  campaign-executor:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    name: skills (${{ matrix.cohort }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - {cohort: campaign-executor, stack: distributed}
    env:
      SKILLS_COHORT: ${{ matrix.cohort }}
      E2E_SKILLS_CAMPAIGNS_ENABLED: "true"
      E2E_STANDALONE_NETWORK: managed-mock
      CTXHUB_APP_COMMIT: ${{ github.sha }}
      E2E_STACK: ${{ matrix.stack }}
      BUILD_BACKEND: "true"
      BUILD_FRONTEND: "true"
      BUILD_GATEWAY: "true"
      E2E_QUARANTINE_TODAY: ${{ needs.changes.outputs.today }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify package-producing job completed
        if: matrix.cohort != 'campaign-executor'
        run: test -n "$SKILL_TRACE_PAIR_SHA256" || { echo '::error::No verified Skills package pair for this checkout'; exit 1; }
      - name: Tag for the images built below
        run: |
          if [ "$E2E_STACK" = standalone ]; then
            tag=$(sed -n 's/^FUTURE_AGI_VERSION=//p' e2e/stack/standalone-e2e.env)
          else
            tag=e2e-ci
          fi
          echo "IMAGE_TAG=${tag:?no FUTURE_AGI_VERSION in e2e/stack/standalone-e2e.env}" >> "$GITHUB_ENV"
          echo "E2E_GOOGLE_IMAGE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Reclaim runner disk
        # / is the small volume and the backend image alone unpacks ~15GB of
        # CUDA/nvidia libs, so docker moves to /mnt (~65GB free). Must run
        # before setup-buildx creates its builder container under the old root.
        # The move is done when the step returns; deleting the unused
        # toolchains goes on in the background (it took 1 to 2 minutes of
        # every shard, and nothing later reads them).
        env:
          RECLAIM_DELETE: background
        run: scripts/reclaim-runner-disk.sh
      - uses: docker/setup-buildx-action@v3
      - name: ghcr login for read-only cache imports
        # Fork PRs and queue groups do not log in; they build cold if the
        # cache package cannot be read anonymously.
        if: >-
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
          || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image from PR code
        if: env.BUILD_BACKEND == 'true'
        uses: docker/build-push-action@v5
        with:
          # Contexts mirror release-images.yml:41/45 — Dockerfile.oss expects
          # the futureagi/ dir as context, not the repo root.
          context: futureagi
          file: futureagi/Dockerfile.oss
          load: true
          # Standalone assembles its app image on the slim variant, as a release
          # does. It shares the default variant's dependency layers; the
          # release builds keep its own cache.
          build-args: ${{ matrix.stack == 'standalone' && 'IMAGE_VARIANT=slim' || '' }}
          tags: futureagi/future-agi:${{ env.IMAGE_TAG }}
          cache-from: |
            type=registry,ref=${{ env.CACHE_REPO }}:backend
            ${{ matrix.stack == 'standalone' && format('type=registry,ref={0}:backend-slim', env.CACHE_REPO) || '' }}
            ${{ matrix.stack == 'standalone' && format('type=registry,ref={0}:backend-slim-amd64', env.BUILD_CACHE) || '' }}
      - name: Add E2E-only fixtures and telemetry isolation to backend image
        if: env.BUILD_BACKEND == 'true'
