          retention-days: 7
          if-no-files-found: error

  skills-journeys:
    needs: [changes, skill-packages, application-wheels]
    if: >-
      needs.changes.outputs.any == 'true' && needs.changes.outputs.journeys != '[]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    uses: ./.github/workflows/skills-e2e-journeys.yml
    with:
      sdk: ${{ needs.skill-packages.outputs.sdk }}
      traceai: ${{ needs.skill-packages.outputs.traceai }}
      pair_sha256: ${{ needs.skill-packages.outputs.pair_sha256 }}
      application_sha256: ${{ needs.application-wheels.outputs.sha256 }}
      journeys: ${{ needs.changes.outputs.journeys }}

  # One verdict for every Skills job: each passed (the registered journeys only
  # when this run selected any), and every required case has a receipt from this
  # run on this commit, with the package pair this run built.
  skills-receipts:
    name: Skills E2E receipts
    needs: [changes, skill-packages, application-wheels, skills, campaign-executor, skills-journeys]
    if: ${{ !cancelled() && needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every Skills job finished as this run requires
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '([."skill-packages".result, ."application-wheels".result, .skills.result, ."campaign-executor".result] | all(. == "success")) and
            (if .changes.outputs.journeys == "[]" then ."skills-journeys".result == "skipped" else ."skills-journeys".result == "success" end)' <<< "$NEEDS"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: skill-passes-*
          path: ${{ runner.temp }}/skill-passes
          merge-multiple: false
      - name: Collect the package pair from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: skill-pair-${{ github.sha }}
          path: ${{ runner.temp }}/skill-pair
      - name: Collect registered worker receipts from this workflow run
        uses: actions/download-artifact@v4
        with:
          pattern: skills-journey-*
          path: ${{ runner.temp }}/skills-journeys
      - name: Check required-coverage controls
        run: python3 -I e2e/scripts/test_skills_coverage.py
      - name: Require every Skills case on this tested commit
        env:
          SDK_COMMIT: ${{ needs.skill-packages.outputs.sdk }}
          TRACEAI_COMMIT: ${{ needs.skill-packages.outputs.traceai }}
          APP_SHA: ${{ needs.application-wheels.outputs.sha256 }}
          PAIR_SHA: ${{ needs.skill-packages.outputs.pair_sha256 }}
          SDK_SHA: ${{ needs.skill-packages.outputs.sdk_sha256 }}
          JOURNEYS: ${{ needs.changes.outputs.journeys }}
        run: |
          mkdir -p "$RUNNER_TEMP/skills-journeys"
          python3 -I e2e/scripts/skills-coverage.py reconcile "$RUNNER_TEMP/skill-passes" "$GITHUB_SHA" \
            --registered "$RUNNER_TEMP/skills-journeys" --run-id "$GITHUB_RUN_ID" --journeys "$JOURNEYS" --pair "$RUNNER_TEMP/skill-pair" --sdk "$SDK_COMMIT" \
            --traceai "$TRACEAI_COMMIT" --pair-sha "$PAIR_SHA" --sdk-sha "$SDK_SHA" --application-sha "$APP_SHA"

  report:
    # One report for all shards of a stack, and the proof that sharding dropped
    # nothing: every test an unsharded listing names must have exactly one
    # result across the shards (e2e/scripts/shard-report.mjs). It runs when a
    # shard failed too, so the merged report shows the failure.
    name: e2e report (${{ matrix.stack }})
    permissions:
      contents: read
      actions: read
    needs: [changes, e2e]
    if: ${{ !cancelled() && needs.changes.outputs.any == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.stacks) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    env:
      # Lists exactly what the ordinary legs ran (playwright.config.ts).
      SKILLS_COHORT: ordinary
      E2E_STACK: ${{ matrix.stack }}
      E2E_QUARANTINE_TODAY: ${{ needs.changes.outputs.today }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: yarn
          cache-dependency-path: e2e/yarn.lock

      - name: Install harness
        run: yarn install --frozen-lockfile

      - name: Download verified shard and once-per-stack receipts
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD_TOTAL: ${{ needs.changes.outputs.shard_total }}
        run: node scripts/shard-report.mjs receipts

      - name: Merge the shards into one report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-report.json
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright merge-reports --reporter html,json all-blob-reports

      - name: List the unsharded suite
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: listed-suite.json
        run: npx playwright test --list --reporter json > /dev/null

      - name: The shards ran every test exactly once
        # Only tests independently listed to pass but skipped at runtime are phased.
        # Set the repository variable E2E_ENFORCE_RUNTIME_SKIPS to 'true' to fail on them.
        # Listing parity, result counts, and all other unexpected outcomes always fail.
        env:
          E2E_ENFORCE_RUNTIME_SKIPS: ${{ vars.E2E_ENFORCE_RUNTIME_SKIPS }}
        run: >-
          node scripts/shard-report.mjs parity --listed listed-suite.json --merged merged-report.json
          --phase-runtime-skips --out shard-parity.json

      - name: Verify topology-specific cases in the listing and merged results
        run: node --test scripts/qualify-topology.mjs

      - name: The flow catalog check and the SDK suites ran and passed
        run: |
          cat once-per-stack/record.json
          if ! jq -e '.outcomes | keys == ["flow_catalog_check", "python_sdk_suite", "typescript_sdk_suite"] and all(.[]; . == "success")' once-per-stack/record.json > /dev/null; then
            echo "::error::A once-per-stack step (flow catalog check, SDK suites) did not succeed on the last shard."
            exit 1
          fi

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.stack == 'standalone' && 'playwright-report-standalone' || 'playwright-report' }}
          path: e2e/playwright-report
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

      - name: Upload the merged results (input for scripts/shard-report.mjs durations)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-merged-results-${{ matrix.stack }}
          path: |
            e2e/merged-report.json
            e2e/listed-suite.json
            e2e/shard-parity.json
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

  e2e-tests:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.body || github.event.changes.title) && 'E2E metadata edit' || 'E2E Tests Pass' }}
    needs: [changes, e2e, report, skills-receipts]
    if: ${{ always() && !(github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.body || github.event.changes.title)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless the suite and its report passed, or nothing needed to run
        env:
          CHANGES: ${{ needs.changes.result }}
          E2E_NEEDED: ${{ needs.changes.outputs.any }}
          E2E: ${{ needs.e2e.result }}
          REPORT: ${{ needs.report.result }}
        run: |
          echo "changes: $CHANGES, e2e needed: ${E2E_NEEDED:-<none>}, e2e: $E2E, report: $REPORT"
          # Stricter than "every dependency succeeded or was skipped": a skip
          # passes only when the changes job said there was nothing to run. A
          # skipped report job would otherwise pass without the parity proof.
          if [ "$CHANGES" != success ]; then
            echo "::error::The changes job did not succeed ($CHANGES)."
            exit 1
          fi
          if [ "$E2E_NEEDED" = true ] && [ "$E2E" = success ] && [ "$REPORT" = success ]; then
            echo "Every shard passed and the report job proved they ran the whole suite."
          elif [ "$E2E_NEEDED" = false ] && [ "$E2E" = skipped ] && [ "$REPORT" = skipped ]; then
            echo "No path that the E2E suite covers changed, so it was not needed."
          else
            echo "::error::E2E did not pass (e2e: $E2E, report: $REPORT, e2e needed: ${E2E_NEEDED:-<none>})."
            exit 1
          fi

      - name: Fail closed unless the Skills cohorts and journeys passed, or nothing needed to run
        env:
          E2E_NEEDED: ${{ needs.changes.outputs.any }}
          SKILLS: ${{ needs.skills-receipts.result }}
        run: |
          echo "e2e needed: ${E2E_NEEDED:-<none>}, Skills receipts: $SKILLS"
          if [ "$E2E_NEEDED" = true ] && [ "$SKILLS" = success ]; then
            echo "Every Skills cohort and selected registered journey passed on this commit."
          elif [ "$E2E_NEEDED" = false ] && [ "$SKILLS" = skipped ]; then
            echo "No path that the E2E suite covers changed, so the Skills cohorts were not needed."
          else
            echo "::error::Skills E2E did not pass (receipts: $SKILLS, e2e needed: ${E2E_NEEDED:-<none>})."
            exit 1
          fi
