name: E2E Harness Self-tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "e2e/**"
      - "bin/e2e"
      - "frontend/Dockerfile"
      - "scripts/reclaim-runner-disk.sh"
      - ".github/workflows/e2e-stack-profile.yml"
      - ".github/workflows/e2e-ci.yml"
      - ".github/workflows/e2e-cache.yml"
      - ".github/workflows/e2e-harness-selftest.yml"
      # Inputs read outside e2e/ by the coverage, host-update and CI-guidance self-tests.
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "api_contracts/host-update/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/python-lint.yml"
      - ".github/workflows/retarget-proof.yml"
      - ".github/scripts/ci_base_gate.py"
  push:
    branches: [dev, main]
    paths:
      - "e2e/**"
      - "bin/e2e"
      - "frontend/Dockerfile"
      - "scripts/reclaim-runner-disk.sh"
      - ".github/workflows/e2e-stack-profile.yml"
      - ".github/workflows/e2e-ci.yml"
      - ".github/workflows/e2e-cache.yml"
      - ".github/workflows/e2e-harness-selftest.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "api_contracts/host-update/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/python-lint.yml"
      - ".github/workflows/retarget-proof.yml"
      - ".github/scripts/ci_base_gate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-harness-selftest-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    name: e2e harness self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Keep the harness on the same Node version as e2e-ci.yml.
          node-version: "22.18"
          cache: yarn
          cache-dependency-path: e2e/yarn.lock

      - name: Install harness
        run: yarn install --frozen-lockfile

      # These checks need neither the application stack nor a browser install.
      - name: Harness self-tests
        run: yarn selftest

      - name: Harness self-tests (standalone)
        run: E2E_STACK=standalone yarn selftest

      - name: Typecheck harness
        run: yarn typecheck

      - name: Flow catalog is current
        id: catalog
        run: yarn catalog:check

      # Preserve the generator's output for remote-only authors. The check above
      # still fails on drift: downloading this file is not a passing catalog gate.
      - name: Generate catalog repair artifact
        if: failure() && steps.catalog.outcome == 'failure'
        run: yarn catalog

      - name: Upload generated catalog
        if: failure() && steps.catalog.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generated-flow-catalog
          path: e2e/FLOWS.md
          retention-days: 3
          if-no-files-found: error
