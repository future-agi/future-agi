name: CI base gate

# "CI ran on this base" is NOT a required check. Backend CI and E2E CI do not
# start on a retarget (see their `types`), so after a pull request moves onto
# main their newest suites were planned against the old base. This check turns
# red there until a push or a reopen runs them against main; into dev it passes
# with a notice, since the merge queue re-tests every merge. It reads the pull
# request's timeline and its CI runs and recomputes its verdict on every run:
# it never writes or copies another check. See .github/scripts/ci_base_gate.py.
# Only the repository owner can make it required on main, and only after this
# file is on main (earlier, main pull requests would wait for it forever).

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  # The workflow runs list (GET /repos/{repo}/actions/runs) needs Actions read.
  actions: read

jobs:
  gate:
    # Never skipped: every run, edits included, reports a truthful verdict.
    name: CI ran on this base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Judge from the timeline and the CI runs of the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ACTION: ${{ github.event.action }}
        run: python3 -I .github/scripts/ci_base_gate.py
