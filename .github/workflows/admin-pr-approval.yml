name: Admin PR approval

# Repository admins land changes through the same merge queue as everyone
# else, without waiting for a second reviewer. This approves a pull request
# when its author has admin permission on this repository. Other authors keep
# the normal review requirement. Every merge to dev still goes through the
# queue and its three required checks.
#
# pull_request_target runs this file from the base branch with no checkout,
# so no pull request code executes here. Fork pull requests and drafts are
# ignored. Dev dismisses stale approvals on push, so each new head is approved
# again.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: admin-pr-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve the head commit when the author is a repository admin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          permission=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission)
          if [[ $permission != admin ]]; then
            echo "Author $AUTHOR has $permission permission; normal review applies."
            exit 0
          fi
          # Approve only the commit this event is about; a later push gets its own run.
          current=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [[ $current != "$HEAD_SHA" ]]; then
            echo "Head moved to $current; the newer event approves it."
            exit 0
          fi
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" \
            -f commit_id="$HEAD_SHA" -f event=APPROVE \
            -f body="Approved automatically: the author is a repository admin. The change still lands only through the dev merge queue and its required checks." \
            --jq '"approved \(.commit_id)"'
