# Manual escape hatch for ad-hoc and -dev builds. Stable releases go through
# release-images.yml (tag-triggered); this wrapper shares the same build via
# build-image-multiarch.yml (native linux/amd64 + linux/arm64, registry layer
# cache) so the two paths cannot drift. The size budget only reports here: an
# ad-hoc build is never blocked by it. `variant` picks the backend variant
# (futureagi/Dockerfile.oss IMAGE_VARIANT, docs/images.md): standard publishes
# <version>, slim publishes <version>-slim.
name: Release backend

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v2.1.0-dev)"
        required: true
        type: string
      branch:
        description: "Branch to build from"
        required: true
        default: "main"
        type: string
      variant:
        description: "Backend variant: standard (<version>) or slim (<version>-slim)"
        required: true
        default: standard
        type: choice
        options: [standard, slim]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      packages: write # ghcr build cache
    uses: ./.github/workflows/build-image-multiarch.yml
    with:
      image: futureagi/future-agi
      context: ./futureagi
      dockerfile: ./futureagi/Dockerfile.oss
      version: ${{ inputs.version }}
      ref: ${{ inputs.branch }}
      push-latest: false
      size-budget: report
      free-disk: false
      tag-suffix: ${{ inputs.variant == 'slim' && '-slim' || '' }}
      build-args: IMAGE_VARIANT=${{ inputs.variant }}
      # Own cache scope, reading the release's: an ad-hoc build of another
      # branch must not replace the cache the next release reuses.
      cache-scope: adhoc-backend
      cache-from-extra: |
        ghcr.io/future-agi/future-agi/build-cache:backend${{ inputs.variant == 'slim' && '-slim' || '' }}-amd64
        ghcr.io/future-agi/future-agi/build-cache:backend${{ inputs.variant == 'slim' && '-slim' || '' }}-arm64
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  verify-oss-boundary:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify OSS image boundary
        env:
          OSS_IMAGE: futureagi/future-agi:${{ inputs.version }}${{ inputs.variant == 'slim' && '-slim' || '' }}
          OSS_VARIANT: ${{ inputs.variant }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/verify-image-contents.sh "$VERSION" oss
