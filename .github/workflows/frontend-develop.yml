name: Frontend Develop Branch Pipeline

on:
  push:
    branches: [develop, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-develop.yml"
  pull_request:
    # Every base branch, so stacked PRs into feature branches get CI too.
    # Every path of frontend-feature.yml is here: that pipeline skips its
    # unit tests while a pull request is open, because this one runs them.
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-develop.yml"
      - ".github/workflows/frontend-feature.yml"
  workflow_dispatch:

concurrency:
  # One active run per pull request: a newer push cancels the older run.
  # Pushes to a branch keep one group per commit and never cancel each other.
  group: frontend-develop-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Quality checks and the whole test suite, once. `test:run` is every test:
  # `test:unit` and `test:integration` only filter the same files by test name,
  # so running all three ran most tests three times. No coverage here: see the
  # coverage job for why the verdict must not come from a coverage run.
  quality-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test contract code generation
        run: yarn test:contracts-codegen

      # Run the real compiler, but keep existing contract-schema diagnostics
      # advisory until the schema defaults and index-signature debt are resolved.
      - name: Type check (advisory)
        continue-on-error: true
        run: yarn type-check

      - name: Run all tests
        run: yarn test:run --reporter=verbose
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Coverage of the whole suite, on pushes and manual runs. Not on pull
  # requests: quality-and-tests holds the verdict there, and a coverage run
  # cannot be trusted with it. With coverage on, vitest converts the coverage
  # on its main thread after the last test (70 to 105 seconds here). Past its
  # 60-second worker RPC limit it exits 1 with every test passed. So this job
  # ignores vitest's exit code and fails only when no coverage file was
  # written. reportOnFailure makes vitest write the file even when a test
  # failed: a test that fails here and passes in quality-and-tests (the run is
  # slower with coverage on) must not turn the coverage job red.
  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run all tests with coverage
        run: |
          yarn test:run --coverage --coverage.reportOnFailure || echo "::warning::vitest exited $? in the coverage run; quality-and-tests holds the verdict on the tests"
          test -s coverage/lcov.info
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/lcov.info
          flags: develop-branch
          name: develop-coverage

  # Build validation, in parallel with the tests: neither needs the other.
  build-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: develop-build
          path: frontend/dist/
          retention-days: 7

  # Performance tests (only on PRs)
  performance-tests:
    runs-on: ubuntu-latest
    needs: build-check
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build app
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x

      - name: Start preview server
        run: yarn start &

      - name: Wait for server
        run: sleep 10

      - name: Run Lighthouse CI
        run: lhci autorun --upload.target=temporary-public-storage || echo "Lighthouse CI completed"
        continue-on-error: true

  # Summary for develop branch
  develop-summary:
    runs-on: ubuntu-latest
    needs: [quality-and-tests, build-check]
    if: always()
    steps:
      - name: Develop Branch Summary
        run: |
          echo "## 🔄 Develop Branch Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Quality & Tests: ${{ needs.quality-and-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Check: ${{ needs.build-check.result }}" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.quality-and-tests.result }}" == "success" && "${{ needs.build-check.result }}" == "success" ]]; then
            echo "✅ All checks passed - Ready for main branch merge!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some checks failed - Please review before merging" >> $GITHUB_STEP_SUMMARY
          fi
