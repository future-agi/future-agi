name: Update rehearsal milestones

on:
  pull_request:
    paths:
      - 'scripts/rehearse_update_compatibility.py'
      - 'scripts/update_rehearsal_*.py'
      - 'scripts/build_update_compatibility_proof.py'
      - 'deploy/tests/test_update_rehearsal_driver.py'
      - 'deploy/tests/update_e2e/real_automatic.py'
      - 'deploy/update/**'
      - '.github/workflows/update-rehearsal-milestones.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-rehearsal-m1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-snapshot:
    name: M1 retained v1.53.0 source snapshot (not qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Daemon-free driver safety tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s deploy/tests -p test_update_rehearsal_driver.py -v
      - name: Isolated native daemon context in private runner config
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d "$HOME/fagi-upd-e2e-driver-m1-docker.XXXXXX")"
          docker --config "$dir" context create colima-fagi-update --docker host=unix:///var/run/docker.sock
          printf 'DOCKER_CONFIG=%s\n' "$dir" >> "$GITHUB_ENV"
      - name: Milestone job plan (no Docker mutations)
        run: |
          set -euo pipefail
          umask 077
          python -I scripts/rehearse_update_compatibility.py qualify --through source_snapshot \
            --dry-run --boot-timeout 4200 --docker-context colima-fagi-update \
            --out "$HOME/fagi-upd-e2e-driver-m1-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Real A boot, A4 witnesses and shipping run_quiesced only
        run: |
          set -euo pipefail
          umask 077
          test "$(uname -m)" = x86_64
          timeout --signal=TERM --kill-after=180s 135m \
            python -I scripts/rehearse_update_compatibility.py qualify --through source_snapshot \
              --boot-timeout 4200 --docker-context colima-fagi-update \
              --out "$HOME/fagi-upd-e2e-driver-m1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Retain milestone evidence and bounded diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-m1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/fagi-upd-e2e-driver-m1-plan-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ~/fagi-upd-e2e-driver-m1-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ~/fagi-upd-e2e-driver-m1-${{ github.run_id }}-${{ github.run_attempt }}/snapshot-*.members.jsonl
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
          # Never upload workspace: archives, generated env/private config, API
          # credentials and raw command logs stay on the ephemeral runner. The
          # exact snapshot inventory includes generated fixture container config;
          # treat this test artifact as private, not production qualification.
