# Measure what a real Standalone boot costs on a GitHub-hosted amd64 runner.
#
# Not a test of the updater: it installs the published v1.53.0 release from
# its own tag, times every boot phase, and records the runner facts that the
# real automatic-update acceptance jobs depend on (boot time, disk, memory,
# whether a cron daemon is running for the installed scheduler, and the size
# of the B and C images). Nothing is signed or published.
#
# workflow_dispatch only works once this file is on the default branch; until
# then it runs on pull requests that change this file.
name: Update real boot smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/update-real-boot-smoke.yml

permissions:
  contents: read

jobs:
  boot:
    name: Real v1.53.0 Standalone boot timing on amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      A_VERSION: v1.53.0
      LATER_VERSIONS: v1.54.0 v1.55.0
      BOOT_LIMIT_SECONDS: "4200"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Runner facts before install
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          {
            echo "## runner"; uname -a; nproc; free -m; df -h / "$RUNNER_TEMP" /var/lib/docker 2>/dev/null
            echo "## docker"; docker version --format '{{.Server.Version}}'; docker compose version
            echo "## scheduler (the installed-scheduler acceptance needs one of these)"
            echo "cron active: $(systemctl is-active cron 2>&1)"
            echo "cron enabled: $(systemctl is-enabled cron 2>&1)"
            echo "crontab binary: $(command -v crontab || echo missing)"
            crontab -l 2>&1 | head -5
            echo "user manager: $(systemctl --user is-system-running 2>&1)"
            echo "linger: $(loginctl show-user "$(id -u)" -p Linger 2>&1)"
          } 2>&1 | tee "$RUNNER_TEMP/smoke/runner-before.txt"

      - name: Install the published release from its own tag (no start)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/a"
          mkdir -p "$dir"
          git archive "$A_VERSION" | tar -x -C "$dir"
          cd "$dir"
          CI=1 ./bin/install --no-up --no-telemetry --skip-user-creation -y \
            2>&1 | tee "$RUNNER_TEMP/smoke/install.txt"
          if grep -q '^FUTURE_AGI_VERSION=' .env; then
            sed -i "s/^FUTURE_AGI_VERSION=.*/FUTURE_AGI_VERSION=$A_VERSION/" .env
          else
            echo "FUTURE_AGI_VERSION=$A_VERSION" >> .env
          fi
          grep '^FUTURE_AGI_VERSION=' .env

      - name: Pull A and time it
        working-directory: ${{ runner.temp }}/a
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker compose pull 2>&1 | tail -5
          echo "pull_seconds=$(( $(date +%s) - start ))" | tee -a "$RUNNER_TEMP/smoke/timings.txt"

      - name: Boot A and time each phase
        working-directory: ${{ runner.temp }}/a
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/smoke/phases.txt"
          start=$(date +%s)
          docker compose up -d 2>&1 | tail -5
          last=""
          result=timeout
          while (( $(date +%s) - start < BOOT_LIMIT_SECONDS )); do
            elapsed=$(( $(date +%s) - start ))
            app=$(docker compose ps -q app)
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$app" 2>/dev/null || echo missing)
            running=$(docker inspect --format '{{.State.Running}}' "$app" 2>/dev/null || echo missing)
            phase=$(curl -fsS --max-time 5 http://localhost:3000/starting-status.json 2>/dev/null | head -c 300 || true)
            now="health=$health running=$running status=$phase"
            if [[ "$now" != "$last" ]]; then
              echo "t+${elapsed}s $now" | tee -a "$out"
              last="$now"
            fi
            if [[ "$health" == healthy ]]; then result=healthy; break; fi
            if [[ "$running" == false ]]; then result=exited; break; fi
            sleep 10
          done
          elapsed=$(( $(date +%s) - start ))
          echo "boot_result=$result boot_seconds=$elapsed" | tee -a "$RUNNER_TEMP/smoke/timings.txt"
          docker compose logs app 2>&1 | grep -E 'Applying |Running migrations|bootstrap|ERROR|Error' | tail -40 > "$RUNNER_TEMP/smoke/app-migrations-tail.txt" || true
          docker compose logs app 2>&1 | grep -c 'Applying ' | sed 's/^/migrations_applied=/' | tee -a "$RUNNER_TEMP/smoke/timings.txt" || true

      - name: Runner facts after boot
        if: always()
        working-directory: ${{ runner.temp }}/a
        run: |
          set -uo pipefail
          {
            echo "## after boot"; free -m; df -h / /var/lib/docker 2>/dev/null
            docker system df
            docker system df -v 2>/dev/null | sed -n '/VOLUME NAME/,/^$/p'
            docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}'
          } 2>&1 | tee "$RUNNER_TEMP/smoke/runner-after.txt"

      - name: Pull B and C and record disk
        if: always()
        run: |
          set -uo pipefail
          for v in $LATER_VERSIONS; do
            start=$(date +%s)
            docker pull --quiet "futureagi/standalone:$v" >/dev/null 2>&1 \
              && echo "pull_${v}_seconds=$(( $(date +%s) - start ))" \
              || echo "pull_${v}=failed"
          done | tee -a "$RUNNER_TEMP/smoke/timings.txt"
          df -h / /var/lib/docker 2>/dev/null | tee -a "$RUNNER_TEMP/smoke/timings.txt"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-real-boot-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: error

      - name: Tear down
        if: always()
        working-directory: ${{ runner.temp }}/a
        run: docker compose down -v --remove-orphans || true
