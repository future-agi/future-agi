name: Backend merge queue

on:
  merge_group:

permissions:
  contents: read
  actions: read # terminal parity reads job attempts and artifact digests
  issues: read # Backend CI's planner reads a pull request's labels (a no-op here)

jobs:
  backend:
    # The receipt verifier looks up these jobs as backend / <shard>.
    name: backend
    # A queue can mix internal and fork PRs. Run the whole candidate suite
    # without forwarding repository secrets into the reusable workflow.
    uses: ./.github/workflows/backend-ci.yml

  full-run-proof:
    # Under CI_SCOPE_MODE=light a pull request run holds the backend suites,
    # and this group runs without the private package. So every same-repo
    # member must show a passing internal Backend CI run on its own head (a
    # train rollup's run always is one). Forks stay exempt, as before light.
    # See .github/scripts/queue_full_run_gate.py.
    name: Members ran the internal suite
    if: vars.CI_SCOPE_MODE == 'light'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The target branch's tip. Not base_sha: under HEADGREEN it can be
          # the entry ahead, which is unlanded code like the group itself.
          ref: ${{ github.event.merge_group.base_ref }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: python3 -I .github/scripts/queue_full_run_gate.py

  backend-tests:
    # Reusable workflow checks are prefixed with the caller's job name.
    # Keep the queue's required check name identical to a direct run's.
    name: Backend Tests Pass
    needs: [backend, full-run-proof]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          VERDICT: ${{ needs.backend.outputs.verdict }}
          # Skipped outside light mode.
          PROOF: ${{ needs.full-run-proof.result }}
        # bash -e does not stop on a failing first command of an && list, so
        # each line exits on its own (test_queue_full_run_gate.py runs it).
        run: |
          [[ $BACKEND_RESULT == success && $VERDICT == success ]] || exit 1
          [[ $PROOF == success || $PROOF == skipped ]] || exit 1

  breaker:
    # Base-health breaker after each queue build, so a red base trips it even
    # when nothing lands (pushes to dev also run it, from pr-digest.yml). Not
    # in Backend Tests Pass's needs: it never changes the queue's verdict,
    # and its step cannot fail the run. It is idempotent, so it has no
    # concurrency group: a queued job would wait on one and hold the run
    # open. The script comes from the target
    # branch's tip (base_ref); the group is unlanded code.
    name: Base-health breaker
    needs: backend
    if: always() && github.repository == 'future-agi/future-agi'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write # the base-red label and tracking issue
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.merge_group.base_ref }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      # No secrets in this file (a group can hold fork code): the trip files
      # the base-red issue here, and the hourly digest on dev carries the
      # Slack line. Both only with DEVFLOW_HEARTBEAT=live.
      - continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEVFLOW_HEARTBEAT: ${{ vars.DEVFLOW_HEARTBEAT }}
        run: |
          set -o pipefail
          # The first group after this file lands still has a base without it.
          [[ -f .github/scripts/devflow_tick.py ]] || { echo "No breaker on the base yet."; exit 0; }
          python3 -I .github/scripts/devflow_tick.py --breaker-only | tee -a "$GITHUB_STEP_SUMMARY"
