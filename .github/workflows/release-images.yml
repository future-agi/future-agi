# Tag-triggered release: builds all seven platform images at the pushed vX.Y.Z
# tag, then fans out (ee overlay dispatch, deployment values-bump PR, docs
# changelog dispatch). Pre-release tags (-suffix) never reach this workflow
# (release-please only cuts bare vX.Y.Z; the guard job double-checks).
name: release-images

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: Stable platform tag whose completed image build needs a deployment bump retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-images-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          set -eu
          # Whole-string bash regex (not line-oriented grep): rejects any value
          # carrying an embedded newline, closing the multiline-GITHUB_OUTPUT
          # injection pattern even though a git tag cannot contain one today.
          v="${REQUESTED_VERSION:-${GITHUB_REF_NAME}}"
          if [[ ! "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$v' is not a stable platform version tag"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: frontend,        image: futureagi/frontend,        context: ./frontend,                dockerfile: ./frontend/Dockerfile,                    free-disk: true,  platforms: 'linux/amd64,linux/arm64' }
          - { name: backend,         image: futureagi/future-agi,      context: ./futureagi,               dockerfile: ./futureagi/Dockerfile.oss,               free-disk: false, platforms: linux/amd64 }
          - { name: agentcc-gateway, image: futureagi/agentcc-gateway, context: ./agentcc-gateway,         dockerfile: ./agentcc-gateway/Dockerfile,             free-disk: false, platforms: 'linux/amd64,linux/arm64' }
          - { name: serving,         image: futureagi/serving,         context: ./futureagi/model_serving, dockerfile: ./futureagi/model_serving/Dockerfile.oss, free-disk: false, platforms: 'linux/amd64,linux/arm64' }
          - { name: code-executor,   image: futureagi/code-executor,   context: ./futureagi/code-executor, dockerfile: ./futureagi/code-executor/Dockerfile,     free-disk: false, platforms: 'linux/amd64,linux/arm64' }
          - { name: fi-collector,    image: futureagi/fi-collector,    context: ./fi-collector,            dockerfile: ./fi-collector/Dockerfile,                free-disk: false, platforms: 'linux/amd64,linux/arm64' }
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      version: ${{ needs.guard.outputs.version }}
      ref: ${{ github.ref }}
      platforms: ${{ matrix.platforms }}
      push-latest: true
      free-disk: ${{ matrix.free-disk }}
      cache-scope: ${{ matrix.name }}
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  resolve-sdk:
    needs: guard
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sdk_version: ${{ steps.sdk.outputs.sdk_version }}
      sdk_wheel_sha256: ${{ steps.sdk.outputs.sdk_wheel_sha256 }}
    steps:
      - id: sdk
        env:
          IMAGE: futureagi/future-agi-simulation-runner
          VERSION: ${{ needs.guard.outputs.version }}
          PYPI: https://pypi.org/pypi/agent-learning-kit
        shell: bash
        run: |
          set -euo pipefail
          c="curl -sS --max-time 20 --retry 3 --retry-all-errors --retry-delay 2"
          code=$($c -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${VERSION}")
          [[ "$code" == 404 ]] || { echo "::error::${IMAGE}:${VERSION} already exists (HTTP $code); delete the tag deliberately to rebuild"; exit 1; }
          sdk=$($c -f "${PYPI}/json" | jq -er '.info.version')
          [[ "$sdk" =~ ^[0-9]+(\.[0-9]+){1,2}(\.post[0-9]+)?$ ]] || { echo "::error::unexpected SDK version '$sdk'"; exit 1; }
          rel=$($c -f "${PYPI}/${sdk}/json")
          jq -e '.info.yanked == false and (.urls | length) > 0' <<<"$rel" >/dev/null || { echo "::error::agent-learning-kit ${sdk} is yanked or has no files"; exit 1; }
          sha=$(jq -er '[.urls[] | select(.packagetype == "bdist_wheel") | .digests.sha256][0]' <<<"$rel")
          { echo "sdk_version=$sdk"; echo "sdk_wheel_sha256=$sha"; } >> "$GITHUB_OUTPUT"
          echo "agent-learning-kit ${sdk} (wheel sha256 ${sha})"

  simulation-runner:
    needs: [guard, build, resolve-sdk]
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-image.yml
    with:
      image: futureagi/future-agi-simulation-runner
      context: .
      dockerfile: ./Dockerfile.simulation-runner
      version: ${{ needs.guard.outputs.version }}
      ref: ${{ github.ref }}
      platforms: linux/amd64
      push-latest: true
      free-disk: false
      cache-scope: simulation-runner
      timeout-minutes: 45
      build-args: |
        BACKEND_IMAGE=futureagi/future-agi:${{ needs.guard.outputs.version }}
        FI_VERSION=${{ needs.resolve-sdk.outputs.sdk_version }}
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  dispatch-ee:
    needs: [guard, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: future-agi
          repositories: ee
          permission-contents: write
      - name: Dispatch platform-release to ee
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          body_b64=$(GH_TOKEN='${{ secrets.GITHUB_TOKEN }}' gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" --jq '.body' | base64 | tr -d '\n')
          gh api -X POST repos/future-agi/ee/dispatches \
            -f event_type=platform-release \
            -F 'client_payload[version]'="${VERSION}" \
            -F 'client_payload[release_url]'="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}" \
            -F 'client_payload[release_body_b64]'="${body_b64}"

  dispatch-docs:
    needs: [guard, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: future-agi
          repositories: docs
          permission-contents: write
      - name: Dispatch platform-release to docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          body_b64=$(GH_TOKEN='${{ secrets.GITHUB_TOKEN }}' gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" --jq '.body' | base64 | tr -d '\n')
          gh api -X POST repos/future-agi/docs/dispatches \
            -f event_type=platform-release \
            -F 'client_payload[version]'="${VERSION}" \
            -F 'client_payload[release_url]'="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}" \
            -F 'client_payload[release_body_b64]'="${body_b64}"

  bump-deployment:
    needs: [guard, dispatch-ee, resolve-sdk, simulation-runner]
    if: >-
      always() &&
      needs.guard.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.dispatch-ee.result == 'success' && needs.simulation-runner.result == 'success')
      )
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      SDK_VERSION: ${{ needs.resolve-sdk.outputs.sdk_version }}
      SDK_WHEEL_SHA256: ${{ needs.resolve-sdk.outputs.sdk_wheel_sha256 }}
      # yq paths of every platform-image tag per values file. If a path list
      # drifts from the values files, the sanity check below fails the job
      # rather than silently bumping a subset.
      COMMON_PATHS: >-
        .backend.image.tag .core_backend_beat.image.tag .core_backend_worker.image.tag
        .temporal_worker_default.image.tag .temporal_worker_tasks_s.image.tag
        .temporal_worker_tasks_l.image.tag .temporal_worker_tasks_xl.image.tag
        .temporal_worker_agent_compass.image.tag .temporal_worker_simulation_runner.image.tag
        .agentcc_gateway.image.tag .codeExecutor.image.tag .embedding.image.tag
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: future-agi
          repositories: deployment
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout deployment repo
        uses: actions/checkout@v4
        with:
          repository: future-agi/deployment
          token: ${{ steps.app-token.outputs.token }}
          ref: main
      - name: Install yq
        run: sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq
      - name: Bump platform tags
        run: |
          set -eu
          bump() { # file, paths...
            f="$1"; shift
            for p in "$@"; do
              if [ "$(yq "$p" "$f")" = "null" ]; then
                echo "::error::$p missing in $f — path list is stale, refusing partial bump"
                exit 1
              fi
              yq -i "$p = \"${VERSION}\"" "$f"
            done
          }
          # $COMMON_PATHS is intentionally unquoted: it must word-split into
          # one argument per yq path handed to bump().
          # Only the active GCP regions are bumped by the pipeline; us/aws is the
          # decommissioned AWS deployment and is intentionally left untouched.
          # shellcheck disable=SC2086
          bump eu/gcp/deployment/values.yaml  $COMMON_PATHS .fiCollector.image.tag
          # shellcheck disable=SC2086
          bump us/gcp/deployment/values.yaml  $COMMON_PATHS .fiCollector.image.tag
      - name: Open bump PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eu
          branch="chore/bump-platform-${VERSION}"
          git config user.name "futureagi-release-bot"
          git config user.email "release-bot@futureagi.com"
          # Idempotent: a re-run reuses the existing branch instead of failing.
          git switch -c "$branch" 2>/dev/null || git switch "$branch"
          git add -A
          git diff --cached --quiet && { echo "values already at ${VERSION}; nothing to do"; exit 0; }
          git commit -m "chore(release): bump platform images to ${VERSION}"
          # Plain --force: the bump branch is bot-owned and regenerated from main
          # each run; a single-branch checkout never fetches its remote ref, so
          # --force-with-lease has no base to compare and is rejected as "stale
          # info" on re-runs. Nothing human ever pushes here to clobber.
          git push --force -u origin "$branch"
          if [ -z "$(gh pr list --repo future-agi/deployment --head "$branch" --state open --json number --jq '.[].number')" ]; then
            if [ -n "${SDK_VERSION:-}" ]; then
              runner_line="simulation-runner ${VERSION} bundles agent-learning-kit ${SDK_VERSION} (wheel sha256 ${SDK_WHEEL_SHA256})."
            else
              runner_line="simulation-runner SDK version not resolved on this retry; see the original tag run."
            fi
            gh pr create --repo future-agi/deployment --base main --head "$branch" \
              --title "chore(release): bump platform to ${VERSION}" \
              --body "Automated bump for [${VERSION}](https://github.com/future-agi/future-agi/releases/tag/${VERSION}). ${runner_line} Review release notes (check for the migrations callout) before deploying per the deployment guide."
          else
            echo "bump PR already open"
          fi
