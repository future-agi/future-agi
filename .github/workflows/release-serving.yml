# Manual escape hatch for ad-hoc and -dev builds. Stable releases go through
# release-images.yml (tag-triggered); this wrapper shares the same build via
# build-image-multiarch.yml (native linux/amd64 + linux/arm64, registry layer
# cache) so the two paths cannot drift. The size budget only reports here: an
# ad-hoc build is never blocked by it.
#
# NOTE: builds Dockerfile.oss (self-contained public base). The sibling plain
# Dockerfile pulls a private ECR base and is not usable by the OSS pipeline.
#
# gpu: the CUDA variant (TORCH_BACKEND=cu124, linux/amd64 only), tagged
# <version>-gpu, as release-images.yml's serving-gpu job publishes it.
name: Release serving

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v2.1.0-dev)'
        required: true
        type: string
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: choice
        options: [main, dev]
      gpu:
        description: 'CUDA build (linux/amd64 only, tagged <version>-gpu)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      packages: write # ghcr build cache
    uses: ./.github/workflows/build-image-multiarch.yml
    with:
      image: futureagi/serving
      context: ./futureagi/model_serving
      dockerfile: ./futureagi/model_serving/Dockerfile.oss
      version: ${{ inputs.version }}
      ref: ${{ inputs.branch }}
      push-latest: false
      size-budget: report
      arches: ${{ inputs.gpu && '["amd64"]' || '["amd64","arm64"]' }}
      tag-suffix: ${{ inputs.gpu && '-gpu' || '' }}
      build-args: ${{ inputs.gpu && 'TORCH_BACKEND=cu124' || '' }}
      free-disk: ${{ inputs.gpu }}
      # Own cache scope, reading the release's: an ad-hoc build of another
      # branch must not replace the cache the next release reuses.
      cache-scope: adhoc-serving
      cache-from-extra: |
        ghcr.io/future-agi/future-agi/build-cache:serving${{ inputs.gpu && '-gpu' || '' }}-amd64
        ghcr.io/future-agi/future-agi/build-cache:serving-arm64
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
