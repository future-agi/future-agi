# Manual escape hatch for ad-hoc and -dev builds. Stable releases go through
# release-images.yml (tag-triggered); this wrapper shares the same build via
# build-image.yml so the two paths cannot drift.
#
# NOTE: builds Dockerfile.oss (self-contained public base). The sibling plain
# Dockerfile pulls a private ECR base and is not usable by the OSS pipeline.
name: Release serving

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v2.1.0-dev)'
        required: true
        type: string
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: choice
        options: [main, dev]
      torch-channel:
        description: 'Torch wheels: default = PyPI (CUDA on x86_64), cpu = CPU-only'
        required: false
        default: 'default'
        type: choice
        options: [default, cpu]

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/build-image.yml
    with:
      image: futureagi/serving
      context: ./futureagi/model_serving
      dockerfile: ./futureagi/model_serving/Dockerfile.oss
      version: ${{ inputs.version }}
      ref: ${{ inputs.branch }}
      platforms: 'linux/amd64,linux/arm64'
      push-latest: false
      free-disk: false
      # Separate scope per channel; the variants share no layers past apt.
      cache-scope: ${{ inputs.torch-channel == 'cpu' && 'serving-cpu' || 'serving' }}
      build-args: ${{ inputs.torch-channel == 'cpu' && 'TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu' || '' }}
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
