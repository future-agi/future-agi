  "_post_merge_reason": "GITHUB_TOKEN merges suppress push workflows. Every dev push workflow that supports workflow_dispatch and whose push filter can match a LOW path is dispatched on dev after a merge, with that filter's paths: Backend CI, advisory distributed E2E, SDK Compatibility, Standalone install CI, Update CI, and the frontend checks and dev CDN for frontend changes. A dispatch of Standalone install CI or Update CI also runs upgrade jobs that a push skips. AgentCC Gateway CI, API Contracts, Collector and compose CI, Helm chart CI, Images CI and Update PostgreSQL probe are not dispatched: their push filters match no LOW path, so a person's merge of the same files would not start them either (a test checks both lists against the workflow files). Respect DEV_CDN_AUTO_DEPLOY=false before dispatching CDN, because that workflow's manual entry bypasses its push switch. The controller never deletes the head branch; this repository's delete_branch_on_merge setting does, after the merge."
