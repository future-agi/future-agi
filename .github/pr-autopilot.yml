  "_low_reason": "Existing docs are Markdown, locale payloads live in frontend/src/locales/langs, and these are established test roots. Glob * matches within one path segment; only ** as a whole segment spans zero or more directories. Named test files must match the final basename, never just a test_-prefixed parent directory. Do not allow arbitrary scripts, MDX, JSX copy edits, fixtures, conftest, test configuration, harnesses or all of frontend: paths alone cannot prove they are copy-only. All removals and renames are MEDIUM unless a HIGH rule applies; this also prevents deleting or moving tests out of coverage.",
