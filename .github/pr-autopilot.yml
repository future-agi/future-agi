  "_post_merge_reason": "GITHUB_TOKEN merges suppress push workflows. Every dev push workflow that supports workflow_dispatch and whose push filter can match a LOW path is dispatched on dev after a merge, with that filter's paths: Backend CI, distributed E2E, E2E Harness Self-tests for e2e flow specs, SDK Compatibility, Standalone install CI, Update CI, and the frontend checks and dev CDN for frontend changes. A dispatch of Standalone install CI or Update CI also runs upgrade jobs that a push skips. Python types (python-types.yml) runs on every dev push but has no workflow_dispatch and is not dispatched: post_merge_not_dispatched records why. The test fails if a LOW path could be a Python file outside a tests/ directory or another mypy input (the baseline, its script and self-test, or a mypy.ini that mypy reads before pyproject.toml), so a wider LOW allowlist forces a review of that exemption. It also fails if [tool.mypy] no longer excludes tests/, and if an exempt workflow is no longer a dev push workflow. AgentCC Gateway CI, API Contracts, Collector and compose CI, Helm chart CI, Images CI and Update PostgreSQL probe are not dispatched: their push filters match no LOW path, so a person's merge of the same files would not start them either (a test checks both lists against the workflow files). That test runs on every PR into dev that changes a workflow file or an autopilot file, so a PR that changes a dev push filter or adds a dev push workflow may need an entry here. Respect DEV_CDN_AUTO_DEPLOY=false before dispatching CDN, because that workflow's manual entry bypasses its push switch. The merging run posts the merged record before any dispatch, so no follow-up starts twice. If the run ends before the record (a lost merge answer, a record it could not write, a timeout), a later sweep posts the record and then dispatches the same list once. A run that ends partway through its dispatches is not repeated: its failed job and a record without the merged label show it, and a person dispatches the rest. The controller never deletes the head branch; this repository's delete_branch_on_merge setting does, after the merge."
