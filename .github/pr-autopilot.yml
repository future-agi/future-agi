  "_post_merge_reason": "GITHUB_TOKEN merges suppress push workflows. These existing workflows support workflow_dispatch: explicitly recheck dev with Backend CI and advisory distributed E2E, and run frontend checks/dev CDN only for frontend changes. Respect DEV_CDN_AUTO_DEPLOY=false before dispatching CDN, because that workflow's manual entry bypasses its push switch. Audit remaining push-only consumers before enablement. Never delete the source branch automatically."
