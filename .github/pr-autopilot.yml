  "_policy": "Low-risk trusted-author changes may merge on checks; medium needs one human, high needs two. Source: https://claude.dev/blog/solving-code-review-at-anthropic . These path and size thresholds are this repository's conservative implementation, not Anthropic's exact thresholds.",
  "base_branch": "dev",
