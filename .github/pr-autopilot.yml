  "_high_reason": "Sensitive components, dependency/build inputs, automation and its own policy always require people. Explicit API-key lifecycle/storage, socket workspace authorization and gateway access-group modules reflect existing security boundaries. Token matching is case-insensitive across separators/camelCase and rejoins adjacent words, so api_key/api-key/apiKey and workspace_access/access_groups remain HIGH even in docs or tests. Unknown paths are never LOW.",
