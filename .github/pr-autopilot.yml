    {"workflow": "frontend-develop.yml", "inputs": {}, "paths": ["frontend/**"]},
    {"workflow": "frontend-dev-cdn.yaml", "inputs": {"branch": "dev", "repair_spa_routes": "false"}, "paths": ["frontend/**"], "respect_dev_cdn_switch": true}
