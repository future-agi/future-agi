# fi-collector default config (also used by docker-compose.standalone.yml).
#
# Override any field via the corresponding FI_* env var (see cmd/fi-collector/main.go
# applyEnvOverrides) without rebuilding the image.

writer:
  # Hostname `clickhouse` resolves inside the docker-compose network. For
  # local dev outside docker use http://127.0.0.1:8123. Production sets
  # this to the CH 25.3 cluster's HTTP load-balancer.
  url: http://clickhouse:8123
  database: default
  table: spans
  # Retry policy. 5 retries with exponential backoff (100ms → 10s capped)
  # tolerates the 99.9p HTTP latency spike from CH compaction. After that
  # we dead-letter to disk — no silent drops, no infinite loop on a
  # malformed payload (4xx skips the retry budget).
  max_retries: 5
  initial_backoff: 100ms
  max_backoff: 10s
  request_timeout: 30s
  # Local path inside the container; bind-mount to /var/lib/fi-collector
  # on the host in compose so a container restart preserves the queue.
  dead_letter_file: /var/lib/fi-collector/dead_letter.jsonl
  # We default async_insert OFF — our own batching is the primary
  # backpressure mechanism. Flip on under acute write spikes only.
  async_insert: false

server:
  # OTLP gRPC receiver (every server-side OTel SDK).
  grpc_addr: ":4317"
  # OTLP/HTTP receiver (browser SDKs + lightweight clients).
  # Accepts POST /v1/traces with application/x-protobuf or application/json,
  # uncompressed or Content-Encoding: gzip (capped as sent and, for gzip,
  # after decompression: otlp_max_body_mib), per
  # https://opentelemetry.io/docs/specs/otlp/#otlphttp. X-Project-Name
  # (alias FI-Project-Name; the same keys as gRPC metadata) names the project
  # for ResourceSpans that carry no project_name resource attribute.
  # Set "" (or FI_HTTP_ADDR=disable) to turn the listener off.
  http_addr: ":4318"
  batch_max_rows: 5000
  batch_max_age: 5s
  # Ingest limits (README.md, "Ingest limits and backpressure"). Memory, in
  # MiB, that all OTLP requests may hold at once, from reading a body until
  # ClickHouse has stored its rows (FI_INGEST_BUDGET_MIB). Unset: about half
  # of the Go memory limit (GOMEMLIMIT, else 90% of the container's limit),
  # less a fixed allowance; 256 with no limit at all. Past it, requests wait
  # their turn while the budget frees up (ingest_max_wait), then get 503 +
  # Retry-After / UNAVAILABLE, which exporters retry.
  # ingest_budget_mib: 0
  # Largest OTLP/HTTP body in MiB, as sent and after gzip decompression
  # (FI_OTLP_MAX_BODY_MIB; 413 above it). Unset: 16, lowered when the budget
  # cannot hold a body that size.
  # otlp_max_body_mib: 16
  # Largest gRPC message in MiB (FI_GRPC_MAX_RECV_MIB). Unset: the body cap.
  # gRPC accepts uncompressed calls only.
  # grpc_max_recv_mib: 16
  # Open connections per listener (FI_OTLP_MAX_CONNECTIONS). Unset or 0: no
  # cap.
  # otlp_max_connections: 0
  # Longest a request waits for the ingest budget, both leases together,
  # before 503 + Retry-After: 1 / UNAVAILABLE (FI_INGEST_MAX_WAIT). Keep it
  # well under exporters' export timeout (10 s in the OpenTelemetry SDKs).
  # ingest_max_wait: 2s
  # ClickHouse inserts of pending rows that run at once
  # (FI_INSERT_CONCURRENCY). Unset: 3 from a 512 MiB Go memory limit up (and
  # with none), 2 from 384 MiB, else 1.
  # insert_concurrency: 3

auth:
  # Auth is active when pg_write is set. Without it, spans land with
  # empty project_id and are unqueryable.
  pg_write: postgres://user:password@db:5432/tfc
  # Falls back to pg_write if empty. In prod, point to read replica.
  pg_read: ""
  cache_ttl: 5m
  warm_ttl: 1h
  # Redis for rate limiting + usage event emission. Empty disables both.
  redis_addr: ""
  # Billing events on the usage:events stream (USAGE_EVENTS_ENABLED, on when
  # unset). Only Future AGI Cloud drains it, so the self-hosted compose files
  # and Helm chart set USAGE_EVENTS_ENABLED=false; anywhere else it only grows.
  # usage_events: true

# Observed attributes remain disabled unless enabled. FI_OBSERVED_CATALOG_MODE=kafka
# publishes them for the separate fi-property-catalog-consumer, which owns index
# writes (docker-compose.distributed.yml supplies FI_OBSERVED_CATALOG_KAFKA_BROKERS
# and FI_OBSERVED_CATALOG_KAFKA_TOPIC). FI_OBSERVED_CATALOG_MODE=direct writes the
# index from this process instead, without Kafka (docker-compose.yml, the Helm
# chart): it needs the index writer's FI_OBSERVED_CATALOG_CH_URL, _CH_DATABASE,
# _CH_USERNAME and _CH_PASSWORD. No workspace activation is needed.
# Keep the spool on a writable persistent volume owned by UID 65532.
observed_catalog:
  mode: disabled
  kafka:
    brokers: []
    topic: futureagi.observed-attributes.v1
  spool:
    directory: /var/lib/fi-collector/observed-catalog
  replay_interval: 1s

admin:
  addr: ":9464" # /healthz and /metrics
