# Development-only standalone test rig for fi-collector.
#
#   docker compose -f docker-compose.standalone.yml up --build -d
#
# What you get (host ports bind to loopback only):
#   - clickhouse:8123 (HTTP) + :9000 (native), CH 25.3 LTS with the spans
#     schema pre-applied via the entrypoint init script.
#   - postgres:5432 (compose network only), seeded with UUID identities and
#     public local-test keys; NOT the full platform schema.
#   - fi-collector:4317 (OTLP gRPC), :4318 (OTLP HTTP), :9464 (admin)
#
# See README.md's standalone smoke test: send X-Api-Key=standalone-api-key,
# X-Secret-Key=standalone-secret-key and a project_name resource attribute.
# Authentication remains enabled. Never use this rig or its test keys in prod.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collector
      POSTGRES_USER: collector
      # Public local-test password; this service has no published host port.
      POSTGRES_PASSWORD: standalone-db-password
    volumes:
      - ./test/standalone/seed.sql:/docker-entrypoint-initdb.d/001-standalone.sql:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      # TCP waits for the final server, after init scripts finish. The temporary
      # initdb server accepts only Unix-socket connections.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "collector", "-d", "collector"]
      interval: 2s
      timeout: 2s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      # The v2 spans table declares `SETTINGS storage_policy='tiered'`. That
      # policy is a SERVER config (NOT a schema .sql), so it must live in
      # config.d — mirror docker-compose.test.yml. Without it, init fails on
      # 002_spans_v2.sql with "Unknown storage policy `tiered`".
      - ../futureagi/.ci/clickhouse-storage-policy.xml:/etc/clickhouse-server/config.d/001_storage_policy.xml:ro
      - ../futureagi/.ci/clickhouse-test-config.xml:/etc/clickhouse-server/config.d/test-overrides.xml:ro
      # Mount the spans schema files so an init script can apply them.
      - ../futureagi/tracer/services/clickhouse/v2/schema:/docker-entrypoint-initdb.d:ro
      - ch-data:/var/lib/clickhouse
    healthcheck:
      # clickhouse-server:alpine ships no wget; use the bundled client so the
      # container reports healthy (the collector's depends_on gate needs it).
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  fi-collector:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      FI_CH_URL: http://clickhouse:8123
      FI_PG_WRITE: postgres://collector:standalone-db-password@postgres:5432/collector?sslmode=disable
      FI_PG_READ: postgres://collector:standalone-db-password@postgres:5432/collector?sslmode=disable
      USAGE_EVENTS_ENABLED: "false"
      FI_GRPC_ADDR: ":4317"
      FI_HTTP_ADDR: ":4318"
      FI_ADMIN_ADDR: ":9464"
      FI_DEAD_LETTER_FILE: /var/lib/fi-collector/dead_letter.jsonl
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9464:9464"
    volumes:
      - fi-dead-letter:/var/lib/fi-collector
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/fi-collector",
          "-config",
          "/etc/fi-collector/config.yaml",
          "--healthcheck-noop",
        ]
      interval: 10s
      timeout: 2s
      retries: 5
      # The distroless image has no shell so we'd usually need a separate
      # health-probe binary. For MVP just rely on the admin /healthz being
      # scraped from the host side.
      disable: true

volumes:
  ch-data:
  pg-data:
  fi-dead-letter:
