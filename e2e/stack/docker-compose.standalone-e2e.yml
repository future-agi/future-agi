# Overlay on docker-compose.yml (the Standalone setup) for the
# futureagi-e2e-standalone stack: `E2E_STACK=standalone bin/e2e up`.
#
# Everything the harness expects on its ports lives in the one `app`
# container; e2e/stack/standalone-e2e.env maps the app's :3000/:8000/:4318/
# :8080 onto the harness ports (3100/8100/24318/28090) and points the gateway
# at e2e/stack/gateway.e2e.yaml (-> mock-llm). This file only adds what the
# Standalone compose file deliberately leaves out for users:
#   - host ports for Postgres and ClickHouse (the storage-lane probes);
#   - the deterministic mock LLM on the same network as `app`;
#   - an `agentcc-gateway` host alias inside `app`, because several flows
#     register a custom model with the Distributed gateway URL
#     (http://agentcc-gateway:8080/v1, e2e/lib/managed-mock.ts MOCK_BASE).
#     In Standalone the gateway listens on 127.0.0.1:8080 in the same container.
services:
  app:
    depends_on:
      mock-google:
        condition: service_healthy
    # Never read the checkout's own .env: it belongs to the developer's
    # install and may hold real provider keys. The harness env file is the
    # only source of interpolated values (bin/e2e passes --env-file).
    env_file: !reset []
    # The public API URL, as docker-compose.e2e.yml sets it for Distributed:
    # SAML checks the response Destination against BASE_URL/saml2_auth/acs/.
    environment:
      REQUESTS_CA_BUNDLE: /run/google-fixture-tls/ca.pem
      BASE_URL: http://localhost:${BACKEND_PORT:-8100}
      DJANGO_SETTINGS_MODULE: tfc.settings.e2e
      # Literal values: a value exported in the caller's shell would otherwise
      # replace the env file's loopback telemetry address.
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
      # Shared by the API and embedded SQL worker; bin/e2e up provisions it.
      SQL_WORKBENCH_CH_USER: e2e_sql_service
      SQL_WORKBENCH_CH_PASSWORD: e2e-sql-workbench-password-for-tests
      # Simulate cutoff (#3502): every org a run signs up is after it; lib/existing-customer.ts dates one before it.
      RESTRICT_SIMULATE_TO_ENVIRONMENTS_CUTOFF: "2026-10-01T00:00:00Z"
    volumes:
      - google-fixture-tls:/run/google-fixture-tls:ro
      - ./e2e/stack/backend/e2e_google.py:/app/backend/tfc/views/e2e_google.py:ro
      - ./e2e/stack/backend/settings_e2e.py:/app/backend/tfc/settings/e2e.py:ro
      - ./e2e/stack/backend/urls_e2e.py:/app/backend/tfc/urls_e2e.py:ro
      - ./e2e/stack/backend/e2e_clean_signup.py:/app/backend/accounts/views/e2e_clean_signup.py:ro
      - ./e2e/stack/backend/e2e_feed_issue.py:/app/backend/tracer/views/e2e_feed_issue.py:ro
    extra_hosts:
      - "agentcc-gateway:127.0.0.1"
    # A crash should fail the run loudly instead of restarting quietly.
    restart: "no"
  # Not started by bin/e2e (--profile ml); if it is, it reads the checkout's
  # .env, so keep its telemetry settings on loopback as well.
  serving:
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
  postgres:
    ports:
      - "127.0.0.1:${PG_PORT:-25432}:5432"
    restart: "no"
  clickhouse:
    ports:
      - "127.0.0.1:${CH_HTTP_PORT:-28123}:8123"
      - "127.0.0.1:${CH_PORT:-29000}:9000"
    restart: "no"
  mock-llm:
    image: node:22-alpine
    command: ["node", "/srv/server.mjs"]
    volumes:
      # Paths resolve against the project directory (repo root).
      - ./e2e/stack/mock-llm/server.mjs:/srv/server.mjs:ro
    restart: "no"

  mock-google:
    image: futureagi/future-agi:${E2E_GOOGLE_IMAGE_TAG:-latest}
    entrypoint: ["python"]
    command: ["/srv/server.py"]
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
    volumes:
      - ./e2e/stack/mock-google/server.py:/srv/server.py:ro
      - google-fixture-tls:/tls
    ports:
      - "127.0.0.1:28443:28443"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; import ssl; urllib.request.urlopen('https://localhost:28443/health', context=ssl.create_default_context(cafile='/tls/ca.pem'))"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
volumes:
  google-fixture-tls:
