# Overlay on docker-compose.yml (the Standalone setup) for the
# futureagi-e2e-standalone stack: `E2E_STACK=standalone bin/e2e up`.
#
# Everything the harness expects on its ports lives in the one `app`
# container; e2e/stack/standalone-e2e.env maps the app's :3000/:8000/:4318/
# :8080 onto the harness ports (3100/8100/24318/28090) and points the gateway
# at e2e/stack/gateway.e2e.yaml (-> mock-llm). This file only adds what the
# Standalone compose file deliberately leaves out for users:
#   - host ports for Postgres and ClickHouse (the storage-lane probes);
#   - the deterministic mock LLM on the same network as `app`;
#   - an `agentcc-gateway` host alias inside `app`, because several flows
#     register a custom model with the Distributed gateway URL
#     (http://agentcc-gateway:8080/v1, e2e/lib/managed-mock.ts MOCK_BASE).
#     In Standalone the gateway listens on 127.0.0.1:8080 in the same container.
services:
  app:
    # Never read the checkout's own .env: it belongs to the developer's
    # install and may hold real provider keys. The harness env file is the
    # only source of interpolated values (bin/e2e passes --env-file).
    env_file: !reset []
    # The public API URL, as docker-compose.e2e.yml sets it for Distributed:
    # SAML checks the response Destination against BASE_URL/saml2_auth/acs/.
    environment:
      BASE_URL: http://localhost:${BACKEND_PORT:-8100}
      DJANGO_SETTINGS_MODULE: tfc.settings.e2e
      E2E_SKILLS_FIXTURES: "1"
      # J5 qualification only. Production and ordinary E2E runs remain off.
      SKILLS_CONTEXT_CAMPAIGNS_ENABLED: ${E2E_SKILLS_CAMPAIGNS_ENABLED:-false}
      # Freeze pricing to the image's pinned LiteLLM catalog; no live GitHub fetch.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # Simulate cutoff (#3502): every org a run signs up is after it; lib/existing-customer.ts dates one before it.
      RESTRICT_SIMULATE_TO_ENVIRONMENTS_CUTOFF: "2026-10-01T00:00:00Z"
      # J2: hosted native verification runs on the internal-only container runtime
      # below. Evidence from it is a synthetic fixture, never E2B qualification.
      SKILLS_NATIVE_RUNTIME_URL: http://native-runtime:8090
      SKILLS_NATIVE_CALLBACK_URL: http://app:8000
      SKILLS_NATIVE_RUNTIME_TOKEN: e2e-native-runtime-launch-token-0001
      SKILLS_NATIVE_RUNTIME_NAME: ctxhub-container-runtime
      SKILLS_NATIVE_EVIDENCE_CLASS: synthetic fixture
    networks:
      - default
      - native-net
    volumes:
      - ./e2e/stack/backend/settings_e2e.py:/app/backend/tfc/settings/e2e.py:ro
      - ./e2e/stack/backend/e2e_skills_transport.py:/app/backend/tfc/e2e_skills_transport.py:ro
      - ./e2e/stack/backend/urls_e2e.py:/app/backend/tfc/urls_e2e.py:ro
      - ./e2e/stack/backend/e2e_clean_signup.py:/app/backend/accounts/views/e2e_clean_signup.py:ro
      - ./e2e/stack/backend/e2e_feed_issue.py:/app/backend/tracer/views/e2e_feed_issue.py:ro
      # J4: test-image-only retention clock seam.
      - ./e2e/stack/backend/e2e_j4_evidence_clock.py:/app/backend/model_hub/views/e2e_j4_evidence_clock.py:ro
    extra_hosts:
      - "agentcc-gateway:127.0.0.1"
    # A crash should fail the run loudly instead of restarting quietly.
    restart: "no"
  postgres:
    ports:
      - "127.0.0.1:${PG_PORT:-25432}:5432"
    restart: "no"
  clickhouse:
    ports:
      - "127.0.0.1:${CH_HTTP_PORT:-28123}:8123"
      - "127.0.0.1:${CH_PORT:-29000}:9000"
    restart: "no"
  skills-fakes:
    networks:
      - default
      - native-net
    image: node:22-alpine
    command: ["node", "/srv/server.mjs"]
    volumes:
      - ./e2e/stack/skills-fakes/server.mjs:/srv/server.mjs:ro
    ports:
      - "127.0.0.1:${E2E_SKILLS_FIXTURE_PORT:-28082}:8080"
    restart: "no"
  mock-llm:
    image: node:22-alpine
    command: ["node", "/srv/server.mjs"]
    volumes:
      # Paths resolve against the project directory (repo root).
      - ./e2e/stack/mock-llm/server.mjs:/srv/server.mjs:ro
    restart: "no"
  # On-demand application request; no ports, external route or persistent credentials.
  skills-ts-runtime:
    profiles: [skill-traces]
    build: ./e2e/stack/skills-ts-runtime
    image: futureagi/skills-ts-runtime:e2esa
    read_only: true
    user: node
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [native-net]
  # J2 native container runtime. No route outside native-net (internal), read-only
  # root/source/context mounts, separate writable state, context-only credentials.
  native-runtime:
    build:
      context: ./e2e/stack/native-runtime
      args:
        CTXHUB_APP_COMMIT: ${CTXHUB_APP_COMMIT:-}
    image: futureagi/native-runtime:e2esa
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      CTXHUB_RUNTIME_TOKEN: e2e-native-runtime-launch-token-0001
      CTXHUB_PROVIDER_KEY: e2e-skills-native-runtime-fixture
      CTXHUB_PROVIDER_URL: http://skills-fakes:8080/v1
      CTXHUB_MODEL: gpt-4o-mini
      CTXHUB_BUSINESS_DB: /fi_business/business.sqlite
    volumes:
      - ./e2e/fixtures/skills-r3/support-application:/fi_app:ro
      - native-context:/fi_context:ro
    tmpfs:
      - /fi_state:uid=10001,gid=10001,mode=0700
      - /fi_output:uid=10001,gid=10001,mode=0700
      - /fi_business:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    networks:
      - native-net
    restart: "no"
networks:
  native-net:
    internal: true
volumes:
  native-context: {}
