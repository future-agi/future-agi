# Overlay on docker-compose.distributed.yml (the distributed topology) for the futureagi-e2e stack.
services:
  clickhouse:
    # Seatbelt on 16GB CI runners: CH is the first OOM-kill victim otherwise.
    mem_limit: 3g
    volumes:
      - ./e2e/stack/clickhouse-metric-log.xml:/etc/clickhouse-server/config.d/e2e-metric-log.xml:ro
  temporal:
    # Temporal opens a pool per internal service. Its default 20/10 pools can
    # exhaust the shared 100-connection test Postgres alongside CDC and the API.
    environment:
      SQL_MAX_CONNS: "5"
      SQL_MAX_IDLE_CONNS: "2"
      SQL_VIS_MAX_CONNS: "2"
      SQL_VIS_MAX_IDLE_CONNS: "1"
  backend:
    depends_on:
      mock-google:
        condition: service_healthy
      sql-workbench-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    # Replace the production outbox: the ONLY application mount permitted by
    # managed-mock is this public, read-only status directory (never the worker).
    # bin/e2e creates the default directory when no override is supplied.
    volumes: !override
      - google-fixture-tls:/run/google-fixture-tls:ro
      - type: bind
        source: ${E2E_HOST_UPDATE_STATUS_DIR:-${HOME}/.cache/futureagi-e2e/${E2E_COMPOSE_PROJECT:-futureagi-e2e}/host-update-status}
        target: /run/futureagi-host-update
        read_only: true
        bind:
          create_host_path: false
    environment:
      FI_HOST_UPDATE_STATUS_FILE: /run/futureagi-host-update/status.json
      # Synthetic slot pinned from api_contracts/host-update/fixtures.json.
      FI_HOST_UPDATE_STATUS_SLOT: "0123456789abcdef0123456789abcdef"
      REQUESTS_CA_BUNDLE: /run/google-fixture-tls/ca.pem
      BASE_URL: http://localhost:8100
      MODEL_SERVING_URL: http://mock-llm:8080
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
      # Request logs reach Django over this shared secret; without it the
      # webhook rejects every batch the gateway sends.
      AGENTCC_WEBHOOK_SECRET: ${AGENTCC_WEBHOOK_SECRET:-e2e-agentcc-webhook-secret}
      # gateway.e2e.yaml defines no budgets, so Request Logs retention need
      # not keep the current month and week for them (GW-E2E-008 purges 3-day-old rows).
      AGENTCC_GATEWAY_YAML_HAS_NO_BUDGETS: "true"
      DJANGO_SETTINGS_MODULE: tfc.settings.e2e
      # The app and worker must share one key to decrypt OAuth credentials.
      INTEGRATION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SLACK_CLIENT_ID: e2e-client
      SLACK_CLIENT_SECRET: e2e-secret
      SLACK_OAUTH_AUTHORIZE_URL: http://localhost:28081/oauth/v2/authorize
      SLACK_REDIRECT_URI: http://localhost:8100/integrations/slack/callback/
      SLACK_API_URL: http://mock-slack:8080/api
      # Simulate cutoff (#3502): every org a run signs up is after it; lib/existing-customer.ts dates one before it.
      RESTRICT_SIMULATE_TO_ENVIRONMENTS_CUTOFF: "2026-10-01T00:00:00Z"
      SQL_WORKBENCH_CH_USER: e2e_sql_service
      SQL_WORKBENCH_CH_PASSWORD: e2e-sql-workbench-password-for-tests
  worker:
    restart: "no"
    # Keep the worker mount-free for the managed-mock attestation as well.
    volumes: !reset []
    environment:
      # GW-E2E-006 watches the delivery schedule disable a failing webhook;
      # the defaults (100 failures spanning 60 minutes) would take hours.
      AGENTCC_WEBHOOK_DISABLE_AFTER_FAILURES: "3"
      AGENTCC_WEBHOOK_DISABLE_AFTER_MINUTES: "0"
      AGENTCC_GATEWAY_YAML_HAS_NO_BUDGETS: "true"
      MODEL_SERVING_URL: http://mock-llm:8080
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
      DJANGO_SETTINGS_MODULE: tfc.settings.e2e
      INTEGRATION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SLACK_API_URL: http://mock-slack:8080/api
  worker-exact-aggregation:
    restart: "no"
    volumes: !reset []
    environment:
      DJANGO_SETTINGS_MODULE: tfc.settings.e2e
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
      SQL_WORKBENCH_CH_USER: e2e_sql_service
      SQL_WORKBENCH_CH_PASSWORD: e2e-sql-workbench-password-for-tests
    depends_on:
      sql-workbench-bootstrap:
        condition: service_completed_successfully
  worker-sql-workbench:
    restart: "no"
    volumes: !reset []
    environment:
      DJANGO_SETTINGS_MODULE: tfc.settings.e2e
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
      SQL_WORKBENCH_CH_USER: e2e_sql_service
      SQL_WORKBENCH_CH_PASSWORD: e2e-sql-workbench-password-for-tests
    depends_on:
      sql-workbench-bootstrap:
        condition: service_completed_successfully
  sql-workbench-bootstrap:
    image: futureagi/future-agi:${FUTURE_AGI_VERSION:-latest}
    entrypoint: ["python", "/app/backend/bootstrap_sql.py"]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    environment:
      FUTURE_AGI_E2E_FIXTURE: sql-workbench
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
      SQL_WORKBENCH_CH_USER: e2e_sql_service
      SQL_WORKBENCH_CH_PASSWORD: e2e-sql-workbench-password-for-tests
      CH_HOST: clickhouse
      CH_PORT: "9000"
      CH_DATABASE: ${CH25_DATABASE:-${CH_DATABASE:-default}}
      CH_USERNAME: ${CH_USERNAME:-default}
      CH_PASSWORD: ${CH_PASSWORD:-e2e-clickhouse-password}
      CH25_EVAL_LOGGER_TABLE: ${CH25_EVAL_LOGGER_TABLE:-tracer_eval_logger}
    depends_on:
      clickhouse-cdc-bootstrap:
        condition: service_completed_successfully
  fi-collector:
    # Collector and consumer must run the same checked-out transport protocol.
    image: futureagi/fi-collector:${E2E_FI_COLLECTOR_VERSION:-latest}
  fi-property-catalog-consumer:
    image: futureagi/fi-collector:${E2E_FI_COLLECTOR_VERSION:-latest}
  peerdb-init:
    environment:
      # Root compose never passes the flag to peerdb-init, so the setup script
      # attempts the retired tracer_observation_span mirror.
      CH25_DROP_LEGACY_CDC_CHAIN: "true"
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
  mock-llm:
    image: node:22-alpine
    command: ["node", "/srv/server.mjs"]
    volumes:
      # Compose resolves paths in an override file against the project
      # directory (the first -f file's dir = repo root), not this file's dir.
      - ./e2e/stack/mock-llm/server.mjs:/srv/server.mjs:ro
    restart: "no"
  mock-slack:
    image: node:22-alpine
    command: ["node", "/srv/server.mjs"]
    volumes:
      - ./e2e/stack/mock-slack/server.mjs:/srv/server.mjs:ro
    ports:
      - "127.0.0.1:28081:8080"
    restart: "no"
  # Literal values, not ${...} defaults: a value exported in the caller's shell
  # takes precedence over the env file, and these services must keep sending
  # telemetry registration to loopback. The services above set the same pair.
  postgres-schema-bootstrap:
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
  clickhouse-native-bootstrap:
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
  clickhouse-cdc-bootstrap:
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
  peerdb-temporal-init:
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
  serving:
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
  worker-default:
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
  worker-tasks-s:
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
  worker-tasks-l:
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
  worker-tasks-xl:
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
  worker-trace-ingestion:
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
  worker-agent-compass:
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
  worker-simulation-runner:
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9

  mock-google:
    image: futureagi/future-agi:${E2E_GOOGLE_IMAGE_TAG:-latest}
    entrypoint: ["python"]
    command: ["/srv/server.py"]
    environment:
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      FUTURE_AGI_TELEMETRY_URL: http://127.0.0.1:9
    volumes:
      - ./e2e/stack/mock-google/server.py:/srv/server.py:ro
      - google-fixture-tls:/tls
    ports:
      - "127.0.0.1:28443:28443"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; import ssl; urllib.request.urlopen('https://localhost:28443/health', context=ssl.create_default_context(cafile='/tls/ca.pem'))"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
volumes:
  google-fixture-tls:
