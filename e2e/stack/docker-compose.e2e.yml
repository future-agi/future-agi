# Overlay on the root docker-compose.yml for the futureagi-e2e stack.
services:
  clickhouse:
    # Seatbelt on 16GB CI runners: CH is the first OOM-kill victim otherwise.
    # 2g, not 3g: with the cache caps mounted below, measured steady state is
    # ~1.15 GiB. A limit genuinely shrinks CH — max_server_memory_usage is
    # derived from the cgroup and its caches reclaim against it.
    mem_limit: 2g
    volumes:
      # Compose resolves paths in an override file against the project
      # directory (the first -f file's dir = repo root), not this file's dir.
      # `zz-` so it sorts after the storage policy the root compose mounts.
      - ./e2e/stack/clickhouse-memory.xml:/etc/clickhouse-server/config.d/zz-e2e-memory.xml:ro
  backend:
    restart: "no"
    # Ceilings on everything, so no single service can drift unbounded into the
    # VM and starve the rest — the failure mode that turned a 4.8m suite into a
    # 52m one and OOM-killed the host's editor.
    #
    # The asymmetry is deliberate: on Postgres/ClickHouse a limit genuinely
    # shrinks the footprint (page cache and CH's own caches reclaim against the
    # cgroup), but on the Python services a limit only OOM-kills rather than
    # compacts — so those stay generous enough to never hit it in a green run.
    mem_limit: 1200m
    environment: &falcon-agent-env
      # Agent evals bypass LiteLLM and the org's BYOK model config: `_run_agent`
      # builds a FalconLLMClient, and off-cloud (no `falcon_ai` entitlement) it
      # falls back to a "direct provider" derived from the model name
      # (gpt-4o-mini -> openai). That branch reads its endpoint/key from
      # FALCON_AI_* env, which the root compose never sets — so it defaulted to
      # https://api.openai.com and every agent eval died on 401 after three
      # retries. Point it at the same gateway the judge lane uses so the agent
      # lane resolves to mock-llm and stays deterministic.
      FALCON_AI_LLM_URL: http://agentcc-gateway:8080
      FALCON_AI_API_KEY: ${AGENTCC_INTERNAL_API_KEY:-local-dev-only-shared-secret-replace-me}
      # EE takes a different path to the same models: with a license the
      # `falcon_ai` entitlement resolves, so `_run_agent` uses the MANAGED
      # transport instead of the direct-provider fallback above. That transport
      # first POSTs /v1/self-hosted/activations to FUTURE_AGI_LICENSE_URL
      # (default https://api.futureagi.com, unreachable from this stack) for a
      # service token. Point it at mock-llm, which answers with a token for the
      # gateway — so the OSS and EE lanes converge on one deterministic
      # upstream instead of EE dying on ACTIVATION_FAILED.
      FUTURE_AGI_LICENSE_URL: http://mock-llm:8080
      # Every provisioned tenant otherwise phones home to
      # FUTURE_AGI_TELEMETRY_URL (default https://api.futureagi.com), which
      # posts "New OSS user registered" with the throwaway e2e address into a
      # real Slack channel — one per worker, per run, from CI and from every
      # local run. The suite fabricates users by design, so none of it is a
      # real signup and all of it is noise in someone else's inbox.
      FUTURE_AGI_TELEMETRY_DISABLED: "true"
      # ...and the disabled path STILL registers once (sender.py
      # `ensure_registration` posts a minimal payload before it checks the
      # flag again), so the flag alone does not stop the Slack announcement.
      # Keep the call inside the stack: mock-llm answers /telemetry/register/
      # so nothing reaches api.futureagi.com from a test run.
      FUTURE_AGI_TELEMETRY_URL: http://mock-llm:8080
  worker:
    restart: "no"
    mem_limit: 2g
    environment:
      <<: *falcon-agent-env
      # 500 in-flight activities is a production number. The suite runs a
      # handful of evals at a time and every activity slot costs a
      # torch-loaded thread, so the default reserves memory nothing uses.
      TEMPORAL_MAX_CONCURRENT_ACTIVITIES: "5"
      TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASKS: "5"
  worker-exact-aggregation:
    restart: "no"
    # Root compose pins this one to a single activity slot, so it carries far
    # less in flight than the generic worker above and needs less headroom.
    mem_limit: 1200m
  postgres:
    # ~0.97 GiB of this cgroup is reclaimable page cache, so the limit shrinks
    # the footprint rather than risking a kill.
    mem_limit: 768m
  temporal:
    mem_limit: 640m
  rabbitmq:
    mem_limit: 512m
    environment:
      # Idle CPU here is Erlang scheduler busy-wait, not work.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
  minio:
    mem_limit: 256m
  peerdb-minio:
    mem_limit: 256m
  fi-collector:
    # Root compose reuses FUTURE_AGI_VERSION for this image; the e2e stack
    # decouples it so CI can retag the backend without inventing a
    # futureagi/fi-collector:e2e-ci that was never built.
    image: futureagi/fi-collector:${E2E_FI_COLLECTOR_VERSION:-latest}
  peerdb-init:
    environment:
      # Root compose never passes the flag to peerdb-init, so the setup script
      # attempts the retired tracer_observation_span mirror.
      CH25_DROP_LEGACY_CDC_CHAIN: "true"
  mock-llm:
    image: node:22-alpine
    command: ["node", "/srv/server.mjs"]
    environment:
      # Handed straight back as the activation access_token, so it must be the
      # key agentcc-gateway itself authenticates against.
      AGENTCC_INTERNAL_API_KEY: ${AGENTCC_INTERNAL_API_KEY:-local-dev-only-shared-secret-replace-me}
    volumes:
      # Compose resolves paths in an override file against the project
      # directory (the first -f file's dir = repo root), not this file's dir.
      - ./e2e/stack/mock-llm/server.mjs:/srv/server.mjs:ro
    restart: "no"
