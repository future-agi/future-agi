# The live smoke's offline tests: python3 -m pytest scripts/connector-smoke/tests -q
# (from the repo root; this file makes scripts/connector-smoke the rootdir).
# They need pytest and PyYAML, and the openssl command for a local test
# certificate. They never reach a real address (tests/conftest.py).
[pytest]
pythonpath = . tests
testpaths = tests
addopts = -p no:cacheprovider
