# Fixture for the live-smoke runner's tests (scripts/connector-smoke), not
# catalog data. Close's API-key credential is two headers (AM-C12 a, AM-C20):
# the secret Close-API-Key and Close-Scope, a constant from the catalog (the
# read-only scope), per https://developer.close.com/mcp read 2026-10-20.
schema: "connector-manifest/v1#provider"
app: close
id: close-mcp
version: 1.0.0
kind: vendor_mcp
publisher: vendor
vendorStatus: { label: ga, source: https://developer.close.com/mcp }
transport:
  { kind: http, url: https://mcp.close.com/mcp, variant: streamable, era: auto }
hosted: true
trusted: false
accountModes: [agent]
auth:
  kind: api_key
  credentialParts:
    - in: header
      name: Close-API-Key
      secret: true
      label: API key
      helpUrl: https://developer.close.com/mcp
    - in: header
      name: Close-Scope
      secret: false
      value: mcp.read
      label: Scope
      help: Read-only access.
tools: { source: upstream_mcp, defaultPosture: ask }
pricing: { model: vendor_plan }
quality: { tier: listed }
lifecycle: { status: active }
sources:
  - fact: transport.url
    url: https://developer.close.com/mcp
    fetchedAt: 2026-10-20
  - fact: auth.credentialParts
    url: https://developer.close.com/mcp
    fetchedAt: 2026-10-20
