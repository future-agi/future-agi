# Fixture for the REST generator's tests, not catalog data (see ../../app.yaml).
# The curated overlay: which Gmail API methods become tools, and how.
schema: connector-gen/rest-overlay/v1
spec: fixtures/spec/gmail-v1.discovery.json.gz
tools:
  - name: search_threads
    title: Search threads
    description: >-
      Search the user's mail threads with a Gmail query and return thread ids and snippets, newest first.
      The query uses Gmail search syntax, for example `from:alice@example.com is:unread newer_than:7d`.
      Pass nextPageToken back as pageToken for the next page.
    operation: { id: gmail.users.threads.list }
    params:
      fixed: { userId: me }
      exclude: [includeSpamTrash]
      describe:
        q: "Gmail search query, for example `subject:invoice has:attachment after:2026/10/01`."
        maxResults: "Threads per page, 1-500 (default 100). Use 10-25 for a first look."
    annotations: { openWorldHint: false }
    posture: auto
    scopes: [https://www.googleapis.com/auth/gmail.readonly]
    response:
      fields: [threads.id, threads.snippet, nextPageToken, resultSizeEstimate]
      maxBytes: 25000

  - name: get_thread
    title: Read a thread
    description: >-
      Read every message of one thread by its id (from search_threads), oldest first.
      format=metadata returns headers only (pick them with metadataHeaders, for example From, To, Subject, Date);
      format=full also returns bodies, base64url-encoded in payload.parts[].body.data.
    operation: { id: gmail.users.threads.get }
    params:
      fixed: { userId: me }
    annotations: { openWorldHint: false }
    posture: auto
    scopes: [https://www.googleapis.com/auth/gmail.readonly]
    response:
      fields:
        [
          id,
          messages.id,
          messages.threadId,
          messages.labelIds,
          messages.snippet,
          messages.payload,
        ]
      maxBytes: 100000

  - name: get_message
    title: Read a message
    description: >-
      Read one message by its id, for example 18c2f0d7a1b2c3d4. format=metadata returns headers only;
      format=full returns the body parts, base64url-encoded; format=raw returns the whole RFC 2822 message in raw.
    operation: { id: gmail.users.messages.get }
    params:
      fixed: { userId: me }
    annotations: { openWorldHint: false }
    posture: auto
    scopes: [https://www.googleapis.com/auth/gmail.readonly]
    response:
      fields: [id, threadId, labelIds, snippet, payload, raw]
      maxBytes: 100000

  - name: list_labels
    title: List labels
    description: >-
      List the mailbox's labels: system labels such as INBOX, SENT, UNREAD and STARRED, and the user's own,
      with their ids (for example Label_12). Use the ids with modify_thread.
    operation: { id: gmail.users.labels.list }
    params:
      fixed: { userId: me }
    annotations: { openWorldHint: false }
    posture: auto
    scopes: [https://www.googleapis.com/auth/gmail.readonly]
    response:
      fields: [labels.id, labels.name, labels.type]

  - name: get_profile
    title: Get the mailbox profile
    description: >-
      Return the signed-in user's email address and message and thread totals, for example
      {"emailAddress": "alice@example.com", "messagesTotal": 1532}. Use it to learn which mailbox is connected.
    operation: { id: gmail.users.getProfile }
    params:
      fixed: { userId: me }
    annotations: { openWorldHint: false }
    posture: auto
    scopes: [https://www.googleapis.com/auth/gmail.readonly]

  - name: send_message
    title: Send a message
    description: >-
      Send an email. raw is the whole RFC 2822 message, base64url-encoded, for example the encoding of
      "To: bob@example.com\r\nSubject: Hello\r\n\r\nHi Bob". To reply in a thread, set threadId and put
      In-Reply-To and References headers in the message.
    operation: { id: gmail.users.messages.send }
    params:
      fixed: { userId: me }
    body:
      fields: [raw, threadId]
      required: [raw]
      description: The message to send.
    annotations:
      { destructiveHint: false, idempotentHint: false, openWorldHint: true }
    posture: ask
    scopes: [https://www.googleapis.com/auth/gmail.send]
    response:
      fields: [id, threadId, labelIds]

  - name: create_draft
    title: Create a draft
    description: >-
      Save a draft without sending it. message.raw is the RFC 2822 message, base64url-encoded; set message.threadId
      to draft a reply in a thread. Returns the draft id for send_draft.
    operation: { id: gmail.users.drafts.create }
    params:
      fixed: { userId: me }
    body:
      fields: [message.raw, message.threadId]
      required: [message, message.raw]
      description: The draft to create.
    annotations:
      { destructiveHint: false, idempotentHint: false, openWorldHint: false }
    posture: ask
    scopes: [https://www.googleapis.com/auth/gmail.compose]
    response:
      fields: [id, message.id, message.threadId]

  - name: send_draft
    title: Send a draft
    description: >-
      Send a draft saved earlier, by the id create_draft returned, for example r-5108413232411426193.
      The draft is removed and the sent message is returned.
    operation: { id: gmail.users.drafts.send }
    params:
      fixed: { userId: me }
    body:
      fields: [id]
      required: [id]
      description: The draft to send.
    annotations:
      { destructiveHint: false, idempotentHint: false, openWorldHint: true }
    posture: ask
    scopes: [https://www.googleapis.com/auth/gmail.compose]
    response:
      fields: [id, threadId, labelIds]

  - name: modify_thread
    title: Change a thread's labels
    description: >-
      Add or remove labels on every message of a thread, by label id from list_labels. For example remove
      UNREAD to mark it read, or add STARRED. Adding a label it already has changes nothing.
    operation: { id: gmail.users.threads.modify }
    params:
      fixed: { userId: me }
    body:
      description: The labels to add and remove.
    annotations:
      { destructiveHint: false, idempotentHint: true, openWorldHint: false }
    posture: ask
    scopes: [https://www.googleapis.com/auth/gmail.modify]
    response:
      fields: [id, messages.id, messages.labelIds]

  - name: trash_message
    title: Move a message to the trash
    description: >-
      Move one message to the trash, by its id. Gmail deletes trashed messages for good after 30 days.
    operation: { id: gmail.users.messages.trash }
    params:
      fixed: { userId: me }
    annotations: { destructiveHint: true, openWorldHint: false }
    posture: deny
    scopes: [https://www.googleapis.com/auth/gmail.modify]
    response:
      fields: [id, labelIds]
