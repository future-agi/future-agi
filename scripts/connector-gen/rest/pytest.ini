# The REST generator's tests: python3 -m pytest scripts/connector-gen/rest/tests -q
# (from the repo root; this file makes scripts/connector-gen/rest the rootdir).
# They need pytest and PyYAML; the Go cross-check also needs go. They read
# only files under tests/fixtures and never reach the network.
[pytest]
pythonpath = . tests
testpaths = tests
addopts = -p no:cacheprovider
