# Optional, explicit host reporting opt-in. Never include this in the default stack.
# Run ./bin/install --host-status-help before selecting this overlay.
# Mount only the dedicated host-owned public slot, NOT .futureagi-updates,
# retained env files, journals, the public parent (other slots), or Docker sockets.
# Mount the directory, not status.json: host atomic replacement must remain visible.
services:
  app:
    environment:
      FI_HOST_UPDATE_STATUS_FILE: /run/futureagi-host-update/status.json
      FI_HOST_UPDATE_STATUS_SLOT: ${FI_HOST_UPDATE_STATUS_SLOT:?select initialized reporting slot}
    volumes:
      - type: bind
        source: ${FI_HOST_UPDATE_STATUS_DIR:?initialize host status reporting first}
        target: /run/futureagi-host-update
        read_only: true
        bind:
          create_host_path: false
