# Production overlay for the distributed topology. Layered on top of
# docker-compose.distributed.yml:
#   docker compose --env-file deploy/.env.production \
#     -f docker-compose.distributed.yml -f deploy/docker-compose.production.yml up -d
# Re-binds required env vars with ${VAR:?error} so compose refuses to boot
# if any are still unset. Pair with deploy/.env.production.

x-production-backend-env: &production-backend-env
  ENV_TYPE: production
  NO_STARTUP_DB_MUTATIONS: "true"
  FI_SKIP_CH25_MIGRATION: "1"
  SECRET_KEY: ${SECRET_KEY:?must be set for production}
  FI_API_SECRET_PEPPER: ${FI_API_SECRET_PEPPER:?must be set for production}
  # Fernet key: every organization's system API key is encrypted under it.
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?must be set for production}
  AGENTCC_INTERNAL_API_KEY: ${AGENTCC_INTERNAL_API_KEY:?must be set for production}
  AGENTCC_ADMIN_TOKEN: ${AGENTCC_ADMIN_TOKEN:?must be set for production}
  PG_PASSWORD: ${PG_PASSWORD:?must be set for production}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must be set for production}
  PROPERTY_CATALOG_CH_PASSWORD: ${PROPERTY_CATALOG_API_PASSWORD:?must be set for production}
  # The Hub's checker token; OMEGA_HUB_MAINTAINER_ORG_ID is set once the
  # maintainer organisation exists (deploy/README.md, "Omega Hub").
  # Production keeps its external-runner checker active even with profiles=full.
  OMEGA_HUB_COMPOSE_PROFILES: hub
  OMEGA_HUB_CHECKER_TOKEN: ${OMEGA_HUB_CHECKER_TOKEN:?must be set for production}
  OMEGA_HUB_APP_URL: ${OMEGA_HUB_APP_URL:?set to the UI's Hub URL, e.g. https://app.example.com/dashboard/hub}
  OMEGA_HUB_PUBLIC_API_URL: ${OMEGA_HUB_PUBLIC_API_URL:?set to the public Hub API, e.g. https://api.example.com/omega-hub/v1}

services:
  # Production uses the reviewed published image, never a source build or :local.
  fi-collector:
    image: futureagi/fi-collector:${FI_COLLECTOR_VERSION:?set the reviewed collector release for production}
    build: !reset null
    environment:
      FI_API_SECRET_PEPPER: ${FI_API_SECRET_PEPPER:?must be set for production}

  # Hosted schema/mirror changes require an explicit, separately qualified
  # deployment. Never inherit the local fresh-install --apply commands.
  property-catalog-clickhouse-bootstrap:
    command: ["--check"]
    environment:
      CLICKHOUSE_USER: observed_catalog_reader
      CLICKHOUSE_PASSWORD: ${PROPERTY_CATALOG_API_PASSWORD:?must be set for production}
      PROPERTY_CATALOG_API_PASSWORD: ${PROPERTY_CATALOG_API_PASSWORD:?must be set for production}
      PROPERTY_CATALOG_CONSUMER_PASSWORD: ${PROPERTY_CATALOG_CONSUMER_PASSWORD:?must be set for production}

  fi-property-catalog-consumer:
    image: futureagi/fi-collector:${FI_COLLECTOR_VERSION:?set the reviewed collector release for production}
    build: !reset null
    environment:
      FI_OBSERVED_CATALOG_CH_PASSWORD: ${PROPERTY_CATALOG_CONSUMER_PASSWORD:?must be set for production}

  postgres-schema-bootstrap:
    image: futureagi/future-agi:${FUTURE_AGI_VERSION:?must be set for production}
    environment:
      <<: *production-backend-env
    entrypoint: ["python"]
    command: ["manage.py", "migrate", "--check", "--noinput"]

  clickhouse-native-bootstrap:
    image: futureagi/future-agi:${FUTURE_AGI_VERSION:?must be set for production}
    environment:
      <<: *production-backend-env
    command: ["--phase", "native"]

  peerdb-init:
    image: futureagi/future-agi:${FUTURE_AGI_VERSION:?must be set for production}
    environment:
      <<: *production-backend-env
      SRC_PG_PASSWORD: ${PG_PASSWORD:?must be set for production}
    command: ["--wait-for-mirrors", "--timeout", "900"]

  peerdb-temporal-init:
    image: futureagi/future-agi:${FUTURE_AGI_VERSION:?must be set for production}
    environment:
      <<: *production-backend-env
    command: []

  clickhouse-cdc-bootstrap:
    image: futureagi/future-agi:${FUTURE_AGI_VERSION:?must be set for production}
    environment:
      <<: *production-backend-env
    command: ["--phase", "cdc", "--wait-for-mirrors", "--timeout", "900"]

  backend:
    image: futureagi/future-agi:${FUTURE_AGI_VERSION:?must be set for production}
    environment:
      <<: *production-backend-env
      FRONTEND_URL: ${FRONTEND_URL:?must be set for production}
    restart: always

  worker:
    <<: &production-worker
      image: futureagi/future-agi:${FUTURE_AGI_VERSION:?must be set for production}
      environment:
        <<: *production-backend-env
      restart: always

  worker-default:
    <<: *production-worker
  worker-tasks-s:
    <<: *production-worker
  worker-tasks-l:
    <<: *production-worker
  worker-tasks-xl:
    <<: *production-worker
  worker-exact-aggregation:
    <<: *production-worker
  worker-trace-ingestion:
    <<: *production-worker
  worker-agent-compass:
    <<: *production-worker
  worker-simulation-runner:
    <<: *production-worker
    # This worker requires the separate SDK image, not the backend image.
    image: futureagi/future-agi-simulation-runner:${SIMULATION_RUNNER_VERSION:?must be set for production}

  agentcc-gateway:
    image: futureagi/agentcc-gateway:${AGENTCC_GATEWAY_VERSION:?must be set for production}
    environment:
      AGENTCC_INTERNAL_API_KEY: ${AGENTCC_INTERNAL_API_KEY:?must be set for production}
      AGENTCC_ADMIN_TOKEN: ${AGENTCC_ADMIN_TOKEN:?must be set for production}
    restart: always

  frontend:
    image: futureagi/frontend:${FRONTEND_VERSION:?must be set for production}
    environment:
      VITE_HOST_API: ${VITE_HOST_API:?set to your backend URL — e.g. https://api.example.com}
    restart: always

  serving:
    image: futureagi/serving:${SERVING_VERSION:?must be set for production}
    environment:
      # This service also inherits backend-env from the distributed base.
      OMEGA_HUB_COMPOSE_PROFILES: hub
      ENV_TYPE: production
      SECRET_KEY: ${SECRET_KEY:?must be set for production}
    restart: always

  postgres:
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:?must be set for production}
    restart: always

  minio:
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must be set for production}
    restart: always

  code-executor:
    image: futureagi/code-executor:${CODE_EXECUTOR_VERSION:?must be set for production}
    restart: always

  # The Hub checker runs uploads on the dedicated runner host only
  # (deploy/hub-runner/docker-compose.yml: its own VM, gVisor, an egress
  # firewall), never on this host: the co-located hub-runner does not start.
  hub-checker:
    image: futureagi/omega-hub-checker:${OMEGA_HUB_CHECKER_VERSION:?must be set for production}
    # Keep the production checker active; it uses the external runner below.
    profiles: !reset []
    build: !reset null
    environment:
      OMEGA_HUB_CHECKER_TOKEN: ${OMEGA_HUB_CHECKER_TOKEN:?must be set for production}
      OMEGA_HUB_RUNNER_IMAGE: ${OMEGA_HUB_RUNNER_IMAGE:?set the reviewed runner image, pinned by digest (futureagi/omega-hub-runner@sha256:...)}
      # A checker that cannot sandbox exits, so `up --wait` fails loudly.
      OMEGA_HUB_RUNNER_WAIT: "0"
      DOCKER_HOST: ${OMEGA_HUB_RUNNER_DOCKER_HOST:?set to the dedicated runner host, tcp://<host>:2376 (deploy/hub-runner)}
    volumes:
      !override # ca.pem, cert.pem and key.pem: the runner host's client certificate.
      - ${OMEGA_HUB_RUNNER_TLS_DIR:?set to the directory holding the runner host's client certificate}:/certs/client:ro
    depends_on: !override
      backend:
        condition: service_started
    restart: always

  hub-runner:
    # Replace, do not merge, the base hub profile: enabling hub must not
    # start a privileged runner on the production application host.
    profiles: !override ["not-in-production"]
    build: !reset null
