# UI server of the standalone install: the SPA on :3000, one worker. Headers and
# caching mirror frontend/nginx.conf (the distributed stack's frontend image).
# Runtime files stay out of /tmp, which the code-evals sandbox can write to.
#
# While the container boots, every page (not the static assets) is the
# starting page, /etc/nginx/starting.html, with a 503 so health checks and
# ./bin/install keep waiting. bin/bootstrap.py writes /run/futureagi/ready
# once the API answers /health/ (bin/start clears it on every start); from
# then on the SPA is served. The page follows the boot through
# /starting-status.json and reloads itself into the app.
worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /var/lib/nginx/body;
    proxy_temp_path /var/lib/nginx/proxy;
    fastcgi_temp_path /var/lib/nginx/fastcgi;
    uwsgi_temp_path /var/lib/nginx/uwsgi;
    scgi_temp_path /var/lib/nginx/scgi;

    server {
        listen 3000;
        server_name _;
        server_tokens off;
        client_max_body_size 1G;
        root /srv/frontend;

        # Repeated in every location below that sets a header of its own.
        include /etc/nginx/security-headers.conf;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

        # The starting page, for the 503 the page locations below answer with
        # until the app is up. Falls back to plain text if the image lacks it.
        error_page 503 /starting.html;
        location = /starting.html {
            internal;
            root /etc/nginx;
            try_files /starting.html @starting_text;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "5" always;
            include /etc/nginx/security-headers.conf;
        }
        location @starting_text {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "5" always;
            include /etc/nginx/security-headers.conf;
            return 503 "Future AGI is starting. The first boot migrates the database and takes a few minutes; this page is served until the app is up. Progress: docker compose logs -f app\n";
        }

        # Boot phase for the starting page (bin/bootstrap.py): phase names
        # only, nothing secret.
        location = /starting-status.json {
            alias /run/futureagi/status.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
        }

        # Written by bin/start from VITE_* settings on every container start.
        location = /config.js {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            include /etc/nginx/security-headers.conf;
            default_type application/javascript;
        }

        # Vite build assets carry content hashes.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        location ~* \.html$ {
            if (!-f /run/futureagi/ready) { return 503; }
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            include /etc/nginx/security-headers.conf;
        }

        # SPA fallback: the client-side router handles unknown paths.
        location / {
            if (!-f /run/futureagi/ready) { return 503; }
            try_files $uri $uri/ /index.html;
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
            include /etc/nginx/security-headers.conf;
        }
    }
}
