; Process tree of the standalone install's app container. Every program logs to
; the container's stdout (docker compose logs app) and inherits the container
; environment; %(ENV_X)s values get defaults in bin/start.
;
; Start order: priority 10 (redis, temporal, objects, web) -> 20 (bootstrap)
; -> 30 (collector, gateway, sandbox) -> 40 (api). api and collector wait for
; /data/.bootstrap-ok (bin/after-bootstrap). Until the API answers, web shows
; a starting page and the API port a JSON 503 (bin/bootstrap.py). Shutdown
; runs in reverse, one program at a time: the API's Temporal worker drains
; first, while the gateway, the sandbox, Temporal and Redis it calls are
; still up.
;
; Command lines are world-readable (/proc/<pid>/cmdline), so no secret goes
; on one; secrets reach programs through the environment or files under
; /etc/futureagi/secrets (root only). Runtime files stay out of /tmp, which
; the code-evals sandbox can write to.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; A program that keeps failing to start ends up FATAL and is never retried.
; Stop the container instead, so Docker restarts it (restart: unless-stopped)
; and a dead collector, gateway or object store does not go unnoticed.
[eventlistener:fatal]
command=sh -c 'printf "READY\n"; read -r header; echo "a program is FATAL; stopping the container" >&2; kill -TERM "$PPID"'
events=PROCESS_STATE_FATAL
priority=1
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Cache, locks and the channel layer. Nothing here must survive a restart.
; bin/start writes the config (password, memory cap) to a root-only file.
[program:redis]
command=redis-server /etc/futureagi/secrets/redis.conf
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; GOMEMLIMIT on the Go programs below is a soft cap: keep it well above each
; program's working set. Below it the Go GC runs continuously (at 96MiB the
; Temporal server burned ~3 cores at idle).

; Single-binary Temporal server; state (schedules, workflow history) lives in
; SQLite on /data. The eval-task search attributes are registered up front.
[program:temporal]
command=temporal server start-dev --headless --ip 127.0.0.1 --port 7233 --db-filename /data/temporal/temporal.db --log-level warn --search-attribute EvalTaskOrgId=Keyword --search-attribute EvalTaskProjectId=Keyword --search-attribute EvalTaskRunType=Keyword --search-attribute EvalTaskStatus=Keyword
environment=GOMEMLIMIT="512MiB"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; S3-compatible object storage for uploads; the browser loads object URLs
; from the published port (MINIO_URL).
[program:objects]
command=minio server /data/objects --address :9005 --console-address 127.0.0.1:9006 --quiet
environment=GOMEMLIMIT="384MiB",MINIO_BROWSER="off"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Schema, seeds and schedules in one Django process. Runs on every start; a
; failure is retried after a 30 s back-off. Meanwhile it answers the API port
; with a JSON 503. When done it frees the port for the API, re-executes itself
; as a small waiter that switches the UI to the app once /health/ answers, and
; exits (see bin/bootstrap.py).
[program:bootstrap]
command=python /opt/futureagi/bin/bootstrap.py
directory=/app/backend
priority=20
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; API and Temporal worker in ONE Python process (tfc/temporal/embedded.py).
; stopwaitsecs covers the worker drain and stays under the compose
; stop_grace_period (60 s).
[program:api]
command=/opt/futureagi/bin/after-bootstrap granian --interface asgi tfc.asgi:application --host 0.0.0.0 --port 8000 --workers 1 --runtime-threads %(ENV_GRANIAN_THREADS)s --runtime-mode mt --loop uvloop --log-level warning --respawn-failed-workers %(ENV_GRANIAN_DEV_ARGS)s
environment=FI_EMBEDDED_TEMPORAL_WORKER="true"
directory=/app/backend
priority=40
autorestart=true
stopwaitsecs=50
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:collector]
command=/opt/futureagi/bin/after-bootstrap fi-collector -config /etc/fi-collector/config.yaml
environment=GOMEMLIMIT="256MiB"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Provider config and the GCP key are bind-mounted under the root-only
; /etc/futureagi/secrets (docker-compose.yml).
[program:gateway]
command=agentcc-gateway --config /etc/futureagi/secrets/agentcc.yaml
environment=GOMEMLIMIT="256MiB",GEMINI_API_KEY="%(ENV_GOOGLE_API_KEY)s",GOOGLE_APPLICATION_CREDENTIALS="/etc/futureagi/secrets/vertex.json"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Code evals: the code-executor server without nsjail. Each run is a
; `python -I` subprocess in its own session and temp dir, with an empty
; environment and CPU, memory, process and file-size limits
; (code-executor/server.py). The server runs as the unprivileged `sandbox`
; user with a scrubbed environment, so eval code cannot read the platform's
; secrets (environment, /etc/futureagi/secrets) or /data (mode 0700), and
; Redis needs a password it does not have. HOME has no user site-packages
; to plant code in.
;
; Not isolated: eval code shares this container's network namespace, so it
; reaches Temporal (127.0.0.1:7233, no auth), ClickHouse and every service on
; the compose network, and concurrent runs share the one uid. The nsjail
; executor allows network access too. Installs whose users must not trust
; one another should run code evals in the nsjail container:
; COMPOSE_PROFILES=sandbox in .env (bin/start then routes evals to it).
[program:sandbox]
command=/usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/nonexistent LANG=C.UTF-8 PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 gunicorn --bind 127.0.0.1:8060 --workers 1 --threads 4 --timeout 75 server:app
directory=/app/backend/code-executor
user=sandbox
priority=30
autorestart=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The UI: the starting page from the first second of a boot, the app once
; the API answers (nginx.conf).
[program:web]
command=nginx -g "daemon off;"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
