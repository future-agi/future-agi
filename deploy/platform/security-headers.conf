# Security headers for every response of the UI server (nginx.conf). nginx
# drops server-level add_header directives in any location that sets its own,
# so each such location includes this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
