# Security headers of every UI response, shipped in the frontend image at
# /etc/nginx/security-headers.conf. nginx drops server-level add_header
# directives in any location that sets its own, so the server block and each
# such location include this file: frontend/nginx.conf,
# deploy/standalone/nginx.conf (copied from the frontend image) and the Helm
# chart's frontend ConfigMap (files/frontend/, a copy hack/check.sh diffs).
# HSTS is left to the TLS layer in front.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
