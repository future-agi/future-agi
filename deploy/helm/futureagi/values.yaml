# =============================================================================
# Future AGI Helm chart: the Distributed setup on Kubernetes.
#
# Every key is documented here; README.md has the same list as a table.
# Datastores are external by default: set postgres/clickhouse/redis/temporal/
# objectStorage .mode, or start from a ready-made file:
#
#   examples/bundled.yaml          everything in the cluster, for evaluation (not HA)
#   examples/local.yaml            the same on Docker Desktop, k3s or OrbStack, no port-forwards
#   examples/external.yaml         your own PostgreSQL, ClickHouse, Redis, Temporal, S3
#   examples/gateway-api.yaml      public UI, API and OTLP endpoints (Gateway API)
#   examples/ingress-traefik.yaml  the same through a Traefik Ingress
#   examples/ingress.yaml          the same through ingress-nginx (legacy)
#   examples/sizes/                small, medium and large sizing
#   examples/cloud/                GKE, EKS and AKS with managed datastores
#   examples/enterprise.yaml       Enterprise: license, SSO, first admin, proxy, CA, private registry
#   examples/external-secrets.yaml every credential from Vault or a cloud secret manager
#   examples/airgap.yaml           no internet access: mirrored images, offline models
#   examples/gitops/               Argo CD Application and Flux HelmRelease (not values)
#
# Environment variable names in [brackets] are what each key sets in the
# application; https://docs.futureagi.com/docs/self-hosting/configuration/reference
# explains every one of them.
# =============================================================================

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the resource name prefix. Default: the release name, plus "-futureagi" unless the release name already contains it.
fullnameOverride: ""

global:
  # -- Registry that replaces every image's own, Future AGI and third-party alike (docker.io, and ghcr.io for the bundled MinIO): a mirror holding every image `hack/list-images.sh` lists, e.g. `registry.example.com/futureagi-mirror`. Not a pull-through cache of one upstream: for Docker Hub alone set `image.registry` and each Docker Hub `<datastore>.bundled.image.registry` to it instead, and leave `objectStorage.bundled.image.registry` on ghcr.io (or a ghcr.io cache). Empty keeps each image's own registry.
  imageRegistry: ""
  # -- Pull secrets added to every pod, e.g. `[{name: regcred}]`.
  imagePullSecrets: []
  # -- StorageClass of every PersistentVolumeClaim the chart creates. Empty uses the cluster default. Install-time only for the bundled datastores (see "Install-time settings" in README.md).
  storageClass: ""
  # -- Air-gapped install: turns off the platform's own calls to the internet. Turns telemetry off [FUTURE_AGI_TELEMETRY_DISABLED=true] (one minimal registration attempt remains; offline it fails harmlessly and is retried), the license heartbeat off unless `license.heartbeat` is `true` [FUTURE_AGI_ENTERPRISE_HEARTBEAT_DISABLED=true], sets [LITELLM_LOCAL_MODEL_COST_MAP=True] on the Python pods and serving, and [HF_HUB_OFFLINE=1, TRANSFORMERS_OFFLINE=1] on serving, whose models must then be pre-seeded on `serving.persistence` (examples/airgap.yaml). Mirror the images first (`hack/list-images.sh`) and set `global.imageRegistry` and `global.imagePullSecrets`.
  airgap: false
  # Outbound HTTP(S) proxy for the Future AGI pods (backend, workers, bootstrap job, frontend, fi-collector, agentcc-gateway, serving; never the code sandbox). The LLM gateway (agentcc-gateway) gets the variables but its provider connections do not use them yet: allow its egress to the providers directly.
  proxy:
    # -- [HTTP_PROXY, http_proxy] e.g. `http://proxy.example.com:3128`. Empty: no proxy.
    httpProxy: ""
    # -- [HTTPS_PROXY, https_proxy] e.g. `http://proxy.example.com:3128`. Empty: no proxy.
    httpsProxy: ""
    # -- [NO_PROXY, no_proxy] extra hosts, domains or CIDRs that bypass the proxy, comma-separated. The chart always adds localhost, 127.0.0.1, the release's Services, `.<namespace>`, `.svc`, `.cluster.local` and the PostgreSQL, ClickHouse, Redis and Temporal hosts; add an external object-storage endpoint here when it is reachable without the proxy (MinIO in your network, an S3 VPC endpoint). Object storage requests match against the host they go to: with `objectStorage.external.endpoint` empty (AWS S3), that is `<bucket>.s3.<region>.amazonaws.com`, so list `.s3.<region>.amazonaws.com`, not `s3.amazonaws.com`. Set only with `httpProxy` or `httpsProxy`.
    noProxy: ""
  # Extra CA certificates (a corporate root, a TLS-inspecting proxy, a private PostgreSQL CA), mounted read-only at /etc/futureagi/ca/ca.crt in the Future AGI pods and the bootstrap job.
  caBundle:
    # -- ConfigMap holding the PEM bundle. Use `configMap` or `secret`, not both.
    configMap: ""
    # -- Secret holding the PEM bundle.
    secret: ""
    # -- Key of the PEM bundle in the ConfigMap or Secret. It must contain every CA the pods need, public roots included when the pods also reach the internet: it replaces the image's trust store [SSL_CERT_FILE, REQUESTS_CA_BUNDLE, CURL_CA_BUNDLE, NODE_EXTRA_CA_CERTS; PGSSLROOTCERT when `postgres.external.sslMode` is verify-ca or verify-full].
    key: ca.crt
  compatibility:
    openshift:
      # -- `auto`: on OpenShift (the security.openshift.io/v1 API exists) leave runAsUser, runAsGroup, fsGroup and seccompProfile out of every pod and container security context, so the restricted-v2 SCC assigns them. `force`: always. `disabled`: never.
      adaptSecurityContext: auto

image:
  # -- Registry of the Future AGI images.
  registry: docker.io
  # -- Tag of every Future AGI image (backend, workers, frontend, fi-collector, agentcc-gateway, serving, code-executor). Empty uses the chart's appVersion. A component's own `image.tag` wins.
  tag: ""
  # -- Pull policy of every image unless a component sets its own.
  pullPolicy: IfNotPresent
  # -- Pin each Future AGI image to the digest in `image.digests`, but only while its tag is the chart's appVersion and its repository path the published one: `--set image.tag=...` or another repository path runs that image by tag. Another registry (`image.registry`, `global.imageRegistry`) keeps the digest, which suits a mirror that copies the images with `crane copy` or `oras copy -r` (they keep the digests). Set `false` for a mirror that re-pushes images, or for your own build under the same repository path (or give that component its own `image.digest`): the published digest does not exist there and the pull fails. The bundled PostgreSQL, Redis and MinIO images are pinned the same way, on their default tags only.
  pinDigests: true
  # -- Digests (`sha256:...`) of the release's images, by component: backend (also the workers and the bootstrap job), frontend, fiCollector, agentccGateway, serving, codeExecutor. Empty in git; the published chart carries the digests of its own release. A component's own `image.digest` wins.
  digests: {}

# -----------------------------------------------------------------------------
# Public URLs. Leave them empty for a port-forwarded evaluation; set them (or
# the ingress hosts) as soon as anyone opens the UI from another machine.
# -----------------------------------------------------------------------------
urls:
  # -- Public URL of the UI, e.g. `https://futureagi.example.com` [FRONTEND_URL, APP_URL, EXTRA_CSRF_ORIGINS]. Invite and password-reset links and app emails point here, with its scheme. Empty: derived from `ingress.app.host` with `ingress.enabled`, else from `gatewayApi.app.host` with `gatewayApi.enabled` (https unless `gatewayApi.tls` is false), else `http://localhost:3000`.
  app: ""
  # -- Public URL of the API, e.g. `https://api.futureagi.example.com` [BASE_URL, and the UI's VITE_HOST_API]. Empty: derived from `ingress.api.host` with `ingress.enabled`, else from `gatewayApi.api.host` with `gatewayApi.enabled`, else `http://localhost:8000`.
  api: ""
  # -- [FI_COLLECTOR_PUBLIC_URL] Public OTLP/HTTP base URL of fi-collector, e.g. `https://otlp.example.com`: what SDKs outside the cluster set as FI_BASE_URL, shown in the install notes, the in-app SDK snippet and the setup screen. Set it when the collector is exposed another way (e.g. `fiCollector.service.type=LoadBalancer`). Empty: derived from `ingress.otlp` with `ingress.enabled`, else from `gatewayApi.otlp` with `gatewayApi.enabled`, else `http://localhost:4318` (the port-forward in the install notes).
  otlp: ""
  # -- Public URL browsers download stored files from [MINIO_URL]; used when `objectStorage.backend` is `minio`. Empty: derived from `ingress.objects.host` with `ingress.enabled`, else the external endpoint, else `http://localhost:<objectStorage.bundled.service.downloadPort>` (9005).
  objects: ""

# -----------------------------------------------------------------------------
# Application settings shared by the backend, the workers and the bootstrap job.
# -----------------------------------------------------------------------------
config:
  # -- [ENV_TYPE] `production`: JSON logs, DEBUG off, refuses published default secrets. `local`: colored console logs.
  envType: production
  # -- [LOG_LEVEL] of the backend, workers and bootstrap job.
  logLevel: INFO
  # -- [ALLOWED_HOSTS], comma-separated. `*` accepts any Host header. A list also gets localhost and the in-cluster service names, which the probes and the workers use, and the pod's own IP (`$(POD_IP)`), which load balancers that health-check pods directly send as the Host. Empty: the API host once the API has a public URL (`urls.api`, `gatewayApi.api.host` or `ingress.api.host`), else `*`.
  allowedHosts: ""
  # -- [CORS_ALLOWED_ORIGINS] browser origins allowed to call the API with credentials, comma-separated. `*`: every origin. Empty: the UI's origin plus `extraCsrfOrigins` once the UI has a public URL (`urls.app`, `gatewayApi.app.host` or `ingress.app.host`), else every origin.
  corsAllowedOrigins: ""
  # -- [EXTRA_CSRF_ORIGINS] in addition to the UI URL, comma-separated.
  extraCsrfOrigins: ""
  # -- Deployment telemetry: an instance id, the version, admin emails and usage counts every 6 hours, never traces, prompts or other content. `false` sets FUTURE_AGI_TELEMETRY_DISABLED=true (one minimal ping remains).
  telemetry: true
  # -- [RECAPTCHA_ENABLED] reCAPTCHA on sign-up, login and token refresh, for every Host but localhost. Needs `secrets.extra.RECAPTCHA_SECRET_KEY` (without it every such login is refused) and a frontend image built with VITE_GOOGLE_SITE_KEY (a build-time setting: the published image has none, so its logins fail).
  recaptcha: false
  # -- [OTEL_ENABLED] export the platform's own traces over OpenTelemetry (configure OTEL_* in `config.extraEnv`).
  otel: false
  # -- [USAGE_EVENTS_ENABLED] billing usage events on the Redis stream usage:events, from the backend, workers and fi-collector. Only for installs that run the usage consumer (Future AGI Cloud): anywhere else nothing drains the stream and it fills Redis.
  usageEvents: false
  # -- [FI_CDC_MODE] Postgres to ClickHouse change data capture. `outbox`: triggers plus a drain in the Temporal workers (no PeerDB). `off` removes it (Observe views then miss relational data).
  cdcMode: outbox
  email:
    # -- [MAILGUN_SENDER_DOMAIN]. Email stays off until `secrets.mailgunApiKey` is set too; invites then return a link to share yourself.
    mailgunSenderDomain: ""
    # -- [DEFAULT_FROM_EMAIL] sender of every app email (invites, password resets). Empty: `Future AGI <noreply@<mailgunSenderDomain>>`.
    fromEmail: ""
    # -- [DEFAULT_REPLY_TO_EMAIL] Reply-To of app emails. Empty: no Reply-To header, so replies go to the sender.
    replyTo: ""
    # -- [SERVER_EMAIL] sender of error emails.
    serverEmail: ""
    # -- Existing Secret with the Mailgun API key [MAILGUN_API_KEY] (wins over `secrets.mailgunApiKey`).
    existingSecret: ""
    # -- Key of the Mailgun API key in `existingSecret`.
    existingSecretKey: MAILGUN_API_KEY
  # -- Extra environment variables for the backend, workers and bootstrap job, as `NAME: value`. Every supported key: https://docs.futureagi.com/docs/self-hosting/configuration/reference (rows marked H).
  extraEnv: {}
  # -- Extra `envFrom` sources for the backend, workers and bootstrap job, e.g. `[{secretRef: {name: my-env}}]`.
  extraEnvFrom: []

# -----------------------------------------------------------------------------
# Secrets. The chart generates the application keys once, stores them in the
# Secret <fullname>-secrets and reuses them on every upgrade (it is kept on
# uninstall, so a reinstall can still read encrypted data).
# -----------------------------------------------------------------------------
secrets:
  # -- Existing Secret with the application keys: SECRET_KEY, INTEGRATION_ENCRYPTION_KEY, AGENTCC_INTERNAL_API_KEY, AGENTCC_ADMIN_TOKEN, PROPERTY_CATALOG_API_PASSWORD, PROPERTY_CATALOG_CONSUMER_PASSWORD and AGENTCC_WEBHOOK_SECRET (unless `agentccWebhookSecret` is set). Empty: generated. Required with Argo CD, which cannot `lookup` the generated Secret.
  existingSecret: ""
  llm:
    # -- Existing Secret with any of OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_API_KEY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (missing keys are fine). Overrides the values below.
    existingSecret: ""
    # -- [OPENAI_API_KEY] server-wide key for built-in evals and the gateway. Workspaces can also add their own in the UI.
    openaiApiKey: ""
    # -- [ANTHROPIC_API_KEY]
    anthropicApiKey: ""
    # -- [GOOGLE_API_KEY] Gemini (Google AI Studio); the gateway gets it as GEMINI_API_KEY.
    googleApiKey: ""
    # -- [AWS_ACCESS_KEY_ID] AWS Bedrock.
    awsAccessKeyId: ""
    # -- [AWS_SECRET_ACCESS_KEY] AWS Bedrock.
    awsSecretAccessKey: ""
    # -- [AWS_REGION] AWS Bedrock region (not secret).
    awsRegion: us-east-1
  # -- Deprecated: use `license.key` or `license.existingSecret`. [EE_LICENSE_KEY] Enterprise Edition license, still honoured when `license.*` is empty.
  eeLicenseKey: ""
  # -- [MAILGUN_API_KEY] turns email on, with `config.email`. `config.email.existingSecret` wins.
  mailgunApiKey: ""
  # -- [AGENTCC_WEBHOOK_SECRET] shared secret the gateway sends its request logs to the backend with. Empty: read from `existingSecret` when that is set, else generated.
  agentccWebhookSecret: ""
  # -- Any other secret environment variables for the backend, workers and bootstrap job, as `NAME: value` (e.g. SENTRY_DSN, DAYTONA_API_KEY). Stored in <fullname>-secrets.
  extra: {}

# -----------------------------------------------------------------------------
# Edition and Enterprise license. One chart and one image for both: `ee` is
# the public futureagi/future-agi image plus a license. A customer given a
# private image sets backend.image.registry/repository (the workers and the
# bootstrap job follow) and global.imagePullSecrets.
# -----------------------------------------------------------------------------
# -- `oss` or `ee`. `ee` requires a license (`license.key` or `license.existingSecret`) and shows the license and SSO settings in the install notes. It never changes the image.
edition: oss

license:
  # -- [EE_LICENSE_KEY] Enterprise license key, stored in <fullname>-secrets. Prefer `existingSecret`. Setting a license also turns on the Enterprise apps, whose migrations the bootstrap job runs.
  key: ""
  # -- Existing Secret with the license key (wins over `key`). The backend, the workers and the bootstrap job read it.
  existingSecret: ""
  # -- Key of the license in `existingSecret`.
  existingSecretKey: EE_LICENSE_KEY
  # -- [FUTURE_AGI_LICENSE_URL] license activation and heartbeat server. Empty: the application default (Future AGI's license service).
  url: ""
  # -- License heartbeat [FUTURE_AGI_ENTERPRISE_HEARTBEAT_DISABLED, inverted]. Empty (null): on, off with `global.airgap`. `true` or `false` wins.
  heartbeat: null
  # -- [EE_LICENSE_PUBLIC_KEY] PEM public key that verifies the license. Honoured only by images without a built-in license key (pre-GA builds); leave empty unless Future AGI gave you one.
  publicKey: ""
  # -- [EE_LICENSE_CLOCK_SKEW_SECONDS] tolerance when checking the license's validity window; set only while a license is configured.
  clockSkewSeconds: 300

# -----------------------------------------------------------------------------
# Sign-in with Google, GitHub or Microsoft. Register the callback URLs the
# install notes print (they derive from urls.api). SAML is configured per
# organization in the UI; the notes print its ACS URL and entity ID too.
# -----------------------------------------------------------------------------
auth:
  google:
    # -- [AUTH0_CLIENT_ID] OAuth client ID of a Google Cloud "Web application" client (the app names Google's settings AUTH0_*).
    clientId: ""
    # -- [AUTH0_CLIENT_SECRET] stored in <fullname>-secrets. Prefer `existingSecret`.
    clientSecret: ""
    # -- Existing Secret with the client ID and secret (wins over the values above).
    existingSecret: ""
    # -- Key of the client ID in `existingSecret`.
    clientIdKey: AUTH0_CLIENT_ID
    # -- Key of the client secret in `existingSecret`.
    clientSecretKey: AUTH0_CLIENT_SECRET
  github:
    # -- [GITHUB_CLIENT_ID] of a GitHub OAuth app.
    clientId: ""
    # -- [GITHUB_CLIENT_SECRET] stored in <fullname>-secrets. Prefer `existingSecret`.
    clientSecret: ""
    # -- Existing Secret with the client ID and secret (wins over the values above).
    existingSecret: ""
    # -- Key of the client ID in `existingSecret`.
    clientIdKey: GITHUB_CLIENT_ID
    # -- Key of the client secret in `existingSecret`.
    clientSecretKey: GITHUB_CLIENT_SECRET
  microsoft:
    # -- [MICROSOFT_CLIENT_ID] of a Microsoft Entra app registration (multi-tenant: the app signs in through the `common` endpoint).
    clientId: ""
    # -- [MICROSOFT_CLIENT_SECRET] stored in <fullname>-secrets. Prefer `existingSecret`.
    clientSecret: ""
    # -- Existing Secret with the client ID and secret (wins over the values above).
    existingSecret: ""
    # -- Key of the client ID in `existingSecret`.
    clientIdKey: MICROSOFT_CLIENT_ID
    # -- Key of the client secret in `existingSecret`.
    clientSecretKey: MICROSOFT_CLIENT_SECRET

# -----------------------------------------------------------------------------
# Secrets from an external store (External Secrets Operator). Each entry of
# `secrets` renders an external-secrets.io/v1 ExternalSecret whose target is
# the Secret an existingSecret value names, so the chart reads it as usual.
# -----------------------------------------------------------------------------
externalSecrets:
  # -- Render the ExternalSecrets below (needs the External Secrets Operator and its CRDs).
  enabled: false
  # -- API version of the ExternalSecret objects.
  apiVersion: external-secrets.io/v1
  # -- SecretStore or ClusterSecretStore every ExternalSecret reads from, e.g. `{name: vault, kind: ClusterSecretStore}`. An entry's own `secretStoreRef` wins.
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  # -- How often the operator re-reads the store.
  refreshInterval: 1h
  # -- One ExternalSecret per entry, as `<group>: {data: {<SECRET_KEY>: {key, property}}, dataFrom: [...], secretStoreRef: {...}}`. Groups and the Secret each creates: `app` (secrets.existingSecret), `llm` (secrets.llm.existingSecret), `license` (license.existingSecret), `email` (config.email.existingSecret), `google`, `github`, `microsoft` (auth.*.existingSecret), `admin` (bootstrap.admin.existingSecret), `postgres`, `clickhouse`, `redis`, `objectStorage` (<store>.existingSecret). That existingSecret value must be set. See examples/external-secrets.yaml.
  secrets: {}

# Roll the Deployments when a Secret or ConfigMap they read changes (a rotated
# existingSecret or ExternalSecret). Kubernetes does not restart pods itself.
reloader:
  # -- Add `reloader.annotations` to every Future AGI Deployment (needs Stakater Reloader, or a tool that reads the same annotations).
  enabled: false
  # -- Annotations added to the Deployments' metadata.
  annotations:
    reloader.stakater.com/auto: "true"

# -----------------------------------------------------------------------------
# Datastores. `external` (default) connects to services you run; `bundled`
# runs a single-replica StatefulSet in this release: for evaluation only,
# not highly available, not backed up.
# -----------------------------------------------------------------------------
postgres:
  # -- `external` or `bundled`.
  mode: external
  # -- [PG_DB] database name.
  database: futureagi
  # -- [PG_USER]
  user: futureagi
  # -- [PG_PASSWORD]. External: required unless `existingSecret`. Bundled: empty generates one.
  password: ""
  # -- Existing Secret holding the password.
  existingSecret: ""
  # -- Key of the password in `existingSecret`.
  existingSecretPasswordKey: password
  external:
    # -- [PG_HOST] PostgreSQL 16 server (11 or newer works), reached directly: the outbox CDC holds a session advisory lock and migrations set session options. Put a pooler in `postgres.pooler`, not here.
    host: ""
    # -- [PG_PORT]
    port: 5432
    # -- [PGSSLMODE] disable, allow, prefer, require, verify-ca or verify-full. verify-ca and verify-full need the server's CA: mount it with `backend`, `worker`, `bootstrap` and `fiCollector` `extraVolumes`/`extraVolumeMounts`, and point PGSSLROOTCERT at it in `config.extraEnv` and `fiCollector.extraEnv`.
    sslMode: prefer
  pooler:
    # -- Send the backend's and workers' Django connections through a transaction-mode pooler such as PgBouncer [PGBOUNCER_HOST, PGBOUNCER_PORT], for many API and worker pods. `PG_HOST` stays the direct server (outbox CDC, migrations), and the bootstrap job always connects directly [PG_DIRECT_HOST]. PgBouncer settings the app needs: `pool_mode = transaction`, `server_reset_query_always = 1`, `ignore_startup_parameters = extra_float_digits,search_path`.
    enabled: false
    # -- [PGBOUNCER_HOST] host of the pooler.
    host: ""
    # -- [PGBOUNCER_PORT] port of the pooler.
    port: 6432
  readReplica:
    # -- Register a read replica (or a pooler in front of one) for the backend and workers [PGBOUNCER_READ_HOST, PGBOUNCER_READ_PORT, PG_READ_DB]. Only the models and features in `optIn` read from it; everything else stays on the primary.
    enabled: false
    # -- [PGBOUNCER_READ_HOST] host of the replica, or of its pooler. Same user and password as the primary.
    host: ""
    # -- [PGBOUNCER_READ_PORT]
    port: 5432
    # -- [PG_READ_DB] database on the replica. Empty: `postgres.database`.
    database: ""
    # -- [READ_REPLICA_OPT_IN] model class names (e.g. `Dashboard`) and `feature:` keys routed to the replica. Empty: nothing reads from it.
    optIn: []
  bundled:
    image:
      # -- Registry of the bundled PostgreSQL image.
      registry: docker.io
      # -- Repository of the bundled PostgreSQL image. Debian-based, like the compose setups, so data directories are interchangeable.
      repository: library/postgres
      # -- Tag of the bundled PostgreSQL image: an exact 16.x release on Debian (the compose setups run `postgres:16`, also Debian).
      tag: 16.15-trixie
      # -- Digest pinned after the tag; wins over the chart's own pin. Empty: the default tag above runs pinned to the digest the chart was tested with (while `image.pinDigests` is on), and any other tag or repository runs by tag.
      digest: ""
    # -- Server settings passed as `-c name=value`.
    parameters:
      max_connections: "300"
      shared_buffers: 256MB
    persistence:
      # -- Size of the data volume. Install-time only (see "Install-time settings" in README.md).
      size: 20Gi
      # -- StorageClass of the data volume. Empty: `global.storageClass`, else the cluster default. Install-time only.
      storageClass: ""
    # -- Resources of the bundled PostgreSQL.
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "2", memory: 2Gi}
    # -- Node selector of the bundled PostgreSQL. Empty: the top-level `nodeSelector`.
    nodeSelector: {}
    # -- Tolerations of the bundled PostgreSQL. Empty: the top-level `tolerations`.
    tolerations: []
    # -- Affinity of the bundled PostgreSQL. Empty: the top-level `affinity`.
    affinity: {}
    # -- Pod securityContext merged over the chart's (runAsNonRoot, the image's user and group, fsGroup, RuntimeDefault seccomp). `global.compatibility.openshift.adaptSecurityContext` drops the fixed IDs.
    podSecurityContext: {}
    # -- Container securityContext merged over the chart's (no privilege escalation, all capabilities dropped).
    containerSecurityContext: {}

clickhouse:
  # -- `external` or `bundled`. ClickHouse 25.3 or newer.
  mode: external
  # -- [CH_DATABASE, CH25_DATABASE] database of traces and analytics.
  database: default
  # -- [CH_USERNAME] needs CREATE on the database; the bootstrap also creates the observed-attribute index (CREATE DATABASE, CREATE USER, GRANT) unless `bootstrap.propertyCatalog` is false. Bundled: `default`, the bundled server's only user.
  user: default
  # -- [CH_PASSWORD]. External: may be empty. Bundled: empty generates one.
  password: ""
  # -- Existing Secret holding the password.
  existingSecret: ""
  # -- Key of the password in `existingSecret`.
  existingSecretPasswordKey: password
  # -- [PROPERTY_CATALOG_DATABASE] database of the observed-attribute index; must differ from `database`.
  propertyCatalogDatabase: property_catalog
  external:
    # -- [CH_HOST] ClickHouse host. Plain HTTP and native protocol: the schema installer and fi-collector do not speak TLS to ClickHouse.
    host: ""
    # -- [CH_HTTP_PORT]
    httpPort: 8123
    # -- [CH_PORT] native protocol port.
    nativePort: 9000
  bundled:
    image:
      # -- Registry of the bundled ClickHouse image.
      registry: docker.io
      # -- Repository of the bundled ClickHouse image.
      repository: clickhouse/clickhouse-server
      # -- Tag of the bundled ClickHouse image. 25.3 is the floor for the v2 spans schema.
      tag: 25.3-alpine
      # -- Optional digest (`sha256:...`) pinned after the tag.
      digest: ""
    # -- Small caches and merge pools and no system log tables (deploy/standalone/clickhouse), as in the Standalone install. Turn off on nodes with 8 GiB or more for ClickHouse.
    lowMemory: true
    persistence:
      # -- Size of the data volume. Install-time only (see "Install-time settings" in README.md).
      size: 50Gi
      # -- StorageClass of the data volume. Empty: `global.storageClass`, else the cluster default. Install-time only.
      storageClass: ""
    # -- Resources of the bundled ClickHouse.
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 3Gi}
    # -- Node selector of the bundled ClickHouse. Empty: the top-level `nodeSelector`.
    nodeSelector: {}
    # -- Tolerations of the bundled ClickHouse. Empty: the top-level `tolerations`.
    tolerations: []
    # -- Affinity of the bundled ClickHouse. Empty: the top-level `affinity`.
    affinity: {}
    # -- Pod securityContext merged over the chart's (runAsNonRoot, the image's user and group, fsGroup, RuntimeDefault seccomp). `global.compatibility.openshift.adaptSecurityContext` drops the fixed IDs.
    podSecurityContext: {}
    # -- Container securityContext merged over the chart's (no privilege escalation, all capabilities dropped).
    containerSecurityContext: {}

redis:
  # -- `external` or `bundled`. Cache, locks and the live-update channel layer.
  mode: external
  # -- [REDIS_PASSWORD] Must be URL-safe (letters, digits, `-._~`): it is part of the Redis URLs. External: empty means no AUTH. Bundled: empty generates one.
  password: ""
  # -- Existing Secret holding the password.
  existingSecret: ""
  # -- Key of the password in `existingSecret`.
  existingSecretPasswordKey: password
  external:
    # -- [REDIS_HOST] Redis 6 or newer with databases 0-4 (the app uses 0 to 3; the LLM gateway 4, see `agentccGateway.redis`).
    host: ""
    # -- [REDIS_PORT]
    port: 6379
    # -- Connect the app over TLS (`rediss://`). fi-collector has no Redis TLS: with TLS on it runs without Redis (key revocation then reaches it through its 5-minute auth cache).
    tls: false
  bundled:
    image:
      # -- Registry of the bundled Redis image.
      registry: docker.io
      # -- Repository of the bundled Redis image.
      repository: library/redis
      # -- Tag of the bundled Redis image: an exact 7.x release.
      tag: 7.4.11-alpine
      # -- Digest pinned after the tag; wins over the chart's own pin. Empty: the default tag above runs pinned to the digest the chart was tested with (while `image.pinDigests` is on), and any other tag or repository runs by tag.
      digest: ""
    # -- Redis `maxmemory`; keep it below the memory limit.
    maxmemory: 384mb
    # -- Redis `maxmemory-policy`. volatile-lru evicts only keys with a TTL (cache entries), never locks or state.
    maxmemoryPolicy: volatile-lru
    persistence:
      # -- Keep an append-only file on a volume. Without it a restart drops cache, locks and in-flight state (the app recovers). Install-time only.
      enabled: true
      # -- Size of the data volume. Install-time only (see "Install-time settings" in README.md).
      size: 2Gi
      # -- StorageClass of the data volume. Empty: `global.storageClass`, else the cluster default. Install-time only.
      storageClass: ""
    # -- Resources of the bundled Redis.
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 512Mi}
    # -- Node selector of the bundled Redis. Empty: the top-level `nodeSelector`.
    nodeSelector: {}
    # -- Tolerations of the bundled Redis. Empty: the top-level `tolerations`.
    tolerations: []
    # -- Affinity of the bundled Redis. Empty: the top-level `affinity`.
    affinity: {}
    # -- Pod securityContext merged over the chart's (runAsNonRoot, the image's user and group, fsGroup, RuntimeDefault seccomp). `global.compatibility.openshift.adaptSecurityContext` drops the fixed IDs.
    podSecurityContext: {}
    # -- Container securityContext merged over the chart's (no privilege escalation, all capabilities dropped).
    containerSecurityContext: {}

temporal:
  # -- `external` (a Temporal cluster, e.g. the temporalio/temporal Helm chart) or `bundled` (the single-binary dev server with SQLite on a volume).
  mode: external
  # -- [TEMPORAL_NAMESPACE] must exist on an external server (the bundled one creates it).
  namespace: default
  external:
    # -- [TEMPORAL_HOST] frontend `host:port`, e.g. `temporal-frontend.temporal.svc:7233`. Plain gRPC: TLS and Temporal Cloud API keys are not supported yet.
    address: ""
  bundled:
    image:
      # -- Registry of the bundled Temporal image (the Temporal CLI, `temporal server start-dev`).
      registry: docker.io
      # -- Repository of the bundled Temporal image.
      repository: temporalio/temporal
      # -- Tag of the bundled Temporal image; the version the Standalone install ships.
      tag: 1.9.1
      # -- Optional digest (`sha256:...`) pinned after the tag.
      digest: ""
    # -- Serve the Temporal Web UI on port 8233 of the temporal Service (`kubectl port-forward`).
    ui: false
    persistence:
      # -- Size of the SQLite volume (schedules and workflow history). Install-time only (see "Install-time settings" in README.md).
      size: 5Gi
      # -- StorageClass of the volume. Empty: `global.storageClass`, else the cluster default. Install-time only.
      storageClass: ""
    # -- [GOMEMLIMIT] soft memory limit of the server; keep it below the memory limit.
    goMemLimit: 512MiB
    # -- Resources of the bundled Temporal server.
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    # -- Node selector of the bundled Temporal. Empty: the top-level `nodeSelector`.
    nodeSelector: {}
    # -- Tolerations of the bundled Temporal. Empty: the top-level `tolerations`.
    tolerations: []
    # -- Affinity of the bundled Temporal. Empty: the top-level `affinity`.
    affinity: {}
    # -- Pod securityContext merged over the chart's (runAsNonRoot, the image's user and group, fsGroup, RuntimeDefault seccomp). `global.compatibility.openshift.adaptSecurityContext` drops the fixed IDs.
    podSecurityContext: {}
    # -- Container securityContext merged over the chart's (no privilege escalation, all capabilities dropped).
    containerSecurityContext: {}

objectStorage:
  # -- `external` (AWS S3, GCS or any S3-compatible service) or `bundled` (one MinIO, for evaluation).
  mode: external
  # -- [STORAGE_BACKEND] `s3` (AWS), `gcs` (Google Cloud Storage with HMAC keys) or `minio` (any other S3-compatible endpoint). Bundled always uses `minio`.
  backend: s3
  # -- [UPLOAD_BUCKET_NAME] bucket for uploads, datasets and exports. Created on the first upload (not on GCS) with a public-read policy.
  bucket: futureagi
  # -- [S3_REGION, AWS_DEFAULT_REGION] bucket region.
  region: us-east-1
  # -- [S3_ACCESS_KEY, or GCS_HMAC_ACCESS_KEY for gcs]. External: required unless `existingSecret`. Bundled: empty generates one.
  accessKey: ""
  # -- [S3_SECRET_KEY, or GCS_HMAC_SECRET_KEY for gcs]. External: required unless `existingSecret`. Bundled: empty generates one.
  secretKey: ""
  # -- Existing Secret holding the access and secret keys.
  existingSecret: ""
  # -- Key of the access key in `existingSecret`.
  existingSecretAccessKeyKey: access-key
  # -- Key of the secret key in `existingSecret`.
  existingSecretSecretKeyKey: secret-key
  external:
    # -- [S3_ENDPOINT_URL] e.g. `https://s3.us-east-1.amazonaws.com` or `http://minio.storage:9000`. Empty with `s3` uses s3.amazonaws.com.
    endpoint: ""
  bundled:
    image:
      # -- Registry of the bundled object storage image.
      registry: ghcr.io
      # -- Repository of the bundled object storage image: the last community MinIO release, as in the compose setups.
      repository: coollabsio/minio
      # -- Tag of the bundled object storage image.
      tag: RELEASE.2025-10-15T17-29-55Z
      # -- Digest pinned after the tag; wins over the chart's own pin. Empty: the default tag above runs pinned to the digest the chart was tested with (while `image.pinDigests` is on), and any other tag or repository runs by tag.
      digest: ""
    persistence:
      # -- Size of the data volume. Install-time only (see "Install-time settings" in README.md).
      size: 20Gi
      # -- StorageClass of the data volume. Empty: `global.storageClass`, else the cluster default. Install-time only.
      storageClass: ""
    # -- [GOMEMLIMIT] soft memory limit; keep it below the memory limit.
    goMemLimit: 384MiB
    service:
      # -- Service type of the bundled object storage. `LoadBalancer` (examples/local.yaml) also publishes `downloadPort` for browser downloads. Evaluation only: it exposes the bucket.
      type: ClusterIP
      # -- Local port of browser downloads [MINIO_URL `http://localhost:<port>`, unless `urls.objects` or `ingress.objects.host` is set]: the Service's download port with a `LoadBalancer` or `NodePort` type, else the local end of the install notes' port-forward.
      downloadPort: 9005
    # -- Resources of the bundled object storage.
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    # -- Node selector of the bundled object storage. Empty: the top-level `nodeSelector`.
    nodeSelector: {}
    # -- Tolerations of the bundled object storage. Empty: the top-level `tolerations`.
    tolerations: []
    # -- Affinity of the bundled object storage. Empty: the top-level `affinity`.
    affinity: {}
    # -- Pod securityContext merged over the chart's (runAsNonRoot, the image's user and group, fsGroup, RuntimeDefault seccomp). `global.compatibility.openshift.adaptSecurityContext` drops the fixed IDs.
    podSecurityContext: {}
    # -- Container securityContext merged over the chart's (no privilege escalation, all capabilities dropped).
    containerSecurityContext: {}

# -----------------------------------------------------------------------------
# Application components
# -----------------------------------------------------------------------------
backend:
  image:
    # -- Registry. Empty: `image.registry`.
    registry: ""
    # -- Repository of the backend image (also the workers' and the bootstrap job's).
    repository: futureagi/future-agi
    # -- Tag. Empty: `image.tag`, else the chart's appVersion.
    tag: ""
    # -- Optional digest (`sha256:...`) pinned after the tag.
    digest: ""
    # -- Pull policy. Empty: `image.pullPolicy`.
    pullPolicy: ""
  # -- Replicas when autoscaling is off. More than one needs the Redis channel layer, which this chart always configures.
  replicas: 1
  # -- Seconds each API pod sleeps before it stops (preStop), so Services and load balancers stop sending it requests first. 0: none.
  preStopSleepSeconds: 10
  # -- Seconds a stopping API pod gets: the preStop sleep, then in-flight requests. Raise it to at least your load balancer's read timeout for long requests.
  terminationGracePeriodSeconds: 90
  granian:
    # -- Granian worker processes per pod.
    workers: 1
    # -- Runtime threads per Granian worker.
    threads: 2
    # -- Log every request.
    accessLog: false
  # -- Run collectstatic into an emptyDir before the API starts (static files of /admin and /docs).
  collectStatic: true
  service:
    # -- Service type of the API.
    type: ClusterIP
    # -- Service port of the API.
    port: 8000
    # -- Service annotations.
    annotations: {}
  # -- Resources of each API pod.
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {cpu: "2", memory: 2Gi}
  autoscaling:
    # -- HorizontalPodAutoscaler for the API.
    enabled: false
    # -- Minimum replicas.
    minReplicas: 2
    # -- Maximum replicas.
    maxReplicas: 6
    # -- Target average CPU utilization (percent of requests).
    targetCPUUtilizationPercentage: 70
    # -- Target average memory utilization (percent of requests). Empty: not used.
    targetMemoryUtilizationPercentage: ""
    # -- HorizontalPodAutoscaler `behavior` (autoscaling/v2), e.g. `{scaleDown: {stabilizationWindowSeconds: 300}}`. Empty: the Kubernetes defaults.
    behavior: {}
  pdb:
    # -- PodDisruptionBudget for the API.
    enabled: true
    # -- At most this many API pods down during voluntary disruptions.
    maxUnavailable: 1
  # -- Extra environment variables for the API only, as `NAME: value`.
  extraEnv: {}
  # -- Pod annotations.
  podAnnotations: {}
  # -- Extra pod labels.
  podLabels: {}
  # -- Merged over the chart's pod security context (non-root uid 1000, fsGroup 1000, RuntimeDefault seccomp).
  podSecurityContext: {}
  # -- Merged over the chart's container security context (read-only root filesystem, no privilege escalation, all capabilities dropped).
  containerSecurityContext: {}
  # -- Extra volumes.
  extraVolumes: []
  # -- Extra volume mounts.
  extraVolumeMounts: []
  # -- Node selector of the API pods, the bootstrap job and the `helm test` pod. Empty: the top-level `nodeSelector`.
  nodeSelector: {}
  # -- Tolerations of the API pods, the bootstrap job and the `helm test` pod. Empty: the top-level `tolerations`.
  tolerations: []
  # -- Affinity of the API pods, the bootstrap job and the `helm test` pod. Empty: the top-level `affinity`.
  affinity: {}
  # -- Topology spread constraints. Empty: the top-level `topologySpreadConstraints`.
  topologySpreadConstraints: []

worker:
  image:
    # -- Registry. Empty: `backend.image.registry`, else `image.registry`.
    registry: ""
    # -- Repository. Empty: `backend.image.repository` (workers run the backend image).
    repository: ""
    # -- Tag. Empty: `backend.image.tag`, else `image.tag`, else the chart's appVersion.
    tag: ""
    # -- Optional digest. Empty: `backend.image.digest`.
    digest: ""
    # -- Pull policy. Empty: `backend.image.pullPolicy`, else `image.pullPolicy`.
    pullPolicy: ""
  # -- [TEMPORAL_GRACEFUL_SHUTDOWN_TIMEOUT] seconds a stopping worker lets running activities finish. The pod's grace period is this plus `preStopSleepSeconds` plus 30 s. A `queues` entry can set its own.
  gracefulShutdownSeconds: 60
  # -- Seconds each worker pod sleeps before it stops (preStop). 0: none. A `queues` entry can set its own.
  preStopSleepSeconds: 15
  # -- PriorityClass of every worker pod. Empty: the top-level `priorityClassName`. A `queues` entry can set its own.
  priorityClassName: ""
  allQueues:
    # -- One Deployment polling every generic queue (default, tasks_s, tasks_l, tasks_xl, trace_ingestion, agent_compass). This worker also drains the outbox CDC.
    enabled: true
    # -- Replicas when autoscaling is off.
    replicas: 1
    # -- [TEMPORAL_EXCLUDED_QUEUES] queues it does not poll. simulation_runner needs the separate simulation-runner image (a `queues` entry with its own image).
    excludedQueues:
      - simulation_runner
    # -- Also exclude every `queues` entry [TEMPORAL_EXCLUDED_QUEUES], so heavy queues run only on their own Deployments. `false`: the all-queues worker polls them too.
    excludeDedicatedQueues: true
    # -- [TEMPORAL_MAX_CONCURRENT_ACTIVITIES] activity slots per queue.
    maxConcurrentActivities: 50
    # -- [TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASKS] workflow-task slots per queue.
    maxConcurrentWorkflowTasks: 50
    # -- Resources of each all-queues worker pod.
    resources:
      requests: {cpu: 250m, memory: 1Gi}
      limits: {cpu: "2", memory: 3Gi}
    autoscaling:
      # -- HorizontalPodAutoscaler for the all-queues worker.
      enabled: false
      # -- Minimum replicas.
      minReplicas: 1
      # -- Maximum replicas.
      maxReplicas: 4
      # -- Target average CPU utilization (percent of requests).
      targetCPUUtilizationPercentage: 70
      # -- Target average memory utilization (percent of requests). Empty: not used.
      targetMemoryUtilizationPercentage: ""
      # -- HorizontalPodAutoscaler `behavior` (autoscaling/v2). Empty: the Kubernetes defaults.
      behavior: {}
  exactAggregation:
    # -- A single-slot worker for the exact_aggregation queue, the admission boundary for expensive exact analytics [EXACT_AGGREGATION_TASK_QUEUE=exact_aggregation]. Off: that work runs on tasks_xl.
    enabled: true
    # -- Resources of the exact-aggregation worker.
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "1", memory: 1536Mi}
  # -- Dedicated per-queue Deployments, added to the all-queues worker (which stops polling them, see `allQueues.excludeDedicatedQueues`), e.g. `[{name: tasks_s, replicas: 2, maxConcurrentActivities: 200}]`; examples/sizes/large.yaml has a full split. Each entry: name (required), replicas, maxConcurrentActivities, maxConcurrentWorkflowTasks, resources, image, extraEnv (wins over `worker.extraEnv` and the chart's own values), autoscaling {enabled, minReplicas, maxReplicas, targetCPUUtilizationPercentage, targetMemoryUtilizationPercentage, behavior} (gaps filled from `allQueues.autoscaling`), gracefulShutdownSeconds, preStopSleepSeconds, pdb {enabled, maxUnavailable}, and nodeSelector, tolerations, affinity, topologySpreadConstraints, priorityClassName, podAnnotations, podLabels (each falling back to the `worker` one).
  queues: []
  pdb:
    # -- PodDisruptionBudget for every worker Deployment.
    enabled: true
    # -- At most this many pods of each worker Deployment down during voluntary disruptions.
    maxUnavailable: 1
  # -- Extra environment variables for the workers only, as `NAME: value`.
  extraEnv: {}
  # -- Pod annotations.
  podAnnotations: {}
  # -- Extra pod labels.
  podLabels: {}
  # -- Merged over the chart's pod security context (as for the backend).
  podSecurityContext: {}
  # -- Merged over the chart's container security context (as for the backend).
  containerSecurityContext: {}
  # -- Extra volumes.
  extraVolumes: []
  # -- Extra volume mounts.
  extraVolumeMounts: []
  # -- Node selector. Empty: the top-level `nodeSelector`.
  nodeSelector: {}
  # -- Tolerations. Empty: the top-level `tolerations`.
  tolerations: []
  # -- Affinity. Empty: the top-level `affinity`.
  affinity: {}
  # -- Topology spread constraints. Empty: the top-level `topologySpreadConstraints`.
  topologySpreadConstraints: []

frontend:
  image:
    # -- Registry. Empty: `image.registry`.
    registry: ""
    # -- Repository of the UI image.
    repository: futureagi/frontend
    # -- Tag. Empty: `image.tag`, else the chart's appVersion.
    tag: ""
    # -- Optional digest (`sha256:...`) pinned after the tag.
    digest: ""
    # -- Pull policy. Empty: `image.pullPolicy`.
    pullPolicy: ""
  # -- Replicas when autoscaling is off.
  replicas: 1
  # -- [VITE_HELP_LINK] where the sidebar Help entry points. Empty: the community Discord.
  helpLink: ""
  service:
    # -- Service type of the UI.
    type: ClusterIP
    # -- Service port of the UI.
    port: 80
    # -- Service annotations.
    annotations: {}
  # -- Resources of each UI pod.
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  autoscaling:
    # -- HorizontalPodAutoscaler for the UI.
    enabled: false
    # -- Minimum replicas.
    minReplicas: 2
    # -- Maximum replicas.
    maxReplicas: 4
    # -- Target average CPU utilization (percent of requests).
    targetCPUUtilizationPercentage: 70
    # -- Target average memory utilization (percent of requests). Empty: not used.
    targetMemoryUtilizationPercentage: ""
    # -- HorizontalPodAutoscaler `behavior` (autoscaling/v2), e.g. `{scaleDown: {stabilizationWindowSeconds: 300}}`. Empty: the Kubernetes defaults.
    behavior: {}
  pdb:
    # -- PodDisruptionBudget for the UI.
    enabled: true
    # -- At most this many UI pods down during voluntary disruptions.
    maxUnavailable: 1
  # -- Extra environment variables for the UI (runtime VITE_* settings), as `NAME: value`.
  extraEnv: {}
  # -- Pod annotations.
  podAnnotations: {}
  # -- Extra pod labels.
  podLabels: {}
  # -- Merged over the chart's pod security context (non-root uid 101, the image's nginx user).
  podSecurityContext: {}
  # -- Merged over the chart's container security context (read-only root filesystem).
  containerSecurityContext: {}
  # -- Node selector. Empty: the top-level `nodeSelector`.
  nodeSelector: {}
  # -- Tolerations. Empty: the top-level `tolerations`.
  tolerations: []
  # -- Affinity. Empty: the top-level `affinity`.
  affinity: {}
  # -- Topology spread constraints. Empty: the top-level `topologySpreadConstraints`.
  topologySpreadConstraints: []

fiCollector:
  image:
    # -- Registry. Empty: `image.registry`.
    registry: ""
    # -- Repository of the OTLP collector image.
    repository: futureagi/fi-collector
    # -- Tag. Empty: `image.tag`, else the chart's appVersion.
    tag: ""
    # -- Optional digest (`sha256:...`) pinned after the tag.
    digest: ""
    # -- Pull policy. Empty: `image.pullPolicy`.
    pullPolicy: ""
  # -- Replicas when autoscaling is off.
  replicas: 1
  # -- Seconds each collector pod waits before it stops (preStop, the kubelet's sleep action: Kubernetes 1.30 or newer, skipped on older clusters), so Services stop sending it spans first. 0: none.
  preStopSleepSeconds: 10
  # -- Seconds a stopping collector gets: the preStop sleep, then it flushes its batches to ClickHouse.
  terminationGracePeriodSeconds: 45
  service:
    # -- Service type. `LoadBalancer` exposes OTLP/gRPC (4317) outside the cluster; OTLP/HTTP can go through the ingress instead.
    type: ClusterIP
    # -- OTLP/gRPC port.
    grpcPort: 4317
    # -- OTLP/HTTP port (POST /v1/traces).
    httpPort: 4318
    # -- Service annotations (e.g. for a cloud load balancer).
    annotations: {}
  # -- [GOMEMLIMIT] soft memory limit; keep it below the memory limit.
  goMemLimit: 900MiB
  # -- Resources of each collector pod.
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 1Gi}
  autoscaling:
    # -- HorizontalPodAutoscaler for the collector.
    enabled: false
    # -- Minimum replicas.
    minReplicas: 2
    # -- Maximum replicas.
    maxReplicas: 6
    # -- Target average CPU utilization (percent of requests).
    targetCPUUtilizationPercentage: 70
    # -- Target average memory utilization (percent of requests). Empty: not used.
    targetMemoryUtilizationPercentage: ""
    # -- HorizontalPodAutoscaler `behavior` (autoscaling/v2), e.g. `{scaleDown: {stabilizationWindowSeconds: 300}}`. Empty: the Kubernetes defaults.
    behavior: {}
  pdb:
    # -- PodDisruptionBudget for the collector.
    enabled: true
    # -- At most this many collector pods down during voluntary disruptions.
    maxUnavailable: 1
  # -- Extra environment variables (FI_* overrides, see fi-collector/README.md), as `NAME: value`.
  extraEnv: {}
  # -- Pod annotations.
  podAnnotations: {}
  # -- Extra pod labels.
  podLabels: {}
  # -- Merged over the chart's pod security context (non-root uid 65532, distroless).
  podSecurityContext: {}
  # -- Merged over the chart's container security context (read-only root filesystem).
  containerSecurityContext: {}
  # -- Extra volumes, e.g. the CA of `postgres.external.sslMode=verify-full`.
  extraVolumes: []
  # -- Extra volume mounts.
  extraVolumeMounts: []
  # -- Node selector. Empty: the top-level `nodeSelector`.
  nodeSelector: {}
  # -- Tolerations. Empty: the top-level `tolerations`.
  tolerations: []
  # -- Affinity. Empty: the top-level `affinity`.
  affinity: {}
  # -- Topology spread constraints. Empty: the top-level `topologySpreadConstraints`.
  topologySpreadConstraints: []

agentccGateway:
  image:
    # -- Registry. Empty: `image.registry`.
    registry: ""
    # -- Repository of the LLM gateway image.
    repository: futureagi/agentcc-gateway
    # -- Tag. Empty: `image.tag`, else the chart's appVersion.
    tag: ""
    # -- Optional digest (`sha256:...`) pinned after the tag.
    digest: ""
    # -- Pull policy. Empty: `image.pullPolicy`.
    pullPolicy: ""
  # -- Replicas when autoscaling is off.
  replicas: 1
  # -- Seconds each gateway pod waits before it stops (preStop, the kubelet's sleep action: Kubernetes 1.30 or newer, skipped on older clusters), so Services stop sending it requests first. 0: none.
  preStopSleepSeconds: 10
  # -- Seconds a stopping gateway gets. Keep it at least the preStop sleep + `config.server.shutdown_timeout` (30 s, for in-flight streams) + 5 s (the gateway then sends its buffered request logs): 10 + 30 + 5 = 45. With `config.otel.exporter: otlp`, add up to 15 s for the exporter's last flush.
  terminationGracePeriodSeconds: 45
  # -- Existing ConfigMap with the gateway configuration under the key `config.yaml`. Empty: rendered from `config`.
  existingConfigMap: ""
  # -- Gateway configuration (agentcc-gateway/config.example.yaml documents every field). `${VAR}` expands from the environment: provider keys come from `secrets.llm`. `server.port` is also the container port: the chart pins it with the AGENTCC_PORT variable, which wins over an `existingConfigMap` too.
  config:
    server:
      port: 8080
      host: 0.0.0.0
      read_header_timeout: 5s
      read_timeout: 60s
      write_timeout: 300s
      idle_timeout: 120s
      shutdown_timeout: 30s
      max_request_body_size: 10485760
      default_request_timeout: 60s
    providers:
      openai:
        base_url: https://api.openai.com
        api_key: ${OPENAI_API_KEY}
        api_format: openai
        default_timeout: 60s
        max_concurrent: 100
        conn_pool_size: 100
        models:
          - gpt-4o
          - gpt-4o-mini
          - gpt-4-turbo
          - gpt-3.5-turbo
          - o1
          - o1-mini
    control_plane:
      # Replicas re-read keys and org settings from the backend this often.
      sync_interval: 60s
    logging:
      level: info
  # -- Pull keys and org settings from the backend on start [AGENTCC_CONTROL_PLANE_URL, AGENTCC_SYNC_ON_STARTUP], so every replica and a restarted pod serve the same keys.
  controlPlaneSync: true
  # -- Let org providers use base URLs on private networks, such as a local Ollama or vLLM [AGENTCC_ALLOW_PRIVATE_PROVIDER_URLS], for the gateway and the backend. Loopback, link-local and cloud metadata addresses stay refused. Only when everyone who can add a provider is trusted: it puts every in-cluster service in reach of a provider URL. Gateway and backend images from before this setting ignore it and refuse every private URL.
  allowPrivateProviderURLs: false
  redis:
    # -- Keep rate limits, budgets and other shared gateway state in the release's Redis [AGENTCC_REDIS_ADDRESS, AGENTCC_REDIS_PASSWORD, AGENTCC_REDIS_DB]. `auto`: on when the gateway runs more than one replica (`replicas` above 1 or autoscaling), off with `redis.external.tls` (the gateway has no Redis TLS): give it a Redis without TLS with AGENTCC_REDIS_ADDRESS in `extraEnv` instead (examples/cloud/aks.yaml). The chart refuses more than one replica without either.
    enabled: auto
    # -- [AGENTCC_REDIS_DB] Redis database of the gateway, apart from the app's 0-3.
    db: 4
  gcpCredentials:
    # -- Existing Secret with a GCP service-account JSON for Vertex AI, mounted read-only [GOOGLE_APPLICATION_CREDENTIALS].
    existingSecret: ""
    # -- Key of the JSON in `existingSecret`.
    key: credentials.json
  service:
    # -- Service type of the gateway. Keep it internal unless your apps call the gateway directly.
    type: ClusterIP
    # -- Service port of the gateway.
    port: 8080
    # -- Service annotations.
    annotations: {}
  # -- [GOMEMLIMIT] soft memory limit; keep it below the memory limit.
  goMemLimit: 450MiB
  # -- Resources of each gateway pod.
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  autoscaling:
    # -- HorizontalPodAutoscaler for the gateway.
    enabled: false
    # -- Minimum replicas.
    minReplicas: 2
    # -- Maximum replicas.
    maxReplicas: 6
    # -- Target average CPU utilization (percent of requests).
    targetCPUUtilizationPercentage: 70
    # -- Target average memory utilization (percent of requests). Empty: not used.
    targetMemoryUtilizationPercentage: ""
    # -- HorizontalPodAutoscaler `behavior` (autoscaling/v2), e.g. `{scaleDown: {stabilizationWindowSeconds: 300}}`. Empty: the Kubernetes defaults.
    behavior: {}
  pdb:
    # -- PodDisruptionBudget for the gateway.
    enabled: true
    # -- At most this many gateway pods down during voluntary disruptions.
    maxUnavailable: 1
  # -- Extra environment variables (AGENTCC_* and provider keys referenced by `config`), as `NAME: value`.
  extraEnv: {}
  # -- Extra `envFrom` sources, e.g. a Secret with more provider keys.
  extraEnvFrom: []
  # -- Pod annotations.
  podAnnotations: {}
  # -- Extra pod labels.
  podLabels: {}
  # -- Merged over the chart's pod security context (non-root uid 65532; the image is a static binary).
  podSecurityContext: {}
  # -- Merged over the chart's container security context (read-only root filesystem).
  containerSecurityContext: {}
  # -- Node selector. Empty: the top-level `nodeSelector`.
  nodeSelector: {}
  # -- Tolerations. Empty: the top-level `tolerations`.
  tolerations: []
  # -- Affinity. Empty: the top-level `affinity`.
  affinity: {}
  # -- Topology spread constraints. Empty: the top-level `topologySpreadConstraints`.
  topologySpreadConstraints: []

serving:
  # -- Embedding model server for embedding-based evals, knowledge bases, Vector DB columns and (with an Enterprise Edition license) Error Feed clustering [MODEL_SERVING_URL]. Off: those features are unavailable and the setup screen marks them off.
  enabled: false
  image:
    # -- Registry. Empty: `image.registry`.
    registry: ""
    # -- Repository of the model server image.
    repository: futureagi/serving
    # -- Tag. Empty: `image.tag`, else the chart's appVersion. Append `-gpu` for the CUDA image (linux/amd64).
    tag: ""
    # -- Optional digest (`sha256:...`) pinned after the tag.
    digest: ""
    # -- Pull policy. Empty: `image.pullPolicy`.
    pullPolicy: ""
  # -- Replicas.
  replicas: 1
  # -- Resources of each model server pod (add `nvidia.com/gpu` for the GPU image).
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {cpu: "4", memory: 6Gi}
  persistence:
    # -- Keep downloaded models on a volume (ReadWriteOnce: one replica). Off: an emptyDir, downloaded again after each restart.
    enabled: false
    # -- Size of the model cache.
    size: 20Gi
    # -- StorageClass of the model cache. Empty: `global.storageClass`, else the cluster default.
    storageClass: ""
  # -- Extra environment variables (e.g. TEXT_EMBEDDING_MODEL), as `NAME: value`.
  extraEnv: {}
  # -- Pod annotations.
  podAnnotations: {}
  # -- Extra pod labels.
  podLabels: {}
  # -- Merged over the chart's pod security context (non-root uid 1000).
  podSecurityContext: {}
  # -- Merged over the chart's container security context.
  containerSecurityContext: {}
  # -- Node selector. Empty: the top-level `nodeSelector`.
  nodeSelector: {}
  # -- Tolerations. Empty: the top-level `tolerations`.
  tolerations: []
  # -- Affinity. Empty: the top-level `affinity`.
  affinity: {}

codeExecutor:
  # -- nsjail sandbox for custom code evals. It needs `privileged: true` (Linux namespaces): Pod Security Admission `restricted`/`baseline` namespaces and some managed clusters (GKE Autopilot, Fargate) refuse it.
  enabled: false
  # -- [CODE_EXECUTOR_LOCAL_FALLBACK] with the sandbox off (or unreachable), run custom code evals inside the worker pods, next to the platform's secrets (RestrictedPython in a subprocess). `false` (default) refuses them with "Code executor unavailable". Enable only when everyone who can create evals is trusted.
  localFallback: false
  image:
    # -- Registry. Empty: `image.registry`.
    registry: ""
    # -- Repository of the code sandbox image.
    repository: futureagi/code-executor
    # -- Tag. Empty: `image.tag`, else the chart's appVersion.
    tag: ""
    # -- Optional digest (`sha256:...`) pinned after the tag.
    digest: ""
    # -- Pull policy. Empty: `image.pullPolicy`.
    pullPolicy: ""
  # -- Replicas.
  replicas: 1
  # -- Resources of each sandbox pod.
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}
  # -- With `networkPolicy.enabled`: let eval code reach the internet (every private, link-local and metadata range stays blocked). `false` blocks all egress but DNS.
  allowInternetEgress: true
  # -- Extra environment variables, as `NAME: value`.
  extraEnv: {}
  # -- Pod annotations.
  podAnnotations: {}
  # -- Extra pod labels.
  podLabels: {}
  # -- Node selector. Empty: the top-level `nodeSelector`.
  nodeSelector: {}
  # -- Tolerations. Empty: the top-level `tolerations`.
  tolerations: []
  # -- Affinity. Empty: the top-level `affinity`.
  affinity: {}

# -----------------------------------------------------------------------------
# Bootstrap job: `python manage.py bootstrap_install` (migrations, seeds,
# ClickHouse schema, observed-attribute index, CDC, Temporal schedules).
# -----------------------------------------------------------------------------
bootstrap:
  # -- When the job runs on install. `auto`: pre-install when every datastore is external (the app starts on a ready schema), post-install when any is bundled (they must exist first). It always runs pre-upgrade. Argo CD runs a pre-install job in PreSync, a post-install one after the bundled datastores and before the rest of the release.
  installHook: auto
  # -- Create the observed-attribute index database and its two ClickHouse users (needs CREATE USER and GRANT). `false`: create them yourself.
  propertyCatalog: true
  # -- Seconds to wait for each datastore to accept connections.
  waitTimeoutSeconds: 600
  # -- Deadline of the ClickHouse schema step, in seconds.
  clickhouseTimeoutSeconds: 600
  # -- Retries of a failed job.
  backoffLimit: 2
  # -- Deadline of the whole job, in seconds. Keep it below `helm install/upgrade --timeout` (20m in every documented command), so Helm reports how the job ended; raise both together for a long migration.
  activeDeadlineSeconds: 1080
  # -- Seconds a finished job (and its logs) is kept. `0`: deleted as soon as it finishes. Empty: kept until the next install or upgrade replaces it.
  ttlSecondsAfterFinished: 86400
  # -- Resources of the bootstrap job.
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {cpu: "2", memory: 2Gi}
  serviceAccount:
    # -- Create a dedicated ServiceAccount for the job (it exists before any other resource on install).
    create: true
    # -- Name of the job's ServiceAccount. Empty: <fullname>-bootstrap when created, else the namespace default.
    name: ""
    # -- Annotations, e.g. for cloud IAM database authentication.
    annotations: {}
  # -- Pod annotations.
  podAnnotations: {}
  # -- Extra volumes, e.g. the CA of `postgres.external.sslMode=verify-full`. Empty: `backend.extraVolumes`.
  extraVolumes: []
  # -- Extra volume mounts. Empty: `backend.extraVolumeMounts`.
  extraVolumeMounts: []
  # The first admin account, created by the job after the migrations (the account creation `manage.py create_user` uses) when no user has its email yet; later runs leave it alone, password included.
  admin:
    # -- Existing Secret with the admin's email, name and password (the sign-up rules: 8+ characters, not a common password, not all digits). Empty: create the first account yourself (install notes, step 3).
    existingSecret: ""
    # -- Key of the email in `existingSecret`.
    emailKey: email
    # -- Key of the full name in `existingSecret`.
    nameKey: name
    # -- Key of the password in `existingSecret`.
    passwordKey: password

# -----------------------------------------------------------------------------
# Networking
# -----------------------------------------------------------------------------
ingress:
  # -- One Ingress for the UI, the API and OTLP/HTTP.
  enabled: false
  # -- IngressClass, e.g. `nginx`.
  className: ""
  # -- Ingress annotations (e.g. cert-manager, proxy body size and timeouts for uploads and WebSockets).
  annotations: {}
  # -- TLS entries, e.g. `[{secretName: futureagi-tls, hosts: [futureagi.example.com, api.futureagi.example.com]}]`. Hosts listed here get https URLs.
  tls: []
  app:
    # -- Host of the UI.
    host: ""
  api:
    # -- Host of the API. It must differ from the UI host: the API serves many top-level paths.
    host: ""
  otlp:
    # -- Route OTLP/HTTP (`/v1/traces`, `/tracer/v1/traces`) to fi-collector.
    enabled: true
    # -- Host for OTLP/HTTP. Empty: the API host.
    host: ""
  objects:
    # -- Host of the bundled object storage (`objectStorage.mode=bundled`), for browser downloads [MINIO_URL]. Evaluation only, like the bundled storage itself: it publishes the bucket through the Ingress. Empty: not exposed.
    host: ""
  websocket:
    # -- A second Ingress for the API's WebSocket paths (`/ws/`) with its own annotations, so long-lived connections get long timeouts without raising them for every request. Same class, host and TLS as the main one.
    enabled: false
    # -- Annotations of the WebSocket Ingress, over `ingress.annotations`. ingress-nginx: `nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"` and `proxy-send-timeout: "3600"`. Traefik has no per-Ingress timeout: raise the entrypoint's `respondingTimeouts` (examples/ingress-traefik.yaml).
    annotations: {}

# -----------------------------------------------------------------------------
# Gateway API (recommended over `ingress`): HTTPRoutes and a GRPCRoute on a
# Gateway you run (Envoy Gateway, Istio, Cilium, GKE, AWS, ...). Needs the
# Gateway API CRDs, v1.2 or newer (route `timeouts` are Standard channel from
# v1.2). examples/gateway-api.yaml shows a setup.
# -----------------------------------------------------------------------------
gatewayApi:
  # -- Render HTTPRoutes for the UI and the API (OTLP/HTTP on the exact paths `/v1/traces` and `/tracer/v1/traces` to fi-collector), plus the optional routes below. URLs (`urls.*`) are derived from these hosts unless the ingress is on.
  enabled: false
  # -- Gateways (and listeners) the routes attach to, e.g. `[{name: public, namespace: gateway-system, sectionName: https}]`.
  parentRefs: []
  # -- The Gateway terminates TLS for these hosts: derived URLs use https. `false`: http.
  tls: true
  # -- Annotations on every route.
  annotations: {}
  app:
    # -- Hostname of the UI. Empty: `ingress.app.host`.
    host: ""
  api:
    # -- Hostname of the API. It must differ from the UI host. Empty: `ingress.api.host`.
    host: ""
  otlp:
    # -- Route OTLP/HTTP to fi-collector [FI_COLLECTOR_PUBLIC_URL].
    enabled: true
    # -- Hostname for OTLP/HTTP. Empty: the API host.
    host: ""
  otlpGrpc:
    # -- A GRPCRoute for OTLP/gRPC (the TraceService) to fi-collector's gRPC port. The listener must accept HTTP/2 (HTTPS).
    enabled: false
    # -- Hostname for OTLP/gRPC; it must differ from the HTTP route hosts.
    host: ""
  llmGateway:
    # -- An HTTPRoute to the LLM gateway (agentcc-gateway), for applications outside the cluster; every call needs a virtual key. It also opens the gateway in the NetworkPolicies.
    enabled: false
    # -- Hostname of the LLM gateway. It must differ from the app and API hosts: each route sends `/` to its own service.
    host: ""
    # -- Route timeout (Gateway API duration) of LLM calls; keep it above the gateway's `config.server.write_timeout`. Empty: the Gateway's default.
    timeout: 310s
  timeouts:
    # -- Route timeout of API requests (Gateway API duration, e.g. `300s`). Empty: the Gateway's default, often 15 s, which cuts long requests.
    request: 300s
    # -- Route timeout of the WebSocket paths (`/ws/`). `0s` disables it where the Gateway supports that; some also need a backend or client traffic policy for idle connections (README).
    websocket: 24h
  gke:
    healthChecks:
      # -- GKE Gateway only: a HealthCheckPolicy (networking.gke.io/v1) for each Service the routes use. GKE's load balancer ignores readiness probes and sends `GET /` with the pod's IP as the Host, which the API (a redirect) and the collector's OTLP port (no `/`) fail; these probe the API's `/health/` with Host `localhost`, the collector's `/healthz` on its admin port 9464, the LLM gateway's `/readyz` and the UI's `/`. Needs the GKE Gateway controller (its CRDs).
      enabled: false

networkPolicy:
  # -- NetworkPolicies: the datastores, the gateway, serving and the code sandbox accept traffic only from this release's pods; the UI, API and collector also from `ingressFrom`. A component whose Service is a LoadBalancer or NodePort accepts any source on its Service ports. Egress is open, except for the code sandbox.
  enabled: false
  # -- Peers (NetworkPolicy `from` entries) that may reach the UI, API and collector, e.g. your ingress controller's namespace: `[{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]`. Empty: any source.
  ingressFrom: []

serviceAccount:
  # -- Create a ServiceAccount for the application pods.
  create: true
  # -- Name. Empty: <fullname> when created, else the namespace default.
  name: ""
  # -- Annotations of the application pods' ServiceAccount. Object storage does not use them: it always authenticates with `objectStorage` keys.
  annotations: {}
  # -- Mount the ServiceAccount's token in the pods that run as it: the backend, workers, UI, collector, gateway and serving (never the code sandbox). The application does not call the Kubernetes API; turn it on for a sidecar that needs the token (e.g. a Vault agent).
  automountServiceAccountToken: false

# -----------------------------------------------------------------------------
# Scheduling defaults for every pod (a component's own setting wins)
# -----------------------------------------------------------------------------
# -- Default node selector.
nodeSelector: {}
# -- Default tolerations.
tolerations: []
# -- Default affinity.
affinity: {}
# -- Default topology spread constraints of the application Deployments. Entries without a `labelSelector` get each component's.
topologySpreadConstraints: []
topologySpread:
  # -- Spread of the backend, UI, collector, gateway and worker pods that can run more than one replica and set no `topologySpreadConstraints`: `soft` prefers other zones and nodes, `hard` never puts two replicas on one node while another is free (needs at least two nodes), `none` leaves placement to the scheduler. Bundled datastores are never spread.
  preset: soft
# -- PriorityClass of every pod.
priorityClassName: ""
# -- Extra labels on every resource.
commonLabels: {}
