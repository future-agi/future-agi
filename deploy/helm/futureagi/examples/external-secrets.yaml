# Every credential from an external store through the External Secrets
# Operator (external-secrets.io/v1). Layer it over examples/external.yaml.
# Each entry of externalSecrets.secrets renders an ExternalSecret that creates
# the Secret its existingSecret value names; the chart reads those Secrets and
# generates none of them.
#
# Seed the application keys into the store once. They must never change after
# the first install (INTEGRATION_ENCRYPTION_KEY decrypts stored credentials):
#   SECRET_KEY                          random, 64+ characters
#   INTEGRATION_ENCRYPTION_KEY          a Fernet key: python -c "import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
#   AGENTCC_INTERNAL_API_KEY            random, 48 characters
#   AGENTCC_ADMIN_TOKEN                 random, 48 characters
#   PROPERTY_CATALOG_API_PASSWORD       random, 32 characters
#   PROPERTY_CATALOG_CONSUMER_PASSWORD  random, 32 characters
#   AGENTCC_WEBHOOK_SECRET              random, 48 characters
# Moving an existing install: copy them from the generated Secret
# <release>-futureagi-secrets.
#
# The store below is a ClusterSecretStore named "vault" (HashiCorp Vault KV v2);
# the same keys work with AWS Secrets Manager or GCP Secret Manager stores,
# with `key` the secret's name and `property` a JSON field.
externalSecrets:
  enabled: true
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  refreshInterval: 1h
  secrets:
    # Every key of futureagi/app becomes a key of the Secret futureagi-app.
    app:
      dataFrom:
        - extract:
            key: futureagi/app
    llm:
      data:
        OPENAI_API_KEY: {key: futureagi/llm, property: openai}
        ANTHROPIC_API_KEY: {key: futureagi/llm, property: anthropic}
    license:
      data:
        EE_LICENSE_KEY: {key: futureagi/license, property: key}
    postgres:
      data:
        password: {key: futureagi/postgres, property: password}
    objectStorage:
      data:
        access-key: {key: futureagi/s3, property: access_key}
        secret-key: {key: futureagi/s3, property: secret_key}

# The Secrets the ExternalSecrets above create, read as usual.
secrets:
  existingSecret: futureagi-app
  llm:
    existingSecret: futureagi-llm
license:
  existingSecret: futureagi-license
postgres:
  existingSecret: futureagi-postgres
objectStorage:
  existingSecret: futureagi-s3
edition: ee

# Roll the pods when the operator updates a Secret (needs Stakater Reloader).
reloader:
  enabled: true
