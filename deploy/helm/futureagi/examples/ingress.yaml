# Legacy: public UI, API and OTLP/HTTP endpoints behind ingress-nginx, with
# TLS from cert-manager. ingress-nginx was retired upstream in March 2026:
# prefer examples/gateway-api.yaml (Gateway API), or
# examples/ingress-traefik.yaml for Traefik (k3s's default controller).
# Layer it over external.yaml (or bundled.yaml):
#
#   helm install futureagi deploy/helm/futureagi \
#     -f deploy/helm/futureagi/examples/external.yaml \
#     -f deploy/helm/futureagi/examples/ingress.yaml --timeout 20m
#
# urls.* are derived from these hosts (https, because they are in tls).
urls:
  app: ""
  api: ""
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Dataset uploads and long LLM calls.
    nginx.ingress.kubernetes.io/proxy-body-size: 1g
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  tls:
    - secretName: futureagi-tls
      hosts:
        - futureagi.example.com
        - api.futureagi.example.com
  app:
    host: futureagi.example.com
  api:
    host: api.futureagi.example.com
  otlp:
    enabled: true
  # WebSockets (/ws/) on their own Ingress, so they are not cut after 600 s.
  websocket:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
  # The MCP OAuth request limits count each client by the address
  # ingress-nginx saw when the request comes from these networks (by default
  # the private ranges). Narrowed to the controller's pod network, e.g.
  # kubeadm with flannel:
  # trustedProxies: "10.244.0.0/16"
config:
  allowedHosts: api.futureagi.example.com
  corsAllowedOrigins: https://futureagi.example.com
