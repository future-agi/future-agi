# Argo CD OCI Application (not Helm values). Use an Argo CD release with
# native OCI application-source support. See the GitOps upgrade runbook.
# Verify the published chart's exact digest and release-tag signing identity
# BEFORE approving this file in Git. Argo CD's OCI source does not itself
# enforce this chart's cosign policy: a digest pin is not a signature check.
# Never replace the digest with a tag/range or enable floating image updates.
#
# Argo CD runs `helm template`, where lookup cannot preserve generated keys.
# Pre-create futureagi-app with SECRET_KEY, INTEGRATION_ENCRYPTION_KEY,
# AGENTCC_INTERNAL_API_KEY, AGENTCC_ADMIN_TOKEN, PROPERTY_CATALOG_API_PASSWORD,
# PROPERTY_CATALOG_CONSUMER_PASSWORD and AGENTCC_WEBHOOK_SECRET. Keep all other
# credentials in existing Secrets too; never commit their values here.
# Apply argocd-project.yaml and create the destination namespace separately.
# External stores must be reachable before the chart's PreSync bootstrap runs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: futureagi
  namespace: argocd
spec:
  project: futureagi
  source:
    # Native OCI source: use the full chart repository and expanded root.
    # prepare-release.py prints the authenticated digest for this field.
    repoURL: oci://ghcr.io/future-agi/charts/futureagi
    path: .
    targetRevision: sha256:REPLACE_WITH_VERIFIED_CHART_DIGEST
    helm:
      releaseName: futureagi
      valuesObject:
        secrets:
          existingSecret: futureagi-app
        postgres:
          mode: external
          existingSecret: futureagi-postgres
          external:
            host: postgres.example.internal
        clickhouse:
          mode: external
          external:
            host: clickhouse.example.internal
        redis:
          mode: external
          external:
            host: redis.example.internal
        temporal:
          mode: external
          external:
            address: temporal-frontend.temporal.svc:7233
        objectStorage:
          mode: external
          existingSecret: futureagi-s3
          external:
            endpoint: https://s3.us-east-1.amazonaws.com
        urls:
          app: https://futureagi.example.com
          api: https://api.futureagi.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: futureagi
  syncPolicy:
    # A reviewed Git change authorizes a sync. Do not repeatedly retry a failed
    # migration or automatically prune data-bearing resources during recovery.
    automated:
      enabled: true
      prune: false
      selfHeal: false
    retry:
      limit: 0
    # Never add ApplyOutOfSyncOnly=true: selective sync skips migration hooks.
    # No CreateNamespace: the operator creates and scopes the namespace first.
