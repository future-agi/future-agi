# CI only: over examples/external.yaml and examples/external-secrets.yaml, an
# ExternalSecret for every other group, so hack/rendered_checks.py checks the
# Secret each of the twelve groups creates.
externalSecrets:
  secrets:
    email:
      data:
        MAILGUN_API_KEY: { key: futureagi/email, property: mailgun }
    google:
      dataFrom:
        - extract:
            key: futureagi/google
    github:
      dataFrom:
        - extract:
            key: futureagi/github
    microsoft:
      dataFrom:
        - extract:
            key: futureagi/microsoft
    admin:
      dataFrom:
        - extract:
            key: futureagi/admin
    clickhouse:
      data:
        password: { key: futureagi/clickhouse, property: password }
    redis:
      data:
        password: { key: futureagi/redis, property: password }

config:
  email:
    mailgunSenderDomain: mg.futureagi.example.com
    existingSecret: futureagi-email
auth:
  google:
    existingSecret: futureagi-google
  github:
    existingSecret: futureagi-github
  microsoft:
    existingSecret: futureagi-microsoft
bootstrap:
  admin:
    existingSecret: futureagi-admin
clickhouse:
  existingSecret: futureagi-clickhouse
redis:
  existingSecret: futureagi-redis
