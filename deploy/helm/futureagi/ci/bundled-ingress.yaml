# CI only: bundled datastores behind the ingress, object downloads included.
ingress:
  objects:
    host: files.futureagi.example.com
  tls:
    - secretName: futureagi-tls
      hosts:
        - futureagi.example.com
        - api.futureagi.example.com
        - files.futureagi.example.com
# Several gateway replicas: auto turns the gateway's Redis on (database 4).
agentccGateway:
  autoscaling:
    enabled: true
