{{- $b := .Values.backend -}}
{{- $ctx := dict "root" . "component" "backend" -}}
{{- $image := include "futureagi.image" (dict "root" . "image" $b.image "digestKey" "backend") -}}
{{- $pullPolicy := include "futureagi.imagePullPolicy" (dict "root" . "image" $b.image) -}}
{{- /* The session exchange signs with omega.issuer's key, and the API sends
revocations to Omega EE (omega.hostEvents), with omega.enabled; the pods that
get the channel carry the label EE admits senders by. config.extraEnvFrom
cannot supply either (futureagi.omega.envFromPins). */ -}}
{{- $channel := include "futureagi.omega.hostEvents.env" . | fromYaml -}}
{{- $component := merge (dict "SERVICE_TYPE" "backend") (include "futureagi.omega.issuer.env" . | fromYaml) $channel (include "futureagi.omega.envFromPins" . | fromYaml) -}}
{{- $env := include "futureagi.env.python" (dict "root" . "component" $component "overrides" $b.extraEnv) -}}
{{- $containerSecurity := include "futureagi.containerSecurityContext" (dict "root" $ "overrides" $b.containerSecurityContext) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "futureagi.component" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "futureagi.componentLabels" $ctx | nindent 4 }}
  {{- include "futureagi.block" (dict "text" (include "futureagi.workloadAnnotations" $) "indent" 2) }}
spec:
  {{- if not $b.autoscaling.enabled }}
  replicas: {{ $b.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "futureagi.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "futureagi.componentLabels" $ctx | nindent 8 }}
        {{- with $b.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $channel }}
        {{- include "futureagi.omega.hostEvents.senderLabel" . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secrets: {{ include "futureagi.secretsChecksum" . }}
        {{- with $b.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "futureagi.serviceAccountName" . }}
      automountServiceAccountToken: {{ include "futureagi.automountServiceAccountToken" . }}
      {{- include "futureagi.block" (dict "text" (include "futureagi.imagePullSecrets" .) "indent" 6) }}
      # The preStop sleep, then in-flight requests.
      terminationGracePeriodSeconds: {{ $b.terminationGracePeriodSeconds | default 30 }}
      securityContext:
        {{- include "futureagi.podSecurityContext" (dict "root" $ "uid" 1000 "overrides" $b.podSecurityContext) | nindent 8 }}
      {{- include "futureagi.block" (dict "text" (include "futureagi.scheduling" (dict "root" . "values" $b "spread" true "component" "backend" "multi" (include "futureagi.multiReplica" $b))) "indent" 6) }}
      {{- if $b.collectStatic }}
      initContainers:
        # Static files of /admin and /docs (WhiteNoise serves them from STATIC_ROOT).
        - name: collectstatic
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          command: ["python", "manage.py", "collectstatic", "--noinput", "--verbosity", "0"]
          env:
            {{- $env | trim | nindent 12 }}
          {{- with .Values.config.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          securityContext:
            {{- $containerSecurity | nindent 12 }}
          volumeMounts:
            {{- include "futureagi.python.volumeMounts" . | trim | nindent 12 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          # The API server directly (the image's entrypoint.sh is for Compose).
          command: ["granian"]
          args:
            - --interface
            - asgi
            - tfc.asgi:application
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - {{ $b.granian.workers | quote }}
            - --runtime-threads
            - {{ $b.granian.threads | quote }}
            - --runtime-mode
            - mt
            - --loop
            - uvloop
            - --log-level
            - warning
            - --respawn-failed-workers
            {{- if $b.granian.accessLog }}
            - --access-log
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- include "futureagi.block" (dict "text" (include "futureagi.preStop" (dict "root" . "seconds" $b.preStopSleepSeconds)) "indent" 10) }}
          env:
            {{- $env | trim | nindent 12 }}
          {{- with .Values.config.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # /health/ is liveness; /readyz/ checks required hosted configuration.
          # Host is set because restricted ALLOWED_HOSTS includes localhost.
          startupProbe:
            httpGet:
              path: /health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: {{ ternary "/readyz/" "/health/" .Values.hosted.enabled }}
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          securityContext:
            {{- $containerSecurity | nindent 12 }}
          volumeMounts:
            {{- include "futureagi.python.volumeMounts" . | trim | nindent 12 }}
            {{- include "futureagi.block" (dict "text" (include "futureagi.omega.backend.volumeMounts" .) "indent" 12) }}
            {{- with $b.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- include "futureagi.block" (dict "text" (include "futureagi.omega.backend.tlsSidecar" .) "indent" 8) }}
      volumes:
        {{- include "futureagi.python.volumes" . | trim | nindent 8 }}
        {{- include "futureagi.block" (dict "text" (include "futureagi.omega.backend.volumes" .) "indent" 8) }}
        {{- with $b.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
