{{- /*
ExternalSecrets (External Secrets Operator) for the Secrets the chart reads
through its existingSecret values: each entry of externalSecrets.secrets
creates the Secret its group's existingSecret names (validate.yaml requires
that name).

They are pre-install/pre-upgrade hooks, created before the bootstrap job,
which on install runs before the release's other resources and waits (in
CreateContainerConfigError) until the operator has written the Secret. Hooks
are replaced on every upgrade, so the target Secret is created with
creationPolicy Orphan: it outlives the ExternalSecret's replacement (and
`helm uninstall`, like the chart's own Secret).
*/ -}}
{{- $es := .Values.externalSecrets | default dict -}}
{{- if $es.enabled }}
{{- $targets := include "futureagi.externalSecrets.targets" . | fromJson -}}
{{- range $group, $spec := $es.secrets | default dict }}
{{- $spec = $spec | default dict }}
{{- $store := $spec.secretStoreRef | default $es.secretStoreRef }}
{{- $target := mergeOverwrite (dict "creationPolicy" "Orphan") ($spec.target | default dict) (dict "name" (dig $group "name" "" $targets)) }}
---
apiVersion: {{ $es.apiVersion | default "external-secrets.io/v1" }}
kind: ExternalSecret
metadata:
  name: {{ printf "%s-%s" (include "futureagi.fullname" $) (kebabcase $group) | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "futureagi.labels" $ | nindent 4 }}
    app.kubernetes.io/component: external-secret
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ $spec.refreshInterval | default $es.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind | default "ClusterSecretStore" }}
  target:
    {{- toYaml $target | nindent 4 }}
  {{- with $spec.data }}
  data:
    {{- range $key, $ref := . }}
    - secretKey: {{ $key }}
      remoteRef:
        {{- toYaml $ref | nindent 8 }}
    {{- end }}
  {{- end }}
  {{- with $spec.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
