{{- /* The gateway's own ServiceAccount (agentccGateway.serviceAccount.create):
bind the cloud identity that reads the provider credentials (Workload
Identity, IRSA) to it, so no other pod holds that identity. Its token mount
follows serviceAccount.automountServiceAccountToken, like the chart's. */ -}}
{{- $sa := .Values.agentccGateway.serviceAccount | default dict -}}
{{- if $sa.create }}
{{- $ctx := dict "root" . "component" "agentcc-gateway" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "futureagi.gatewayServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "futureagi.componentLabels" $ctx | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "futureagi.automountServiceAccountToken" . }}
{{- end }}
