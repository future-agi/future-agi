{{- $g := .Values.agentccGateway -}}
{{- $ctx := dict "root" . "component" "agentcc-gateway" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "futureagi.component" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "futureagi.componentLabels" $ctx | nindent 4 }}
  {{- with $g.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $g.service.type }}
  selector:
    {{- include "futureagi.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $g.service.port }}
      targetPort: http
      protocol: TCP
{{- if $g.autoscaling.enabled }}
---
{{ include "futureagi.hpa" (dict "root" . "component" "agentcc-gateway" "name" (include "futureagi.component" $ctx) "autoscaling" $g.autoscaling) }}
{{- end }}
{{- if $g.pdb.enabled }}
---
{{ include "futureagi.pdb" (dict "root" . "component" "agentcc-gateway" "name" (include "futureagi.component" $ctx) "pdb" $g.pdb) }}
{{- end }}
