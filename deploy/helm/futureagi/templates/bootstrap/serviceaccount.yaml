{{- if .Values.bootstrap.serviceAccount.create }}
{{- /* A hook like the job itself: on install it must exist before the
release's own ServiceAccount does. Rolled back with the chart's Secret. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "futureagi.bootstrapServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "futureagi.componentLabels" (dict "root" . "component" "bootstrap") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.bootstrap.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
