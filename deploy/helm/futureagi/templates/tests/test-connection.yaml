{{- /* `helm test <release>`: every HTTP service of the release answers. Runs
in the backend image (already on the nodes) with the standard library. */ -}}
{{- $b := .Values.backend -}}
{{- $ctx := dict "root" . "component" "test" -}}
{{- $urls := list
      (printf "http://%s:%v/health/" (include "futureagi.component" (dict "root" . "component" "backend")) $b.service.port)
      (printf "%s://%s:%v/" (ternary "http" "https" .Values.frontend.tls.httpEnabled) (include "futureagi.component" (dict "root" . "component" "frontend")) (ternary .Values.frontend.service.port .Values.frontend.tls.servicePort .Values.frontend.tls.httpEnabled))
      (printf "http://%s:9464/healthz" (include "futureagi.component" (dict "root" . "component" "fi-collector")))
      (printf "%s://%s:%v/healthz" (ternary "http" "https" .Values.agentccGateway.tls.httpEnabled) (include "futureagi.component" (dict "root" . "component" "agentcc-gateway")) (ternary .Values.agentccGateway.service.port .Values.agentccGateway.tls.servicePort .Values.agentccGateway.tls.httpEnabled)) -}}
{{- if .Values.serving.enabled -}}
{{- $urls = append $urls (printf "http://%s:8080/health" (include "futureagi.component" (dict "root" . "component" "serving"))) -}}
{{- end -}}
{{- if .Values.codeExecutor.enabled -}}
{{- $urls = append $urls (printf "http://%s:8060/health" (include "futureagi.component" (dict "root" . "component" "code-executor"))) -}}
{{- end -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "futureagi.component" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "futureagi.componentLabels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- include "futureagi.block" (dict "text" (include "futureagi.imagePullSecrets" .) "indent" 2) }}
  securityContext:
    {{- include "futureagi.podSecurityContext" (dict "root" $ "uid" 1000) | nindent 4 }}
  {{- /* Placed like the bootstrap job: the backend's settings, else the chart-wide ones. */}}
  {{- include "futureagi.block" (dict "text" (include "futureagi.scheduling" (dict "root" . "values" $b)) "indent" 2) }}
  containers:
    - name: test
      image: {{ include "futureagi.image" (dict "root" . "image" $b.image "digestKey" "backend") }}
      imagePullPolicy: {{ include "futureagi.imagePullPolicy" (dict "root" . "image" $b.image) }}
      command: ["python", "-c"]
      args:
        - |
          import sys, urllib.request
          {{- if or (not .Values.frontend.tls.httpEnabled) (not .Values.agentccGateway.tls.httpEnabled) }}
          import ssl
          {{- end }}
          failed = 0
          for url in sys.argv[1:]:
              try:
                  {{- if or (not .Values.frontend.tls.httpEnabled) (not .Values.agentccGateway.tls.httpEnabled) }}
                  # The Helm smoke test probes a self-signed service; production clients
                  # verify the configured global.caBundle instead.
                  context = ssl._create_unverified_context() if url.startswith("https://") else None
                  with urllib.request.urlopen(url, timeout=10, context=context) as response:
                  {{- else }}
                  with urllib.request.urlopen(url, timeout=10) as response:
                  {{- end }}
                      print(f"ok    {response.status} {url}")
              except Exception as exc:
                  failed += 1
                  print(f"FAIL  {url}: {exc}")
          sys.exit(1 if failed else 0)
        {{- range $urls }}
        - {{ . | quote }}
        {{- end }}
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {cpu: 200m, memory: 256Mi}
      securityContext:
        {{- include "futureagi.containerSecurityContext" (dict "root" $) | nindent 8 }}
