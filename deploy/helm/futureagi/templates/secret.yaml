{{- /*
The chart's Secret: generated application keys, bundled datastore passwords
and secrets given inline in the values.

Generated values are created once and read back with `lookup` on every
upgrade, so they never change. It is a pre-install/pre-upgrade hook because
the bootstrap job, which runs before the release's other resources on
install, reads it; hook resources are not deleted by `helm uninstall`, which
keeps the keys that decrypt stored data for a reinstall. As a hook it is not
part of the release manifest, so pre-rollback puts back the target
revision's copy: `helm rollback` (and --atomic) restore the old values too.
*/ -}}
{{- $v := .Values -}}
{{- $name := include "futureagi.secretName" . -}}
{{- $old := dict -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $old = .data | default dict -}}
{{- end -}}
{{- $data := dict -}}
{{- /* keep: the stored value, else a freshly generated one */ -}}
{{- if not $v.secrets.existingSecret -}}
{{- $_ := set $data "SECRET_KEY" (get $old "SECRET_KEY" | default (randAlphaNum 64 | b64enc)) -}}
{{- /* Fernet key: 32 random bytes, URL-safe base64 */ -}}
{{- $_ := set $data "INTEGRATION_ENCRYPTION_KEY" (get $old "INTEGRATION_ENCRYPTION_KEY" | default (randBytes 32 | replace "+" "-" | replace "/" "_" | b64enc)) -}}
{{- $_ := set $data "AGENTCC_INTERNAL_API_KEY" (get $old "AGENTCC_INTERNAL_API_KEY" | default (randAlphaNum 48 | b64enc)) -}}
{{- $_ := set $data "AGENTCC_ADMIN_TOKEN" (get $old "AGENTCC_ADMIN_TOKEN" | default (randAlphaNum 48 | b64enc)) -}}
{{- $_ := set $data "PROPERTY_CATALOG_API_PASSWORD" (get $old "PROPERTY_CATALOG_API_PASSWORD" | default (randAlphaNum 32 | b64enc)) -}}
{{- $_ := set $data "PROPERTY_CATALOG_CONSUMER_PASSWORD" (get $old "PROPERTY_CATALOG_CONSUMER_PASSWORD" | default (randAlphaNum 32 | b64enc)) -}}
{{- end -}}
{{- /* datastores: an explicit value wins; bundled ones get a generated password */ -}}
{{- if not $v.postgres.existingSecret -}}
{{- if $v.postgres.password -}}
{{- $_ := set $data "PG_PASSWORD" ($v.postgres.password | b64enc) -}}
{{- else if eq $v.postgres.mode "bundled" -}}
{{- $_ := set $data "PG_PASSWORD" (get $old "PG_PASSWORD" | default (randAlphaNum 32 | b64enc)) -}}
{{- end -}}
{{- end -}}
{{- if not $v.clickhouse.existingSecret -}}
{{- if $v.clickhouse.password -}}
{{- $_ := set $data "CH_PASSWORD" ($v.clickhouse.password | b64enc) -}}
{{- else if eq $v.clickhouse.mode "bundled" -}}
{{- $_ := set $data "CH_PASSWORD" (get $old "CH_PASSWORD" | default (randAlphaNum 32 | b64enc)) -}}
{{- else -}}
{{- $_ := set $data "CH_PASSWORD" "" -}}
{{- end -}}
{{- end -}}
{{- if not $v.redis.existingSecret -}}
{{- if $v.redis.password -}}
{{- $_ := set $data "REDIS_PASSWORD" ($v.redis.password | b64enc) -}}
{{- else if eq $v.redis.mode "bundled" -}}
{{- $_ := set $data "REDIS_PASSWORD" (get $old "REDIS_PASSWORD" | default (randAlphaNum 32 | b64enc)) -}}
{{- end -}}
{{- end -}}
{{- if not $v.objectStorage.existingSecret -}}
{{- if $v.objectStorage.accessKey -}}
{{- $_ := set $data "S3_ACCESS_KEY" ($v.objectStorage.accessKey | b64enc) -}}
{{- else if eq $v.objectStorage.mode "bundled" -}}
{{- $_ := set $data "S3_ACCESS_KEY" (get $old "S3_ACCESS_KEY" | default (printf "futureagi-%s" (randAlphaNum 10 | lower) | b64enc)) -}}
{{- end -}}
{{- if $v.objectStorage.secretKey -}}
{{- $_ := set $data "S3_SECRET_KEY" ($v.objectStorage.secretKey | b64enc) -}}
{{- else if eq $v.objectStorage.mode "bundled" -}}
{{- $_ := set $data "S3_SECRET_KEY" (get $old "S3_SECRET_KEY" | default (randAlphaNum 40 | b64enc)) -}}
{{- end -}}
{{- end -}}
{{- /* secrets given inline */ -}}
{{- if not $v.secrets.llm.existingSecret -}}
{{- range $key, $value := dict "OPENAI_API_KEY" $v.secrets.llm.openaiApiKey "ANTHROPIC_API_KEY" $v.secrets.llm.anthropicApiKey "GOOGLE_API_KEY" $v.secrets.llm.googleApiKey "AWS_ACCESS_KEY_ID" $v.secrets.llm.awsAccessKeyId "AWS_SECRET_ACCESS_KEY" $v.secrets.llm.awsSecretAccessKey -}}
{{- if $value -}}
{{- $_ := set $data $key ($value | toString | b64enc) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range $key, $value := dict "EE_LICENSE_KEY" $v.secrets.eeLicenseKey "MAILGUN_API_KEY" $v.secrets.mailgunApiKey "AGENTCC_WEBHOOK_SECRET" $v.secrets.agentccWebhookSecret -}}
{{- if $value -}}
{{- $_ := set $data $key ($value | toString | b64enc) -}}
{{- end -}}
{{- end -}}
{{- range $key, $value := $v.secrets.extra -}}
{{- $_ := set $data $key ($value | toString | b64enc) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "futureagi.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := keys $data | sortAlpha }}
  {{ $key }}: {{ get $data $key | quote }}
  {{- end }}
