{{- $f := .Values.frontend -}}
{{- $ctx := dict "root" . "component" "frontend" -}}
{{- $apiUrl := include "futureagi.url.api" . -}}
{{- $env := dict "CONFIG_PATH" "/tmp/config.js" -}}
{{- /* Empty VITE_HOST_API: the UI calls http://localhost:8000 (a port-forward). */ -}}
{{- if $apiUrl }}{{ $_ := set $env "VITE_HOST_API" $apiUrl }}{{ end -}}
{{- with $f.helpLink }}{{ $_ := set $env "VITE_HELP_LINK" . }}{{ end -}}
{{- $env = mergeOverwrite $env (include "futureagi.env.platform" (dict "root" . "kind" "frontend") | fromYaml) ($f.extraEnv | default dict) -}}
{{- if $f.tls.enabled -}}
{{- $_ := set $env "FRONTEND_HTTP_ENABLED" (toString $f.tls.httpEnabled) -}}
{{- $_ := set $env "FRONTEND_HTTP_PORT" "8080" -}}
{{- $_ := set $env "FRONTEND_TLS_ENABLED" "true" -}}
{{- $_ := set $env "FRONTEND_TLS_PORT" (toString $f.tls.port) -}}
{{- $_ := set $env "FRONTEND_TLS_CERT_FILE" "/var/run/secrets/futureagi/tls/tls.crt" -}}
{{- $_ := set $env "FRONTEND_TLS_KEY_FILE" "/var/run/secrets/futureagi/tls/tls.key" -}}
{{- $_ := set $env "FRONTEND_TLS_RELOAD_INTERVAL" (toString $f.tls.reloadInterval) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "futureagi.component" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "futureagi.componentLabels" $ctx | nindent 4 }}
  {{- include "futureagi.block" (dict "text" (include "futureagi.workloadAnnotations" $) "indent" 2) }}
spec:
  {{- if not $f.autoscaling.enabled }}
  replicas: {{ $f.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "futureagi.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "futureagi.componentLabels" $ctx | nindent 8 }}
        {{- with $f.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/frontend/configmap.yaml") . | sha256sum }}
        {{- with $f.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "futureagi.serviceAccountName" . }}
      automountServiceAccountToken: {{ include "futureagi.automountServiceAccountToken" . }}
      {{- include "futureagi.block" (dict "text" (include "futureagi.imagePullSecrets" .) "indent" 6) }}
      securityContext:
        {{- include "futureagi.podSecurityContext" (dict "root" $ "uid" 101 "overrides" $f.podSecurityContext) | nindent 8 }}
      {{- include "futureagi.block" (dict "text" (include "futureagi.scheduling" (dict "root" . "values" $f "spread" true "component" "frontend" "multi" (include "futureagi.multiReplica" $f))) "indent" 6) }}
      containers:
        - name: frontend
          image: {{ include "futureagi.image" (dict "root" . "image" $f.image "digestKey" "frontend") }}
          imagePullPolicy: {{ include "futureagi.imagePullPolicy" (dict "root" . "image" $f.image) }}
          # The image's entrypoint writes /config.js from the VITE_* variables, then runs nginx.
          args: ["nginx", "-c", "/etc/nginx/futureagi/nginx.conf", "-g", "daemon off;"]
          ports:
            {{- if $f.tls.httpEnabled }}
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- end }}
            {{- if $f.tls.enabled }}
            - name: https
              containerPort: {{ $f.tls.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- range $name := keys $env | sortAlpha }}
            - name: {{ $name }}
              value: {{ get $env $name | toString | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ ternary "http" "https" $f.tls.httpEnabled }}
              {{- if not $f.tls.httpEnabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: {{ ternary "http" "https" $f.tls.httpEnabled }}
              {{- if not $f.tls.httpEnabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $f.resources | nindent 12 }}
          securityContext:
            {{- include "futureagi.containerSecurityContext" (dict "root" $ "overrides" $f.containerSecurityContext) | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/futureagi
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            {{- if $f.tls.enabled }}
            - name: tls
              mountPath: /var/run/secrets/futureagi/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "futureagi.component" $ctx }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
        {{- if $f.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ $f.tls.existingSecret }}
            items:
              - key: {{ $f.tls.certKey }}
                path: tls.crt
              - key: {{ $f.tls.keyKey }}
                path: tls.key
        {{- end }}
