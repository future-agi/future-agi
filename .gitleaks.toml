# Extends the default gitleaks ruleset.
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and documented placeholders"

# Paths that contain only test fixtures / example values.
paths = [
    '''(?i)/tests?/.*\.(py|go)$''',
    '''_test\.go$''',
    '''/test_[^/]+\.py$''',               # test_foo.py at any depth
    '''/test_mcp_server/''',              # MCP server test scaffolding directory
    '''(?i)/templates/.*\.html$''',       # email templates (figmeta + Mailgun placeholders)
    '''docs/.*\.md$''',                   # documentation examples
    '''\.env\.example$''',
]

# Specific stopwords that are clearly placeholder values anywhere they appear.
stopwords = [
    "YOUR-API-KEY",
    "your-api-key",
    "your-qdrant-api-key",
    "sk-EXAMPLE-REDACTED",
    "test-api-key",
    "test-vapi-api-key",
    "test-retell-api-key",
    "valid-api-key-123",
    "REDACTED",
    "EXAMPLE",
]

# Specific regex patterns to allow (false positives surfaced by entropy/default rules).
regexes = [
    '''ProviderChoices\.VAPI''',          # enum value, not a key
    '''eyJhbGciOiJSUzI1NiJ9\.test''',     # truncated test JWT
    '''glpat-ABCDEFGHIJKLMNOPQRST''',     # literal test input for secret-detection guardrail
    '''sk_live_ABCDEFGHIJKLMNOPQRSTuvwx''',
    '''FwoGZXIvYXdzEBYaDHqa0AP''',        # AWS session token format test fixture
]

# Reviewed synthetic findings in the product-port revision only.
# Keep upstream allowances above unchanged. Each added allowance requires
# BOTH the exact revision and the exact path within the named rule.
# Fingerprints document every adjudicated finding covered by that pair;
# no subsequent commit or other rule is exempted by these entries.

[[rules]]
id = "curl-auth-header"

[[rules.allowlists]]
description = "Reviewed API template with literal YOUR_API_KEY; exact matched construct only"
condition = "AND"
paths = ['''^futureagi/model_hub/constants\.py$''']
regexTarget = "match"
regexes = ['''\A\Qcurl --location '{api_url}' \\
--header 'X-Api-Key: YOUR_API_KEY'\E\z''']
